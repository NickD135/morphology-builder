name: Resource health check

# Fortnightly SOLO Tracker resource-link health check.
# Runs scripts/check-resources.js, which regenerates SUGGESTIONS.md, and commits
# it back to main if anything changed. Read-only against Supabase (public anon key
# is read from solo/index.html — no secrets needed). Also runnable on demand.

on:
  schedule:
    - cron: '0 6 1,15 * *'   # 06:00 UTC on the 1st and 15th of every month
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resource-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run resource health check
        run: node scripts/check-resources.js

      - name: Commit SUGGESTIONS.md if changed
        run: |
          if git diff --quiet -- SUGGESTIONS.md; then
            echo "No changes to SUGGESTIONS.md — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUGGESTIONS.md
          git commit -m "chore(suggestions): fortnightly resource health check"
          git push
