<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Effect Depth — Full 25-Effect Sweep (Task 5)</title>
  <style>
    body { font-family:monospace; background:#0a0a14; color:#e8e8f0; padding:20px; margin:0; }
    h2 { color:#a5b4fc; }
    .pass { color:#4ade80; font-weight:bold; }
    .fail { color:#f87171; font-weight:bold; }
    .warn { color:#fbbf24; }
    pre { background:#1a1a2e; padding:10px; border-radius:6px; white-space:pre-wrap; font-size:12px; }
    table { border-collapse:collapse; width:100%; margin:12px 0; font-size:12px; }
    th { background:#1e1b4b; color:#a5b4fc; padding:6px 10px; text-align:left; }
    td { padding:4px 10px; border-bottom:1px solid #1e1b4b; }
    tr:hover td { background:#111124; }
    .stub { position:relative; border:1px dashed #334; margin:10px; display:inline-block; }
    #containers { display:flex; gap:24px; flex-wrap:wrap; margin:16px 0; }
    h3 { color:#818cf8; margin-top:20px; }
    #status { font-size:14px; color:#94a3b8; margin-bottom:8px; }
  </style>

  <!-- Real modules — order matters: effects first, then worlds, then shop-data, then scientist -->
  <script src="../../wordlab-effects.js"></script>
  <script src="../../wordlab-worlds.js"></script>
  <script src="../../wordlab-shop-data.js"></script>
  <script src="../../wordlab-scientist.js"></script>
</head>
<body>
<h2>Effect Depth — Full 25-Effect Sweep (Task 5)</h2>
<p id="status">Initialising...</p>

<!-- ── TWO TEST CONTAINERS ─────────────────────────────────────── -->
<div id="containers">

  <!-- SHOP container: mirrors scientist.html .lab-charwrap -->
  <div>
    <div style="color:#a5b4fc;font-size:11px;margin-bottom:4px;">SHOP (.lab-charwrap, svg z=6)</div>
    <div class="stub" id="shopContainer">
      <div class="lab-charwrap" id="shopEl"
           style="position:relative;width:200px;height:260px;">
        <!-- character svg at z=6, matching scientist.html -->
        <svg id="shopChar"
             style="position:relative;z-index:6;width:100%;height:100%;display:block;">
          <rect width="100%" height="100%" fill="#2a2060" rx="8"/>
          <text x="50%" y="48%" fill="#a5b4fc" font-size="11" text-anchor="middle"
                dominant-baseline="middle">SVG</text>
          <text x="50%" y="62%" fill="#818cf8" font-size="9" text-anchor="middle"
                dominant-baseline="middle">character z=6</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- GAME container: mirrors .scientist-stage on game pages -->
  <div>
    <div style="color:#4ade80;font-size:11px;margin-bottom:4px;">GAME (.scientist-stage, #sciCharWrap z=20)</div>
    <div class="stub" id="gameContainer">
      <div class="scientist-stage" id="gameEl"
           style="position:relative;width:200px;height:260px;">
        <!-- #sciCharWrap at z=20 (also set by injected CSS from wordlab-scientist.js) -->
        <div id="sciCharWrap"
             style="position:relative;z-index:20;width:100%;height:100%;">
          <svg style="width:100%;height:100%;display:block;">
            <rect width="100%" height="100%" fill="#0a2a12" rx="8"/>
            <text x="50%" y="48%" fill="#4ade80" font-size="11" text-anchor="middle"
                  dominant-baseline="middle">SVG</text>
            <text x="50%" y="62%" fill="#22c55e" font-size="9" text-anchor="middle"
                  dominant-baseline="middle">#sciCharWrap z=20</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- AURA screenshot container (for visual capture of halo) -->
  <div>
    <div style="color:#fbbf24;font-size:11px;margin-bottom:4px;">AURA visual (halo, not box-shadow)</div>
    <div class="stub" id="auraScreenshotContainer">
      <div class="lab-charwrap" id="auraScreenEl"
           style="position:relative;width:200px;height:260px;">
        <svg style="position:relative;z-index:6;width:100%;height:100%;display:block;">
          <rect width="100%" height="100%" fill="#1e1b4b" rx="8"/>
          <circle cx="50%" cy="50%" r="40" fill="#4338ca" opacity="0.6"/>
          <text x="50%" y="50%" fill="#e0e7ff" font-size="11" text-anchor="middle"
                dominant-baseline="middle">AURA preview</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- BLACKHOLE screenshot container -->
  <div>
    <div style="color:#9b7bff;font-size:11px;margin-bottom:4px;">BLACKHOLE visual (disk behind char)</div>
    <div class="stub" id="bhScreenshotContainer">
      <div class="lab-charwrap" id="bhScreenEl"
           style="position:relative;width:200px;height:260px;">
        <svg style="position:relative;z-index:6;width:100%;height:100%;display:block;">
          <rect width="100%" height="100%" fill="#0a0518" rx="8"/>
          <circle cx="50%" cy="50%" r="35" fill="#4a008a" opacity="0.7"/>
          <text x="50%" y="50%" fill="#c4b5fd" font-size="11" text-anchor="middle"
                dominant-baseline="middle">BLACKHOLE</text>
        </svg>
      </div>
    </div>
  </div>
</div>

<div id="output"><em>Running sweep (async — ~35s)...</em></div>

<script>
// ═══════════════════════════════════════════════════════════
// Effect Depth Sweep — Task 5
// ═══════════════════════════════════════════════════════════

// All 25 effect IDs in catalogue order
const ALL_EFFECTS = [
  'sparkle','shimmer','bubbles','starfield','aura',
  'fire','frost','electric','rainbow','matrix',
  'galaxy','pixel','radioactive','confetti','divine',
  'quantum','aurora','vortex','hearts-fx','snow',
  'petals','smoke','lasers','quark-rain','blackhole'
];

// Effects where boxShadow must be '' during rendering (migrated border-glow + orbit)
const BOX_SHADOW_EFFECTS = new Set(['aura','shimmer','divine','quantum','vortex','electric','radioactive']);

// World sprite max z-index (from CSS: .wlw-sprite { z-index:3 })
const WORLD_SPRITE_Z = 3;

const wait = ms => new Promise(r => setTimeout(r, ms));

function getZ(el) {
  if (!el) return NaN;
  return parseInt(getComputedStyle(el).zIndex, 10) || 0;
}

// ── Sweep state ────────────────────────────────────────────
const effectRows = [];   // { id, container, total, boxShadowOK, stopOK, boxShadowAfterOK, animAfterOK }
const zCoherence = {};
let lowStimResult = null;
let rapidSwitchResult = null;

(async function runSweep() {
  document.getElementById('status').textContent = 'Running sweep...';

  const shopEl = document.getElementById('shopEl');
  const gameEl = document.getElementById('gameEl');

  // ── 1. FULL 25-EFFECT SWEEP on BOTH containers ─────────────────

  async function sweepContainer(el, containerName) {
    const charEl = el.querySelector('#sciCharWrap') || el.querySelector(':scope > svg') || el.querySelector('svg');
    const charZ = charEl ? getZ(charEl) : 5;

    for (const id of ALL_EFFECTS) {
      document.getElementById('status').textContent =
        `Sweeping ${id} on ${containerName}...`;

      WLEffects.start(id, el);

      // Sync peek: some effects (e.g. electric) create initial nodes synchronously
      // but self-remove them at ~500ms, BEFORE the 900ms async wait below.
      // Capturing them here ensures the "renders >= 1" assertion passes.
      const peekBehind = el.querySelector('.wlfx-behind');
      const peekFront  = el.querySelector('.wlfx-front');
      const peekTotal  = (peekBehind ? peekBehind.childElementCount : 0)
                       + (peekFront  ? peekFront.childElementCount  : 0);

      await wait(900);  // wait for async spawners

      const behind = el.querySelector('.wlfx-behind');
      const front  = el.querySelector('.wlfx-front');
      const behindCount = behind ? behind.childElementCount : 0;
      const frontCount  = front  ? front.childElementCount  : 0;
      // Use max across peek + async wait so effects with short-lived sync nodes pass
      const total = Math.max(peekTotal, behindCount + frontCount);

      // boxShadow check during rendering (for migrated effects only)
      const boxShadowNow = el.style.boxShadow || '';
      const boxShadowOK = BOX_SHADOW_EFFECTS.has(id)
        ? boxShadowNow === ''
        : true;  // not checked for other effects

      // stop and check cleanup
      WLEffects.stop(el);
      await wait(150);  // let transient remove() callbacks settle

      const behindAfter = el.querySelectorAll('.wlfx-behind').length;
      const frontAfter  = el.querySelectorAll('.wlfx-front').length;
      const stopOK = (behindAfter === 0) && (frontAfter === 0);
      const boxShadowAfterOK = el.style.boxShadow === '';
      const animAfterOK     = el.style.animation === '';

      effectRows.push({
        id, container: containerName,
        total, behindCount, frontCount,
        boxShadowOK,
        stopOK, behindAfter, frontAfter,
        boxShadowAfterOK, animAfterOK,
        charZ,
        behindZ: behind ? getZ(behind) : NaN,
        frontZ:  front  ? getZ(front)  : NaN,
      });
    }
  }

  await sweepContainer(shopEl, 'shop');
  await sweepContainer(gameEl, 'game');

  // ── 2. WORLD + EFFECT Z-COHERENCE on game container ────────────
  document.getElementById('status').textContent = 'Testing world z-coherence...';

  // Start a real world
  WLWorlds.start('galaxy', gameEl);
  await wait(300);  // let world panel settle

  // Check world elements exist
  const worldPanel  = gameEl.querySelector('.wlworld');
  const worldFloor  = gameEl.querySelector('.wlworld-floor');
  const worldScene  = gameEl.querySelector('.wlworld-scene');
  const worldPanelZ = worldPanel ? getZ(worldPanel) : NaN;
  const worldFloorZ = worldFloor ? getZ(worldFloor) : NaN;

  for (const fxId of ['aura','galaxy','blackhole']) {
    WLEffects.start(fxId, gameEl);
    await wait(600);

    const behind = gameEl.querySelector('.wlfx-behind');
    const front  = gameEl.querySelector('.wlfx-front');
    const behindZ = behind ? getZ(behind) : NaN;
    const frontZ  = front  ? getZ(front)  : NaN;
    const charZ   = getZ(document.getElementById('sciCharWrap'));

    const order = (WORLD_SPRITE_Z < behindZ) && (behindZ < charZ) && (charZ < frontZ);
    const behindAboveSprites = behindZ > WORLD_SPRITE_Z;

    zCoherence[fxId] = {
      worldSpriteZ: WORLD_SPRITE_Z,
      worldPanelZ, worldFloorZ,
      behindZ, charZ, frontZ,
      order, behindAboveSprites,
      pass: order && behindAboveSprites
    };

    WLEffects.stop(gameEl);
    await wait(100);
  }

  WLWorlds.stop(gameEl);

  // ── 3. LOW-STIM GATE ───────────────────────────────────────────
  document.getElementById('status').textContent = 'Testing low-stim gate...';

  const freshEl = document.createElement('div');
  freshEl.style.cssText = 'position:relative;width:150px;height:180px;';
  const freshSvg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  freshSvg.style.cssText = 'position:relative;z-index:6;width:100%;height:100%;';
  freshEl.appendChild(freshSvg);
  document.body.appendChild(freshEl);

  const _savedWordLabData = window.WordLabData;
  window.WordLabData = { isLowStimMode: () => true };

  WLEffects.start('galaxy', freshEl);
  await wait(200);

  const lowStimLayerCount = freshEl.querySelectorAll('.wlfx-behind,.wlfx-front').length;
  lowStimResult = {
    layerCount: lowStimLayerCount,
    pass: lowStimLayerCount === 0
  };

  // Restore WordLabData
  if (_savedWordLabData !== undefined) {
    window.WordLabData = _savedWordLabData;
  } else {
    delete window.WordLabData;
  }

  document.body.removeChild(freshEl);

  // ── 4. RAPID-SWITCH TEARDOWN ───────────────────────────────────
  document.getElementById('status').textContent = 'Testing rapid-switch teardown...';

  // Use shop container for this
  const rapidEffects = ['sparkle','aura','galaxy','electric','divine','blackhole'];
  for (const fxId of rapidEffects) {
    WLEffects.start(fxId, shopEl);
    await wait(200);
  }
  // Settle: wait for the last effect's sync setup + any residue
  await wait(600);

  const rapidBehind = shopEl.querySelectorAll('.wlfx-behind').length;
  const rapidFront  = shopEl.querySelectorAll('.wlfx-front').length;
  rapidSwitchResult = {
    behind: rapidBehind,
    front:  rapidFront,
    pass: (rapidBehind === 1) && (rapidFront === 1)
  };

  WLEffects.stop(shopEl);

  // ── 5. VISUAL PREVIEWS for screenshots ─────────────────────────
  document.getElementById('status').textContent = 'Running visual previews...';

  // Aura on auraScreenEl (halo should wrap character, not be a box-shadow border)
  WLEffects.start('aura', document.getElementById('auraScreenEl'));

  // Blackhole on bhScreenEl (disk should be BEHIND the character svg)
  WLEffects.start('blackhole', document.getElementById('bhScreenEl'));

  await wait(1800);  // let blackhole jets fire too

  // ── 6. ASSEMBLE __SWEEP__ ──────────────────────────────────────
  const sweepPassed = effectRows.every(r =>
    r.total >= 1 && r.boxShadowOK && r.stopOK && r.boxShadowAfterOK && r.animAfterOK
  );
  const zCohPassed = Object.values(zCoherence).every(v => v.pass);

  window.__SWEEP__ = {
    effects: effectRows.map(r => ({
      id: r.id,
      container: r.container,
      total: r.total,
      behindCount: r.behindCount,
      frontCount: r.frontCount,
      boxShadowOK: r.boxShadowOK,
      stopOK: r.stopOK,
      boxShadowAfterOK: r.boxShadowAfterOK,
      animAfterOK: r.animAfterOK,
      PASS: r.total >= 1 && r.boxShadowOK && r.stopOK && r.boxShadowAfterOK && r.animAfterOK
    })),
    zCoherence,
    lowStim: lowStimResult,
    rapidSwitch: rapidSwitchResult,
    summary: {
      effectsPass: sweepPassed,
      zCoherence: zCohPassed,
      lowStimPass: lowStimResult ? lowStimResult.pass : false,
      rapidSwitchPass: rapidSwitchResult ? rapidSwitchResult.pass : false,
      allPass: sweepPassed && zCohPassed &&
               (lowStimResult ? lowStimResult.pass : false) &&
               (rapidSwitchResult ? rapidSwitchResult.pass : false)
    }
  };

  renderResults();
  document.getElementById('status').textContent = 'Done.';
})();

// ─────────────────────────────────────────────────────────────
function renderResults() {
  const s = window.__SWEEP__;
  const out = document.getElementById('output');
  out.innerHTML = '';

  // Overall header
  const allPass = s.summary.allPass;
  const hdr = document.createElement('h3');
  hdr.className = allPass ? 'pass' : 'fail';
  const effectPassCount = s.effects.filter(r => r.PASS).length;
  hdr.textContent = allPass
    ? `ALL PASS — ${s.effects.length} effect-rows, z-coherence, low-stim, rapid-switch`
    : `FAILURES DETECTED — see table below`;
  out.appendChild(hdr);

  // ── Effect table ──────────────────────────────────────────
  out.appendChild(Object.assign(document.createElement('h3'),{textContent:'Full Effect Sweep (25 effects × 2 containers)'}));

  const shopRows = s.effects.filter(r => r.container === 'shop');
  const gameRows = s.effects.filter(r => r.container === 'game');

  function makeTable(rows, title) {
    const h = document.createElement('h4');
    h.style.color = '#94a3b8'; h.textContent = title;
    out.appendChild(h);

    const tbl = document.createElement('table');
    const thead = tbl.createTHead();
    const hr = thead.insertRow();
    ['Effect','Total nodes','Behind','Front','BoxShadow OK','Stop OK','BS after','Anim after','PASS'].forEach(t=>{
      const th = document.createElement('th'); th.textContent = t; hr.appendChild(th);
    });
    const tbody = tbl.createTBody();
    for (const r of rows) {
      const tr = tbody.insertRow();
      const cells = [
        r.id,
        r.total,
        r.behindCount,
        r.frontCount,
        r.boxShadowOK ? '✓' : '✗ '+r.boxShadowNow,
        r.stopOK      ? '✓' : `✗ (b${r.behindAfter}+f${r.frontAfter})`,
        r.boxShadowAfterOK ? '✓' : '✗',
        r.animAfterOK      ? '✓' : '✗',
        r.PASS ? '✅ PASS' : '❌ FAIL'
      ];
      cells.forEach((c, i) => {
        const td = tr.insertCell();
        td.textContent = c;
        if (i === 8) td.className = r.PASS ? 'pass' : 'fail';
        if (i === 1 && r.total < 1) td.className = 'fail';
      });
    }
    out.appendChild(tbl);
  }

  makeTable(shopRows, 'Shop container (.lab-charwrap, svg z=6)');
  makeTable(gameRows, 'Game container (.scientist-stage, #sciCharWrap z=20)');

  // ── Z-Coherence ───────────────────────────────────────────
  const zh = document.createElement('h3');
  zh.textContent = 'World + Effect Z-Coherence (galaxy world running)';
  out.appendChild(zh);

  const ztbl = document.createElement('table');
  const zth = ztbl.createTHead().insertRow();
  ['Effect','worldSprite z','behind z','char z','front z','order ok','above sprites','PASS'].forEach(t=>{
    const th = document.createElement('th'); th.textContent = t; zth.appendChild(th);
  });
  const ztb = ztbl.createTBody();
  for (const [id, v] of Object.entries(s.zCoherence)) {
    const ztr = ztb.insertRow();
    [id, v.worldSpriteZ, v.behindZ, v.charZ, v.frontZ,
     v.order ? '✓' : '✗', v.behindAboveSprites ? '✓' : '✗',
     v.pass ? '✅ PASS' : '❌ FAIL'
    ].forEach((c, i) => {
      const td = ztr.insertCell();
      td.textContent = c;
      if (i === 7) td.className = v.pass ? 'pass' : 'fail';
    });
  }
  out.appendChild(ztbl);

  // ── Low-stim ──────────────────────────────────────────────
  const lh = document.createElement('h3');
  lh.textContent = 'Low-Stim Gate';
  out.appendChild(lh);
  const lp = document.createElement('p');
  const ls = s.lowStim;
  lp.className = ls && ls.pass ? 'pass' : 'fail';
  lp.textContent = ls
    ? (ls.pass ? `PASS — 0 layers created (isLowStimMode=true hard-returns)` : `FAIL — ${ls.layerCount} layer(s) found`)
    : 'Not run';
  out.appendChild(lp);

  // ── Rapid-switch ──────────────────────────────────────────
  const rh = document.createElement('h3');
  rh.textContent = 'Rapid-Switch Teardown (6 effects, 200ms apart)';
  out.appendChild(rh);
  const rp = document.createElement('p');
  const rs = s.rapidSwitch;
  rp.className = rs && rs.pass ? 'pass' : 'fail';
  rp.textContent = rs
    ? (rs.pass
       ? `PASS — exactly 1 .wlfx-behind + 1 .wlfx-front after settling`
       : `FAIL — found ${rs.behind} behind, ${rs.front} front (expected 1 each)`)
    : 'Not run';
  out.appendChild(rp);

  // ── Failures summary ──────────────────────────────────────
  const fails = s.effects.filter(r => !r.PASS);
  if (fails.length) {
    const fh = document.createElement('h3');
    fh.className = 'fail';
    fh.textContent = `FAILURES (${fails.length}):`;
    out.appendChild(fh);
    const pre = document.createElement('pre');
    pre.style.color = '#f87171';
    pre.textContent = fails.map(r =>
      `  ${r.container}/${r.id}: total=${r.total} boxShadowOK=${r.boxShadowOK} stopOK=${r.stopOK} bsAfter=${r.boxShadowAfterOK} animAfter=${r.animAfterOK}`
    ).join('\n');
    out.appendChild(pre);
  }

  // ── Raw JSON ──────────────────────────────────────────────
  const raw = document.createElement('details');
  raw.innerHTML = '<summary style="cursor:pointer;color:#818cf8">Raw __SWEEP__ JSON</summary>';
  const pre2 = document.createElement('pre');
  pre2.textContent = JSON.stringify(s, null, 2);
  raw.appendChild(pre2);
  out.appendChild(raw);
}
</script>
</body>
</html>
