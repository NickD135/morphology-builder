<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SVG hair harness</title>
<style>body{background:#1a1930;color:#e2e8f0;font-family:sans-serif;padding:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.cell{background:radial-gradient(120% 90% at 50% 30%,#2c2b45,#1a1930);border-radius:12px;padding:8px;text-align:center;font-size:11px}
.cell svg{width:150px;height:225px;display:block}
.cell.sm svg{width:44px;height:66px}
pre{background:#0f0e1c;padding:10px;border-radius:8px;white-space:pre-wrap}
h3{color:#a5b4fc;margin:14px 0 4px}</style>
</head><body>
<h2>SVG Hair — Task 1 (renderer)</h2>

<h3>Style grid — large (150px), 3 hair colours × 12 styles</h3>
<div id="grid" class="row"></div>

<h3>44px row — legibility check (black hair, 12 styles)</h3>
<div id="mini" class="row"></div>

<h3>Layering — hats over hair (should cover/sit in front)</h3>
<div id="hats" class="row"></div>

<h3>Isolation — two characters, different styles + colours, one page</h3>
<div id="iso" class="row"></div>

<pre id="results">running…</pre>

<script src="../../wordlab-worlds.js"></script>
<script src="../../wordlab-shop-data.js"></script>
<script src="../../wordlab-scientist.js"></script>
<script>
(function(){
  var STYLES = ['none','short','tousled','side_part','bob','curly','afro','spiky','mohawk','ponytail','bun','long'];
  var COLORS = ['#1A1A1A','#C1502E','#A855F7'];
  var R = { styles: STYLES.slice(), errors: [], isolationOK: false, noneIsBare: false };

  function svgOf(sci, rx) {
    var d = document.createElement('div');
    d.innerHTML = WLScientist.buildSVG(sci, rx || 'neutral');
    return d.firstElementChild;
  }

  function cell(sci, rx, label, size) {
    var wrapper = document.createElement('div');
    wrapper.className = 'cell' + (size === 'sm' ? ' sm' : '');
    try {
      wrapper.appendChild(svgOf(sci, rx));
    } catch (e) {
      R.errors.push({ key: label, err: e.message });
      var err = document.createElement('div');
      err.textContent = 'ERR: ' + e.message;
      err.style.color = '#f87171';
      wrapper.appendChild(err);
    }
    var lbl = document.createElement('div');
    lbl.textContent = label;
    wrapper.appendChild(lbl);
    return wrapper;
  }

  // ── Style grid: 12 styles × 3 colours, large ────────────────────
  var grid = document.getElementById('grid');
  STYLES.forEach(function(style) {
    COLORS.forEach(function(color) {
      var key = style + '@' + color;
      var sci = { skinTone: '#FDBCB4', coatColor: '#6366f1', hair: style, hairColor: color };
      var svg;
      try {
        svg = WLScientist.buildSVG(sci, 'neutral');
        if (!svg || svg.indexOf('<svg') !== 0) throw new Error('empty/invalid svg');
      } catch (e) {
        R.errors.push({ key: key, err: e.message });
      }
      grid.appendChild(cell(sci, 'neutral', key, 'lg'));
    });
  });

  // ── 44px row: legibility check, black hair, all styles ──────────
  var mini = document.getElementById('mini');
  STYLES.forEach(function(style) {
    var sci = { skinTone: '#FDBCB4', coatColor: '#6366f1', hair: style, hairColor: '#1A1A1A' };
    mini.appendChild(cell(sci, 'happy', style, 'sm'));
  });

  // ── Layering: hats over hair (beanie should cover, tiara sits in front) ──
  var hats = document.getElementById('hats');
  [
    [{ hair: 'short', hairColor: '#8C3B2B' }, 'short (no hat)'],
    [{ hair: 'short', hairColor: '#8C3B2B', head: 'beanie' }, 'short + beanie'],
    [{ hair: 'long', hairColor: '#D9B36A' }, 'long (no hat)'],
    [{ hair: 'long', hairColor: '#D9B36A', head: 'tiara' }, 'long + tiara'],
    [{ hair: 'ponytail', hairColor: '#3B82F6', head: 'beanie' }, 'ponytail + beanie'],
  ].forEach(function(pair) {
    var sci = Object.assign({ skinTone: '#FDBCB4', coatColor: '#6366f1' }, pair[0]);
    hats.appendChild(cell(sci, 'neutral', pair[1], 'lg'));
  });

  // ── none/null = bare head (no hair gradient) ─────────────────────
  var bareNull = svgOf({ skinTone: '#FDBCB4', coatColor: '#6366f1', hair: null });
  var bareNone = svgOf({ skinTone: '#FDBCB4', coatColor: '#6366f1', hair: 'none' });
  R.noneIsBare = !bareNull.querySelector('[id^=hairG]') && !bareNone.querySelector('[id^=hairG]');

  // ── Isolation: two characters, different style + colour, share no hairG id ──
  var iso = document.getElementById('iso');
  var a = svgOf({ skinTone: '#FDBCB4', coatColor: '#f00', hair: 'afro', hairColor: '#1A1A1A' }, 'happy');
  var b = svgOf({ skinTone: '#5C3A29', coatColor: '#0f0', hair: 'long', hairColor: '#A855F7' }, 'happy');
  iso.appendChild((function(){ var w=document.createElement('div'); w.className='cell'; w.appendChild(a.cloneNode(true)); w.appendChild(document.createTextNode('A: afro/black')); return w; })());
  iso.appendChild((function(){ var w=document.createElement('div'); w.className='cell'; w.appendChild(b.cloneNode(true)); w.appendChild(document.createTextNode('B: long/violet')); return w; })());
  function hairGIds(svg) { return [...svg.querySelectorAll('[id^=hairG]')].map(function(n){ return n.id; }); }
  var aIds = hairGIds(a), bIds = hairGIds(b);
  R.isolationOK = aIds.length > 0 && bIds.length > 0 && aIds.every(function(id){ return bIds.indexOf(id) === -1; });

  R.allPass = R.errors.length === 0 && R.isolationOK && R.noneIsBare;
  window.__HAIR__ = R;

  var pre = document.getElementById('results');
  pre.style.color = R.allPass ? '#4ade80' : '#f87171';
  pre.textContent = JSON.stringify(R, null, 2);
})();
</script>
</body></html>
