<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Effects + pets harness</title>
<style>body{background:#141327;color:#e2e8f0;font-family:sans-serif;padding:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.cell{background:radial-gradient(120% 90% at 50% 30%,#2c2b45,#141327);border-radius:12px;padding:8px;text-align:center;font-size:11px}
.cell svg{width:110px;height:110px;display:block}
.cell44 svg{width:44px;height:44px;display:block}
.stage{position:relative;width:150px;height:200px;background:#1c1b30;border-radius:12px;display:inline-block}
.stage > svg{width:100%;height:auto;display:block}
pre{background:#0f0e1c;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px}</style>
</head><body>
<h2>Effects visibility + 6 new pets</h2>
<h3>All 15 pets (~110px)</h3><div class="row" id="pets"></div>
<h3>Glow effects — behind+front layers on shop- and game-shaped stages</h3><div class="row" id="fx"></div>
<pre id="results">running…</pre>
<script src="../../wordlab-worlds.js?v=T"></script>
<script src="../../wordlab-shop-data.js?v=T"></script>
<script src="../../wordlab-scientist.js?v=T"></script>
<script src="../../wordlab-effects.js?v=T"></script>
<script>
(function(){
  // WLEffects.start gates on WordLabData.isLowStimMode() (not the body class).
  // Stub it so the low-stim assertion below is meaningful; normal runs get false.
  window.__LOWSTIM__ = false;
  window.WordLabData = window.WordLabData || { isLowStimMode: function(){ return window.__LOWSTIM__ === true; } };
  const NEW = ['goldfish','duck','bunny','goose','sealion','giraffe'];
  const ALL = ['cat','ginger_cat','puppy','bird','frog','owl','dragon','horse','hamster'].concat(NEW);
  const R = { pets:{ newRendered:{}, allCount:ALL.length, gradDupes:[], gradTotal:0, gradUnique:0 },
              fx:{}, shop:{ petCount:0, newInShop:[] }, errors:[] };

  // ── Pets render + unique-id isolation across ALL 15 together ──
  const petsEl = document.getElementById('pets');
  const allGradIds = [];
  ALL.forEach(function(id){
    try {
      const svg = WLScientist.buildPetSVG(id);
      const c = document.createElement('div'); c.className='cell'; c.innerHTML = svg;
      c.appendChild(document.createTextNode(id)); petsEl.appendChild(c);
      const ok = !!(svg && svg.length>50 && c.querySelector('svg'));
      if (NEW.indexOf(id)>=0) R.pets.newRendered[id] = ok;
      if (!ok) R.errors.push('pet-render-failed:'+id);
      Array.prototype.forEach.call(c.querySelectorAll('[id^="petG"]'), function(n){ allGradIds.push(n.id); });
    } catch(e){ R.errors.push('pet-threw:'+id+':'+e.message); }
  });
  const seen={}, dups=[];
  allGradIds.forEach(function(i){ if(seen[i])dups.push(i); seen[i]=true; });
  R.pets.gradTotal = allGradIds.length; R.pets.gradUnique = Object.keys(seen).length; R.pets.gradDupes = dups;

  // ── Shop catalogue: new pets present ──
  try {
    R.shop.petCount = WLShopData.pets.length;
    R.shop.newInShop = NEW.filter(function(id){ return WLShopData.pets.some(function(p){return p.id===id;}); });
  } catch(e){ R.errors.push('shop-threw:'+e.message); }

  // ── Glow effects: behind+front layer presence + teardown + low-stim ──
  const GLOW = ['aura','shimmer','divine','quantum','vortex','blackhole'];
  const fxEl = document.getElementById('fx');
  function makeStage(shape){
    const s = document.createElement('div'); s.className='stage';
    if (shape==='game'){
      const w = document.createElement('div'); w.id='sciCharWrap';
      w.style.cssText='position:relative;z-index:20;width:100%;height:100%';
      w.innerHTML='<svg viewBox="0 0 80 120" style="width:60%;margin:0 auto;display:block"><ellipse cx="40" cy="40" rx="22" ry="22" fill="#fbcd9b"/><rect x="14" y="60" width="52" height="58" rx="10" fill="#fff"/></svg>';
      s.appendChild(w);
    } else {
      s.innerHTML='<svg viewBox="0 0 80 120" style="width:60%;margin:0 auto;display:block"><ellipse cx="40" cy="40" rx="22" ry="22" fill="#fbcd9b"/><rect x="14" y="60" width="52" height="58" rx="10" fill="#fff"/></svg>';
    }
    return s;
  }
  ['shop','game'].forEach(function(shape){
    GLOW.forEach(function(fx){
      const key = fx+'/'+shape;
      const rec = { behindNodes:0, frontNodes:0, teardownClean:null };
      try {
        const s = makeStage(shape); fxEl.appendChild(s);
        WLEffects.start(fx, s);
        const behind = s.querySelector('.wlfx-behind');
        const front  = s.querySelector('.wlfx-front');
        rec.behindNodes = behind ? behind.children.length : 0;
        rec.frontNodes  = front  ? front.children.length  : 0;
        // z-coherence: behind z < character z < front z
        if (behind && front){
          const bz = parseInt(getComputedStyle(behind).zIndex,10);
          const fz = parseInt(getComputedStyle(front).zIndex,10);
          rec.zOrderOK = (bz < 20 && fz > 20) || (bz < fz);
        }
        if (rec.frontNodes < 1) R.errors.push(key+': no front veil (invisible-behind risk)');
        if (rec.behindNodes < 1) R.errors.push(key+': no behind halo');
        // teardown
        WLEffects.stop(s);
        rec.teardownClean = !s.querySelector('.wlfx-behind') && !s.querySelector('.wlfx-front');
        if (!rec.teardownClean) R.errors.push(key+': teardown left layers');
        const label = document.createElement('div'); label.style.fontSize='10px'; label.textContent=key;
        s.appendChild(label);
      } catch(e){ R.errors.push(key+':threw:'+e.message); }
      R.fx[key] = rec;
    });
  });

  // ── Low-stim gate: glow effect creates ZERO layers under body.low-stim ──
  try {
    window.__LOWSTIM__ = true;
    const s = makeStage('shop'); document.body.appendChild(s);
    WLEffects.start('aura', s);
    R.lowStimZeroLayers = !s.querySelector('.wlfx-behind') && !s.querySelector('.wlfx-front');
    if (!R.lowStimZeroLayers) R.errors.push('low-stim: aura still created layers');
    WLEffects.stop(s);
    window.__LOWSTIM__ = false;
  } catch(e){ R.errors.push('lowstim-threw:'+e.message); }

  R.PASS = R.errors.length === 0;
  window.__RESULTS__ = R;
  document.getElementById('results').textContent = JSON.stringify(R, null, 2);
})();
</script></body></html>
