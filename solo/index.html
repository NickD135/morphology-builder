<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLO Tracker – Word Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#1e1b4b;--indigo:#4338ca;--ind-mid:#6366f1;
      --ind-50:#eef2ff;--ind-100:#e0e7ff;--ind-200:#c7d2fe;
      --blue:#3b82f6;--bg:#f4f6fb;--surface:#ffffff;
      --border:rgba(15,23,42,0.08);--text:#0f172a;--sub:#475569;
      --muted:#94a3b8;
      --sh-sm:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
      --sh-md:0 4px 16px rgba(15,23,42,0.07),0 1px 3px rgba(15,23,42,0.04);
      --sh-lg:0 8px 40px rgba(15,23,42,0.10),0 2px 8px rgba(15,23,42,0.05);
      --sh-hov:0 16px 48px rgba(67,56,202,0.12),0 4px 12px rgba(15,23,42,0.07);
      --r:16px;--tx:all 0.2s cubic-bezier(0.4,0,0.2,1)
    }
    html,body,#root{height:100%}
    body{background:var(--bg);font-family:'Lexend',sans-serif;color:var(--text)}
    #root{display:flex;flex-direction:column}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    /* Learn card soul — gated for reduced-motion + low-stim below */
    @keyframes lcCardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes lcStepIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes lcBadgePop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
    @keyframes lcCheckPop{0%{transform:scale(.4)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
    @keyframes lcHalo{0%{box-shadow:0 0 0 0 rgba(22,163,74,0)}30%{box-shadow:0 0 0 4px rgba(22,163,74,.3)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
    .lc-card{animation:lcCardIn 440ms cubic-bezier(.4,0,.2,1) both}
    .lc-step{animation:lcStepIn 300ms cubic-bezier(.4,0,.2,1) both}
    .lc-badge{animation:lcBadgePop 380ms cubic-bezier(.34,1.56,.64,1) both}
    .lc-check{display:inline-block;animation:lcCheckPop 440ms cubic-bezier(.34,1.56,.64,1) both}
    .lc-done{animation:lcHalo 800ms ease-out 1}
    @keyframes coachPop{0%{transform:scale(.88)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
    @keyframes coachShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2.5px)}60%{transform:translateX(2.5px)}}
    @keyframes coachBubble{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .coach-pop{animation:coachPop 420ms cubic-bezier(.34,1.56,.64,1)}
    .coach-shake{animation:coachShake 380ms ease-in-out}
    .coach-bubble{animation:coachBubble 280ms cubic-bezier(.4,0,.2,1) both}
    @media (prefers-reduced-motion:reduce){.lc-card,.lc-step,.lc-badge,.lc-check,.lc-done,.coach-pop,.coach-shake,.coach-bubble{animation:none!important}}
    body.low-stim .lc-card,body.low-stim .lc-step,body.low-stim .lc-badge,body.low-stim .lc-check,body.low-stim .lc-done,body.low-stim .coach-pop,body.low-stim .coach-shake,body.low-stim .coach-bubble{animation:none!important}
  </style>
</head>
<body>
  <div id="root"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e1b4b;flex-direction:column;gap:16px"><div style="width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,0.15);border-top-color:#6366f1;animation:spin 0.8s linear infinite"></div><div style="color:rgba(255,255,255,0.7);font-family:sans-serif;font-size:14px;letter-spacing:0.03em">Loading…</div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
// ─── Question banks ───────────────────────────────────────────────────────────
var UNITS = [
  // ── Unit 24: Fractions ────────────────────────────────────────────────────
  { id:"u24", name:"Unit 24", subtitle:"Fractions", outcomes:[
    {id:"r1",band:"red",short:"Order unit fractions",label:"Compare and order unit fractions with denominators of 2,3,4,5,6,8 and 10 on a number line",questions:[
      {id:1,type:"truefalse",text:"True or false: 1/4 is greater than 1/3.",answer:"false"},
      {id:2,type:"numberline",text:"Place each fraction in its correct position on the number line.",tokens:["1/2","1/4","1/8"],targets:{"1/2":[0.40,0.60],"1/4":[0.18,0.32],"1/8":[0.05,0.17]}},
      {id:3,type:"mc",text:"Which fraction is closest to 1 on a number line?",options:["1/10","1/8","1/4","1/2"],answer:"1/2"},
      {id:4,type:"truefalse",text:"True or false: the larger the denominator, the smaller the unit fraction.",answer:"true"},
      {id:5,type:"numberline",text:"Place each fraction in its correct position on the number line.",tokens:["1/3","1/2","1/10","1/5"],targets:{"1/3":[0.27,0.39],"1/2":[0.42,0.58],"1/10":[0.05,0.14],"1/5":[0.15,0.26]}},
      {id:6,type:"mc",text:"Which fraction sits between 1/4 and 1/2 on a number line?",options:["1/8","1/6","1/3","1/10"],answer:"1/3"},
      {id:7,type:"truefalse",text:"True or false: 1/6 is smaller than 1/8.",answer:"false"},
      {id:8,type:"input",text:"Write a unit fraction that is smaller than 1/4 but larger than 1/8.",answer:"1/6",aliases:["1/5"]},
      {id:9,type:"mc",text:"What is the correct order from left to right on a number line?",options:["1/2, 1/4, 1/8","1/8, 1/4, 1/2","1/4, 1/8, 1/2","1/2, 1/8, 1/4"],answer:"1/8, 1/4, 1/2"},
      {id:10,type:"order",text:"Click from largest to smallest.",items:["1/10","1/2","1/4","1/6"],answer:["1/2","1/4","1/6","1/10"]},
    ]},
    {id:"r2",band:"red",short:"Equivalent fractions for half",label:"Create equivalent fractions for half in quarters, eighths, sixths and tenths",questions:[
      {id:1,type:"partition",text:"Shade exactly half of this bar.",parts:4,target:2,shape:"bar"},
      {id:2,type:"input",text:"How many quarters make one half?",answer:"2"},
      {id:3,type:"partition",text:"Shade exactly half of this bar.",parts:8,target:4,shape:"bar"},
      {id:4,type:"input",text:"How many eighths make one half?",answer:"4"},
      {id:5,type:"input",text:"How many tenths make one half?",answer:"5"},
      {id:6,type:"input",text:"How many sixths make one half?",answer:"3"},
      {id:7,type:"mc",text:"Which fraction is equivalent to 1/2?",options:["3/8","4/8","2/6","3/10"],answer:"4/8"},
      {id:8,type:"truefalse",text:"True or false: 5/10 is equivalent to 1/2.",answer:"true"},
      {id:9,type:"input",text:"1/2 = ?/10 — what is the missing number?",answer:"5"},
      {id:10,type:"match",text:"Match each fraction to its equivalent.",left:["1/2","2/4","3/6"],right:["5/10","6/12","4/8"],pairs:{"1/2":"5/10","2/4":"4/8","3/6":"6/12"}},
    ]},
    {id:"r3",band:"red",short:"Add fractions: same denominator",label:"Add fractions with the same denominator and make a whole",questions:[
      {id:1,type:"input",text:"3/10 + 4/10 =",answer:"7/10"},
      {id:2,type:"input",text:"2/6 + 3/6 =",answer:"5/6"},
      {id:3,type:"input",text:"2/4 + 3/4 =",answer:"5/4",aliases:["1 1/4"]},
      {id:4,type:"input",text:"7/8 + 6/8 =",answer:"13/8",aliases:["1 5/8"]},
      {id:5,type:"input",text:"3/8 + ?/8 = 7/8 — what is the missing numerator?",answer:"4"},
      {id:6,type:"truefalse",text:"True or false: when you add fractions with the same denominator, you add both the numerators and the denominators.",answer:"false"},
      {id:7,type:"mc",text:"What is 5/12 + 7/12?",options:["12/24","11/12","12/12","10/12"],answer:"12/12"},
      {id:8,type:"input",text:"1/5 + 3/5 =",answer:"4/5"},
      {id:9,type:"input",text:"?/6 + 2/6 = 5/6 — what is the missing numerator?",answer:"3"},
      {id:10,type:"truefalse",text:"True or false: 4/10 + 8/10 = 12/10.",answer:"true"},
    ]},
    {id:"r4",band:"red",short:"Subtract fractions: same denominator",label:"Find the difference between fractions with the same denominator",questions:[
      {id:1,type:"input",text:"7/10 − 5/10 =",answer:"2/10",aliases:["1/5"]},
      {id:2,type:"input",text:"6/8 − 3/8 =",answer:"3/8"},
      {id:3,type:"input",text:"5/6 − 2/6 =",answer:"3/6",aliases:["1/2"]},
      {id:4,type:"input",text:"9/4 − 3/4 =",answer:"6/4",aliases:["3/2","1 2/4","1 1/2"]},
      {id:5,type:"input",text:"7/8 − ?/8 = 3/8 — what is the missing numerator?",answer:"4"},
      {id:6,type:"truefalse",text:"True or false: 8/10 − 3/10 = 5/10.",answer:"true"},
      {id:7,type:"mc",text:"What is 11/12 − 4/12?",options:["8/12","7/0","7/12","6/12"],answer:"7/12"},
      {id:8,type:"input",text:"4/5 − 1/5 =",answer:"3/5"},
      {id:9,type:"input",text:"?/6 − 1/6 = 4/6 — what is the missing numerator?",answer:"5"},
      {id:10,type:"truefalse",text:"True or false: 3/4 − 1/4 = 2/8.",answer:"false"},
    ]},
    {id:"r5",band:"red",short:"Word problems: same denominator",label:"Solve word problems involving fractions with the same denominator",questions:[
      {id:1,type:"input",text:"Emily has 5/12 of a chocolate bar. Nathan has 4/12. How much altogether?",answer:"9/12",aliases:["3/4"]},
      {id:2,type:"input",text:"A jug has 1 litre of juice. You pour out 3/8 of a litre. How much is left?",answer:"5/8"},
      {id:3,type:"input",text:"There is 7/10 of a pizza in one box and 3/10 in another. How much more in the first box?",answer:"4/10",aliases:["2/5"]},
      {id:4,type:"mc",text:"A ribbon is 9/10 m long. You cut off 4/10 m. How much is left?",options:["5/20 m","13/10 m","4/10 m","5/10 m"],answer:"5/10 m"},
      {id:5,type:"input",text:"Jack eats 3/8 of a pie and Jill eats 2/8. How much have they eaten altogether?",answer:"5/8"},
      {id:6,type:"truefalse",text:"True or false: 4/9 + 6/9 is more than 1 whole.",answer:"true"},
      {id:7,type:"input",text:"A tank is 7/8 full. After draining 3/8, how full is it?",answer:"4/8",aliases:["1/2"]},
      {id:8,type:"mc",text:"Sam ran 3/5 km in the morning and 1/5 km in the afternoon. How far in total?",options:["4/10 km","2/5 km","3/5 km","4/5 km"],answer:"4/5 km"},
      {id:9,type:"input",text:"A cake has 10 equal pieces. Tom eats 3 and Sue eats 4. What fraction is left?",answer:"3/10"},
      {id:10,type:"truefalse",text:"True or false: 5/8 + 4/8 = 9/16.",answer:"false"},
    ]},
    {id:"r6",band:"red",short:"Fraction of a quantity",label:"Solve word problems involving a fraction of a quantity",questions:[
      {id:1,type:"input",text:"A box has 24 apples. 1/3 are red. How many red apples?",answer:"8"},
      {id:2,type:"input",text:"A bus has 16 passengers. Half are children. How many children?",answer:"8"},
      {id:3,type:"input",text:"You have $9. You spend 2/3 of it. How much is left?",answer:"3"},
      {id:4,type:"mc",text:"What is 1/4 of 20?",options:["4","5","6","8"],answer:"5"},
      {id:5,type:"input",text:"A class has 30 students. 1/5 are absent. How many are absent?",answer:"6"},
      {id:6,type:"input",text:"1/3 of a number is 7. What is the number?",answer:"21"},
      {id:7,type:"truefalse",text:"True or false: 1/4 of 12 = 4.",answer:"false"},
      {id:8,type:"input",text:"There are 40 lollies. 3/4 are red. How many red lollies?",answer:"30"},
      {id:9,type:"mc",text:"A bag has 18 marbles. 2/3 are blue. How many are blue?",options:["6","9","12","14"],answer:"12"},
      {id:10,type:"input",text:"1/5 of a number is 6. What is the number?",answer:"30"},
    ]},
    {id:"y1",band:"yellow",short:"Multi-step word problems",label:"Solve multi-step word problems with related denominators",questions:[
      {id:1,type:"input",text:"84 students go on excursions. 1/6 go to the museum. How many?",answer:"14"},
      {id:2,type:"input",text:"84 students go on excursions. 1/4 go to the zoo. How many?",answer:"21"},
      {id:3,type:"input",text:"84 students: 1/6 museum, 1/4 zoo. How many go to the theme park?",answer:"49"},
      {id:4,type:"mc",text:"60 students. 1/3 play sport and 1/4 do art (no overlap). How many do neither?",options:["15","20","25","30"],answer:"25"},
      {id:5,type:"input",text:"A farmer has 120 animals. 1/4 are cows and 1/3 are sheep. How many are neither?",answer:"50"},
      {id:6,type:"truefalse",text:"True or false: 1/3 of 84 is more than 1/4 of 84.",answer:"true"},
      {id:7,type:"input",text:"72 students. 1/8 go to the library and 1/4 go to sport. How many go to neither?",answer:"45"},
      {id:8,type:"mc",text:"A school has 240 students. 1/6 are in Year 5 and 1/4 are in Year 6. How many combined?",options:["80","90","100","110"],answer:"100"},
      {id:9,type:"input",text:"36 students. 1/3 chose maths and 1/4 chose English (no overlap). How many chose neither?",answer:"15"},
      {id:10,type:"truefalse",text:"True or false: 1/6 of 84 plus 1/4 of 84 is less than half of 84.",answer:"true"},
    ]},
    {id:"y2",band:"yellow",short:"Order fractions: related denominators",label:"Order fractions with related denominators using diagrams and number lines",questions:[
      {id:1,type:"numberline",text:"Place these fractions in their correct positions on the number line.",tokens:["4/12","1/2","2/3","5/6"],targets:{"4/12":[0.26,0.40],"1/2":[0.42,0.58],"2/3":[0.60,0.74],"5/6":[0.76,0.90]}},
      {id:2,type:"mc",text:"Which is larger: 3/4 or 5/8?",options:["3/4","5/8","They are equal"],answer:"3/4"},
      {id:3,type:"truefalse",text:"True or false: 2/3 is greater than 3/4.",answer:"false"},
      {id:4,type:"numberline",text:"Place these fractions in their correct positions on the number line.",tokens:["1/4","3/8","1/2","7/8"],targets:{"1/4":[0.19,0.31],"3/8":[0.31,0.44],"1/2":[0.44,0.57],"7/8":[0.81,0.93]}},
      {id:5,type:"input",text:"Convert 3/4 to eighths (write as ?/8).",answer:"6/8"},
      {id:6,type:"truefalse",text:"True or false: 5/6 is greater than 7/8.",answer:"false"},
      {id:7,type:"mc",text:"Which is the correct order from largest to smallest?",options:["2/3, 5/6, 1/2, 1/3","5/6, 2/3, 1/2, 1/3","1/3, 1/2, 2/3, 5/6","5/6, 1/2, 2/3, 1/3"],answer:"5/6, 2/3, 1/2, 1/3"},
      {id:8,type:"truefalse",text:"True or false: 4/12 is the same as 1/3.",answer:"true"},
      {id:9,type:"input",text:"Convert 2/3 to sixths (write as ?/6).",answer:"4/6"},
      {id:10,type:"mc",text:"Which fraction is between 1/2 and 2/3 on a number line?",options:["1/3","3/4","7/12","5/6"],answer:"7/12"},
    ]},
    {id:"y3",band:"yellow",short:"Fractions of collections: decimals",label:"Find 1/2, 1/4, 1/5 and 1/10 of collections, expressing remainders as decimals",questions:[
      {id:1,type:"input",text:"1/2 of 15 — write as a decimal.",answer:"7.5"},
      {id:2,type:"input",text:"1/4 of 15 — write as a decimal.",answer:"3.75"},
      {id:3,type:"input",text:"1/5 of 24 — write as a decimal.",answer:"4.8"},
      {id:4,type:"input",text:"1/10 of 24 — write as a decimal.",answer:"2.4"},
      {id:5,type:"mc",text:"What is 1/4 of 7 as a decimal?",options:["1.5","1.75","2.25","2.5"],answer:"1.75"},
      {id:6,type:"truefalse",text:"True or false: 1/2 of 9 = 4.5.",answer:"true"},
      {id:7,type:"input",text:"1/5 of 13 — write as a decimal.",answer:"2.6"},
      {id:8,type:"mc",text:"What is 1/10 of 35?",options:["3","3.5","4","3.55"],answer:"3.5"},
      {id:9,type:"input",text:"1/4 of 9 — write as a decimal.",answer:"2.25"},
      {id:10,type:"truefalse",text:"True or false: 1/2 of any odd number will always give a decimal answer.",answer:"true"},
    ]},
    {id:"y4",band:"yellow",short:"Equivalent fractions: notation",label:"Record equivalent fractions using diagrams, words and fraction notation",questions:[
      {id:1,type:"mc",text:"Which is equivalent to 2/3?",options:["4/6","3/4","6/10","4/5"],answer:"4/6"},
      {id:2,type:"mc",text:"Which is also equivalent to 2/3?",options:["6/8","4/10","3/6","8/12"],answer:"8/12"},
      {id:3,type:"input",text:"Complete: 2/3 = ?/12 — write just the missing number.",answer:"8"},
      {id:4,type:"input",text:"Complete: 3/4 = ?/8 — write just the missing number.",answer:"6"},
      {id:5,type:"truefalse",text:"True or false: 4/6 and 6/9 are both equivalent to 2/3.",answer:"true"},
      {id:6,type:"input",text:"Write an equivalent fraction for 1/3 with denominator 9 (e.g. 3/9).",answer:"3/9"},
      {id:7,type:"mc",text:"Which fraction is NOT equivalent to 3/4?",options:["6/8","9/12","12/16","6/10"],answer:"6/10"},
      {id:8,type:"input",text:"Complete: 1/2 = 3/? — write just the missing number.",answer:"6"},
      {id:9,type:"truefalse",text:"True or false: 10/15 is equivalent to 2/3.",answer:"true"},
      {id:10,type:"match",text:"Match each fraction to its equivalent.",left:["2/3","3/4","1/5"],right:["8/12","2/10","6/8"],pairs:{"2/3":"8/12","3/4":"6/8","1/5":"2/10"}},
    ]},
    {id:"y5",band:"yellow",short:"Recreate the whole",label:"Recreate the whole from fractional parts including quarters, eighths, thirds, sixths, fifths and tenths",questions:[
      {id:1,type:"input",text:"1/4 + 1/4 + __ = 1. What is the missing fraction?",answer:"2/4",aliases:["1/2"]},
      {id:2,type:"input",text:"1/5 + 1/5 + 1/5 + __ = 1. What is the missing fraction?",answer:"2/5"},
      {id:3,type:"input",text:"1/8 + 1/8 + 1/8 + 1/8 + __ = 1. What is the missing fraction?",answer:"4/8",aliases:["1/2"]},
      {id:4,type:"mc",text:"How many thirds make a whole?",options:["2","3","4","6"],answer:"3"},
      {id:5,type:"input",text:"3/10 + 2/10 + ?/10 = 1. What is the missing numerator?",answer:"5"},
      {id:6,type:"truefalse",text:"True or false: 5/6 + 1/6 = 1 whole.",answer:"true"},
      {id:7,type:"input",text:"2/5 + 1/5 + __ = 1. What is the missing fraction?",answer:"2/5"},
      {id:8,type:"mc",text:"Which fraction completes: 3/8 + 2/8 + __ = 1?",options:["2/8","3/8","4/8","5/8"],answer:"3/8"},
      {id:9,type:"input",text:"?/4 + 3/4 = 1. What is the missing numerator?",answer:"1"},
      {id:10,type:"partition",text:"Shade all parts of this circle to show that 4/4 equals 1 whole.",parts:4,target:4,shape:"circle"},
    ]},
    {id:"y6",band:"yellow",short:"Add and subtract: related denominators",label:"Represent fractions with related denominators to add and subtract",questions:[
      {id:1,type:"input",text:"1/8 + 3/4 = (give answer as eighths, e.g. 7/8)",answer:"7/8"},
      {id:2,type:"input",text:"2/3 + 5/12 = (give answer as twelfths)",answer:"13/12",aliases:["1 1/12"]},
      {id:3,type:"input",text:"7/9 − 1/3 = (give answer as ninths)",answer:"4/9"},
      {id:4,type:"input",text:"11/12 − 3/4 = (give answer as twelfths)",answer:"2/12",aliases:["1/6"]},
      {id:5,type:"mc",text:"What is 1/2 + 1/4?",options:["2/6","2/4","3/4","3/6"],answer:"3/4"},
      {id:6,type:"input",text:"1/2 + ?/4 = 3/4. What is the missing numerator?",answer:"1"},
      {id:7,type:"truefalse",text:"True or false: 3/4 − 1/2 = 1/4.",answer:"true"},
      {id:8,type:"input",text:"5/6 − 1/3 = (write answer as sixths)",answer:"3/6",aliases:["1/2"]},
      {id:9,type:"mc",text:"What is 7/8 − 1/4?",options:["6/4","6/8","5/8","4/8"],answer:"5/8"},
      {id:10,type:"truefalse",text:"True or false: 2/3 + 1/6 = 5/6.",answer:"true"},
    ]},
    {id:"g1",band:"green",short:"Simplify fractions",label:"Simplify fractions using the HCF of the numerator and denominator or repeated simplification",questions:[
      {id:1,type:"mc",text:"What is the HCF of 12 and 18?",options:["2","3","6","9"],answer:"6"},
      {id:2,type:"input",text:"Simplify 12/18 to its lowest terms.",answer:"2/3"},
      {id:3,type:"mc",text:"What is 16/24 in its simplest form?",options:["4/8","2/3","8/12","4/6"],answer:"2/3"},
      {id:4,type:"input",text:"Simplify 15/25.",answer:"3/5"},
      {id:5,type:"truefalse",text:"True or false: 14/21 simplified is 2/3.",answer:"true"},
      {id:6,type:"mc",text:"Which fraction is already in its simplest form?",options:["4/8","6/9","5/7","6/10"],answer:"5/7"},
      {id:7,type:"input",text:"Simplify 18/24.",answer:"3/4"},
      {id:8,type:"truefalse",text:"True or false: to simplify a fraction you divide both the numerator and denominator by their HCF.",answer:"true"},
      {id:9,type:"mc",text:"What is the HCF of 20 and 30?",options:["5","10","15","20"],answer:"10"},
      {id:10,type:"input",text:"Simplify 20/30 to its lowest terms.",answer:"2/3"},
    ]},
    {id:"g2",band:"green",short:"Fractions and decimals on a number line",label:"Locate positive and negative fractions, decimals and mixed numbers on a number line",questions:[
      {id:1,type:"mc",text:"Where does 1.5 sit on a number line?",options:["Between 0 and 1","Between 1 and 2","Between 2 and 3","At 2"],answer:"Between 1 and 2"},
      {id:2,type:"mc",text:"Which is the correct order from smallest to largest: −1/2, 1/4, −1, 3/4?",options:["−1/2, −1, 1/4, 3/4","−1, −1/2, 1/4, 3/4","1/4, 3/4, −1/2, −1","−1, 1/4, −1/2, 3/4"],answer:"−1, −1/2, 1/4, 3/4"},
      {id:3,type:"truefalse",text:"True or false: 1 3/4 sits between 1 and 2 on a number line.",answer:"true"},
      {id:4,type:"input",text:"What mixed number is halfway between 2 and 3?",answer:"2 1/2",aliases:["2.5"]},
      {id:5,type:"truefalse",text:"True or false: −3/4 is closer to 0 than −1 is.",answer:"true"},
      {id:6,type:"mc",text:"Which value is greatest?",options:["1 1/2","1.4","1 3/8","1.45"],answer:"1 1/2"},

      {id:3,type:"input",text:"2/3 − 1/4 = (write as a fraction)",answer:"5/12"},

  { id:"u25", name:"Unit 25", subtitle:"Data", outcomes:[
    {id:"r1",band:"red",short:"Collect and tabulate data",label:"Collect categorical and numerical data through surveys and observation and tabulate it",showTask:{instruction:"Conduct a quick survey. Ask at least 10 classmates ONE question — for example: 'What is your favourite season?' or 'Which do you prefer: reading, drawing, or sport?' Record every response in a tally table with three columns: Category, Tally, and Total.",checklist:["Column headers: Category, Tally, Total","A tally mark for every response","Totals filled in for each row","A title for your table","Every response is accounted for"],dataset:null},questions:[

      {id:2,type:"truefalse",text:"True or false: discrete numerical data can only take whole number values, like the number of siblings a student has.",answer:"true"},
      {id:3,type:"mc",text:"Which of these is an example of categorical data?",options:["Number of goals scored","Students' shoe sizes","Favourite colour","Number of books read"],answer:"Favourite colour"},
      {id:4,type:"input",text:"A survey of 28 students found: 10 chose football, 8 chose swimming, 6 chose tennis, and the rest chose basketball. How many chose basketball?",answer:"4"},
      {id:5,type:"truefalse",text:"True or false: a tally chart is a good way to record data as you collect it.",answer:"true"},
      {id:6,type:"mc",text:"Which method would you use to collect data about the number of birds visiting a garden each hour?",options:["Survey","Observation","Interview","Experiment"],answer:"Observation"},
      {id:7,type:"input",text:"A class of 30 students is surveyed about their pet. 9 have a dog, 7 have a cat, 5 have a fish, and the rest have no pet. How many have no pet?",answer:"9"},
      {id:8,type:"truefalse",text:"True or false: a spreadsheet is an appropriate tool for tabulating collected data.",answer:"true"},
      {id:9,type:"mc",text:"Which question collects nominal categorical data (named categories with no order)?",options:["How tall are you?","What is your favourite sport?","How many siblings do you have?","What is your age?"],answer:"What is your favourite sport?"},
      {id:10,type:"input",text:"A survey asks 25 students to choose their favourite season. 8 chose Summer, 5 chose Autumn, 7 chose Winter. How many chose Spring?",answer:"5"},
    ]},

    {id:"r3",band:"red",short:"Interpret and draw timelines",label:"Interpret integers on a timeline and draw accurate timelines using an appropriate scale",showTask:{instruction:"Draw a timeline from 1900 to 2000. Mark every decade (every 10 years) with an evenly-spaced tick. Then plot each event below at its correct position on your timeline.",checklist:["Number line drawn with ruler","Every decade (1900, 1910 … 2000) marked with a tick","Scale is even — all gaps the same size","All 5 events plotted at correct positions","Labels written neatly above or below the line","A title for your timeline"],dataset:{title:"Events to plot",rows:[["1901","Federation of Australia"],["1927","Canberra becomes capital"],["1956","Melbourne Olympics"],["1973","Sydney Opera House opens"],["1999","East Timor vote for independence"]]}},questions:[
      {id:1,type:"mc",text:"A timeline shows events from 1850 to 1950. What is the total time span?",options:["50 years","75 years","100 years","150 years"],answer:"100 years",svg:`<svg viewBox="0 0 260 70" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="70" fill="#f8fafc" rx="6"/><line x1="30" y1="38" x2="235" y2="38" stroke="#94a3b8" stroke-width="2"/><line x1="40" y1="32" x2="40" y2="44" stroke="#6366f1" stroke-width="2"/><text x="40" y="56" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">1850</text><line x1="138" y1="34" x2="138" y2="42" stroke="#94a3b8" stroke-width="1.5"/><text x="138" y="56" font-size="9" fill="#64748b" text-anchor="middle">1900</text><line x1="228" y1="32" x2="228" y2="44" stroke="#6366f1" stroke-width="2"/><text x="228" y="56" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">1950</text></svg>`},

      {id:5,type:"truefalse",text:"True or false: the scale on a timeline must show equal time intervals.",answer:"true"},
      {id:6,type:"input",text:"A timeline represents 60 years and is drawn 30 cm long. How many centimetres represent 10 years?",answer:"5"},

      {id:7,type:"mc",text:"What does a horizontal (flat) line on a line graph tell you?",options:["A rapid increase","No change over that time period","A decrease","The data has ended"],answer:"No change over that time period"},
      {id:8,type:"truefalse",text:"True or false: a line graph would be appropriate to display the favourite colours of students in a class.",answer:"false"},
      {id:9,type:"mc",text:"The line graph shows a student's test scores over five weeks. What is the overall trend?",options:["Increasing","Decreasing","No change","Random"],answer:"Increasing",svg:`<svg viewBox="0 0 260 150" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="150" fill="#f8fafc" rx="6"/><line x1="38" y1="15" x2="38" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="38" y1="120" x2="248" y2="120" stroke="#94a3b8" stroke-width="1.5"/><text x="10" y="70" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,10,70)">Score</text><line x1="38" y1="68" x2="248" y2="68" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="71" font-size="9" fill="#64748b" text-anchor="end">40</text><line x1="38" y1="41" x2="248" y2="41" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="44" font-size="9" fill="#64748b" text-anchor="end">60</text><line x1="38" y1="15" x2="248" y2="15" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="18" font-size="9" fill="#64748b" text-anchor="end">80</text><polyline points="68,41 108,35 148,28 188,31 228,22" fill="none" stroke="#6366f1" stroke-width="2"/><circle cx="68" cy="41" r="4" fill="#6366f1"/><text x="68" y="34" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">60</text><text x="68" y="133" font-size="9" fill="#475569" text-anchor="middle">Wk1</text><circle cx="108" cy="35" r="4" fill="#6366f1"/><text x="108" y="28" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">65</text><text x="108" y="133" font-size="9" fill="#475569" text-anchor="middle">Wk2</text><circle cx="148" cy="28" r="4" fill="#6366f1"/><text x="148" y="21" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">70</text><text x="148" y="133" font-size="9" fill="#475569" text-anchor="middle">Wk3</text><circle cx="188" cy="31" r="4" fill="#6366f1"/><text x="188" y="24" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">68</text><text x="188" y="133" font-size="9" fill="#475569" text-anchor="middle">Wk4</text><circle cx="228" cy="22" r="4" fill="#6366f1"/><text x="228" y="15" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">75</text><text x="228" y="133" font-size="9" fill="#475569" text-anchor="middle">Wk5</text></svg>`},
      {id:10,type:"input",text:"The line graph shows daily reading time (min) over one week. What is the mode?",answer:"30",svg:`<svg viewBox="0 0 260 150" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="150" fill="#f8fafc" rx="6"/><line x1="38" y1="15" x2="38" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="38" y1="120" x2="248" y2="120" stroke="#94a3b8" stroke-width="1.5"/><text x="10" y="70" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,10,70)">min</text><line x1="38" y1="90" x2="248" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="93" font-size="9" fill="#64748b" text-anchor="end">20</text><line x1="38" y1="60" x2="248" y2="60" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="63" font-size="9" fill="#64748b" text-anchor="end">40</text><line x1="38" y1="30" x2="248" y2="30" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="33" y="33" font-size="9" fill="#64748b" text-anchor="end">60</text><polyline points="68,75 108,75 148,52 188,30 228,75" fill="none" stroke="#6366f1" stroke-width="2"/><circle cx="68" cy="75" r="4" fill="#6366f1"/><text x="68" y="68" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">30</text><text x="68" y="133" font-size="9" fill="#475569" text-anchor="middle">Mon</text><circle cx="108" cy="75" r="4" fill="#6366f1"/><text x="108" y="68" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">30</text><text x="108" y="133" font-size="9" fill="#475569" text-anchor="middle">Tue</text><circle cx="148" cy="52" r="4" fill="#6366f1"/><text x="148" y="45" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">45</text><text x="148" y="133" font-size="9" fill="#475569" text-anchor="middle">Wed</text><circle cx="188" cy="30" r="4" fill="#6366f1"/><text x="188" y="23" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">60</text><text x="188" y="133" font-size="9" fill="#475569" text-anchor="middle">Thu</text><circle cx="228" cy="75" r="4" fill="#6366f1"/><text x="228" y="68" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">30</text><text x="228" y="133" font-size="9" fill="#475569" text-anchor="middle">Fri</text></svg>`},
    ]},
    {id:"r5",band:"red",short:"Choose appropriate data displays",label:"Recognise which types of data displays are appropriate to represent different types of data",questions:[
      {id:1,type:"mc",text:"Which display best shows how a value changes over time?",options:["Column graph","Side-by-side column graph","Line graph","Tally chart"],answer:"Line graph"},
      {id:2,type:"mc",text:"Which display would best compare the favourite sports of boys and girls?",options:["Line graph","Side-by-side column graph","Pie chart","Tally chart"],answer:"Side-by-side column graph"},
      {id:3,type:"truefalse",text:"True or false: a timeline is the best display for showing historical events in order.",answer:"true"},
      {id:4,type:"mc",text:"A researcher wants to display daily maximum temperatures for one month. Which is most appropriate?",options:["Tally chart","Side-by-side column graph","Pie chart","Line graph"],answer:"Line graph"},
      {id:5,type:"truefalse",text:"True or false: a column graph is appropriate for displaying categorical data.",answer:"true"},
      {id:6,type:"mc",text:"Which display would best show the results of a class survey about favourite subjects?",options:["Line graph","Timeline","Column graph","Scatter plot"],answer:"Column graph"},
      {id:7,type:"truefalse",text:"True or false: a line graph should be used to compare two groups' preferences across categories.",answer:"false"},
      {id:8,type:"mc",text:"To display when important events in a person's life occurred, which is most appropriate?",options:["Column graph","Line graph","Timeline","Side-by-side column graph"],answer:"Timeline"},
      {id:9,type:"mc",text:"A teacher wants to display how a student's weekly test scores have changed. Which is best?",options:["Column graph","Line graph","Side-by-side column graph","Timeline"],answer:"Line graph"},
      {id:10,type:"truefalse",text:"True or false: you could appropriately use a line graph to display categorical data such as favourite foods.",answer:"false"},
    ]},
    {id:"r6",band:"red",short:"Determine appropriate scale",label:"Determine an appropriate scale to represent data and use many-to-one scales",questions:[
      {id:1,type:"mc",text:"Data values are 10, 20, 30, 40, 50. Which scale is most appropriate?",options:["By 1s","By 10s","By 100s","By 5s"],answer:"By 10s"},
      {id:2,type:"truefalse",text:"True or false: a many-to-one scale means each unit on the axis represents more than one data value.",answer:"true"},
      {id:3,type:"input",text:"A pictograph uses 1 symbol = 5 students. If 35 students chose football, how many symbols are drawn?",answer:"7"},
      {id:4,type:"mc",text:"Your highest data value is 75. Which scale goes up to at least 75 in sensible steps?",options:["0 to 50 by 10s","0 to 60 by 20s","0 to 80 by 10s","0 to 100 by 50s"],answer:"0 to 80 by 10s"},
      {id:5,type:"truefalse",text:"True or false: the scale on a column graph must always start at 0.",answer:"true"},
      {id:6,type:"mc",text:"A many-to-one scale has 1 picture = 10 students. A category shows 4 pictures. How many students?",options:["14","4","400","40"],answer:"40"},
      {id:7,type:"input",text:"Data values range from 0 to 30 counting by 5s. How many gridlines are needed from 0 to 30 inclusive?",answer:"7"},
      {id:8,type:"mc",text:"Which scale would work best for data with a maximum value of 95?",options:["0 to 80 by 20s","0 to 50 by 10s","0 to 90 by 5s","0 to 100 by 10s"],answer:"0 to 100 by 10s"},
      {id:9,type:"input",text:"A pictograph uses 1 symbol = 4 students. If 24 students chose science, how many symbols are drawn?",answer:"6"},
      {id:10,type:"truefalse",text:"True or false: if your data goes up to 200, a scale that only reaches 100 would be inappropriate.",answer:"true"},
    ]},
    {id:"y1",band:"yellow",short:"Identify bias in data",label:"Identify sources of possible bias in data collection and surveys",questions:[
      {id:1,type:"mc",text:"A survey asks: 'Don't you agree that homework should be banned?' What type of bias is this?",options:["Sampling bias","Observer bias","Leading question bias","No bias"],answer:"Leading question bias"},
      {id:2,type:"truefalse",text:"True or false: surveying only one class to represent the whole school can cause sampling bias.",answer:"true"},
      {id:3,type:"mc",text:"Which survey method gives the most representative result for the whole school?",options:["Ask 5 friends","Ask only Year 6","Ask students at the library","Randomly select 30 students from all year groups"],answer:"Randomly select 30 students from all year groups"},
      {id:4,type:"truefalse",text:"True or false: a very small sample size can make survey results unreliable.",answer:"true"},
      {id:5,type:"mc",text:"A soft drink company surveys shoppers in their own branded store. What bias might exist?",options:["The sample is too large","The questions are unclear","People there may already prefer that brand","There is no bias"],answer:"People there may already prefer that brand"},
      {id:6,type:"input",text:"A survey of 3 students is used to represent a school of 300. Is this a good sample size? Write yes or no.",answer:"no"},
      {id:7,type:"mc",text:"Which survey question is most likely to produce unbiased results?",options:["Don't you love sport?","Isn't reading better than TV?","Surely you prefer healthy food?","What do you enjoy most in your free time?"],answer:"What do you enjoy most in your free time?"},
      {id:8,type:"truefalse",text:"True or false: to reduce bias, a survey should include a variety of participants from different groups.",answer:"true"},
      {id:9,type:"mc",text:"A survey about school start times is only given to teachers. What problem does this create?",options:["Too many people are surveyed","The questions are too long","Only one group's perspective is represented","The scale is wrong"],answer:"Only one group's perspective is represented"},
      {id:10,type:"truefalse",text:"True or false: a biased survey always produces completely wrong results.",answer:"false"},
    ]},
    {id:"y2",band:"yellow",short:"Identify misleading representations",label:"Identify misleading representations of data in graphs and media",questions:[
      {id:1,type:"mc",text:"A graph's y-axis starts at 80 instead of 0. What effect does this have?",options:["It makes the graph more colourful","It has no effect","It makes the graph easier to read","Small differences appear much larger"],answer:"Small differences appear much larger",svg:`<svg viewBox="0 0 260 150" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="150" fill="#f8fafc" rx="6"/><line x1="50" y1="20" x2="50" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="50" y1="120" x2="230" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="46" y1="124" x2="54" y2="119" stroke="#dc2626" stroke-width="1.5"/><line x1="46" y1="129" x2="54" y2="124" stroke="#dc2626" stroke-width="1.5"/><line x1="50" y1="95" x2="230" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="98" font-size="8" fill="#64748b" text-anchor="end">85</text><line x1="50" y1="70" x2="230" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="73" font-size="8" fill="#64748b" text-anchor="end">90</text><line x1="50" y1="45" x2="230" y2="45" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="48" font-size="8" fill="#64748b" text-anchor="end">95</text><line x1="50" y1="20" x2="230" y2="20" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="23" font-size="8" fill="#64748b" text-anchor="end">100</text><text x="45" y="123" font-size="8" fill="#64748b" text-anchor="end">80</text><rect x="80" y="110" width="40" height="10" fill="#6366f1" rx="2"/><text x="100" y="107" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">82</text><text x="100" y="134" font-size="9" fill="#475569" text-anchor="middle">School A</text><rect x="160" y="80" width="40" height="40" fill="#0d9488" rx="2"/><text x="180" y="77" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">88</text><text x="180" y="134" font-size="9" fill="#475569" text-anchor="middle">School B</text><text x="130" y="145" font-size="8" fill="#dc2626" text-anchor="middle">y-axis starts at 80, not 0</text></svg>`},
      {id:2,type:"truefalse",text:"True or false: starting a bar graph's y-axis at a number other than zero can be misleading.",answer:"true"},
      {id:3,type:"mc",text:"Graph A: y-axis 0–100. Graph B: same data, y-axis 90–100. Which makes the change look more dramatic?",options:["Graph A","They look the same","Graph B","Cannot tell"],answer:"Graph B",svg:`<svg viewBox="0 0 260 150" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="150" fill="#f8fafc" rx="6"/><text x="130" y="14" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Graph B — y-axis: 90–100</text><line x1="50" y1="22" x2="50" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="50" y1="120" x2="230" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="46" y1="124" x2="54" y2="119" stroke="#dc2626" stroke-width="1.5"/><line x1="46" y1="129" x2="54" y2="124" stroke="#dc2626" stroke-width="1.5"/><line x1="50" y1="95" x2="230" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="98" font-size="8" fill="#64748b" text-anchor="end">92</text><line x1="50" y1="70" x2="230" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="73" font-size="8" fill="#64748b" text-anchor="end">94</text><line x1="50" y1="45" x2="230" y2="45" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="48" font-size="8" fill="#64748b" text-anchor="end">97</text><line x1="50" y1="22" x2="230" y2="22" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="25" font-size="8" fill="#64748b" text-anchor="end">100</text><text x="45" y="123" font-size="8" fill="#64748b" text-anchor="end">90</text><rect x="80" y="100" width="40" height="20" fill="#6366f1" rx="2"/><text x="100" y="97" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">92</text><text x="100" y="134" font-size="9" fill="#475569" text-anchor="middle">Month 1</text><rect x="160" y="40" width="40" height="80" fill="#0d9488" rx="2"/><text x="180" y="37" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">98</text><text x="180" y="134" font-size="9" fill="#475569" text-anchor="middle">Month 2</text><text x="130" y="145" font-size="8" fill="#dc2626" text-anchor="middle">Same data looks more dramatic here</text></svg>`},
      {id:4,type:"truefalse",text:"True or false: a graph can be technically accurate yet still be misleading.",answer:"true"},
      {id:5,type:"mc",text:"Which feature of a graph is most important to check to avoid being misled?",options:["The colour","The size","The title","The scale and axis labels"],answer:"The scale and axis labels"},
      {id:6,type:"truefalse",text:"True or false: using pictures of different sizes to represent the same value in a pictograph is misleading.",answer:"true"},
      {id:7,type:"mc",text:"Sales went from 100 to 102. Headline: 'Sales skyrocket!' What makes this misleading?",options:["Wrong graph type","Sales actually decreased","Y-axis starts at 100, making a tiny increase look huge","The title is too short"],answer:"Y-axis starts at 100, making a tiny increase look huge",svg:`<svg viewBox="0 0 260 150" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="150" fill="#f8fafc" rx="6"/><text x="130" y="13" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">'Sales Skyrocket!'</text><line x1="50" y1="20" x2="50" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="50" y1="120" x2="230" y2="120" stroke="#94a3b8" stroke-width="1.5"/><line x1="46" y1="124" x2="54" y2="119" stroke="#dc2626" stroke-width="1.5"/><line x1="46" y1="129" x2="54" y2="124" stroke="#dc2626" stroke-width="1.5"/><line x1="50" y1="95" x2="230" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="98" font-size="8" fill="#64748b" text-anchor="end">100.5</text><line x1="50" y1="70" x2="230" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="73" font-size="8" fill="#64748b" text-anchor="end">101</text><line x1="50" y1="45" x2="230" y2="45" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="48" font-size="8" fill="#64748b" text-anchor="end">101.5</text><line x1="50" y1="20" x2="230" y2="20" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,2"/><text x="45" y="23" font-size="8" fill="#64748b" text-anchor="end">102</text><text x="45" y="123" font-size="8" fill="#64748b" text-anchor="end">100</text><rect x="80" y="115" width="40" height="5" fill="#6366f1" rx="2"/><text x="100" y="112" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">100</text><text x="100" y="134" font-size="9" fill="#475569" text-anchor="middle">Month 1</text><rect x="160" y="20" width="40" height="100" fill="#0d9488" rx="2"/><text x="180" y="17" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">102</text><text x="180" y="134" font-size="9" fill="#475569" text-anchor="middle">Month 2</text><text x="130" y="145" font-size="8" fill="#dc2626" text-anchor="middle">y-axis starts at 100 — tiny change looks huge</text></svg>`},
      {id:8,type:"mc",text:"Which of these would make a column graph misleading?",options:["Labelling all axes","Starting y-axis at 0","Making all bars the same width","Y-axis that jumps from 0 to 50 with no equal intervals"],answer:"Y-axis that jumps from 0 to 50 with no equal intervals"},
      {id:9,type:"truefalse",text:"True or false: graphs used in advertising always present data fairly and accurately.",answer:"false"},
      {id:10,type:"mc",text:"Why might a 3D pie chart be considered misleading?",options:["Too many colours","Too complicated","Some slices appear larger due to 3D perspective","Shows too much data"],answer:"Some slices appear larger due to 3D perspective"},
    ]},
    {id:"y3",band:"yellow",short:"Construct column graphs: many-to-one scale",label:"Construct column graphs using a many-to-one scale",showTask:{instruction:"Use the data below to draw a column graph. Choose a many-to-one scale (e.g. each unit = 5 students). Include a title, label both axes, and clearly state your scale.",checklist:["Title written above the graph","x-axis labelled (Sports)","y-axis labelled (Number of students)","Scale stated clearly (e.g. 1 unit = 5 students)","Bar heights accurate for each category","All bars equal width with even spacing between them"],dataset:{title:"Favourite sports in Year 5",rows:[["Soccer",25],["Basketball",15],["Swimming",10],["Cricket",20],["Tennis",5]]}},questions:[
      {id:1,type:"mc",text:"Drawing a column graph for data: 20, 40, 60, 80, 100. Which scale is most appropriate?",options:["By 5s","By 1s","By 20s","By 100s"],answer:"By 20s"},
      {id:2,type:"input",text:"A column graph has a scale of 1 cm = 10 students. A category has 70 students. How tall (cm) should the bar be?",answer:"7"},
      {id:3,type:"truefalse",text:"True or false: when drawing a column graph, all bars should have equal width.",answer:"true"},
      {id:4,type:"mc",text:"Data goes up to 90 and you want no more than 10 intervals. Which works best?",options:["By 5s","By 2s","By 10s","By 20s"],answer:"By 10s"},
      {id:5,type:"input",text:"Scale goes 0–50 by 10s. A bar represents 35 students. Between which two gridlines does the bar end? Write the lower value.",answer:"30"},
      {id:6,type:"truefalse",text:"True or false: a column graph must always have a title and labelled axes.",answer:"true"},
      {id:7,type:"mc",text:"Which axis label placement is correct for a graph showing favourite sports?",options:["Number of students on x-axis, Sports on y-axis","Sports on y-axis, Number on x-axis","Sports on x-axis, Number of students on y-axis","No labels needed"],answer:"Sports on x-axis, Number of students on y-axis"},
      {id:8,type:"mc",text:"Scale goes 0–50 by 5s. How many gridlines from 0 to 50 inclusive?",options:["9","10","11","12"],answer:"11"},
      {id:9,type:"input",text:"A pictograph uses 1 symbol = 5 students. A category has 45 students. How many symbols?",answer:"9"},
      {id:10,type:"truefalse",text:"True or false: when using a many-to-one scale you must include a key explaining what each unit represents.",answer:"true"},
    ]},
    {id:"y4",band:"yellow",short:"Describe data: range, mode and shape",label:"Describe and interpret data by calculating range and mode and describing the shape of distribution",questions:[
      {id:1,type:"input",text:"Data: 3, 7, 5, 9, 5, 2, 8. What is the range?",answer:"7"},
      {id:2,type:"input",text:"Data: 4, 7, 4, 9, 4, 6, 2. What is the mode?",answer:"4"},
      {id:3,type:"mc",text:"A column graph shows the most frequent value is 5. What does this tell you?",options:["The mean is 5","The range is 5","The minimum is 5","The mode is 5"],answer:"The mode is 5"},
      {id:4,type:"input",text:"Data: 12, 15, 12, 18, 20, 12, 15. What is the range?",answer:"8"},
      {id:5,type:"truefalse",text:"True or false: a dataset can have more than one mode.",answer:"true"},
      {id:6,type:"mc",text:"Data: 3, 3, 4, 5, 6, 7, 7, 7, 9. What is the mode?",options:["3","5","7","9"],answer:"7"},
      {id:7,type:"input",text:"The range of a dataset is 15 and the lowest value is 8. What is the highest value?",answer:"23"},
      {id:8,type:"truefalse",text:"True or false: the range tells us how spread out the data is.",answer:"true"},
      {id:9,type:"mc",text:"Data: 2, 3, 5, 8, 10. What is the range?",options:["5","6","8","10"],answer:"8"},
      {id:10,type:"mc",text:"Data: 4, 4, 5, 6, 6, 6, 7, 8. What is the mode?",options:["4","5","6","7"],answer:"6"},
    ]},
    {id:"y5",band:"yellow",short:"Compare and interpret displays",label:"Interpret and compare different data displays describing range, mode and shape of distribution",questions:[
      {id:1,type:"mc",text:"Class A test scores range=20. Class B range=40. What does this tell us?",options:["Class A has higher scores","Class B has lower scores","Class B has more spread out results","Class A has more students"],answer:"Class B has more spread out results"},
      {id:2,type:"truefalse",text:"True or false: two datasets can have the same mode but different ranges.",answer:"true"},
      {id:3,type:"input",text:"Dataset A: 2,4,6,8,10. Dataset B: 1,4,7,10,13. Which has the larger range? Write A or B.",answer:"B"},
      {id:4,type:"truefalse",text:"True or false: comparing two displays allows you to identify similarities and differences between datasets.",answer:"true"},
      {id:5,type:"mc",text:"Class A: mode=75, range=20. Class B: mode=75, range=40. What can we conclude?",options:["Class B is more consistent","Both are equally consistent","Cannot tell","Class A is more consistent"],answer:"Class A is more consistent"},
      {id:6,type:"mc",text:"A dataset is described as 'clustered around 50'. What does this mean?",options:["All values equal 50","The minimum is 50","The range is 50","Most values are close to 50"],answer:"Most values are close to 50"},
      {id:7,type:"input",text:"Both classes have mode=7 for hours of sleep. Class A range=3, Class B range=6. Which is more consistent? Write A or B.",answer:"A"},
      {id:8,type:"truefalse",text:"True or false: a larger range always means the data is unreliable.",answer:"false"},
      {id:9,type:"mc",text:"Graph A: most students scored 70–80. Graph B: scores spread 20–100. Which class had more consistent results?",options:["Class in Graph B","Equally consistent","Cannot tell","Class in Graph A"],answer:"Class in Graph A"},
      {id:10,type:"mc",text:"What does an 'outlier' in a dataset mean?",options:["A value that appears most often","The average value","The middle value","A value far from the rest of the data"],answer:"A value far from the rest of the data"},
    ]},
    {id:"g1",band:"green",short:"Calculate and use the mean",label:"Calculate the mean of a dataset and use mean, median, mode and range together to describe and compare data",questions:[
      {id:1,type:"input",text:"Data: 4, 7, 3, 8, 3. What is the mean?",answer:"5"},
      {id:2,type:"input",text:"Data: 10, 14, 12, 16, 8. What is the mean?",answer:"12"},
      {id:3,type:"mc",text:"Which measure tells you the most common value in a dataset?",options:["Mean","Median","Mode","Range"],answer:"Mode"},
      {id:4,type:"truefalse",text:"True or false: the mean is calculated by adding all values and dividing by how many values there are.",answer:"true"},
      {id:5,type:"input",text:"Five students scored: 60, 70, 80, 90, 100. What is the mean score?",answer:"80"},
      {id:6,type:"mc",text:"A class has a mean score of 75 and a range of 40. Another class has mean 75 and range 10. Which class is more consistent?",options:["Class with range 40","They are equally consistent","Cannot tell","Class with range 10"],answer:"Class with range 10"},
      {id:7,type:"truefalse",text:"True or false: the mean, median, mode and range together give a more complete picture of a dataset than any single measure alone.",answer:"true"},
      {id:8,type:"input",text:"Data: 3, 5, 7, 9, 11. The mean = 7. True or false: the mean equals the median here. Write true or false.",answer:"true"},
      {id:9,type:"mc",text:"Data: 2, 4, 4, 6, 9. What is the mean?",options:["4","5","4.5","6"],answer:"5"},
      {id:10,type:"input",text:"The mean of 4 numbers is 8. Three of the numbers are 6, 9, and 7. What is the fourth number?",answer:"10"},
    ]},
    {id:"g2",band:"green",short:"Effect of outliers",label:"Identify outliers and describe their effect on the mean, median, mode and range of a dataset",questions:[
      {id:1,type:"mc",text:"Data: 5, 6, 7, 6, 5, 50. Which value is an outlier?",options:["5","6","7","50"],answer:"50"},
      {id:2,type:"truefalse",text:"True or false: removing an outlier will always change the mean.",answer:"true"},
      {id:3,type:"mc",text:"Data: 10, 11, 12, 11, 10, 100. Which measure is most affected by the outlier 100?",options:["Mode","Median","Mean","None are affected"],answer:"Mean"},
      {id:4,type:"input",text:"Data: 3, 4, 4, 5, 5, 40. Without the outlier (40), the mean of the remaining 5 values is: (3+4+4+5+5)/5 = ?",answer:"4.2",aliases:["4.20"]},
      {id:5,type:"truefalse",text:"True or false: an outlier has a large effect on the range of a dataset.",answer:"true"},
      {id:6,type:"mc",text:"Data: 8, 9, 9, 10, 8, 2. The outlier is 2. If it is removed, the range changes from:",options:["8 to 2","8 to 3","2 to 8","Cannot tell"],answer:"8 to 2"},
      {id:7,type:"mc",text:"Which measure is least affected by a single outlier in a large dataset?",options:["Mean","Range","Median","None"],answer:"Median"},
      {id:8,type:"truefalse",text:"True or false: the mode is not affected by an outlier unless the outlier appears most frequently.",answer:"true"},
      {id:9,type:"input",text:"Data: 5, 6, 6, 7, 7, 30. The range = 25. If the outlier is removed, what is the new range?",answer:"2"},
      {id:10,type:"mc",text:"A student scores 95, 90, 88, 92, 10. The score of 10 is an outlier. What should the student do when reporting their 'typical' performance?",options:["Always include the outlier","Report the mean including 10","Report the mean without 10 and explain why","Ignore all results"],answer:"Report the mean without 10 and explain why"},
    ]},
    {id:"g3",band:"green",short:"Dot plots and stem-and-leaf plots",label:"Construct and interpret dot plots and stem-and-leaf plots to display and compare data",showTask:{instruction:"Use the data below to construct BOTH a dot plot AND a stem-and-leaf plot. Give each display a title.",checklist:["Dot plot: number line drawn, dots stacked accurately above each value","Stem-and-leaf: stems in order (tens digits on the left)","Leaves listed correctly next to each stem","All 12 values appear in both displays","Both displays have a title","Key included for stem-and-leaf (e.g. 2 | 3 = 23)"],dataset:{title:"Number of pages read last week",rows:[["12, 15, 15, 18, 21, 24, 24, 24, 27, 31, 31, 35"]]}},questions:[
      {id:1,type:"mc",text:"Use the stem-and-leaf plot. What values does this represent?",options:["3, 2, 5, 8","32, 53, 83","32, 35, 38","23, 53, 83"],answer:"32, 35, 38",svg:`<svg viewBox="0 0 260 80" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="80" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="72" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="44" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">3</text><text x="120" y="44" font-size="11" fill="#0d9488" font-weight="600">2  5  8</text></svg>`},
      {id:2,type:"input",text:"Use the dot plot. How many data values are there in total?",answer:"6",svg:`<svg viewBox="0 0 260 100" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="100" fill="#f8fafc" rx="6"/><line x1="60" y1="75" x2="230" y2="75" stroke="#94a3b8" stroke-width="1.5"/><line x1="90" y1="72" x2="90" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="90" y="90" font-size="10" fill="#475569" text-anchor="middle">4</text><circle cx="90" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="90" cy="46" r="7" fill="#6366f1" opacity="0.85"/><circle cx="90" cy="30" r="7" fill="#6366f1" opacity="0.85"/><line x1="145" y1="72" x2="145" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="145" y="90" font-size="10" fill="#475569" text-anchor="middle">5</text><circle cx="145" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="145" cy="46" r="7" fill="#6366f1" opacity="0.85"/><line x1="200" y1="72" x2="200" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="200" y="90" font-size="10" fill="#475569" text-anchor="middle">6</text><circle cx="200" cy="62" r="7" fill="#6366f1" opacity="0.85"/></svg>`},
      {id:3,type:"truefalse",text:"True or false: a stem-and-leaf plot preserves every individual data value.",answer:"true"},
      {id:4,type:"mc",text:"Use the stem-and-leaf plot. What is the mode?",options:["21","24","27","47"],answer:"27",svg:`<svg viewBox="0 0 260 80" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="80" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="72" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="44" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">2</text><text x="120" y="44" font-size="11" fill="#0d9488" font-weight="600">1  4  7  7</text></svg>`},
      {id:5,type:"truefalse",text:"True or false: a dot plot is a type of number line with dots stacked above each value to show frequency.",answer:"true"},
      {id:6,type:"input",text:"Use the stem-and-leaf plot. What is the range?",answer:"19",svg:`<svg viewBox="0 0 260 110" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="110" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="102" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="44" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">1</text><text x="120" y="44" font-size="11" fill="#0d9488" font-weight="600">2  5</text><text x="80" y="62" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">2</text><text x="120" y="62" font-size="11" fill="#0d9488" font-weight="600">0  3  8</text><text x="80" y="80" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">3</text><text x="120" y="80" font-size="11" fill="#0d9488" font-weight="600">1</text></svg>`},
      {id:7,type:"mc",text:"What is the main advantage of a stem-and-leaf plot over a column graph?",options:["It looks nicer","It shows every individual data value","It is easier to draw","It uses less space"],answer:"It shows every individual data value"},
      {id:8,type:"input",text:"Use the dot plot. What is the mode?",answer:"7",svg:`<svg viewBox="0 0 260 100" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="100" fill="#f8fafc" rx="6"/><line x1="40" y1="75" x2="230" y2="75" stroke="#94a3b8" stroke-width="1.5"/><line x1="70" y1="72" x2="70" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="70" y="90" font-size="10" fill="#475569" text-anchor="middle">5</text><circle cx="70" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="70" cy="46" r="7" fill="#6366f1" opacity="0.85"/><line x1="113" y1="72" x2="113" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="113" y="90" font-size="10" fill="#475569" text-anchor="middle">6</text><circle cx="113" cy="62" r="7" fill="#6366f1" opacity="0.85"/><line x1="157" y1="72" x2="157" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="157" y="90" font-size="10" fill="#475569" text-anchor="middle">7</text><circle cx="157" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="157" cy="46" r="7" fill="#6366f1" opacity="0.85"/><circle cx="157" cy="30" r="7" fill="#6366f1" opacity="0.85"/><line x1="200" y1="72" x2="200" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="200" y="90" font-size="10" fill="#475569" text-anchor="middle">8</text><circle cx="200" cy="62" r="7" fill="#6366f1" opacity="0.85"/></svg>`},
      {id:9,type:"truefalse",text:"True or false: back-to-back stem-and-leaf plots are useful for comparing two datasets.",answer:"true"},
      {id:10,type:"mc",text:"Use the back-to-back stem-and-leaf plot. Which group has more values above 45?",options:["Group A","Group B","They are equal","Cannot tell"],answer:"Group A",svg:`<svg viewBox="0 0 260 80" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="80" fill="#f8fafc" rx="6"/><text x="55" y="18" font-size="9" fill="#6366f1" font-weight="700" text-anchor="middle">Group A</text><text x="130" y="18" font-size="9" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><text x="195" y="18" font-size="9" fill="#0d9488" font-weight="700" text-anchor="middle">Group B</text><line x1="100" y1="6" x2="100" y2="74" stroke="#94a3b8" stroke-width="1.5"/><line x1="160" y1="6" x2="160" y2="74" stroke="#94a3b8" stroke-width="1.5"/><line x1="30" y1="24" x2="240" y2="24" stroke="#e2e8f0" stroke-width="1"/><text x="95" y="44" font-size="11" fill="#6366f1" font-weight="600" text-anchor="end">8  5  3</text><text x="130" y="44" font-size="11" fill="#64748b" font-weight="700" text-anchor="middle">4</text><text x="165" y="44" font-size="11" fill="#0d9488" font-weight="600">1  2  6</text></svg>`},
    ]},
    {id:"g4",band:"green",short:"Evaluate statistical claims",label:"Critically evaluate statistical claims and reports in the media, identifying possible bias and misleading representations",questions:[
      {id:1,type:"mc",text:"A report says '9 out of 10 dentists prefer Brand X'. What should you question?",options:["Nothing — 9/10 is impressive","Who funded the study?","What is Brand X?","How many dentists there are"],answer:"Who funded the study?"},
      {id:2,type:"truefalse",text:"True or false: a study with a sample size of 10 can reliably represent the opinion of 10 million people.",answer:"false"},
      {id:3,type:"mc",text:"A graph shows sales increased by 5%. The y-axis starts at 95. What is misleading?",options:["The title is wrong","The increase looks much larger than it really is","The scale is correct","The colours are wrong"],answer:"The increase looks much larger than it really is"},
      {id:4,type:"mc",text:"A headline reads: 'Screen time causes poor grades.' A study found students with more screen time had slightly lower grades. What is a problem with the headline?",options:["It is too short","It confuses correlation with causation","The study must be wrong","There is no problem"],answer:"It confuses correlation with causation"},
      {id:5,type:"truefalse",text:"True or false: two things happening at the same time (correlation) does not necessarily mean one causes the other (causation).",answer:"true"},
      {id:6,type:"mc",text:"A survey of 1000 people claims '70% prefer Product A'. The survey was funded by the makers of Product A. What type of bias might exist?",options:["No bias — 1000 is a large sample","Sampling bias from funding influence","The question was too hard","The results must be correct"],answer:"Sampling bias from funding influence"},
      {id:7,type:"input",text:"A report says '1 in 3 students struggles with reading'. 3 students were surveyed. Is this a reliable sample? Write yes or no.",answer:"no"},
      {id:8,type:"truefalse",text:"True or false: when evaluating a statistical claim, you should always consider who conducted the study and why.",answer:"true"},
      {id:9,type:"mc",text:"A newspaper claims crime 'skyrocketed' based on a graph where the y-axis starts at 98 instead of 0 and crime went from 99 to 101. What is the best description?",options:["The graph is accurate and fair","The y-axis manipulation makes a tiny increase look dramatic","Crime genuinely skyrocketed","There is not enough information"],answer:"The y-axis manipulation makes a tiny increase look dramatic"},
      {id:10,type:"mc",text:"Which of the following would most improve the reliability of a statistical study?",options:["Funding from a company that benefits from the results","A very small sample size","A large, randomly selected, representative sample","Only surveying people who agree with the hypothesis"],answer:"A large, randomly selected, representative sample"},
    ]},
  ]},

  // ── Unit 26: Representing Numbers & Decimals ──────────────────────────────
  { id:"u26", name:"Unit 26", subtitle:"Representing Numbers & Decimals", outcomes:[
    {id:"r1",band:"red",short:"Round numbers",label:"Round numbers to a specified place value",questions:[
      {id:1,type:"input",text:"Round 3,847 to the nearest hundred.",answer:"3800"},
      {id:2,type:"mc",text:"What is 56,423 rounded to the nearest thousand?",options:["55,000","56,000","56,400","57,000"],answer:"56,000"},
      {id:3,type:"input",text:"Round 7.6 to the nearest whole number.",answer:"8"},
      {id:4,type:"mc",text:"What is 4.35 rounded to the nearest tenth?",options:["4.3","4","4.4","5"],answer:"4.4"},
      {id:5,type:"truefalse",text:"True or false: 6,500 rounded to the nearest thousand is 7,000.",answer:"true"},
      {id:6,type:"input",text:"Round 234,567 to the nearest ten thousand.",answer:"230000"},
      {id:7,type:"mc",text:"What is 0.847 rounded to the nearest hundredth?",options:["0.8","0.84","0.85","0.9"],answer:"0.85"},
      {id:8,type:"truefalse",text:"True or false: 3.145 rounded to 2 decimal places is 3.15.",answer:"true"},
      {id:9,type:"input",text:"Round 1,350,000 to the nearest million.",answer:"1000000"},
      {id:10,type:"mc",text:"A number rounded to the nearest ten is 380. Which could be the original number?",options:["371","374","384","391"],answer:"384"},
    ]},
    {id:"r2",band:"red",short:"Millions and billions",label:"Recognise 1000 thousands = 1 million and 1000 millions = 1 billion, and partition large numbers",questions:[
      {id:1,type:"mc",text:"How many thousands are in one million?",options:["100","10,000","100,000","1,000"],answer:"1,000"},
      {id:2,type:"input",text:"Write the number: two million, four hundred thousand, six hundred and fifty.",answer:"2400650"},
      {id:3,type:"mc",text:"How many millions are in one billion?",options:["10","100","10,000","1,000"],answer:"1,000"},
      {id:4,type:"truefalse",text:"True or false: 1,000 thousands = 1 million.",answer:"true"},
      {id:5,type:"mc",text:"What is the value of the digit 7 in 7,432,000?",options:["7 thousand","70,000","700,000","7 million"],answer:"7 million"},
      {id:6,type:"truefalse",text:"True or false: 1,000 millions = 1 billion.",answer:"true"},
      {id:7,type:"input",text:"Write: 5 millions + 4 hundred thousands + 3 ten thousands + 2 thousands + 1 hundred + 6 tens + 7 ones.",answer:"5432167"},
      {id:8,type:"mc",text:"Which is the correct way to write six billion, three hundred million?",options:["6,003,000,000","6,300,000","6,030,000,000","6,300,000,000"],answer:"6,300,000,000"},
      {id:9,type:"input",text:"In the number 8,245,673,000 — what digit is in the billions place?",answer:"8"},
      {id:10,type:"mc",text:"Which number equals 3 millions + 5 hundreds?",options:["3,500","3,005,000","3,000,005","3,000,500"],answer:"3,000,500"},
    ]},
    {id:"r3",band:"red",short:"Decimal place value: thousandths",label:"Interpret decimal notation for thousandths and describe place value of digits up to 3 decimal places",questions:[
      {id:1,type:"mc",text:"What is the value of the digit 5 in 3.125?",options:["5 tenths","5 ones","5 hundredths","5 thousandths"],answer:"5 thousandths"},
      {id:2,type:"input",text:"Write 4 ones, 3 tenths, 7 hundredths and 2 thousandths as a decimal.",answer:"4.372"},
      {id:3,type:"mc",text:"What is the place value of the digit 8 in 0.085?",options:["8 tenths","8 thousandths","8 hundredths","8 ones"],answer:"8 hundredths"},
      {id:4,type:"truefalse",text:"True or false: in the number 2.307, the digit 0 is in the hundredths place.",answer:"true"},
      {id:5,type:"input",text:"Write 7 thousandths as a decimal.",answer:"0.007"},
      {id:6,type:"mc",text:"Which decimal has the digit 4 in the thousandths place?",options:["4.100","0.400","0.040","0.004"],answer:"0.004"},
      {id:7,type:"truefalse",text:"True or false: in 3.250, the digit 5 is in the hundredths place.",answer:"true"},
      {id:8,type:"input",text:"What is 2 tenths + 4 hundredths + 6 thousandths as a decimal?",answer:"0.246"},
      {id:9,type:"mc",text:"In the number 5.923, which digit is in the hundredths place?",options:["9","5","3","2"],answer:"2"},
      {id:10,type:"mc",text:"What is 0.045 equal to?",options:["4 tenths + 5 hundredths","4 hundredths + 5 tenths","45 hundredths","45 thousandths"],answer:"45 thousandths"},
    ]},
    {id:"r4",band:"red",short:"Compare and order decimals",label:"Compare and order decimal numbers of up to 3 decimal places",questions:[
      {id:1,type:"order",text:"Click from smallest to largest.",items:["0.3","0.25","0.305","0.03"],answer:["0.03","0.25","0.3","0.305"]},
      {id:2,type:"mc",text:"Which is larger: 0.5 or 0.49?",options:["0.49","They are equal","0.5"],answer:"0.5"},
      {id:3,type:"truefalse",text:"True or false: 0.70 is greater than 0.7.",answer:"false"},
      {id:4,type:"mc",text:"Which decimal is between 0.4 and 0.5?",options:["0.35","0.39","0.51","0.45"],answer:"0.45"},
      {id:5,type:"truefalse",text:"True or false: 0.9 is greater than 0.89.",answer:"true"},
      {id:6,type:"order",text:"Click from largest to smallest.",items:["2.1","2.01","2.15","2.105"],answer:["2.15","2.105","2.1","2.01"]},
      {id:7,type:"mc",text:"Which of these is the greatest?",options:["3.009","3.09","3.099","3.1"],answer:"3.1"},
      {id:8,type:"truefalse",text:"True or false: 4.250 = 4.25.",answer:"true"},
      {id:9,type:"input",text:"What decimal comes exactly halfway between 0.6 and 0.8?",answer:"0.7"},
      {id:10,type:"mc",text:"Which is the correct order from smallest to largest: 1.2, 0.12, 1.02?",options:["1.2, 1.02, 0.12","0.12, 1.2, 1.02","1.02, 0.12, 1.2","0.12, 1.02, 1.2"],answer:"0.12, 1.02, 1.2"},
    ]},
    {id:"r5",band:"red",short:"Trailing zeros",label:"Interpret that zero digits at the end of a decimal do not change its value",questions:[
      {id:1,type:"truefalse",text:"True or false: 3.40 and 3.4 represent the same value.",answer:"true"},
      {id:2,type:"mc",text:"Which of these are equal to 5.6?",options:["5.06 only","5.600 only","5.60 only","Both 5.60 and 5.600"],answer:"Both 5.60 and 5.600"},
      {id:3,type:"truefalse",text:"True or false: adding a zero after the last decimal digit (e.g. 2.5 → 2.50) changes the value of the decimal.",answer:"false"},
      {id:4,type:"mc",text:"What is 1.250 written without unnecessary trailing zeros?",options:["1.0","1.2","1.3","1.25"],answer:"1.25"},
      {id:5,type:"truefalse",text:"True or false: 7.500 = 7.5.",answer:"true"},
      {id:6,type:"input",text:"Write 4.30 without the unnecessary trailing zero.",answer:"4.3"},
      {id:7,type:"mc",text:"Which decimal is NOT equal to 0.8?",options:["0.80","0.800","0.08","0.8000"],answer:"0.08"},
      {id:8,type:"truefalse",text:"True or false: 6.0 and 6 represent the same value.",answer:"true"},
      {id:9,type:"mc",text:"A length is written as 2.50 m. Which is the same length?",options:["2.5 m","2.05 m","25 m","0.25 m"],answer:"2.5 m"},
      {id:10,type:"input",text:"Write 0.900 without unnecessary trailing zeros.",answer:"0.9"},
    ]},
    {id:"r8",band:"red",short:"Decimals on a number line",label:"Place decimal numbers with up to 3 decimal places on a number line",questions:[
      {id:1,type:"mc",text:"Where does 0.3 sit on a number line from 0 to 1?",options:["Closer to 1","Exactly halfway","Beyond 1","Closer to 0"],answer:"Closer to 0"},
      {id:2,type:"input",text:"What decimal is exactly halfway between 0 and 1?",answer:"0.5"},

      "Data can be categorical (e.g. favourite colour) or numerical (e.g. number of goals scored).",
      "Surveys collect opinions or preferences. Observations collect data by watching and counting.",
      "A tally chart records data as you collect it: |||| = 4, ||||/ = 5 (the slash crosses the four marks)",
      "A class of 30 is surveyed: 12 chose dogs, 8 chose cats, 6 chose fish, and the rest chose birds.",
      "Birds = 30 - 12 - 8 - 6 = 4 students",
    ],
    questions:[
      {type:"mc",text:"Which is an example of categorical data?",options:["Number of goals scored","Height in centimetres","Favourite subject","Number of siblings"],answer:"Favourite subject"},
      {type:"truefalse",text:"True or false: observation is used to collect data by watching and counting events.",answer:"true"},
      {type:"mc",text:"A student wants to find out how many cars pass the school each hour. Which method is best?",options:["Survey","Observation","Interview","Research"],answer:"Observation"},
      {type:"input",text:"25 students were surveyed: 8 chose summer, 7 chose winter, 6 chose autumn. How many chose spring?",answer:"4"},
      {type:"truefalse",text:"True or false: the number of siblings a student has is an example of discrete numerical data.",answer:"true"},
      {type:"mc",text:"A tally chart shows ||||/ ||||/ | for football. How many students chose football?",options:["9","10","11","8"],answer:"11"},
      {type:"input",text:"A class of 32 was surveyed about pets: 10 dogs, 8 cats, 5 fish. How many chose other or none?",answer:"9"},
      {type:"truefalse",text:"True or false: 'What is your favourite sport?' collects categorical data.",answer:"true"},
      {type:"mc",text:"Which question collects numerical data?",options:["What sport do you play?","What is your favourite colour?","How many books did you read this week?","What is your pet?"],answer:"How many books did you read this week?"},
    ]},
  u25_r2:{
    example:[

      "Always check the key/legend to know which bar belongs to which group.",
      "Example: Boys who prefer dogs = 8, Girls who prefer dogs = 5. Total = 13.",
      "To find 'how many more', subtract: 8 - 5 = 3 more boys than girls prefer dogs.",
    ],

  u25_r3:{
    example:[
      "A timeline shows events in chronological order from left to right.",
      "The scale must use equal intervals — e.g. every 10 years, every month.",
      "To find a time span: subtract the earlier date from the later date.",
      "Example: A timeline from 1920 to 2000 spans 80 years.",
      "Scale: 80 years drawn 40 cm long = 1 cm per 2 years.",
    ],
    questions:[
      {type:"mc",text:"A timeline runs from 1850 to 1950. What is the total time span?",options:["50 years","75 years","100 years","150 years"],answer:"100 years"},
      {type:"truefalse",text:"True or false: events on a timeline are placed in chronological order from left to right.",answer:"true"},
      {type:"input",text:"A timeline from 1900 to 2000 has a mark every 10 years. How many marks are there, including start and end?",answer:"11"},
      {type:"mc",text:"A timeline spans 6 years and is drawn 30 cm long. How many centimetres represent 1 year?",options:["4 cm","5 cm","6 cm","3 cm"],answer:"5 cm"},
      {type:"truefalse",text:"True or false: negative numbers on a timeline can represent events before a reference point.",answer:"true"},
      {type:"mc",text:"An event happened in 1975. A timeline runs 1950–2000 with marks every 10 years. Between which marks does it sit?",options:["1960 and 1970","1970 and 1980","1980 and 1990","1950 and 1960"],answer:"1970 and 1980"},
      {type:"input",text:"A timeline spans 4 years from 2010 to 2014 and is drawn 20 cm long. How many cm represent 1 year?",answer:"5"},
      {type:"mc",text:"Which scale suits a timeline showing events across one school year?",options:["Every decade","Every century","Every year","Every month"],answer:"Every month"},
      {type:"truefalse",text:"True or false: all intervals on a timeline must be equal.",answer:"true"},
    ]},
  u25_r4:{
    example:[
      "A line graph shows how data changes over time. Read values from the y-axis at each point.",
      "A rising line = increase. A falling line = decrease. A flat line = no change.",
      "Range = highest value − lowest value.",
      "Example: Temperatures Mon=20, Tue=24, Wed=28, Thu=25, Fri=27.",
      "Range = 28 − 20 = 8. The temperature decreased on Thursday.",
