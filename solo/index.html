// ─── Visual question components ───────────────────────────────────────────────

function Frac({v,s=15,c="inherit"}){
  const p=String(v).split("/");
  if(p.length!==2)return <span style={{fontSize:s,color:c,fontWeight:700}}>{v}</span>;
  return <span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",lineHeight:1.1,verticalAlign:"middle",color:c}}>
    <span style={{fontSize:s,fontWeight:700,lineHeight:1}}>{p[0]}</span>
    <span style={{display:"block",height:1.5,background:"currentColor",width:"110%",margin:"1px 0"}}/>
    <span style={{fontSize:s,fontWeight:700,lineHeight:1}}>{p[1]}</span>
  </span>;
}

function NumberLineQ({q,ans,setAns}){
  const lineRef=useRef(null);
  const [held,setHeld]=useState(null);
  const placed=ans.nlPlaced||{};
  const unplaced=q.tokens.filter(t=>placed[t]===undefined);
  function pickUp(token){
    if(held===token){setHeld(null);return;}
    if(placed[token]!==undefined){const np={...placed};delete np[token];setAns(a=>({...a,nlPlaced:np}));}
    setHeld(token);
  }
  function clickLine(e){
    if(!held)return;
    const rect=lineRef.current.getBoundingClientRect();
    const pos=Math.max(0.02,Math.min(0.97,(e.clientX-rect.left)/rect.width));
    setAns(a=>({...a,nlPlaced:{...(a.nlPlaced||{}),[held]:pos}}));
    setHeld(null);
  }
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {held?<><strong style={{color:"#1e40af"}}>Click the number line</strong> to place <strong style={{color:"#1e40af"}}>{held}</strong></>
          :"Click a fraction to pick it up, then click the number line to place it."}
      </p>
      <div style={{display:"flex",gap:10,marginBottom:28,flexWrap:"wrap",minHeight:44}}>
        {unplaced.map(t=>(
          <button key={t} onClick={()=>pickUp(t)} style={{padding:"8px 18px",background:held===t?"#1e40af":"#eff6ff",color:held===t?"#fff":"#1d4ed8",border:`2px solid ${held===t?"#1e40af":"#93c5fd"}`,borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:15,display:"flex",alignItems:"center",gap:4,boxShadow:held===t?"0 2px 8px rgba(30,64,175,0.3)":"none",transform:held===t?"scale(1.05)":"scale(1)",transition:"all 0.15s"}}>
            <Frac v={t} s={13} c={held===t?"#fff":"#1d4ed8"}/>
          </button>
        ))}
        {unplaced.length===0&&<span style={{fontSize:12,color:"#94a3b8",alignSelf:"center"}}>All placed — click a token to move it</span>}
      </div>
      <div style={{padding:"36px 20px 32px",cursor:held?"crosshair":"default",background:held?"#f0f9ff":"#f8fafc",borderRadius:12,border:`1.5px solid ${held?"#93c5fd":"#e2e8f0"}`,transition:"all 0.15s"}} onClick={clickLine}>
        <div ref={lineRef} style={{position:"relative",height:4,background:"#334155",borderRadius:2}}>
          <div style={{position:"absolute",left:-8,top:-4,width:0,height:0,borderTop:"6px solid transparent",borderBottom:"6px solid transparent",borderRight:"10px solid #334155"}}/>
          <div style={{position:"absolute",right:-8,top:-4,width:0,height:0,borderTop:"6px solid transparent",borderBottom:"6px solid transparent",borderLeft:"10px solid #334155"}}/>
          {[0,0.25,0.5,0.75,1].map(p=>(
            <div key={p} style={{position:"absolute",left:`${p*100}%`,top:-6,transform:"translateX(-50%)",display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:2,height:16,background:"#334155"}}/>
              <span style={{marginTop:4,fontSize:11,fontWeight:600,color:"#475569"}}>{p===0?"0":p===1?"1":""}</span>
            </div>
          ))}
          {Object.entries(placed).map(([t,pos])=>(
            <div key={t} onClick={e=>{e.stopPropagation();pickUp(t);}}
              style={{position:"absolute",left:`${pos*100}%`,top:-38,transform:"translateX(-50%)",background:"#1e40af",color:"#fff",padding:"4px 10px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",zIndex:2,boxShadow:"0 2px 6px rgba(30,64,175,0.35)",display:"flex",alignItems:"center"}}>
              <Frac v={t} s={11} c="#fff"/>
              <div style={{position:"absolute",left:"50%",top:"100%",marginLeft:-1,width:2,height:20,background:"#1e40af"}}/>
            </div>
          ))}
        </div>
      </div>
      {Object.keys(placed).length>0&&<p style={{fontSize:11,color:"#94a3b8",margin:"8px 0 0",textAlign:"center"}}>Click a placed fraction to move it</p>}
    </div>
  );
}

function MatchQ({q,ans,setAns}){
  const [selLeft,setSelLeft]=useState(null);
  const matched=ans.matchPairs||{};
  const matchedLeft=Object.keys(matched);
  const matchedRight=Object.values(matched);
  function clickLeft(item){
    if(matchedLeft.includes(item)){const nm={...matched};delete nm[item];setAns(a=>({...a,matchPairs:nm}));setSelLeft(item);return;}
    setSelLeft(selLeft===item?null:item);
  }
  function clickRight(item){
    if(matchedRight.includes(item)){const nm={...matched};const k=Object.keys(nm).find(k=>nm[k]===item);delete nm[k];setAns(a=>({...a,matchPairs:nm}));return;}
    if(!selLeft)return;
    setAns(a=>({...a,matchPairs:{...(a.matchPairs||{}),[selLeft]:item}}));
    setSelLeft(null);
  }
  const isCorrect=l=>matched[l]&&q.pairs[l]===matched[l];
  const card=(active,isM,ok)=>({padding:"10px 4px",borderRadius:10,fontWeight:700,fontSize:15,cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",minHeight:48,
    border:`2px solid ${isM?(ok?"#86efac":"#fca5a5"):active?"#3b82f6":"#e2e8f0"}`,
    background:isM?(ok?"#dcfce7":"#fee2e2"):active?"#eff6ff":"#f8fafc",
    color:isM?(ok?"#16a34a":"#dc2626"):active?"#1d4ed8":"#1e293b",transition:"all 0.15s"});
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {selLeft?<><strong style={{color:"#1e40af"}}>Now click the matching fraction</strong> on the right</>
          :"Click a fraction on the left, then click its equivalent on the right."}
      </p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 28px 1fr",gap:"8px 4px",alignItems:"center"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Fraction</div>
        <div/>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Equivalent</div>
        {q.left.map((l,i)=>{
          const r=q.right[i];
          const lM=matchedLeft.includes(l);
          const rMatchedTo=Object.keys(matched).find(k=>matched[k]===r);
          const rM=!!rMatchedTo;
          return[
            <button key={`l${l}`} onClick={()=>clickLeft(l)} style={card(selLeft===l,lM,isCorrect(l))}>
              <Frac v={l} s={13} c={lM?(isCorrect(l)?"#16a34a":"#dc2626"):selLeft===l?"#1d4ed8":"#1e293b"}/>
            </button>,
            <div key={`m${i}`} style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
              {lM&&<div style={{height:2,width:"100%",background:isCorrect(l)?"#86efac":"#fca5a5",borderRadius:1}}/>}
            </div>,
            <button key={`r${r}`} onClick={()=>clickRight(r)} style={card(false,rM,rMatchedTo?isCorrect(rMatchedTo):false)}>
              <Frac v={r} s={13} c={rM?(isCorrect(rMatchedTo)?"#16a34a":"#dc2626"):"#1e293b"}/>
            </button>
          ];
        })}
      </div>
      <p style={{fontSize:11,color:"#94a3b8",margin:"10px 0 0",textAlign:"center"}}>Click a matched pair to undo it</p>
    </div>
  );
}

function PartitionQ({q,ans,setAns}){
  const shaded=new Set(ans.partitionShaded||[]);
  function toggle(i){const ns=new Set(shaded);ns.has(i)?ns.delete(i):ns.add(i);setAns(a=>({...a,partitionShaded:[...ns]}));}
  const fracStr=`${q.target}/${q.parts}`;
  const statusColor=shaded.size===q.target?"#16a34a":shaded.size>q.target?"#dc2626":"#64748b";
  const statusMsg=shaded.size===q.target?`✓ ${fracStr} shaded`:shaded.size>q.target?"Too many — click to unshade":`${shaded.size}/${q.parts} shaded`;
  if(q.shape==="circle"){
    const sz=180,cx=90,cy=90,r=82;
    return(
      <div>
        <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
          Click the sections to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the circle.
        </p>
        <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>
          <svg width={sz} height={sz} style={{cursor:"pointer"}}>
            {Array.from({length:q.parts},(_,i)=>{
              const a1=(i/q.parts)*2*Math.PI-Math.PI/2,a2=((i+1)/q.parts)*2*Math.PI-Math.PI/2;
              const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
              const large=q.parts<3?1:0;
              return <path key={i} d={`M${cx},${cy} L${x1},${y1} A${r},${r},0,${large},1,${x2},${y2} Z`}
                fill={shaded.has(i)?"#1e40af":"#dbeafe"} stroke="#fff" strokeWidth={2}
                onClick={()=>toggle(i)} style={{transition:"fill 0.15s",cursor:"pointer"}}/>;
            })}
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#334155" strokeWidth={2}/>
          </svg>
        </div>
        <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
      </div>
    );
  }
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        Click the parts to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the bar.
      </p>
      <div style={{display:"flex",gap:3,marginBottom:8}}>
        {Array.from({length:q.parts},(_,i)=>(
          <div key={i} onClick={()=>toggle(i)}
            style={{flex:1,height:80,background:shaded.has(i)?"#1e40af":"#dbeafe",border:"2px solid #fff",borderRadius:4,cursor:"pointer",transition:"background 0.15s",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {shaded.has(i)&&<span style={{color:"rgba(255,255,255,0.5)",fontSize:20}}>✓</span>}
          </div>
        ))}
      </div>
      <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
    </div>
  );
}

  // ── Unit 25: Data ─────────────────────────────────────────────────────────
  { id:"u25", name:"Unit 25", subtitle:"Data", outcomes:[
    {id:"r1",band:"red",short:"Collect and tabulate data",label:"Collect categorical and numerical data through surveys and observation and tabulate it",questions:[
      {id:1,type:"mc",text:"A student wants to find out the favourite fruit of students in their class. What is the best way to collect this data?",options:["Survey","Observation","Experiment","Research"],answer:"Survey"},
      {id:2,type:"truefalse",text:"True or false: discrete numerical data can only take whole number values, like the number of siblings a student has.",answer:"true"},
      {id:3,type:"mc",text:"Which of these is an example of categorical data?",options:["Number of goals scored","Students' shoe sizes","Favourite colour","Number of books read"],answer:"Favourite colour"},
      {id:4,type:"input",text:"A survey of 28 students found: 10 chose football, 8 chose swimming, 6 chose tennis, and the rest chose basketball. How many chose basketball?",answer:"4"},
      {id:5,type:"truefalse",text:"True or false: a tally chart is a good way to record data as you collect it.",answer:"true"},
      {id:6,type:"mc",text:"Which method would you use to collect data about the number of birds visiting a garden each hour?",options:["Survey","Observation","Interview","Experiment"],answer:"Observation"},
      {id:7,type:"input",text:"A class of 30 students is surveyed about their pet. 9 have a dog, 7 have a cat, 5 have a fish, and the rest have no pet. How many have no pet?",answer:"9"},
      {id:8,type:"truefalse",text:"True or false: a spreadsheet is an appropriate tool for tabulating collected data.",answer:"true"},
      {id:9,type:"mc",text:"Which question collects nominal categorical data (named categories with no order)?",options:["How tall are you?","What is your favourite sport?","How many siblings do you have?","What is your age?"],answer:"What is your favourite sport?"},
      {id:10,type:"input",text:"A survey asks 25 students to choose their favourite season. 8 chose Summer, 5 chose Autumn, 7 chose Winter. How many chose Spring?",answer:"5"},
    ]},
    {id:"r2",band:"red",short:"Interpret side-by-side column graphs",label:"Interpret side-by-side column graphs for 2 categories",questions:[
      {id:1,type:"input",text:"A side-by-side graph shows: boys who chose cats=5, girls who chose cats=8. How many students altogether chose cats?",answer:"13"},
      {id:2,type:"truefalse",text:"True or false: in a side-by-side column graph, you can compare data from two groups at once.",answer:"true"},
      {id:3,type:"mc",text:"A graph shows: Year 5 fiction=12, non-fiction=6. Year 6 fiction=9, non-fiction=11. Which year group reads more non-fiction?",options:["Year 5","Year 6","They read the same","Cannot tell"],answer:"Year 6"},
      {id:4,type:"input",text:"A side-by-side graph shows: Monday — done:18, not done:4. Tuesday — done:15, not done:7. Across both days, how many did NOT do homework?",answer:"11"},
      {id:5,type:"truefalse",text:"True or false: the height of a bar in a column graph represents the frequency of that category.",answer:"true"},
      {id:6,type:"mc",text:"A graph shows pet preferences. Boys: dogs=8, cats=4. Girls: dogs=5, cats=9. Which pet is preferred more by girls?",options:["Dogs","Cats","They are equal","Cannot tell"],answer:"Cats"},
      {id:7,type:"input",text:"Book preferences: Year 5 adventure=10, mystery=6. Year 6 adventure=7, mystery=11. How many more Year 6 students prefer mystery than adventure?",answer:"4"},
      {id:8,type:"truefalse",text:"True or false: a side-by-side column graph always needs a key or legend to identify which bar belongs to which group.",answer:"true"},
      {id:9,type:"mc",text:"Sport participation: Class A cricket=8, soccer=14. Class B cricket=11, soccer=9. Which class has more cricket participants?",options:["Class A","Class B","They are equal","Cannot tell"],answer:"Class B"},
      {id:10,type:"mc",text:"What is the main advantage of a side-by-side column graph over two separate column graphs?",options:["It uses less space","It makes comparison between groups easier","It shows more types of data","It is more colourful"],answer:"It makes comparison between groups easier"},
    ]},
    {id:"r3",band:"red",short:"Interpret and draw timelines",label:"Interpret integers on a timeline and draw accurate timelines using an appropriate scale",questions:[
      {id:1,type:"mc",text:"A timeline shows events from 1850 to 1950. What is the total time span?",options:["50 years","75 years","100 years","150 years"],answer:"100 years"},
      {id:2,type:"truefalse",text:"True or false: on a timeline, events are placed in chronological order from left to right.",answer:"true"},
      {id:3,type:"input",text:"A timeline runs from 1900 to 2000 with a mark every 10 years. How many marks are on the timeline, including start and end?",answer:"11"},
      {id:4,type:"mc",text:"A timeline from January to December shows each month. Where would July appear?",options:["Near the start","In the middle","Near the end","At the very end"],answer:"In the middle"},
      {id:5,type:"truefalse",text:"True or false: the scale on a timeline must show equal time intervals.",answer:"true"},
      {id:6,type:"input",text:"A timeline represents 60 years and is drawn 30 cm long. How many centimetres represent 10 years?",answer:"5"},
      {id:7,type:"mc",text:"An event happened in 1965. Timeline runs 1900–2000 with marks every 10 years. Between which two marks does it sit?",options:["1950 and 1960","1960 and 1970","1970 and 1980","1955 and 1965"],answer:"1960 and 1970"},
      {id:8,type:"truefalse",text:"True or false: negative integers can appear on a timeline to represent events before a reference point.",answer:"true"},
      {id:9,type:"mc",text:"Which is the most appropriate scale for a timeline showing events across a single school year?",options:["Every decade","Every year","Every month","Every century"],answer:"Every month"},
      {id:10,type:"input",text:"A timeline spans 5 years from 2010 to 2015 and is drawn 25 cm long. How many centimetres represent 1 year?",answer:"5"},
    ]},

      {id:1,type:"mc",text:"A line graph shows temperatures: Mon 20°C, Tue 25°C, Wed 26°C. What was the increase from Monday to Wednesday?",options:["4°C","5°C","6°C","7°C"],answer:"6°C"},
      {id:2,type:"truefalse",text:"True or false: a line graph is best used to show how data changes over time.",answer:"true"},
      {id:3,type:"input",text:"A line graph shows plant height (cm): Wk1=3, Wk2=5, Wk3=8, Wk4=8, Wk5=11. What is the range of heights?",answer:"8"},

      {id:5,type:"truefalse",text:"True or false: a steeper line on a line graph indicates a greater rate of change.",answer:"true"},
      {id:6,type:"input",text:"A line graph shows rainfall (mm): Jan=40, Feb=35, Mar=55, Apr=60. What is the total rainfall?",answer:"190"},
      {id:7,type:"mc",text:"What does a horizontal (flat) line on a line graph tell you?",options:["A rapid increase","No change over that time period","A decrease","The data has ended"],answer:"No change over that time period"},

      {id:9,type:"mc",text:"Test scores over 5 weeks: 60, 65, 70, 68, 75. What is the overall trend?",options:["Increasing","Decreasing","No change","Random"],answer:"Increasing"},
      {id:10,type:"input",text:"Daily reading time (min): Mon=30, Tue=30, Wed=45, Thu=60, Fri=30. What is the mode?",answer:"30"},
    ]},

      {id:6,type:"mc",text:"Which display would best show the results of a class survey about favourite subjects?",options:["Line graph","Timeline","Column graph","Scatter plot"],answer:"Column graph"},
      {id:7,type:"truefalse",text:"True or false: a line graph should be used to compare two groups' preferences across categories.",answer:"false"},
      {id:8,type:"mc",text:"To display when important events in a person's life occurred, which is most appropriate?",options:["Column graph","Line graph","Timeline","Side-by-side column graph"],answer:"Timeline"},
      {id:9,type:"mc",text:"A teacher wants to display how a student's weekly test scores have changed. Which is best?",options:["Column graph","Line graph","Side-by-side column graph","Timeline"],answer:"Line graph"},
      {id:10,type:"truefalse",text:"True or false: you could appropriately use a line graph to display categorical data such as favourite foods.",answer:"false"},
    ]},
    {id:"r6",band:"red",short:"Determine appropriate scale",label:"Determine an appropriate scale to represent data and use many-to-one scales",questions:[

      {id:5,type:"mc",text:"A soft drink company surveys shoppers in their own branded store. What bias might exist?",options:["The sample is too large","The questions are unclear","People there may already prefer that brand","There is no bias"],answer:"People there may already prefer that brand"},

    {id:"y2",band:"yellow",short:"Identify misleading representations",label:"Identify misleading representations of data in graphs and media",questions:[

  const p={};
  studentList.forEach(s=>{

// ─── Helpers ──────────────────────────────────────────────────────────────────
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }
function checkAnswer(given,q){
  if(q.type==="order")return Array.isArray(given)&&JSON.stringify(given)===JSON.stringify(q.answer);
  if(q.type==="shade")return Number(given)===q.answer;
  if(q.type==="numberline"){
    if(!given||typeof given!=="object")return false;
    return q.tokens.every(t=>{const pos=given[t];if(pos===undefined)return false;const[mn,mx]=q.targets[t];return pos>=mn&&pos<=mx;});
  }
  if(q.type==="match"){
    if(!given||typeof given!=="object")return false;
    return q.left.every(l=>given[l]===q.pairs[l]);
  }
  if(q.type==="partition"){
    if(!Array.isArray(given))return false;
    return given.length===q.target;
  }
  const u=norm(given);
  if(u===norm(q.answer))return true;
  return(q.aliases||[]).some(a=>u===norm(a));
}
function fmtGiven(given,q){
  if(q.type==="order")return Array.isArray(given)?given.join(" → "):String(given);
  if(q.type==="shade")return `${given} cell${given===1?"":"s"} shaded`;
  if(q.type==="numberline")return"Number line placement submitted";
  if(q.type==="match")return"Matching attempt submitted";
  if(q.type==="partition")return`${Array.isArray(given)?given.length:0} parts shaded`;
  return String(given)||"(blank)";
}
function initAns(q){
  return{input:"",option:"",orderSeq:[],shadedCells:q.type==="shade"?new Array(q.cells).fill(false):[],nlPlaced:{},matchPairs:{},partitionShaded:[]};
}
function unitProgress(prog,unitId){ const u=UNITS.find(u=>u.id===unitId); if(!u)return{done:0,total:0}; const total=u.outcomes.length; const done=u.outcomes.filter(o=>prog[`${unitId}_${o.id}`]).length; return{done,total}; }

                  </div>
                  <span style={{fontSize:11,fontWeight:700,color:ok?"#16a34a":"#dc2626",flexShrink:0}}>{r?`${r.correct}/${r.total}`:""}</span>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>{setPretestMode(null);setView("home");}} style={Sb()}>Back to units</button>
            <button onClick={()=>{setSelectedUnit(UNITS.find(u=>u.id==="u24"));setView("rubric");setPretestMode(null);}}
              style={Sb({background:"#1e40af",color:"#fff",border:"none",fontWeight:600})}>Go to my rubric →</button>
          </div>
        </div>
      );
    }

    const current=pretestQList[pretestIdx];
    if(!current)return null;
    const q=current.q;
    const pct=Math.round(pretestIdx/pretestQList.length*100);
    const ok=pretestCanGo();
    const pool=q.type==="order"?q.items.filter(item=>!pretestAns.orderSeq.includes(item)):[];

    return(
      <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.25rem"}}>
          <button onClick={()=>{setPretestMode(null);setView("home");}} style={Sb()}>✕ Exit</button>
          <div style={{flex:1}}>
            <p style={{fontSize:12,fontWeight:600,margin:"0 0 5px",color:"#64748b"}}>📋 Pre-test · {current.short}</p>
            <div style={{background:"#f1f5f9",borderRadius:4,height:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:"#3b82f6",borderRadius:4,transition:"width 0.3s"}}/>
            </div>
          </div>
          <span style={{fontSize:12,color:"#94a3b8",flexShrink:0}}>{pretestIdx+1}/{pretestQList.length}</span>
        </div>
        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"1.5rem",marginBottom:12}}>
          <p style={{fontSize:16,fontWeight:500,margin:"0 0 1.25rem",lineHeight:1.6,color:"#0f172a"}}>{q.text}</p>
          {q.type==="input"&&(
            <><input autoFocus type="text" value={pretestAns.input} onChange={e=>setPretestAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&handlePretestNext()}
              placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"10px 12px",border:"1.5px solid #cbd5e1",borderRadius:8,fontSize:15,outline:"none"}}/>
            <p style={{fontSize:11,color:"#94a3b8",margin:"6px 0 0"}}>Use fractions like 3/4 or whole numbers</p></>
          )}
          {q.type==="mc"&&(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {q.options.map(opt=><button key={opt} onClick={()=>setPretestAns(a=>({...a,option:opt}))} style={Pb(pretestAns.option===opt)}>{opt}</button>)}
            </div>
          )}
          {q.type==="truefalse"&&(
            <div style={{display:"flex",gap:12}}>
              {["true","false"].map(val=><button key={val} onClick={()=>setPretestAns(a=>({...a,option:val}))} style={Pb(pretestAns.option===val,{flex:1,textAlign:"center",fontSize:15})}>{val.charAt(0).toUpperCase()+val.slice(1)}</button>)}
            </div>
          )}
          {q.type==="order"&&(
            <div>
              <p style={{fontSize:12,color:"#64748b",margin:"0 0 8px"}}>Click to build your order:</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                {pool.length>0?pool.map(item=><button key={item} onClick={()=>setPretestAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500}}>{item}</button>)
                  :<span style={{fontSize:12,color:"#94a3b8"}}>All placed</span>}
              </div>
              {pretestAns.orderSeq.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                {pretestAns.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                  {i>0&&<span style={{color:"#cbd5e1"}}>→</span>}
                  <button onClick={()=>setPretestAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600}}>{item}</button>
                </span>)}
              </div>}
            </div>
          )}
          {q.type==="numberline"&&<NumberLineQ key={pretestIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
          {q.type==="match"&&<MatchQ key={pretestIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
          {q.type==="partition"&&<PartitionQ key={pretestIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
        </div>
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={handlePretestNext} disabled={!ok}
            style={{fontSize:14,padding:"9px 22px",background:ok?"#1e40af":"#e2e8f0",color:ok?"#fff":"#94a3b8",border:"none",borderRadius:8,cursor:ok?"pointer":"default",fontWeight:600}}>
            {pretestIdx===pretestQList.length-1?"Submit":"Next →"}
          </button>
        </div>
      </div>
    );
  }

  // ── Assessment ────────────────────────────────────────────────────────────
  if(view==="assessment"){
    const o=activeOutcome;
    const bs=BAND[o.band];
    const uc=UC[selectedUnit.id];

    if(results){
      const correct=results.results.filter(r=>r.correct).length;
      return(
        <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
          <div style={{textAlign:"center",padding:"1.5rem 0 1.25rem"}}>
            <div style={{width:56,height:56,borderRadius:"50%",background:results.allCorrect?"#dcfce7":"#fef9c3",border:`2px solid ${results.allCorrect?"#86efac":"#fcd34d"}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:22}}>
              {results.allCorrect?"✓":correct}
            </div>
            {results.allCorrect
              ?<><h2 style={{fontSize:18,fontWeight:600,margin:"0 0 4px",color:"#16a34a"}}>Outcome unlocked!</h2><p style={{fontSize:13,color:"#64748b",margin:0}}>{o.short} has been highlighted on your rubric.</p></>
              :<><h2 style={{fontSize:18,fontWeight:600,margin:"0 0 4px",color:"#0f172a"}}>Keep practising</h2><p style={{fontSize:13,color:"#64748b",margin:0}}>{correct} of {results.results.length} correct — you can only miss 1 to unlock this outcome.</p></>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:"1.25rem"}}>
            {results.results.map((r,i)=>(
              <div key={i} style={{background:"#fff",border:`1px solid ${r.correct?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"11px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                  <p style={{fontSize:13,margin:0,flex:1,color:"#1e293b"}}>{r.q.text}</p>
                  <span style={{fontSize:11,fontWeight:700,flexShrink:0,color:r.correct?"#16a34a":"#dc2626"}}>{r.correct?"Correct":"Incorrect"}</span>
                </div>
                {!r.correct&&<p style={{fontSize:12,color:"#64748b",margin:"6px 0 0"}}>Your answer: <span style={{color:"#dc2626"}}>{fmtGiven(r.given,r.q)}</span></p>}
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setView("rubric")} style={Sb()}>Back to rubric</button>
            {!results.allCorrect&&<button onClick={()=>{setQIdx(0);setAnswers([]);setAns(initAns(o.questions[0]));setResults(null);}} style={Sb({background:uc.dark,color:"#fff",border:"none",fontWeight:600})}>Try again</button>}
          </div>
        </div>
      );
    }

    const q=o.questions[qIdx];
    const total=o.questions.length;
    const pct=Math.round(qIdx/total*100);
    const ok=canGo();
    const pool=q.type==="order"?q.items.filter(item=>!ans.orderSeq.includes(item)):[];

    return(
      <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.25rem"}}>
          <button onClick={()=>setView("rubric")} style={Sb()}>← Back</button>
          <div style={{flex:1}}>
            <p style={{fontSize:12,fontWeight:600,margin:"0 0 5px",color:"#64748b"}}>{o.short}</p>
            <div style={{background:"#f1f5f9",borderRadius:4,height:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:bs.dot,borderRadius:4,transition:"width 0.3s"}}/>
            </div>
          </div>
          <span style={{fontSize:12,color:"#94a3b8",flexShrink:0}}>{qIdx+1}/{total}</span>
        </div>
        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"1.5rem",marginBottom:12}}>
          <p style={{fontSize:16,fontWeight:500,margin:"0 0 1.25rem",lineHeight:1.6,color:"#0f172a"}}>{q.text}</p>
          {q.type==="input"&&(
            <><input autoFocus type="text" value={ans.input} onChange={e=>setAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&handleNext()}
              placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"10px 12px",border:"1.5px solid #cbd5e1",borderRadius:8,fontSize:15,outline:"none"}}/>
            <p style={{fontSize:11,color:"#94a3b8",margin:"6px 0 0"}}>Use fractions like 3/4 or whole numbers</p></>
          )}
          {q.type==="mc"&&(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {q.options.map(opt=><button key={opt} onClick={()=>setAns(a=>({...a,option:opt}))} style={Pb(ans.option===opt)}>{opt}</button>)}
            </div>
          )}
          {q.type==="truefalse"&&(
            <div style={{display:"flex",gap:12}}>
              {["true","false"].map(val=><button key={val} onClick={()=>setAns(a=>({...a,option:val}))} style={Pb(ans.option===val,{flex:1,textAlign:"center",fontSize:15})}>{val.charAt(0).toUpperCase()+val.slice(1)}</button>)}
            </div>
          )}
          {q.type==="order"&&(
            <div>
              <p style={{fontSize:12,color:"#64748b",margin:"0 0 8px"}}>Click to build your order:</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                {pool.length>0?pool.map(item=><button key={item} onClick={()=>setAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500,color:"#1e293b"}}>{item}</button>)
                  :<span style={{fontSize:12,color:"#94a3b8"}}>All placed below</span>}
              </div>
              {ans.orderSeq.length>0&&<>
                <p style={{fontSize:12,color:"#94a3b8",margin:"0 0 6px"}}>Your order (click to remove):</p>
                <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                  {ans.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                    {i>0&&<span style={{color:"#cbd5e1",fontSize:14}}>→</span>}
                    <button onClick={()=>setAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600}}>{item}</button>
                  </span>)}
                </div>
              </>}
            </div>
          )}
          {q.type==="shade"&&ans.shadedCells.length===q.cells&&(
            <div>
              <p style={{fontSize:12,color:"#64748b",margin:"0 0 8px"}}>Click cells to shade them:</p>
              <div style={{display:"flex",gap:3,marginBottom:8}}>
                {ans.shadedCells.map((shaded,i)=><div key={i} onClick={()=>setAns(a=>({...a,shadedCells:a.shadedCells.map((v,idx)=>idx===i?!v:v)}))}
                  style={{flex:1,height:44,borderRadius:4,cursor:"pointer",background:shaded?uc.dark:"#f8fafc",border:`1px solid ${shaded?uc.dark:"#cbd5e1"}`,transition:"background 0.15s"}}/>)}
              </div>
              <p style={{fontSize:12,color:"#64748b",margin:0}}>{ans.shadedCells.filter(Boolean).length} of {q.cells} cells shaded</p>
            </div>
          )}
          {q.type==="numberline"&&<NumberLineQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
          {q.type==="match"&&<MatchQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
          {q.type==="partition"&&<PartitionQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
        </div>
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <button onClick={handleNext} disabled={!ok} style={{fontSize:14,padding:"9px 22px",background:ok?uc.dark:"#e2e8f0",color:ok?"#fff":"#94a3b8",border:"none",borderRadius:8,cursor:ok?"pointer":"default",fontWeight:600}}>
            {qIdx===total-1?"Submit":"Next →"}
          </button>
        </div>
      </div>
    );
  }

  // ── Teacher: unit rubric view ────────────────────────────────────────────
  if(view==="rubric"&&isTeacher){
    if(teacherFocus){
      const s=students.find(s=>s.id===teacherFocus);
      const prog=progress[s.id];
      const {done,total}=unitProgress(prog,selectedUnit.id);
      const uc=UC[selectedUnit.id];
      const studentAttempts=attempts[s.id]||{};

      // ── Attempt detail view ──────────────────────────────────────────────
      if(teacherAttemptKey!==null&&teacherAttemptIdx!==null){
        const outcomeId=teacherAttemptKey.replace(`${selectedUnit.id}_`,"");
        const outcome=selectedUnit.outcomes.find(o=>o.id===outcomeId);
        const attempt=(studentAttempts[teacherAttemptKey]||[])[teacherAttemptIdx];
        if(!attempt) return null;
        const attemptNum=teacherAttemptIdx+1;
        const timeStr=new Date(attempt.ts).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
        return(
          <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.5rem"}}>
              <button onClick={()=>setTeacherAttemptIdx(null)} style={Sb()}>← Attempts</button>
              <div>
                <h1 style={{fontSize:17,fontWeight:600,margin:"0 0 2px",color:"#0f172a"}}>{s.name} — Attempt {attemptNum}</h1>
                <p style={{fontSize:12,color:"#64748b",margin:0}}>{outcome?.short} · {timeStr} · <span style={{fontWeight:600,color:attempt.passed?"#16a34a":"#dc2626"}}>{attempt.passed?"Passed":"Not passed"}</span> ({attempt.correct}/{attempt.total})</p>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {attempt.results.map((r,i)=>(
                <div key={i} style={{background:"#fff",border:`1px solid ${r.correct?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"11px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                    <p style={{fontSize:13,margin:0,flex:1,color:"#1e293b",lineHeight:1.4}}>{r.text}</p>
                    <span style={{fontSize:11,fontWeight:700,flexShrink:0,color:r.correct?"#16a34a":"#dc2626",paddingTop:1}}>{r.correct?"✓":"✗"}</span>
                  </div>
                  {!r.correct&&<p style={{fontSize:12,color:"#64748b",margin:"6px 0 0"}}>Answer given: <span style={{color:"#dc2626",fontWeight:600}}>{r.given||"(blank)"}</span></p>}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ── Attempt list for one outcome ─────────────────────────────────────
      if(teacherAttemptKey!==null){
        const outcomeId=teacherAttemptKey.replace(`${selectedUnit.id}_`,"");
        const outcome=selectedUnit.outcomes.find(o=>o.id===outcomeId);
        const outcomeAttempts=studentAttempts[teacherAttemptKey]||[];
        return(
          <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.5rem"}}>
              <button onClick={()=>setTeacherAttemptKey(null)} style={Sb()}>← {s.name}</button>
              <div>
                <h1 style={{fontSize:17,fontWeight:600,margin:"0 0 2px",color:"#0f172a"}}>{outcome?.short}</h1>
                <p style={{fontSize:12,color:"#64748b",margin:0}}>{s.name} · {outcomeAttempts.length} attempt{outcomeAttempts.length!==1?"s":""}</p>
              </div>
            </div>
            {outcomeAttempts.length===0
              ? <p style={{fontSize:13,color:"#94a3b8",textAlign:"center",padding:"2rem 0"}}>No attempts recorded this session.</p>
              : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {[...outcomeAttempts].reverse().map((a,ri)=>{
                    const i=outcomeAttempts.length-1-ri;
                    const timeStr=new Date(a.ts).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
                    const wrongQs=a.results.filter(r=>!r.correct);
                    return(
                      <div key={i} style={{background:"#fff",border:`1px solid ${a.passed?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:wrongQs.length>0?8:0}}>
                          <div>
                            <span style={{fontSize:13,fontWeight:600,color:a.passed?"#16a34a":"#dc2626"}}>{a.passed?"Passed":"Not passed"}</span>
                            <span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{a.correct}/{a.total} correct · {timeStr}</span>
                          </div>
                          <button onClick={()=>setTeacherAttemptIdx(i)} style={Sb({fontSize:12,padding:"4px 12px"})}>View</button>
                        </div>
                        {wrongQs.length>0&&(
                          <div style={{borderTop:"1px solid #f1f5f9",paddingTop:8}}>
                            <p style={{fontSize:11,fontWeight:700,color:"#94a3b8",margin:"0 0 5px",textTransform:"uppercase",letterSpacing:"0.04em"}}>Incorrect questions</p>
                            {wrongQs.map((r,wi)=>(
                              <p key={wi} style={{fontSize:12,color:"#dc2626",margin:"0 0 3px",lineHeight:1.4}}>✗ {r.text}</p>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>}
          </div>
        );
      }

      // ── Student rubric with attempt counts ───────────────────────────────
      return(
        <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.5rem"}}>
            <button onClick={()=>{setTeacherFocus(null);setTeacherAttemptKey(null);setTeacherAttemptIdx(null);}} style={Sb()}>← Class</button>
            <div><h1 style={{fontSize:18,fontWeight:600,margin:"0 0 2px",color:"#0f172a"}}>{s.name}</h1>
              <p style={{fontSize:13,color:"#64748b",margin:0}}>{selectedUnit.name}: {selectedUnit.subtitle} — {done}/{total} complete</p></div>
          </div>
          {["red","yellow","green"].filter(band=>selectedUnit.outcomes.some(o=>o.band===band)).map(band=>{
            const bs=BAND[band];
            return(<div key={band} style={{marginBottom:"1.25rem"}}>
              <span style={{display:"inline-block",background:bs.bg,color:bs.text,border:`1px solid ${bs.border}`,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:6,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>{band}</span>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {selectedUnit.outcomes.filter(o=>o.band===band).map(o=>{
                  const d=prog[`${selectedUnit.id}_${o.id}`];
                  const key=`${selectedUnit.id}_${o.id}`;
                  const n=(studentAttempts[key]||[]).length;
                  const lastAttempt=(studentAttempts[key]||[]).slice(-1)[0];
                  return(
                    <div key={o.id} style={{background:"#fff",border:`1px solid ${d?"#86efac":"#e2e8f0"}`,borderRadius:10,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:18,height:18,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,background:d?"#dcfce7":"#f1f5f9",color:d?"#16a34a":"#94a3b8"}}>{d?"✓":""}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{fontSize:13,fontWeight:600,margin:"0 0 1px",color:d?"#16a34a":"#1e293b"}}>{o.short}</p>
                        {n>0&&<p style={{fontSize:11,color:"#94a3b8",margin:0}}>{n} attempt{n!==1?"s":""} · last: <span style={{color:lastAttempt.passed?"#16a34a":"#dc2626",fontWeight:600}}>{lastAttempt.correct}/{lastAttempt.total}</span></p>}
                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0}}>
                        {n>0&&<button onClick={()=>{setTeacherAttemptKey(key);setTeacherAttemptIdx(null);}} style={Sb({fontSize:12,padding:"4px 10px"})}>Attempts</button>}
                        <button onClick={()=>{const nv=!d;setProgress(p=>({...p,[s.id]:{...p[s.id],[key]:nv}}));saveOutcome(s.id,key,nv);}}
                          style={{fontSize:12,padding:"4px 10px",borderRadius:8,cursor:"pointer",fontWeight:600,border:`1px solid ${d?"#fca5a5":"#86efac"}`,background:d?"#fff0f0":"#f0fdf4",color:d?"#dc2626":"#16a34a"}}>
                          {d?"Unmark":"✓ Mark"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>);
          })}
        </div>
      );
    }

    const uc=UC[selectedUnit.id];
    return(
      <div style={{maxWidth:700,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
          <div>
            <button onClick={()=>{setView("home");setTeacherFocus(null);}} style={{...Sb(),marginBottom:6,display:"block"}}>← All units</button>
            <h1 style={{fontSize:20,fontWeight:600,margin:"0 0 2px",color:"#0f172a"}}>{selectedUnit.name}: {selectedUnit.subtitle}</h1>
            <p style={{fontSize:13,color:"#64748b",margin:0}}>{students.length} students</p>
          </div>
          <button onClick={doLogout} style={Sb()}>Sign out</button>
        </div>
        <div style={{overflowX:"auto",marginBottom:"1.75rem"}}>
          <table style={{borderCollapse:"collapse",minWidth:"100%"}}>
            <thead><tr>
              <th style={{textAlign:"left",fontSize:12,fontWeight:400,color:"#94a3b8",padding:"0 8px 8px 0",minWidth:80}}></th>
              {selectedUnit.outcomes.filter(o=>o.band==="red").map((_,i)=><th key={`r${i}`} style={{padding:"0 2px 8px"}}><span style={{display:"block",fontSize:10,fontWeight:700,color:BAND.red.text,textAlign:"center"}}>R{i+1}</span></th>)}
              {selectedUnit.outcomes.filter(o=>o.band==="yellow").map((_,i)=><th key={`y${i}`} style={{padding:"0 2px 8px"}}><span style={{display:"block",fontSize:10,fontWeight:700,color:BAND.yellow.text,textAlign:"center"}}>Y{i+1}</span></th>)}
              {selectedUnit.outcomes.filter(o=>o.band==="green").map((_,i)=><th key={`g${i}`} style={{padding:"0 2px 8px"}}><span style={{display:"block",fontSize:10,fontWeight:700,color:BAND.green.text,textAlign:"center"}}>G{i+1}</span></th>)}
              <th style={{padding:"0 0 8px 8px"}}></th>
            </tr></thead>
            <tbody>
              {students.map(s=>{
                const prog=progress[s.id];
                const {done,total}=unitProgress(prog,selectedUnit.id);
                return(<tr key={s.id}>
                  <td style={{padding:"3px 8px 3px 0"}}><button onClick={()=>setTeacherFocus(s.id)} style={{fontSize:13,padding:"3px 10px",border:"1px solid #e2e8f0",borderRadius:6,background:"#fff",cursor:"pointer",color:"#1e293b",fontWeight:500}}>{s.name}</button></td>
                  {selectedUnit.outcomes.map(o=>{
                    const d=prog[`${selectedUnit.id}_${o.id}`];
                    return(<td key={o.id} style={{padding:"3px 2px",textAlign:"center"}}>
                      <div style={{width:22,height:22,borderRadius:4,margin:"0 auto",background:d?"#dcfce7":"#f8fafc",border:`1px solid ${d?"#86efac":"#e2e8f0"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:d?"#16a34a":"#cbd5e1"}}>{d?"✓":""}</div>
                    </td>);
                  })}
                  <td style={{padding:"3px 0 3px 8px",textAlign:"right"}}><span style={{fontSize:12,fontWeight:600,color:"#64748b"}}>{done}/{total}</span></td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
        <p style={{fontSize:12,fontWeight:700,color:"#94a3b8",margin:"0 0 10px",textTransform:"uppercase",letterSpacing:"0.05em"}}>Completion by outcome</p>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {selectedUnit.outcomes.map(o=>{
            const n=students.filter(s=>progress[s.id][`${selectedUnit.id}_${o.id}`]).length;
            const pct=Math.round(n/students.length*100);
            const bs=BAND[o.band];
            return(<div key={o.id} style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:10,fontWeight:700,color:bs.text,width:20,flexShrink:0}}>{o.id.toUpperCase()}</span>
              <span style={{fontSize:12,width:180,flexShrink:0,color:"#334155",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.short}</span>
              <div style={{flex:1,background:"#f1f5f9",borderRadius:4,height:7,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:uc.dot,borderRadius:4}}/>
              </div>
              <span style={{fontSize:11,color:"#94a3b8",minWidth:28,textAlign:"right"}}>{n}/{students.length}</span>
            </div>);
          })}
        </div>
      </div>
    );
  }

  return null;
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
