            <button onClick={()=>setPracticePhase("example")} style={Sb()}>← Example</button>
            <div style={{flex:1,background:"var(--ind-100)",borderRadius:99,height:6,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,var(--indigo),var(--blue))",borderRadius:99,transition:"width 0.3s"}}/>
            </div>
            <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,flexShrink:0}}>{practiceIdx+1}/{total}</span>
          </div>
          {/* outcome strip */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",display:"flex",alignItems:"center",gap:8,marginBottom:14,flexShrink:0,boxShadow:"var(--sh-sm)"}}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",padding:"3px 9px",borderRadius:5,background:"var(--ind-50)",color:"var(--indigo)",flexShrink:0}}>Practice</span>
            <span style={{fontSize:13,fontWeight:600,color:"var(--sub)"}}>{outcomeShortName}</span>
          </div>
          {/* question card — fills remaining space */}
          <div style={{background:"var(--surface)",border:`1px solid ${practiceSubmitted?(practiceCorrect?"#86efac":"#fca5a5"):"var(--border)"}`,borderRadius:20,padding:"28px 26px 24px",boxShadow:"var(--sh-lg)",flex:1,display:"flex",flexDirection:"column",minHeight:0,transition:"border-color 0.2s"}}>
            {q.svg&&<div dangerouslySetInnerHTML={{__html:q.svg}} style={{marginBottom:16,borderRadius:8,overflow:"hidden"}}/>}
            <p style={{fontSize:22,fontWeight:600,lineHeight:1.55,letterSpacing:"-0.02em",marginBottom:26,flexShrink:0,color:"var(--text)"}}>{q.text}</p>
            <div style={{display:"flex",flexDirection:"column",gap:10,flex:1,minHeight:0}}>
              {gateBookwork&&(
                <Coach mood="idle" reactKey={`bw${practiceIdx}`}>
                  <p style={{fontSize:14,fontWeight:700,margin:"0 0 2px",color:"var(--text)"}}>✍️ Have a go in your maths book first.</p>
                  <p style={{fontSize:12.5,color:"var(--sub)",margin:"0 0 10px",lineHeight:1.5}}>{bookworkPrompt}</p>
                  <button onClick={()=>setPracticeBookwork(true)}
                    style={{fontFamily:ff,fontSize:13,fontWeight:700,padding:"9px 18px",background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",boxShadow:"0 3px 12px rgba(67,56,202,0.28)"}}>
                    I've worked it out ✏️
                  </button>
                </Coach>
              )}
              {!practiceSubmitted&&!gateBookwork&&<>
                {q.type==="input"&&(
                  <div>
                    <input autoFocus type="text" value={practiceAns.input} onChange={e=>setPracticeAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&submitPracticeAnswer()}
                      placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",border:"1.5px solid #cbd5e1",borderRadius:10,fontSize:16,outline:"none",fontFamily:ff}}/>
                    <p style={{fontSize:12,color:"var(--muted)",margin:"8px 0 0"}}>Use fractions like 3/4 or whole numbers</p>
                  </div>
                )}
                {q.type==="mc"&&(
                  <>{q.options.map(opt=><button key={opt} onClick={()=>setPracticeAns(a=>({...a,option:opt}))} style={Pb(practiceAns.option===opt)}>{opt}</button>)}</>
                )}
                {q.type==="truefalse"&&(
                  <div style={{display:"flex",gap:12,flex:1}}>
                    {["true","false"].map(v=><button key={v} onClick={()=>setPracticeAns(a=>({...a,option:v}))} style={Pb(practiceAns.option===v,{textAlign:"center",justifyContent:"center"})}>{v.charAt(0).toUpperCase()+v.slice(1)}</button>)}
                  </div>
                )}
                {q.type==="order"&&(
                  <div>
                    <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click to build your order:</p>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                      {pool.length>0?pool.map(item=><button key={item} onClick={()=>setPracticeAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500,fontFamily:ff,color:"var(--text)"}}>{item}</button>)
                        :<span style={{fontSize:12,color:"var(--muted)"}}>All placed</span>}
                    </div>
                    {practiceAns.orderSeq.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                      {practiceAns.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                        {i>0&&<span style={{color:"#cbd5e1"}}>→</span>}
                        <button onClick={()=>setPracticeAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600,fontFamily:ff}}>{item}</button>
                      </span>)}
                    </div>}
                  </div>
                )}
                {q.type==="numberline"&&<NumberLineQ key={`p${practiceIdx}`} q={q} ans={practiceAns} setAns={setPracticeAns}/>}
                {q.type==="match"&&<MatchQ key={`p${practiceIdx}`} q={q} ans={practiceAns} setAns={setPracticeAns}/>}
                {q.type==="partition"&&<PartitionQ key={`p${practiceIdx}`} q={q} ans={practiceAns} setAns={setPracticeAns}/>}
              </>}
              {practiceSubmitted&&(
                <Coach mood={practiceCorrect?"happy":(showAnswer?"idle":"oops")} reactKey={`${practiceIdx}-${practiceAttempts}-${practiceCorrect}`}>
                  <p style={{fontSize:14,fontWeight:700,margin:"0 0 2px",color:practiceCorrect?"#16a34a":"#b45309"}}>
                    {practiceCorrect?coachLine(COACH_PRAISE,practiceIdx):(showAnswer?coachLine(COACH_REVEAL,practiceIdx):coachLine(COACH_RETRY,practiceIdx))}
                  </p>
                  {practiceCorrect&&q.why&&<p style={{fontSize:12.5,color:"var(--sub)",margin:0,lineHeight:1.5}}>{q.why}</p>}
                  {!practiceCorrect&&!showAnswer&&q.hint&&<p style={{fontSize:12.5,color:"var(--sub)",margin:"2px 0 0",lineHeight:1.5}}>💡 {q.hint}</p>}
                  {!practiceCorrect&&!showAnswer&&!q.hint&&<p style={{fontSize:12.5,color:"var(--sub)",margin:"2px 0 0",lineHeight:1.5}}>Check your working and have another go.</p>}
                  {showAnswer&&<p style={{fontSize:13,color:"var(--text)",margin:"2px 0 0",lineHeight:1.5}}>The answer is <strong style={{color:"#16a34a"}}>{q.answer}</strong>{q.aliases?.length?` (also accepted: ${q.aliases.join(", ")})`:""}.{q.why?" "+q.why:""}</p>}
                </Coach>
              )}
            </div>
          </div>
          {/* actions row */}
          <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:10,marginTop:18,flexShrink:0}}>
            {!practiceSubmitted&&!gateBookwork&&(
              <button onClick={submitPracticeAnswer} disabled={!ok}
                style={{padding:"13px 32px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:ok?"pointer":"default",background:ok?"linear-gradient(135deg,var(--indigo),var(--blue))":"#e2e8f0",color:ok?"#fff":"var(--muted)",boxShadow:ok?"0 4px 18px rgba(67,56,202,0.32)":"none",transition:"all 0.2s"}}>
                Check answer
              </button>
            )}
            {practiceSubmitted&&<>
              {!practiceCorrect&&practiceAttempts===1&&(
                <button onClick={()=>{setPracticeSubmitted(false);setPracticeAns({input:"",option:"",orderSeq:[],shadedCells:[],nlPlaced:{},matchPairs:{},partitionShaded:[]});}}
                  style={Sb({fontWeight:600,borderColor:"#f59e0b",color:"#92400e"})}>Try again</button>
              )}
              <button onClick={nextPracticeQuestion}
                style={{padding:"13px 32px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",boxShadow:"0 4px 18px rgba(67,56,202,0.32)",transition:"all 0.2s"}}>
                {practiceIdx===total-1?"Finish":"Next →"}
              </button>
            </>}
          </div>
        </div>
      </div>
    );
  }

  // ── Pre-test / Post-test ──────────────────────────────────────────────────
  if(view==="pretest"){
    if(pretestMode==="done"&&pretestResults){
      const {byOutcome,passed,priorSnaps=[]}=pretestResults;
      const activeUnitId=pretestQList[0]?.unitId||"u24";
      const activePretestData=PRETESTS[activeUnitId]||[];
      const allIds=activePretestData.map(s=>s.outcomeId);
      const isPostTest=priorSnaps.length>=1;
      const preSnap=priorSnaps[0]||null;
      // Build current result as snap-style object for comparison
      const currentByOutcome={};
      Object.entries(byOutcome).forEach(([id,o])=>{currentByOutcome[id]={short:o.short,correct:o.correct,total:o.total,passed:o.correct===o.total};});
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title={isPostTest?"Post-test Results":"Pre-test Results"}/>
          <div style={{flex:1,overflowY:"auto",padding:"1.5rem 1rem"}}>
            <div style={{maxWidth:520,margin:"0 auto"}}>
              <div style={{textAlign:"center",padding:"1.5rem 0 1.25rem"}}>
                <div style={{width:60,height:60,background:isPostTest?"#f0fdf4":"var(--ind-50)",border:`1px solid ${isPostTest?"#86efac":"var(--ind-200)"}`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:24,boxShadow:isPostTest?"0 0 0 6px rgba(134,239,172,0.15)":"0 0 0 6px rgba(99,102,241,0.08)"}}>
                  {isPostTest?"📊":"📋"}
                </div>
                <h2 style={{fontSize:20,fontWeight:800,margin:"0 0 4px",color:"var(--text)",letterSpacing:"-0.01em"}}>{isPostTest?"Post-test Complete":"Pre-test Complete"}</h2>
                <p style={{fontSize:13,color:"var(--sub)",margin:0}}>{passed.length} of {allIds.length} outcomes passed</p>
              </div>
              {/* Pre vs post comparison when a prior snapshot exists */}
              {isPostTest&&preSnap&&(()=>{
                const prePassed=preSnap.passed_count;
                const postPassed=passed.length;
                const delta=postPassed-prePassed;
                return(
                  <div style={{background:"var(--surface)",borderRadius:12,boxShadow:"var(--sh-sm)",border:"1px solid var(--border)",padding:"14px 16px",marginBottom:16}}>
                    <p style={{fontSize:11,fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.05em",margin:"0 0 10px"}}>Progress since pre-test</p>
                    <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
                      <div style={{flex:1,background:"#f8fafc",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600,marginBottom:2}}>PRE-TEST</div>
                        <div style={{fontSize:18,fontWeight:800,color:"#475569"}}>{prePassed}<span style={{fontSize:12,fontWeight:500}}>/{preSnap.total_count}</span></div>
                      </div>
                      <div style={{fontSize:18,color:"var(--muted)"}}>→</div>
                      <div style={{flex:1,background:delta>0?"#f0fdf4":delta<0?"#fff0f0":"#f8fafc",borderRadius:8,padding:"8px 12px",textAlign:"center",border:`1px solid ${delta>0?"#86efac":delta<0?"#fca5a5":"#e2e8f0"}`}}>
                        <div style={{fontSize:11,color:"var(--muted)",fontWeight:600,marginBottom:2}}>POST-TEST</div>
                        <div style={{fontSize:18,fontWeight:800,color:delta>0?"#16a34a":delta<0?"#dc2626":"#475569"}}>{postPassed}<span style={{fontSize:12,fontWeight:500}}>/{allIds.length}</span></div>
                      </div>
                      {delta!==0&&<div style={{fontSize:13,fontWeight:700,color:delta>0?"#16a34a":"#dc2626",flexShrink:0}}>{delta>0?`+${delta}`:delta}</div>}
                    </div>
                    {/* Per-outcome comparison */}
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {allIds.map(id=>{
                        const pre=preSnap.by_outcome?.[id];
                        const post=currentByOutcome[id];
                        if(!pre||!post)return null;
                        const preP=pre.passed;const postP=post.passed;
                        const changed=preP!==postP;
                        const improved=!preP&&postP;const regressed=preP&&!postP;
                        const changeColor=improved?"#16a34a":regressed?"#dc2626":"#94a3b8";
                        const changeLabel=improved?"✗ → ✓":regressed?"✓ → ✗":"—";
                        return(
                          <div key={id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                            <span style={{fontSize:12,flex:1,color:"var(--text)",fontWeight:500}}>{pre.short||post.short}</span>
                            <span style={{fontSize:11,width:28,textAlign:"center",color:preP?"#16a34a":"#dc2626",fontWeight:700}}>{preP?"✓":"✗"}</span>
                            <span style={{fontSize:10,color:"#cbd5e1"}}>→</span>
                            <span style={{fontSize:11,width:28,textAlign:"center",color:postP?"#16a34a":"#dc2626",fontWeight:700}}>{postP?"✓":"✗"}</span>
                            {changed&&<span style={{fontSize:10,fontWeight:700,color:changeColor,width:40,textAlign:"right",flexShrink:0}}>{changeLabel}</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
              {!isPostTest&&(
                <div style={{background:"var(--ind-50)",border:"1px solid var(--ind-200)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:"var(--indigo)"}}>
                  💡 Come back after practising to take your post-test and track your improvement.
                </div>
              )}
              <div style={{display:"flex",flexDirection:"column",marginBottom:"1.25rem"}}>
                {allIds.map(id=>{
                  const section=activePretestData.find(s=>s.outcomeId===id);
                  const r=byOutcome[id];
                  const isPassed=r&&r.correct===r.total;
                  return(
                    <div key={id} style={{background:"var(--surface)",borderRadius:10,boxShadow:"var(--sh-sm)",borderLeft:`3px solid ${isPassed?"#86efac":"#fca5a5"}`,padding:"12px 16px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <div>
                        <div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{section?.short}</div>
                        <div style={{fontSize:12,color:"var(--sub)"}}>{r?`${r.correct}/${r.total} correct`:""}{isPassed?" — passed":"Needs more practice"}</div>
                      </div>
                      <span style={{fontSize:16}}>{isPassed?"✓":"✗"}</span>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:20}}>
                <button onClick={()=>{setPretestMode(null);setView("home");}} style={Sb()}>← Units</button>
                <button onClick={()=>{setSelectedUnit(UNITS.find(u=>u.id===activeUnitId));setView("rubric");setPretestMode(null);}}
                  style={Sb({background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",border:"none",fontWeight:700,boxShadow:"0 4px 18px rgba(67,56,202,0.32)"})}>View Rubric →</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Section transition / start screen
    if(pretestSectionStart){
      const psb=BAND[pretestSectionStart];
      const sNameMap={red:"Red",yellow:"Yellow",green:"Green"};
      const sDescMap={
        red:"These questions cover the key foundations. Do your best on each one.",
        yellow:"These questions build on the foundations.",
        green:"These are the most challenging questions — give them your best shot!"
      };
      const sEmojiMap={red:"🔴",yellow:"🟡",green:"🟢"};
      const activeUnitIdSS=pretestQList[0]?.unitId||"u24";
      const isPostTestSS=((testSnapshots[studentId]||{})[activeUnitIdSS]||[]).length>=1;
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title={isPostTestSS?"Post-test":"Pre-test"}/>
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem 1.5rem"}}>
            <div style={{background:psb.bg,border:`2px solid ${psb.border}`,borderRadius:20,padding:"2.5rem 2rem",maxWidth:380,width:"100%",textAlign:"center",boxShadow:"0 8px 32px rgba(0,0,0,0.1)"}}>
              <div style={{width:72,height:72,background:psb.border,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",fontSize:36,boxShadow:`0 0 0 10px ${psb.bg}`}}>
                {sEmojiMap[pretestSectionStart]}
              </div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:psb.text,marginBottom:6}}>Now starting</div>
              <h2 style={{fontSize:28,fontWeight:800,color:psb.text,margin:"0 0 12px",letterSpacing:"-0.01em"}}>
                {sNameMap[pretestSectionStart]} Section
              </h2>
              <p style={{fontSize:14,color:psb.text,opacity:0.85,margin:"0 0 28px",lineHeight:1.6}}>
                {sDescMap[pretestSectionStart]}
              </p>
              <button onClick={()=>setPretestSectionStart(null)}
                style={{background:psb.text,color:"#fff",border:"none",borderRadius:12,padding:"14px 40px",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:ff,letterSpacing:"-0.01em"}}>
                Let's go! →
              </button>
            </div>
          </div>
        </div>
      );
    }

    const currentItemIdx=pretestInReview?pretestReviewQueue[pretestReviewPos]:pretestIdx;
    const current=pretestQList[currentItemIdx];
    if(!current)return null;
    const q=current.q;
    const currentBand=getBand(current.outcomeId);
    const b=BAND[currentBand];
    const pct=pretestInReview?100:Math.round(pretestIdx/pretestQList.length*100);
    const ok=pretestCanGo();
    const pool=q.type==="order"?q.items.filter(item=>!pretestAns.orderSeq.includes(item)):[];
    const activeUnitIdR=pretestQList[0]?.unitId||"u24";
    const isPostTestR=((testSnapshots[studentId]||{})[activeUnitIdR]||[]).length>=1;
    const testTitleR=isPostTestR?"Post-test":"Pre-test";
    const isLastMain=!pretestInReview&&pretestIdx===pretestQList.length-1;
    const isLastReview=pretestInReview&&pretestReviewPos===pretestReviewQueue.length-1;
    const hasFlagged=pretestFlagged.size>0;
    const nextBtnLabel=isLastReview?"Submit ✓":isLastMain&&hasFlagged?`Review flagged (${pretestFlagged.size}) →`:isLastMain?"Submit ✓":"Next →";
    const progressLabel=pretestInReview?`Review ${pretestReviewPos+1}/${pretestReviewQueue.length}`:`${pretestIdx+1}/${pretestQList.length}`;

    return(
      <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
        {/* Exit dialog — 3 options */}
        {pretestShowExitDialog&&(
          <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
            <div style={{background:"#fff",borderRadius:16,padding:"24px 28px",maxWidth:360,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
              <div style={{fontSize:28,marginBottom:12,textAlign:"center"}}>🚪</div>
              <h3 style={{margin:"0 0 6px",fontSize:18,fontWeight:800,color:"var(--text)",textAlign:"center"}}>Leaving the test?</h3>
              <p style={{margin:"0 0 20px",fontSize:13,color:"var(--sub)",lineHeight:1.6,textAlign:"center"}}>Choose what to do with your progress.</p>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <button onClick={()=>{setPretestShowExitDialog(false);finishPretest([...pretestAnswers]);}}
                  style={{fontFamily:ff,fontSize:14,fontWeight:700,padding:"12px 0",border:"none",borderRadius:9,cursor:"pointer",background:"linear-gradient(135deg,#dc2626,#b91c1c)",color:"#fff",textAlign:"center"}}>
                  Finish test now
                  <div style={{fontSize:11,fontWeight:400,opacity:0.85,marginTop:2}}>Record results — unanswered questions count as wrong</div>
                </button>
                <button onClick={()=>{
                  if(studentId&&(pretestIdx>0||pretestAnswers.length>0)){
                    try{
                      const uid=pretestQList[0]?.unitId;
                      const slimAns=a=>({...a,q:{...a.q,svg:undefined}});
                      localStorage.setItem(`solo_pretest_draft_${studentId}`,JSON.stringify({unitId:uid,pretestIdx,pretestAnswers:pretestAnswers.map(slimAns)}));
                    }catch{}
                  }
                  setPretestShowExitDialog(false);setPretestMode(null);setPretestInReview(false);setPretestFlagged(new Set());setPretestShowResume(false);setPretestResumeDraft(null);setView("home");
                }} style={{fontFamily:ff,fontSize:14,fontWeight:700,padding:"12px 0",border:"1.5px solid var(--ind-200)",borderRadius:9,cursor:"pointer",background:"var(--ind-50)",color:"var(--indigo)",textAlign:"center"}}>
                  I'll come back later
                  <div style={{fontSize:11,fontWeight:400,opacity:0.75,marginTop:2}}>Save your progress — resume from here next time</div>
                </button>
                <button onClick={()=>{
                  if(studentId){try{localStorage.removeItem(`solo_pretest_draft_${studentId}`);}catch{}}
                  setPretestShowExitDialog(false);setPretestMode(null);setPretestInReview(false);setPretestFlagged(new Set());setPretestShowResume(false);setPretestResumeDraft(null);setView("home");
                }} style={{fontFamily:ff,fontSize:14,fontWeight:700,padding:"12px 0",border:"1.5px solid #fca5a5",borderRadius:9,cursor:"pointer",background:"#fff0f0",color:"#dc2626",textAlign:"center"}}>
                  Discard this attempt
                  <div style={{fontSize:11,fontWeight:400,opacity:0.8,marginTop:2}}>Exit without recording anything — no results saved</div>
                </button>
                <button onClick={()=>setPretestShowExitDialog(false)}
                  style={Sb({fontSize:13,padding:"10px 0",textAlign:"center",width:"100%"})}>
                  Never mind, keep going
                </button>
              </div>
            </div>
          </div>
        )}
        {/* Early exit confirmation modal */}
        {pretestShowEarlyExit&&(
          <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
            <div style={{background:"#fff",borderRadius:16,padding:"24px 28px",maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
              <div style={{fontSize:28,marginBottom:12,textAlign:"center"}}>⏹️</div>
              <h3 style={{margin:"0 0 10px",fontSize:18,fontWeight:800,color:"var(--text)",textAlign:"center"}}>End test early?</h3>
              <p style={{margin:"0 0 20px",fontSize:14,color:"var(--sub)",lineHeight:1.6,textAlign:"center"}}>
                Your answers so far will be saved. Questions you haven't answered will be counted as incorrect.
              </p>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setPretestShowEarlyExit(false)} style={Sb({flex:1,padding:"11px 0",fontSize:14})}>Keep going</button>
                <button onClick={()=>{setPretestShowEarlyExit(false);finishPretest([...pretestAnswers]);}}
                  style={{flex:1,fontFamily:ff,fontSize:14,fontWeight:700,padding:"11px 0",border:"none",borderRadius:9,cursor:"pointer",background:"linear-gradient(135deg,#dc2626,#b91c1c)",color:"#fff"}}>Submit now</button>
              </div>
            </div>
          </div>
        )}
        <AppNav title={testTitleR}
          right={<span style={{fontSize:12,color:"rgba(255,255,255,0.6)",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{current.short}</span>}
        />
        {/* Section colour banner */}
        <div style={{background:b.bg,borderBottom:`2px solid ${b.border}`,padding:"7px 18px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:b.dot,flexShrink:0}}/>
          <span style={{fontSize:13,fontWeight:700,color:b.text}}>
            {currentBand==="red"?"Red Section":currentBand==="yellow"?"Yellow Section":"Green Section"}
          </span>
          {pretestInReview&&<span style={{fontSize:12,color:b.text,opacity:0.75,marginLeft:2}}>— Reviewing flagged questions</span>}
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",padding:"18px 18px 24px",minHeight:0}}>
          {/* topbar */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexShrink:0}}>
            <button onClick={()=>setPretestShowExitDialog(true)} style={Sb()}>✕ Exit</button>
            <div style={{flex:1,background:"var(--ind-100)",borderRadius:99,height:6,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${b.dot},${b.border})`,borderRadius:99,transition:"width 0.3s"}}/>
            </div>
            <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,flexShrink:0}}>{progressLabel}</span>
          </div>
          {/* resume banner */}
          {pretestShowResume&&(
            <div style={{background:"var(--ind-50)",border:"1px solid var(--ind-200)",borderRadius:10,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexShrink:0}}>
              <span style={{fontSize:13,color:"var(--indigo)",fontWeight:500}}>Continue where you left off? You were on question {pretestResumeDraft?.pretestIdx+1} of {pretestQList.length}.</span>
              <div style={{display:"flex",gap:8,flexShrink:0}}>
                <button onClick={()=>{try{if(studentId)localStorage.removeItem(`solo_pretest_draft_${studentId}`);}catch{}setPretestShowResume(false);setPretestResumeDraft(null);setPretestIdx(0);setPretestAnswers([]);setPretestAns(initAns(pretestQList[0].q));}}
                  style={{fontFamily:ff,fontSize:12,padding:"5px 10px",background:"#fff",border:"1px solid var(--ind-200)",borderRadius:7,cursor:"pointer",color:"var(--indigo)"}}>Start over</button>
                <button onClick={()=>setPretestShowResume(false)}
                  style={{fontFamily:ff,fontSize:12,padding:"5px 12px",background:"var(--indigo)",border:"none",borderRadius:7,cursor:"pointer",color:"#fff",fontWeight:600}}>Continue →</button>
              </div>
            </div>
          )}
          {/* outcome strip — coloured to match section */}
          <div style={{background:b.bg,border:`1px solid ${b.border}`,borderRadius:10,padding:"9px 14px",display:"flex",alignItems:"center",gap:8,marginBottom:14,flexShrink:0,boxShadow:"var(--sh-sm)"}}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",padding:"3px 9px",borderRadius:5,background:b.border,color:b.text,flexShrink:0}}>
              {pretestInReview?"Flagged Review":testTitleR}
            </span>
            <span style={{fontSize:13,fontWeight:600,color:b.text}}>{current.short}</span>
          </div>
          {/* sidebar + question area row */}
          <div style={{flex:1,display:"flex",gap:10,minHeight:0}}>
            {/* question-number sidebar */}
            <div style={{width:64,flexShrink:0,display:"flex",flexWrap:"wrap",gap:2,alignContent:"flex-start",overflowY:"auto",paddingBottom:4}}>
              {pretestQList.map((_,i)=>{
                const sIsCurrent=pretestInReview?i===pretestReviewQueue[pretestReviewPos]:i===pretestIdx;
                const sIsFlagged=pretestFlagged.has(i);
                const sIsAnswered=pretestAnswers.some(a=>a.idx===i);
                const sIsPending=pretestInReview&&pretestReviewQueue.slice(pretestReviewPos+1).includes(i);
                const sIsClickable=!pretestInReview&&!sIsCurrent&&(i<pretestIdx||sIsFlagged);
                const sdb=BAND[getBand(pretestQList[i].outcomeId)];
                const sbg=sIsCurrent?"var(--indigo)":sIsFlagged||sIsPending?"#fef3c7":sIsAnswered?sdb.bg:"#f8fafc";
                const sborder=sIsCurrent?"var(--indigo)":sIsFlagged||sIsPending?"#f59e0b":sIsAnswered?sdb.border:"#e2e8f0";
                const scol=sIsCurrent?"#fff":sIsFlagged||sIsPending?"#92400e":sIsAnswered?sdb.text:"#94a3b8";
                return(<button key={i} onClick={()=>sIsClickable&&handlePretestJumpTo(i)}
                  title={sIsFlagged?"Flagged — click to return":sIsAnswered?"Answered":`Q${i+1}`}
                  style={{width:28,height:22,boxSizing:"border-box",display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:10,fontWeight:700,fontFamily:ff,borderRadius:5,
                    border:`1.5px solid ${sborder}`,background:sbg,color:scol,
                    cursor:sIsClickable?"pointer":"default",transition:"all 0.15s",position:"relative",outline:"none"}}>
                  {i+1}
                  {sIsFlagged&&<span style={{position:"absolute",top:-4,right:-3,fontSize:8,lineHeight:1,pointerEvents:"none"}}>🏳</span>}
                </button>);
              })}
            </div>
            {/* question + actions column */}
            <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
          {/* question card */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"28px 26px 24px",boxShadow:"var(--sh-lg)",flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
            {q.svg&&<div dangerouslySetInnerHTML={{__html:q.svg}} style={{marginBottom:16,borderRadius:8,overflow:"hidden"}}/>}
            <p style={{fontSize:22,fontWeight:600,lineHeight:1.55,letterSpacing:"-0.02em",marginBottom:26,flexShrink:0,color:"var(--text)"}}>{q.text}</p>
            <div style={{display:"flex",flexDirection:"column",gap:10,flex:1,minHeight:0}}>
              {q.type==="input"&&(
                <div>
                  <input autoFocus type="text" value={pretestAns.input} onChange={e=>setPretestAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&handlePretestNext()}
                    placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",border:"1.5px solid #cbd5e1",borderRadius:10,fontSize:16,outline:"none",fontFamily:ff}}/>
                  <p style={{fontSize:12,color:"var(--muted)",margin:"8px 0 0"}}>Use fractions like 3/4 or whole numbers</p>
                </div>
              )}
              {q.type==="mc"&&(
                <>{q.options.map(opt=><button key={opt} onClick={()=>setPretestAns(a=>({...a,option:opt}))} style={Pb(pretestAns.option===opt)}>{opt}</button>)}</>
              )}
              {q.type==="truefalse"&&(
                <div style={{display:"flex",gap:12,flex:1}}>
                  {["true","false"].map(val=><button key={val} onClick={()=>setPretestAns(a=>({...a,option:val}))} style={Pb(pretestAns.option===val,{textAlign:"center",justifyContent:"center"})}>{val.charAt(0).toUpperCase()+val.slice(1)}</button>)}
                </div>
              )}
              {q.type==="order"&&(
                <div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click to build your order:</p>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                    {pool.length>0?pool.map(item=><button key={item} onClick={()=>setPretestAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500,fontFamily:ff}}>{item}</button>)
                      :<span style={{fontSize:12,color:"var(--muted)"}}>All placed</span>}
                  </div>
                  {pretestAns.orderSeq.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                    {pretestAns.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                      {i>0&&<span style={{color:"#cbd5e1"}}>→</span>}
                      <button onClick={()=>setPretestAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600,fontFamily:ff}}>{item}</button>
                    </span>)}
                  </div>}
                </div>
              )}
              {q.type==="shade"&&pretestAns.shadedCells.length===q.cells&&(
                <div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click cells to shade them:</p>
                  <div style={{display:"flex",gap:3,marginBottom:8}}>
                    {pretestAns.shadedCells.map((shaded,i)=><div key={i} onClick={()=>setPretestAns(a=>({...a,shadedCells:a.shadedCells.map((v,idx)=>idx===i?!v:v)}))}
                      style={{flex:1,height:52,borderRadius:4,cursor:"pointer",background:shaded?"var(--indigo)":"#f8fafc",border:`1px solid ${shaded?"var(--indigo)":"#cbd5e1"}`,transition:"background 0.15s"}}/>)}
                  </div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:0}}>{pretestAns.shadedCells.filter(Boolean).length} of {q.cells} cells shaded</p>
                </div>
              )}
              {q.type==="numberline"&&<NumberLineQ key={currentItemIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
              {q.type==="match"&&<MatchQ key={currentItemIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
              {q.type==="partition"&&<PartitionQ key={currentItemIdx} q={q} ans={pretestAns} setAns={setPretestAns}/>}
            </div>
          </div>
          {/* actions */}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:18,flexShrink:0}}>
            <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              {!pretestInReview&&pretestIdx>0&&(
                <button onClick={handlePretestBack} style={Sb({fontSize:12,padding:"9px 14px"})}>← Back</button>
              )}
              <button onClick={handlePretestSkip}
                style={Sb({fontSize:12,padding:"9px 14px",color:"#92400e",borderColor:"#fcd34d",background:"#fffbeb",fontWeight:600})}>
                {pretestInReview?"Leave as wrong ✗":"🏳 Skip for now"}
              </button>
              <button onClick={handlePretestNext} disabled={!ok}
                style={{padding:"12px 28px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:ok?"pointer":"default",background:ok?`linear-gradient(135deg,${b.dot},var(--indigo))`:"#e2e8f0",color:ok?"#fff":"var(--muted)",boxShadow:ok?"0 4px 18px rgba(67,56,202,0.32)":"none",transition:"all 0.2s",whiteSpace:"nowrap"}}>
                {nextBtnLabel}
              </button>
            </div>
            {/* Finish early link */}
            {!pretestInReview&&(
              <div style={{display:"flex",justifyContent:"center"}}>
                <button onClick={()=>setPretestShowEarlyExit(true)}
                  style={{fontFamily:ff,fontSize:12,color:"var(--muted)",background:"none",border:"none",cursor:"pointer",padding:"2px 0",textDecoration:"underline",textDecorationStyle:"dotted"}}>
                  Submit what I have so far
                </button>
              </div>
            )}
          </div>
            </div>{/* end question+actions column */}
          </div>{/* end sidebar+question row */}
        </div>
      </div>
    );
  }

  // ── Unit Review ───────────────────────────────────────────────────────────
  if(view==="review"){
    const reviewUnit=UNITS.find(u=>u.id===reviewActive?.unitId);

    // Results screen
    if(reviewMode==="done"&&reviewResults){
      const{byOutcome,passedCount,totalCount}=reviewResults;
      const pct=totalCount?Math.round(passedCount/totalCount*100):0;
      const allPassed=passedCount===totalCount;
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title="Unit Review Complete"/>
          <div style={{flex:1,overflowY:"auto",padding:"1.5rem 1rem"}}>
            <div style={{maxWidth:520,margin:"0 auto"}}>
              <div style={{textAlign:"center",padding:"1.5rem 0 1.25rem"}}>
                <div style={{width:64,height:64,background:allPassed?"#f0fdf4":"#fff7ed",border:`1px solid ${allPassed?"#86efac":"#fdba74"}`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:28,boxShadow:allPassed?"0 0 0 6px rgba(134,239,172,0.15)":"0 0 0 6px rgba(249,115,22,0.1)"}}>
                  {allPassed?"🏆":"📋"}
                </div>
                <h2 style={{fontSize:20,fontWeight:800,margin:"0 0 4px",color:"var(--text)",letterSpacing:"-0.01em"}}>Review Complete!</h2>
                <p style={{fontSize:13,color:"var(--sub)",margin:0}}>{reviewUnit?.name}: {reviewUnit?.subtitle}</p>
                <div style={{display:"inline-flex",alignItems:"center",gap:8,margin:"14px 0 0",background:allPassed?"#f0fdf4":"#fff7ed",border:`1px solid ${allPassed?"#86efac":"#fdba74"}`,borderRadius:10,padding:"8px 16px"}}>
                  <span style={{fontSize:22,fontWeight:800,color:allPassed?"#16a34a":"#c2410c"}}>{passedCount}</span>
                  <span style={{fontSize:14,color:"var(--sub)"}}>of {totalCount} remembered</span>
                  <span style={{fontSize:13,fontWeight:700,color:allPassed?"#16a34a":"#c2410c"}}>{pct}%</span>
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:"1.5rem"}}>
                {Object.entries(byOutcome).map(([id,o])=>(
                  <div key={id} style={{background:"var(--surface)",borderRadius:12,boxShadow:"var(--sh-sm)",borderLeft:`4px solid ${o.passed?"#86efac":"#fca5a5"}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:20,flexShrink:0}}>{o.passed?"✓":"✗"}</span>
                    <div style={{flex:1}}>
                      <p style={{fontSize:14,fontWeight:600,margin:"0 0 2px",color:o.passed?"#16a34a":"var(--text)"}}>{o.short}</p>
                      <p style={{fontSize:12,color:"var(--sub)",margin:0}}>{o.passed?"Still know it!":"Keep practising this one"}</p>
                    </div>
                  </div>
                ))}
              </div>
              {!allPassed&&(
                <div style={{background:"var(--ind-50)",border:"1px solid var(--ind-200)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:12,color:"var(--indigo)"}}>
                  {"💡 Open the outcomes you didn't get and practise them — your teacher will run a new review to check."}
                </div>
              )}
              <div style={{display:"flex",justifyContent:"center"}}>
                <button onClick={()=>{setReviewMode(null);setView("home");}}
                  style={{padding:"13px 32px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",boxShadow:"0 4px 18px rgba(67,56,202,0.32)"}}>
                  Continue to my work →
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Running review
    if(reviewMode==="running"&&reviewQList.length>0){
      const current=reviewQList[reviewIdx];
      if(!current)return null;
      const q=current.q;
      const pct=Math.round(reviewIdx/reviewQList.length*100);
      const ok=reviewCanGo();
      const pool=q.type==="order"?q.items.filter(item=>!reviewAns.orderSeq.includes(item)):[];
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title="Unit Review"
            right={<span style={{fontSize:12,color:"rgba(255,255,255,0.6)",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{current.short}</span>}
          />
          <div style={{flex:1,display:"flex",flexDirection:"column",padding:"18px 18px 24px",minHeight:0}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexShrink:0}}>
              <span style={{fontSize:12,fontWeight:700,color:"#c2410c",padding:"3px 9px",background:"#fff7ed",border:"1px solid #fdba74",borderRadius:6}}>Review</span>
              <div style={{flex:1,background:"var(--ind-100)",borderRadius:99,height:6,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#f97316,#ea580c)",borderRadius:99,transition:"width 0.3s"}}/>
              </div>
              <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,flexShrink:0}}>{reviewIdx+1}/{reviewQList.length}</span>
            </div>
            <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",display:"flex",alignItems:"center",gap:8,marginBottom:14,flexShrink:0,boxShadow:"var(--sh-sm)"}}>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",padding:"3px 9px",borderRadius:5,background:"#fff7ed",color:"#c2410c",flexShrink:0}}>Outcome</span>
              <span style={{fontSize:13,fontWeight:600,color:"var(--sub)"}}>{current.short}</span>
            </div>
            <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"28px 26px 24px",boxShadow:"var(--sh-lg)",flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
              <p style={{fontSize:22,fontWeight:600,lineHeight:1.55,letterSpacing:"-0.02em",marginBottom:26,flexShrink:0,color:"var(--text)"}}>{q.text}</p>
              <div style={{display:"flex",flexDirection:"column",gap:10,flex:1,minHeight:0}}>
                {q.type==="input"&&(
                  <div>
                    <input autoFocus type="text" value={reviewAns.input} onChange={e=>setReviewAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&handleReviewNext()}
                      placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",border:"1.5px solid #cbd5e1",borderRadius:10,fontSize:16,outline:"none",fontFamily:ff}}/>
                    <p style={{fontSize:12,color:"var(--muted)",margin:"8px 0 0"}}>Use fractions like 3/4 or whole numbers</p>
                  </div>
                )}
                {q.type==="mc"&&(
                  <>{q.options.map(opt=><button key={opt} onClick={()=>setReviewAns(a=>({...a,option:opt}))} style={Pb(reviewAns.option===opt)}>{opt}</button>)}</>
                )}
                {q.type==="truefalse"&&(
                  <div style={{display:"flex",gap:12,flex:1}}>
                    {["true","false"].map(val=><button key={val} onClick={()=>setReviewAns(a=>({...a,option:val}))} style={Pb(reviewAns.option===val,{textAlign:"center",justifyContent:"center"})}>{val.charAt(0).toUpperCase()+val.slice(1)}</button>)}
                  </div>
                )}
                {q.type==="order"&&(
                  <div>
                    <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click to build your order:</p>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                      {pool.length>0?pool.map(item=><button key={item} onClick={()=>setReviewAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500,fontFamily:ff}}>{item}</button>)
                        :<span style={{fontSize:12,color:"var(--muted)"}}>All placed</span>}
                    </div>
                    {reviewAns.orderSeq.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                      {reviewAns.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                        {i>0&&<span style={{color:"#cbd5e1"}}>{"→"}</span>}
                        <button onClick={()=>setReviewAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600,fontFamily:ff}}>{item}</button>
                      </span>)}
                    </div>}
                  </div>
                )}
                {q.type==="shade"&&reviewAns.shadedCells.length===q.cells&&(
                  <div>
                    <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click cells to shade them:</p>
                    <div style={{display:"flex",gap:3,marginBottom:8}}>
                      {reviewAns.shadedCells.map((shaded,i)=><div key={i} onClick={()=>setReviewAns(a=>({...a,shadedCells:a.shadedCells.map((v,idx)=>idx===i?!v:v)}))}
                        style={{flex:1,height:52,borderRadius:4,cursor:"pointer",background:shaded?"var(--indigo)":"#f8fafc",border:`1px solid ${shaded?"var(--indigo)":"#cbd5e1"}`,transition:"background 0.15s"}}/>)}
                    </div>
                    <p style={{fontSize:12,color:"var(--sub)",margin:0}}>{reviewAns.shadedCells.filter(Boolean).length} of {q.cells} cells shaded</p>
                  </div>
                )}
                {q.type==="numberline"&&<NumberLineQ key={reviewIdx} q={q} ans={reviewAns} setAns={setReviewAns}/>}
                {q.type==="match"&&<MatchQ key={reviewIdx} q={q} ans={reviewAns} setAns={setReviewAns}/>}
                {q.type==="partition"&&<PartitionQ key={reviewIdx} q={q} ans={reviewAns} setAns={setReviewAns}/>}
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18,flexShrink:0}}>
              {reviewQList.length<=15
                ?<div style={{display:"flex",gap:5}}>{reviewQList.map((_,i)=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:i<reviewIdx?"#f97316":i===reviewIdx?"#ea580c":"var(--ind-100)",transform:i===reviewIdx?"scale(1.3)":"none",transition:"all 0.15s"}}/>)}</div>
                :<span style={{fontSize:12,color:"var(--muted)"}}>{reviewIdx+1} of {reviewQList.length}</span>
              }
              <button onClick={handleReviewNext} disabled={!ok}
                style={{padding:"13px 32px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:ok?"pointer":"default",background:ok?"linear-gradient(135deg,#f97316,#ea580c)":"#e2e8f0",color:ok?"#fff":"var(--muted)",boxShadow:ok?"0 4px 18px rgba(249,115,22,0.35)":"none",transition:"all 0.2s"}}>
                {reviewIdx===reviewQList.length-1?"Submit":"Next →"}
              </button>
            </div>
          </div>
        </div>
      );
    }
    return null;
  }

  // ── Assessment ────────────────────────────────────────────────────────────
  if(view==="assessment"){
    const o=activeOutcome;
    const bs=BAND[o.band];
    const uc=UC[selectedUnit.id];

    if(results){
      const correct=results.results.filter(r=>r.correct).length;
      const total=results.results.length;
      const allCorrect=results.allCorrect;
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title={o.short}/>
          <div style={{flex:1,overflowY:"auto",padding:"1.5rem 1rem"}}>
            <div style={{maxWidth:520,margin:"0 auto"}}>
              <div style={{textAlign:"center",padding:"1.5rem 0 1.25rem"}}>
                <div style={{width:60,height:60,background:allCorrect?"#dcfce7":"var(--ind-50)",border:`1px solid ${allCorrect?"#86efac":"var(--ind-200)"}`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:24,boxShadow:allCorrect?"0 0 0 6px rgba(134,239,172,0.2)":"0 0 0 6px rgba(99,102,241,0.08)"}}>
                  {allCorrect?"⭐":"📋"}
                </div>
                <h2 style={{fontSize:20,fontWeight:800,margin:"0 0 4px",color:"var(--text)",letterSpacing:"-0.01em"}}>{allCorrect?"All correct!":correct+" / "+total+" correct"}</h2>
                <p style={{fontSize:13,color:"var(--sub)",margin:0}}>{o.short}</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",marginBottom:"1.25rem"}}>
                {results.results.map((r,i)=>(
                  <div key={i} style={{background:"var(--surface)",borderRadius:10,boxShadow:"var(--sh-sm)",borderLeft:`3px solid ${r.correct?"#86efac":"#fca5a5"}`,padding:"12px 16px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{flex:1,marginRight:12}}>
                      <div style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{r.q.text}</div>
                      {!r.correct&&<div style={{fontSize:12,color:"var(--sub)",marginTop:2}}>Your answer: <span style={{color:"#dc2626"}}>{fmtGiven(r.given,r.q)}</span></div>}
                    </div>
                    <span style={{fontSize:16,flexShrink:0}}>{r.correct?"✓":"✗"}</span>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:20}}>
                <button onClick={()=>setView("rubric")} style={Sb()}>← Rubric</button>
                {!allCorrect&&<button onClick={()=>{setQIdx(0);setAnswers([]);setAns(initAns(o.questions[0]));setResults(null);}} style={Sb({background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",border:"none",fontWeight:700,boxShadow:"0 4px 18px rgba(67,56,202,0.32)"})}>Try Again →</button>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const q=o.questions[qIdx];
    const total=o.questions.length;
    const pct=Math.round(qIdx/total*100);
    const ok=canGo();
    const pool=q.type==="order"?q.items.filter(item=>!ans.orderSeq.includes(item)):[];

    return(
      <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
        <AppNav title={o.short}/>
        <div style={{flex:1,display:"flex",flexDirection:"column",padding:"18px 18px 24px",minHeight:0}}>
          {/* topbar */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexShrink:0}}>
            <button onClick={()=>setView("rubric")} style={Sb()}>← Back</button>
            <div style={{flex:1,background:"var(--ind-100)",borderRadius:99,height:6,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,var(--indigo),var(--blue))",borderRadius:99,transition:"width 0.3s"}}/>
            </div>
            <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,flexShrink:0}}>{qIdx+1}/{total}</span>
          </div>
          {/* outcome strip */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 14px",display:"flex",alignItems:"center",gap:8,marginBottom:14,flexShrink:0,boxShadow:"var(--sh-sm)"}}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",padding:"3px 9px",borderRadius:5,background:bs.bg,color:bs.text,flexShrink:0}}>{o.band}</span>
            <span style={{fontSize:13,fontWeight:600,color:"var(--sub)"}}>{o.short}</span>
          </div>
          {/* question card */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"28px 26px 24px",boxShadow:"var(--sh-lg)",flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
            {q.svg&&<div dangerouslySetInnerHTML={{__html:q.svg}} style={{marginBottom:16,borderRadius:8,overflow:"hidden"}}/>}
            <p style={{fontSize:22,fontWeight:600,lineHeight:1.55,letterSpacing:"-0.02em",marginBottom:26,flexShrink:0,color:"var(--text)"}}>{q.text}</p>
            <div style={{display:"flex",flexDirection:"column",gap:10,flex:1,minHeight:0}}>
              {q.type==="input"&&(
                <div>
                  <input autoFocus type="text" value={ans.input} onChange={e=>setAns(a=>({...a,input:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&ok&&handleNext()}
                    placeholder="Type your answer" style={{width:"100%",boxSizing:"border-box",padding:"12px 14px",border:"1.5px solid #cbd5e1",borderRadius:10,fontSize:16,outline:"none",fontFamily:ff}}/>
                  <p style={{fontSize:12,color:"var(--muted)",margin:"8px 0 0"}}>Use fractions like 3/4 or whole numbers</p>
                </div>
              )}
              {q.type==="mc"&&(
                <>{q.options.map(opt=><button key={opt} onClick={()=>setAns(a=>({...a,option:opt}))} style={Pb(ans.option===opt)}>{opt}</button>)}</>
              )}
              {q.type==="truefalse"&&(
                <div style={{display:"flex",gap:12,flex:1}}>
                  {["true","false"].map(val=><button key={val} onClick={()=>setAns(a=>({...a,option:val}))} style={Pb(ans.option===val,{textAlign:"center",justifyContent:"center"})}>{val.charAt(0).toUpperCase()+val.slice(1)}</button>)}
                </div>
              )}
              {q.type==="order"&&(
                <div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click to build your order:</p>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",minHeight:44,marginBottom:14,padding:8,background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",alignItems:"center"}}>
                    {pool.length>0?pool.map(item=><button key={item} onClick={()=>setAns(a=>({...a,orderSeq:[...a.orderSeq,item]}))} style={{padding:"7px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:500,fontFamily:ff,color:"var(--text)"}}>{item}</button>)
                      :<span style={{fontSize:12,color:"var(--muted)"}}>All placed below</span>}
                  </div>
                  {ans.orderSeq.length>0&&<>
                    <p style={{fontSize:12,color:"var(--muted)",margin:"0 0 6px"}}>Your order (click to remove):</p>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                      {ans.orderSeq.map((item,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                        {i>0&&<span style={{color:"#cbd5e1",fontSize:14}}>→</span>}
                        <button onClick={()=>setAns(a=>({...a,orderSeq:a.orderSeq.filter((_,idx)=>idx!==i)}))} style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid #bfdbfe",background:"#eff6ff",cursor:"pointer",fontSize:14,color:"#1d4ed8",fontWeight:600,fontFamily:ff}}>{item}</button>
                      </span>)}
                    </div>
                  </>}
                </div>
              )}
              {q.type==="shade"&&ans.shadedCells.length===q.cells&&(
                <div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:"0 0 8px"}}>Click cells to shade them:</p>
                  <div style={{display:"flex",gap:3,marginBottom:8}}>
                    {ans.shadedCells.map((shaded,i)=><div key={i} onClick={()=>setAns(a=>({...a,shadedCells:a.shadedCells.map((v,idx)=>idx===i?!v:v)}))}
                      style={{flex:1,height:52,borderRadius:4,cursor:"pointer",background:shaded?"var(--indigo)":"#f8fafc",border:`1px solid ${shaded?"var(--indigo)":"#cbd5e1"}`,transition:"background 0.15s"}}/>)}
                  </div>
                  <p style={{fontSize:12,color:"var(--sub)",margin:0}}>{ans.shadedCells.filter(Boolean).length} of {q.cells} cells shaded</p>
                </div>
              )}
              {q.type==="numberline"&&<NumberLineQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
              {q.type==="match"&&<MatchQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
              {q.type==="partition"&&<PartitionQ key={qIdx} q={q} ans={ans} setAns={setAns}/>}
            </div>
          </div>
          {/* actions */}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:18,flexShrink:0}}>
            <button onClick={handleNext} disabled={!ok}
              style={{padding:"13px 32px",border:"none",borderRadius:12,fontFamily:ff,fontSize:15,fontWeight:700,cursor:ok?"pointer":"default",background:ok?"linear-gradient(135deg,var(--indigo),var(--blue))":"#e2e8f0",color:ok?"#fff":"var(--muted)",boxShadow:ok?"0 4px 18px rgba(67,56,202,0.32)":"none",transition:"all 0.2s"}}>
              {qIdx===total-1?"Submit":"Next →"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── Teacher: unit rubric view ────────────────────────────────────────────
  if(view==="rubric"&&isTeacher){
    if(teacherFocus){
      const s=students.find(s=>s.id===teacherFocus);
      const prog=progress[s.id];
      const {done,total}=unitProgress(prog,selectedUnit.id);
      const uc=UC[selectedUnit.id];
      const studentAttempts=attempts[s.id]||{};

      // ── Attempt detail view ──────────────────────────────────────────────
      if(teacherAttemptKey!==null&&teacherAttemptIdx!==null){
        const outcomeId=teacherAttemptKey.replace(`${selectedUnit.id}_`,"");
        const outcome=selectedUnit.outcomes.find(o=>o.id===outcomeId);
        const attempt=(studentAttempts[teacherAttemptKey]||[])[teacherAttemptIdx];
        if(!attempt) return null;
        const attemptNum=teacherAttemptIdx+1;
        const timeStr=new Date(attempt.ts).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
        return(
          <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
            <AppNav title={`${s.name} — Attempt ${attemptNum}`} right={<button onClick={()=>setTeacherAttemptIdx(null)} style={{fontFamily:ff,fontSize:12,padding:"6px 12px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.8)",cursor:"pointer"}}>← Attempts</button>}/>
            <div style={{flex:1,overflowY:"auto",padding:"1rem"}}>
              <div style={{maxWidth:520,margin:"0 auto"}}>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 1rem"}}>{outcome?.short} · {timeStr} · <span style={{fontWeight:600,color:attempt.passed?"#16a34a":"#dc2626"}}>{attempt.passed?"Passed":"Not passed"}</span> ({attempt.correct}/{attempt.total})</p>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {attempt.results.map((r,i)=>(
                    <div key={i} style={{background:"#fff",border:`1px solid ${r.correct?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"11px 14px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                        <p style={{fontSize:13,margin:0,flex:1,color:"#1e293b",lineHeight:1.4}}>{r.text}</p>
                        <span style={{fontSize:11,fontWeight:700,flexShrink:0,color:r.correct?"#16a34a":"#dc2626",paddingTop:1}}>{r.correct?"✓":"✗"}</span>
                      </div>
                      {!r.correct&&<p style={{fontSize:12,color:"#64748b",margin:"6px 0 0"}}>Answer given: <span style={{color:"#dc2626",fontWeight:600}}>{r.given||"(blank)"}</span></p>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ── Attempt list for one outcome ─────────────────────────────────────
      if(teacherAttemptKey!==null){
        const outcomeId=teacherAttemptKey.replace(`${selectedUnit.id}_`,"");
        const outcome=selectedUnit.outcomes.find(o=>o.id===outcomeId);
        const outcomeAttempts=studentAttempts[teacherAttemptKey]||[];
        return(
          <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
            <AppNav title={outcome?.short||""} right={<button onClick={()=>setTeacherAttemptKey(null)} style={{fontFamily:ff,fontSize:12,padding:"6px 12px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.8)",cursor:"pointer"}}>← {s.name}</button>}/>
            <div style={{flex:1,overflowY:"auto",padding:"1rem"}}>
              <div style={{maxWidth:520,margin:"0 auto"}}>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 1rem"}}>{s.name} · {outcomeAttempts.length} attempt{outcomeAttempts.length!==1?"s":""}</p>
            {outcomeAttempts.length===0
              ? <p style={{fontSize:13,color:"#94a3b8",textAlign:"center",padding:"2rem 0"}}>No attempts recorded this session.</p>
              : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {[...outcomeAttempts].reverse().map((a,ri)=>{
                    const i=outcomeAttempts.length-1-ri;
                    const timeStr=new Date(a.ts).toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});
                    const wrongQs=a.results.filter(r=>!r.correct);
                    return(
                      <div key={i} style={{background:"#fff",border:`1px solid ${a.passed?"#86efac":"#fca5a5"}`,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:wrongQs.length>0?8:0}}>
                          <div>
                            <span style={{fontSize:13,fontWeight:600,color:a.passed?"#16a34a":"#dc2626"}}>{a.passed?"Passed":"Not passed"}</span>
                            <span style={{fontSize:12,color:"#94a3b8",marginLeft:8}}>{a.correct}/{a.total} correct · {timeStr}</span>
                          </div>
                          <button onClick={()=>setTeacherAttemptIdx(i)} style={Sb({fontSize:12,padding:"4px 12px"})}>View</button>
                        </div>
                        {wrongQs.length>0&&(
                          <div style={{borderTop:"1px solid #f1f5f9",paddingTop:8}}>
                            <p style={{fontSize:11,fontWeight:700,color:"#94a3b8",margin:"0 0 5px",textTransform:"uppercase",letterSpacing:"0.04em"}}>Incorrect questions</p>
                            {wrongQs.map((r,wi)=>(
                              <p key={wi} style={{fontSize:12,color:"#dc2626",margin:"0 0 3px",lineHeight:1.4}}>✗ {r.text}</p>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>}
              </div>
            </div>
          </div>
        );
      }

      // ── Student rubric with attempt counts ───────────────────────────────
      const unitSnapsForStudent=(testSnapshots[s.id]||{})[selectedUnit.id]||[];
      const preSnapT=unitSnapsForStudent[0]||null;
      const postSnapT=unitSnapsForStudent.length>=2?unitSnapsForStudent[unitSnapsForStudent.length-1]:null;
      const activePretestData=PRETESTS[selectedUnit.id]||[];
      const allPretestIds=activePretestData.map(sec=>sec.outcomeId);
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>
          <AppNav title={s.name} right={<button onClick={()=>{setTeacherFocus(null);setTeacherAttemptKey(null);setTeacherAttemptIdx(null);}} style={{fontFamily:ff,fontSize:12,padding:"6px 12px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.8)",cursor:"pointer"}}>← Class</button>}/>
          <div style={{flex:1,overflowY:"auto",padding:"1rem"}}>
            <div style={{maxWidth:520,margin:"0 auto"}}>
              <p style={{fontSize:13,color:"#64748b",margin:"0 0 1rem"}}>{selectedUnit.name}: {selectedUnit.subtitle} — {done}/{total} complete</p>
              {/* Pre/Post assessment comparison */}
              {unitSnapsForStudent.length>=1&&(
                <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"14px 16px",marginBottom:16,boxShadow:"var(--sh-sm)"}}>
                  <p style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.05em",margin:"0 0 10px"}}>📊 Pre / Post Assessment</p>
                  {/* Summary row */}
                  <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
                    <div style={{flex:1,background:"#f8fafc",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:2}}>Pre-test</div>
                      <div style={{fontSize:16,fontWeight:800,color:"#475569"}}>{preSnapT.passed_count}<span style={{fontSize:11,fontWeight:500}}>/{preSnapT.total_count}</span></div>
                      <div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>{new Date(preSnapT.taken_at).toLocaleDateString("en-AU",{day:"numeric",month:"short"})}</div>
                    </div>
                    <div style={{fontSize:16,color:"#cbd5e1"}}>→</div>
                    {postSnapT?(
                      <div style={{flex:1,background:"#f0fdf4",borderRadius:8,padding:"8px 12px",textAlign:"center",border:"1px solid #86efac"}}>
                        <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:2}}>Post-test</div>
                        <div style={{fontSize:16,fontWeight:800,color:postSnapT.passed_count>preSnapT.passed_count?"#16a34a":postSnapT.passed_count<preSnapT.passed_count?"#dc2626":"#475569"}}>
                          {postSnapT.passed_count}<span style={{fontSize:11,fontWeight:500}}>/{postSnapT.total_count}</span>
                        </div>
                        <div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>{new Date(postSnapT.taken_at).toLocaleDateString("en-AU",{day:"numeric",month:"short"})}</div>
                      </div>
                    ):(
                      <div style={{flex:1,background:"#fafafa",borderRadius:8,padding:"8px 12px",textAlign:"center",border:"1px solid #e2e8f0"}}>
                        <div style={{fontSize:10,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:2}}>Post-test</div>
                        <div style={{fontSize:12,color:"#cbd5e1",fontStyle:"italic",marginTop:4}}>Not taken yet</div>
                      </div>
                    )}
                    {postSnapT&&postSnapT.passed_count!==preSnapT.passed_count&&(
                      <div style={{fontSize:13,fontWeight:800,color:postSnapT.passed_count>preSnapT.passed_count?"#16a34a":"#dc2626",flexShrink:0}}>
                        {postSnapT.passed_count>preSnapT.passed_count?`+${postSnapT.passed_count-preSnapT.passed_count}`:postSnapT.passed_count-preSnapT.passed_count}
                      </div>
                    )}
                  </div>
                  {/* Per-outcome comparison table */}
                  {allPretestIds.length>0&&(
                    <div style={{borderTop:"1px solid #f1f5f9",paddingTop:10}}>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 32px 10px 32px",gap:"4px 6px",alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.04em"}}>Outcome</span>
                        <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase"}}>Pre</span>
                        <span/>
                        <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase"}}>Post</span>
                      </div>
                      {allPretestIds.map(id=>{
                        const section=activePretestData.find(sec=>sec.outcomeId===id);
                        const preO=preSnapT.by_outcome?.[id];
                        const postO=postSnapT?.by_outcome?.[id];
                        const preP=preO?.passed;
                        const postP=postO?.passed;
                        const improved=preP===false&&postP===true;
                        const regressed=preP===true&&postP===false;
                        return(
                          <div key={id} style={{display:"grid",gridTemplateColumns:"1fr 32px 10px 32px",gap:"4px 6px",alignItems:"center",padding:"4px 0",borderBottom:"1px solid #f8fafc"}}>
                            <span style={{fontSize:12,color:"#334155",lineHeight:1.3}}>{section?.short||id}</span>
                            <span style={{fontSize:13,fontWeight:700,textAlign:"center",color:preP?"#16a34a":"#dc2626"}}>{preP!==undefined?(preP?"✓":"✗"):"—"}</span>
                            <span style={{fontSize:9,color:"#cbd5e1",textAlign:"center"}}>→</span>
                            <span style={{fontSize:13,fontWeight:700,textAlign:"center",color:postP===undefined?"#cbd5e1":postP?"#16a34a":improved?"#dc2626":"#dc2626"}}>{postP!==undefined?(postP?"✓":"✗"):"–"}{improved?" ↑":regressed?" ↓":""}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {/* All sittings history */}
                  {unitSnapsForStudent.length>1&&(
                    <div style={{marginTop:10,borderTop:"1px solid #f1f5f9",paddingTop:8}}>
                      <p style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.04em",margin:"0 0 6px"}}>All sittings ({unitSnapsForStudent.length})</p>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        {unitSnapsForStudent.map((snap,i)=>(
                          <span key={i} style={{fontSize:11,padding:"3px 9px",borderRadius:5,background:i===0?"#f0f4ff":"#f0fdf4",color:i===0?"#4338ca":"#16a34a",border:`1px solid ${i===0?"#c7d2fe":"#86efac"}`,fontWeight:600}}>
                            {i===0?"Pre":"Post"} {i>1?i+1:""}: {snap.passed_count}/{snap.total_count} · {new Date(snap.taken_at).toLocaleDateString("en-AU",{day:"numeric",month:"short"})}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
          {["red","yellow","green"].filter(band=>selectedUnit.outcomes.some(o=>o.band===band)).map(band=>{
            const bs=BAND[band];
            return(<div key={band} style={{marginBottom:"1.25rem"}}>
              <span style={{display:"inline-block",background:bs.bg,color:bs.text,border:`1px solid ${bs.border}`,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:6,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>{band}</span>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {selectedUnit.outcomes.filter(o=>o.band===band).map(o=>{
                  const d=prog[`${selectedUnit.id}_${o.id}`];
                  const key=`${selectedUnit.id}_${o.id}`;
                  const n=(studentAttempts[key]||[]).length;
