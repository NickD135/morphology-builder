// ─── Visual question components ───────────────────────────────────────────────

function Frac({v,s=15,c="inherit"}){
  const p=String(v).split("/");
  if(p.length!==2)return <span style={{fontSize:s,color:c,fontWeight:700}}>{v}</span>;
  return <span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",lineHeight:1.1,verticalAlign:"middle",color:c}}>
    <span style={{fontSize:s,fontWeight:700,lineHeight:1}}>{p[0]}</span>
    <span style={{display:"block",height:1.5,background:"currentColor",width:"110%",margin:"1px 0"}}/>
    <span style={{fontSize:s,fontWeight:700,lineHeight:1}}>{p[1]}</span>
  </span>;
}

function useIsMobile(){ const [m,setM]=useState(()=>window.innerWidth<640); useEffect(()=>{const h=()=>setM(window.innerWidth<640);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);return m; }

function NumberLineQ({q,ans,setAns}){
  const lineRef=useRef(null);
  const [held,setHeld]=useState(null);
  const placed=ans.nlPlaced||{};
  const unplaced=q.tokens.filter(t=>placed[t]===undefined);

  function posFromEvent(e){
    const rect=lineRef.current.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.changedTouches?e.changedTouches[0].clientX:e.clientX;
    return Math.max(0.02,Math.min(0.97,(clientX-rect.left)/rect.width));
  }
  function pickUp(token){
    if(held===token){setHeld(null);return;}
    if(placed[token]!==undefined){const np={...placed};delete np[token];setAns(a=>({...a,nlPlaced:np}));}
    setHeld(token);
  }
  function placeToken(e){
    if(!held)return;
    e.preventDefault();
    const pos=posFromEvent(e);
    setAns(a=>({...a,nlPlaced:{...(a.nlPlaced||{}),[held]:pos}}));
    setHeld(null);
  }
  return(
    <div>
      <p style={{fontSize:13,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {held?<><strong style={{color:"#1e40af"}}>Tap the number line</strong> to place <strong style={{color:"#1e40af"}}>{held}</strong></>
          :"Tap a fraction to pick it up, then tap the number line to place it."}
      </p>
      <div style={{display:"flex",gap:10,marginBottom:28,flexWrap:"wrap",minHeight:52}}>
        {unplaced.map(t=>(
          <button key={t} onClick={()=>pickUp(t)} style={{padding:"10px 20px",background:held===t?"#1e40af":"#eff6ff",color:held===t?"#fff":"#1d4ed8",border:`2px solid ${held===t?"#1e40af":"#93c5fd"}`,borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:16,display:"flex",alignItems:"center",gap:4,minHeight:44,boxShadow:held===t?"0 2px 8px rgba(30,64,175,0.3)":"none",transform:held===t?"scale(1.05)":"scale(1)",transition:"all 0.15s"}}>
            <Frac v={t} s={14} c={held===t?"#fff":"#1d4ed8"}/>
          </button>
        ))}
        {unplaced.length===0&&<span style={{fontSize:13,color:"#94a3b8",alignSelf:"center"}}>All placed — tap a token to move it</span>}
      </div>
      <div style={{padding:"40px 20px 36px",cursor:held?"crosshair":"default",background:held?"#f0f9ff":"#f8fafc",borderRadius:12,border:`1.5px solid ${held?"#93c5fd":"#e2e8f0"}`,transition:"all 0.15s",touchAction:"none"}}
        onClick={placeToken} onTouchEnd={placeToken}>
        <div ref={lineRef} style={{position:"relative",height:4,background:"#334155",borderRadius:2}}>
          <div style={{position:"absolute",left:-8,top:-4,width:0,height:0,borderTop:"6px solid transparent",borderBottom:"6px solid transparent",borderRight:"10px solid #334155"}}/>
          <div style={{position:"absolute",right:-8,top:-4,width:0,height:0,borderTop:"6px solid transparent",borderBottom:"6px solid transparent",borderLeft:"10px solid #334155"}}/>
          {[0,0.25,0.5,0.75,1].map(p=>(
            <div key={p} style={{position:"absolute",left:`${p*100}%`,top:-6,transform:"translateX(-50%)",display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:2,height:16,background:"#334155"}}/>
              <span style={{marginTop:4,fontSize:11,fontWeight:600,color:"#475569"}}>{p===0?"0":p===1?"1":""}</span>
            </div>
          ))}
          {Object.entries(placed).map(([t,pos])=>(
            <div key={t} onClick={e=>{e.stopPropagation();pickUp(t);}}
              style={{position:"absolute",left:`${pos*100}%`,top:-42,transform:"translateX(-50%)",background:"#1e40af",color:"#fff",padding:"5px 12px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",zIndex:2,boxShadow:"0 2px 6px rgba(30,64,175,0.35)",display:"flex",alignItems:"center",minHeight:36}}>
              <Frac v={t} s={12} c="#fff"/>
              <div style={{position:"absolute",left:"50%",top:"100%",marginLeft:-1,width:2,height:22,background:"#1e40af"}}/>
            </div>
          ))}
        </div>
      </div>
      {Object.keys(placed).length>0&&<p style={{fontSize:11,color:"#94a3b8",margin:"8px 0 0",textAlign:"center"}}>Tap a placed fraction to move it</p>}
    </div>
  );
}

function MatchQ({q,ans,setAns}){
  const [selLeft,setSelLeft]=useState(null);
  const matched=ans.matchPairs||{};
  const matchedLeft=Object.keys(matched);
  const matchedRight=Object.values(matched);
  function clickLeft(item){
    if(matchedLeft.includes(item)){const nm={...matched};delete nm[item];setAns(a=>({...a,matchPairs:nm}));setSelLeft(item);return;}
    setSelLeft(selLeft===item?null:item);
  }
  function clickRight(item){
    if(matchedRight.includes(item)){const nm={...matched};const k=Object.keys(nm).find(k=>nm[k]===item);delete nm[k];setAns(a=>({...a,matchPairs:nm}));return;}
    if(!selLeft)return;
    setAns(a=>({...a,matchPairs:{...(a.matchPairs||{}),[selLeft]:item}}));
    setSelLeft(null);
  }
  const isCorrect=l=>matched[l]&&q.pairs[l]===matched[l];
  const card=(active,isM,ok)=>({padding:"10px 4px",borderRadius:10,fontWeight:700,fontSize:15,cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",minHeight:48,
    border:`2px solid ${isM?(ok?"#86efac":"#fca5a5"):active?"#3b82f6":"#e2e8f0"}`,
    background:isM?(ok?"#dcfce7":"#fee2e2"):active?"#eff6ff":"#f8fafc",
    color:isM?(ok?"#16a34a":"#dc2626"):active?"#1d4ed8":"#1e293b",transition:"all 0.15s"});
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {selLeft?<><strong style={{color:"#1e40af"}}>Now click the matching fraction</strong> on the right</>
          :"Click a fraction on the left, then click its equivalent on the right."}
      </p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 28px 1fr",gap:"8px 4px",alignItems:"center"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Fraction</div>
        <div/>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Equivalent</div>
        {q.left.map((l,i)=>{
          const r=q.right[i];
          const lM=matchedLeft.includes(l);
          const rMatchedTo=Object.keys(matched).find(k=>matched[k]===r);
          const rM=!!rMatchedTo;
          return[
            <button key={`l${l}`} onClick={()=>clickLeft(l)} style={card(selLeft===l,lM,isCorrect(l))}>
              <Frac v={l} s={13} c={lM?(isCorrect(l)?"#16a34a":"#dc2626"):selLeft===l?"#1d4ed8":"#1e293b"}/>
            </button>,
            <div key={`m${i}`} style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
              {lM&&<div style={{height:2,width:"100%",background:isCorrect(l)?"#86efac":"#fca5a5",borderRadius:1}}/>}
            </div>,
            <button key={`r${r}`} onClick={()=>clickRight(r)} style={card(false,rM,rMatchedTo?isCorrect(rMatchedTo):false)}>
              <Frac v={r} s={13} c={rM?(isCorrect(rMatchedTo)?"#16a34a":"#dc2626"):"#1e293b"}/>
            </button>
          ];
        })}
      </div>
      <p style={{fontSize:11,color:"#94a3b8",margin:"10px 0 0",textAlign:"center"}}>Click a matched pair to undo it</p>
    </div>
  );
}

function PartitionQ({q,ans,setAns}){
  const shaded=new Set(ans.partitionShaded||[]);
  function toggle(i){const ns=new Set(shaded);ns.has(i)?ns.delete(i):ns.add(i);setAns(a=>({...a,partitionShaded:[...ns]}));}
  const fracStr=`${q.target}/${q.parts}`;
  const statusColor=shaded.size===q.target?"#16a34a":shaded.size>q.target?"#dc2626":"#64748b";
  const statusMsg=shaded.size===q.target?`✓ ${fracStr} shaded`:shaded.size>q.target?"Too many — click to unshade":`${shaded.size}/${q.parts} shaded`;
  if(q.shape==="circle"){
    const sz=180,cx=90,cy=90,r=82;
    return(
      <div>
        <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
          Click the sections to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the circle.
        </p>
        <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>
          <svg width={sz} height={sz} style={{cursor:"pointer"}}>
            {Array.from({length:q.parts},(_,i)=>{
              const a1=(i/q.parts)*2*Math.PI-Math.PI/2,a2=((i+1)/q.parts)*2*Math.PI-Math.PI/2;
              const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
              const large=q.parts<3?1:0;
              return <path key={i} d={`M${cx},${cy} L${x1},${y1} A${r},${r},0,${large},1,${x2},${y2} Z`}
                fill={shaded.has(i)?"#1e40af":"#dbeafe"} stroke="#fff" strokeWidth={2}
                onClick={()=>toggle(i)} style={{transition:"fill 0.15s",cursor:"pointer"}}/>;
            })}
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#334155" strokeWidth={2}/>
          </svg>
        </div>
        <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
      </div>
    );
  }
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        Click the parts to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the bar.
      </p>
      <div style={{display:"flex",gap:3,marginBottom:8}}>
        {Array.from({length:q.parts},(_,i)=>(
          <div key={i} onClick={()=>toggle(i)}
            style={{flex:1,height:80,background:shaded.has(i)?"#1e40af":"#dbeafe",border:"2px solid #fff",borderRadius:4,cursor:"pointer",transition:"background 0.15s",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {shaded.has(i)&&<span style={{color:"rgba(255,255,255,0.5)",fontSize:20}}>✓</span>}
          </div>
        ))}
      </div>
      <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
    </div>
  );
}

  // ── Unit 25: Data ─────────────────────────────────────────────────────────
  { id:"u25", name:"Unit 25", subtitle:"Data", outcomes:[
    {id:"r1",band:"red",short:"Collect and tabulate data",label:"Collect categorical and numerical data through surveys and observation and tabulate it",questions:[
      {id:1,type:"mc",text:"A student wants to find out the favourite fruit of students in their class. What is the best way to collect this data?",options:["Survey","Observation","Experiment","Research"],answer:"Survey"},
      {id:2,type:"truefalse",text:"True or false: discrete numerical data can only take whole number values, like the number of siblings a student has.",answer:"true"},
      {id:3,type:"mc",text:"Which of these is an example of categorical data?",options:["Number of goals scored","Students' shoe sizes","Favourite colour","Number of books read"],answer:"Favourite colour"},
      {id:4,type:"input",text:"A survey of 28 students found: 10 chose football, 8 chose swimming, 6 chose tennis, and the rest chose basketball. How many chose basketball?",answer:"4"},
      {id:5,type:"truefalse",text:"True or false: a tally chart is a good way to record data as you collect it.",answer:"true"},
      {id:6,type:"mc",text:"Which method would you use to collect data about the number of birds visiting a garden each hour?",options:["Survey","Observation","Interview","Experiment"],answer:"Observation"},
      {id:7,type:"input",text:"A class of 30 students is surveyed about their pet. 9 have a dog, 7 have a cat, 5 have a fish, and the rest have no pet. How many have no pet?",answer:"9"},
      {id:8,type:"truefalse",text:"True or false: a spreadsheet is an appropriate tool for tabulating collected data.",answer:"true"},
      {id:9,type:"mc",text:"Which question collects nominal categorical data (named categories with no order)?",options:["How tall are you?","What is your favourite sport?","How many siblings do you have?","What is your age?"],answer:"What is your favourite sport?"},
      {id:10,type:"input",text:"A survey asks 25 students to choose their favourite season. 8 chose Summer, 5 chose Autumn, 7 chose Winter. How many chose Spring?",answer:"5"},
    ]},
    {id:"r2",band:"red",short:"Interpret side-by-side column graphs",label:"Interpret side-by-side column graphs for 2 categories",questions:[
      {id:1,type:"input",text:"A side-by-side graph shows: boys who chose cats=5, girls who chose cats=8. How many students altogether chose cats?",answer:"13"},
      {id:2,type:"truefalse",text:"True or false: in a side-by-side column graph, you can compare data from two groups at once.",answer:"true"},
      {id:3,type:"mc",text:"A graph shows: Year 5 fiction=12, non-fiction=6. Year 6 fiction=9, non-fiction=11. Which year group reads more non-fiction?",options:["Year 5","Year 6","They read the same","Cannot tell"],answer:"Year 6"},
      {id:4,type:"input",text:"A side-by-side graph shows: Monday — done:18, not done:4. Tuesday — done:15, not done:7. Across both days, how many did NOT do homework?",answer:"11"},
      {id:5,type:"truefalse",text:"True or false: the height of a bar in a column graph represents the frequency of that category.",answer:"true"},
      {id:6,type:"mc",text:"A graph shows pet preferences. Boys: dogs=8, cats=4. Girls: dogs=5, cats=9. Which pet is preferred more by girls?",options:["Dogs","Cats","They are equal","Cannot tell"],answer:"Cats"},
      {id:7,type:"input",text:"Book preferences: Year 5 adventure=10, mystery=6. Year 6 adventure=7, mystery=11. How many more Year 6 students prefer mystery than adventure?",answer:"4"},
      {id:8,type:"truefalse",text:"True or false: a side-by-side column graph always needs a key or legend to identify which bar belongs to which group.",answer:"true"},
      {id:9,type:"mc",text:"Sport participation: Class A cricket=8, soccer=14. Class B cricket=11, soccer=9. Which class has more cricket participants?",options:["Class A","Class B","They are equal","Cannot tell"],answer:"Class B"},
      {id:10,type:"mc",text:"What is the main advantage of a side-by-side column graph over two separate column graphs?",options:["It uses less space","It makes comparison between groups easier","It shows more types of data","It is more colourful"],answer:"It makes comparison between groups easier"},
    ]},
    {id:"r3",band:"red",short:"Interpret and draw timelines",label:"Interpret integers on a timeline and draw accurate timelines using an appropriate scale",questions:[
      {id:1,type:"mc",text:"A timeline shows events from 1850 to 1950. What is the total time span?",options:["50 years","75 years","100 years","150 years"],answer:"100 years"},
      {id:2,type:"truefalse",text:"True or false: on a timeline, events are placed in chronological order from left to right.",answer:"true"},

      {id:9,type:"mc",text:"Which is the most appropriate scale for a timeline showing events across a single school year?",options:["Every decade","Every year","Every month","Every century"],answer:"Every month"},
      {id:10,type:"input",text:"A timeline spans 5 years from 2010 to 2015 and is drawn 25 cm long. How many centimetres represent 1 year?",answer:"5"},

      {id:7,type:"truefalse",text:"True or false: a line graph should be used to compare two groups' preferences across categories.",answer:"false"},
      {id:8,type:"mc",text:"To display when important events in a person's life occurred, which is most appropriate?",options:["Column graph","Line graph","Timeline","Side-by-side column graph"],answer:"Timeline"},
      {id:9,type:"mc",text:"A teacher wants to display how a student's weekly test scores have changed. Which is best?",options:["Column graph","Line graph","Side-by-side column graph","Timeline"],answer:"Line graph"},
      {id:10,type:"truefalse",text:"True or false: you could appropriately use a line graph to display categorical data such as favourite foods.",answer:"false"},
    ]},
    {id:"r6",band:"red",short:"Determine appropriate scale",label:"Determine an appropriate scale to represent data and use many-to-one scales",questions:[
      {id:1,type:"mc",text:"Data values are 10, 20, 30, 40, 50. Which scale is most appropriate?",options:["By 1s","By 10s","By 100s","By 5s"],answer:"By 10s"},
      {id:2,type:"truefalse",text:"True or false: a many-to-one scale means each unit on the axis represents more than one data value.",answer:"true"},
      {id:3,type:"input",text:"A pictograph uses 1 symbol = 5 students. If 35 students chose football, how many symbols are drawn?",answer:"7"},
      {id:4,type:"mc",text:"Your highest data value is 75. Which scale goes up to at least 75 in sensible steps?",options:["0 to 50 by 10s","0 to 60 by 20s","0 to 80 by 10s","0 to 100 by 50s"],answer:"0 to 80 by 10s"},
      {id:5,type:"truefalse",text:"True or false: the scale on a column graph must always start at 0.",answer:"true"},
      {id:6,type:"mc",text:"A many-to-one scale has 1 picture = 10 students. A category shows 4 pictures. How many students?",options:["14","4","400","40"],answer:"40"},
      {id:7,type:"input",text:"Data values range from 0 to 30 counting by 5s. How many gridlines are needed from 0 to 30 inclusive?",answer:"7"},
      {id:8,type:"mc",text:"Which scale would work best for data with a maximum value of 95?",options:["0 to 80 by 20s","0 to 50 by 10s","0 to 90 by 5s","0 to 100 by 10s"],answer:"0 to 100 by 10s"},
      {id:9,type:"input",text:"A pictograph uses 1 symbol = 4 students. If 24 students chose science, how many symbols are drawn?",answer:"6"},
      {id:10,type:"truefalse",text:"True or false: if your data goes up to 200, a scale that only reaches 100 would be inappropriate.",answer:"true"},
    ]},
    {id:"y1",band:"yellow",short:"Identify bias in data",label:"Identify sources of possible bias in data collection and surveys",questions:[
      {id:1,type:"mc",text:"A survey asks: 'Don't you agree that homework should be banned?' What type of bias is this?",options:["Sampling bias","Observer bias","Leading question bias","No bias"],answer:"Leading question bias"},
      {id:2,type:"truefalse",text:"True or false: surveying only one class to represent the whole school can cause sampling bias.",answer:"true"},
      {id:3,type:"mc",text:"Which survey method gives the most representative result for the whole school?",options:["Ask 5 friends","Ask only Year 6","Ask students at the library","Randomly select 30 students from all year groups"],answer:"Randomly select 30 students from all year groups"},
      {id:4,type:"truefalse",text:"True or false: a very small sample size can make survey results unreliable.",answer:"true"},
      {id:5,type:"mc",text:"A soft drink company surveys shoppers in their own branded store. What bias might exist?",options:["The sample is too large","The questions are unclear","People there may already prefer that brand","There is no bias"],answer:"People there may already prefer that brand"},
      {id:6,type:"input",text:"A survey of 3 students is used to represent a school of 300. Is this a good sample size? Write yes or no.",answer:"no"},
      {id:7,type:"mc",text:"Which survey question is most likely to produce unbiased results?",options:["Don't you love sport?","Isn't reading better than TV?","Surely you prefer healthy food?","What do you enjoy most in your free time?"],answer:"What do you enjoy most in your free time?"},
      {id:8,type:"truefalse",text:"True or false: to reduce bias, a survey should include a variety of participants from different groups.",answer:"true"},
      {id:9,type:"mc",text:"A survey about school start times is only given to teachers. What problem does this create?",options:["Too many people are surveyed","The questions are too long","Only one group's perspective is represented","The scale is wrong"],answer:"Only one group's perspective is represented"},
      {id:10,type:"truefalse",text:"True or false: a biased survey always produces completely wrong results.",answer:"false"},
    ]},
    {id:"y2",band:"yellow",short:"Identify misleading representations",label:"Identify misleading representations of data in graphs and media",questions:[
      {id:1,type:"mc",text:"A graph's y-axis starts at 80 instead of 0. What effect does this have?",options:["It makes the graph more colourful","It has no effect","It makes the graph easier to read","Small differences appear much larger"],answer:"Small differences appear much larger"},
      {id:2,type:"truefalse",text:"True or false: starting a bar graph's y-axis at a number other than zero can be misleading.",answer:"true"},
      {id:3,type:"mc",text:"Graph A: y-axis 0–100. Graph B: same data, y-axis 90–100. Which makes the change look more dramatic?",options:["Graph A","They look the same","Graph B","Cannot tell"],answer:"Graph B"},
      {id:4,type:"truefalse",text:"True or false: a graph can be technically accurate yet still be misleading.",answer:"true"},
      {id:5,type:"mc",text:"Which feature of a graph is most important to check to avoid being misled?",options:["The colour","The size","The title","The scale and axis labels"],answer:"The scale and axis labels"},
      {id:6,type:"truefalse",text:"True or false: using pictures of different sizes to represent the same value in a pictograph is misleading.",answer:"true"},
      {id:7,type:"mc",text:"Sales went from 100 to 102. Headline: 'Sales skyrocket!' What makes this misleading?",options:["Wrong graph type","Sales actually decreased","Y-axis starts at 100, making a tiny increase look huge","The title is too short"],answer:"Y-axis starts at 100, making a tiny increase look huge"},
      {id:8,type:"mc",text:"Which of these would make a column graph misleading?",options:["Labelling all axes","Starting y-axis at 0","Making all bars the same width","Y-axis that jumps from 0 to 50 with no equal intervals"],answer:"Y-axis that jumps from 0 to 50 with no equal intervals"},
      {id:9,type:"truefalse",text:"True or false: graphs used in advertising always present data fairly and accurately.",answer:"false"},
      {id:10,type:"mc",text:"Why might a 3D pie chart be considered misleading?",options:["Too many colours","Too complicated","Some slices appear larger due to 3D perspective","Shows too much data"],answer:"Some slices appear larger due to 3D perspective"},
    ]},
    {id:"y3",band:"yellow",short:"Construct column graphs: many-to-one scale",label:"Construct column graphs using a many-to-one scale",questions:[
      {id:1,type:"mc",text:"Drawing a column graph for data: 20, 40, 60, 80, 100. Which scale is most appropriate?",options:["By 5s","By 1s","By 20s","By 100s"],answer:"By 20s"},
      {id:2,type:"input",text:"A column graph has a scale of 1 cm = 10 students. A category has 70 students. How tall (cm) should the bar be?",answer:"7"},
      {id:3,type:"truefalse",text:"True or false: when drawing a column graph, all bars should have equal width.",answer:"true"},
      {id:4,type:"mc",text:"Data goes up to 90 and you want no more than 10 intervals. Which works best?",options:["By 5s","By 2s","By 10s","By 20s"],answer:"By 10s"},
      {id:5,type:"input",text:"Scale goes 0–50 by 10s. A bar represents 35 students. Between which two gridlines does the bar end? Write the lower value.",answer:"30"},
      {id:6,type:"truefalse",text:"True or false: a column graph must always have a title and labelled axes.",answer:"true"},
      {id:7,type:"mc",text:"Which axis label placement is correct for a graph showing favourite sports?",options:["Number of students on x-axis, Sports on y-axis","Sports on y-axis, Number on x-axis","Sports on x-axis, Number of students on y-axis","No labels needed"],answer:"Sports on x-axis, Number of students on y-axis"},
      {id:8,type:"mc",text:"Scale goes 0–50 by 5s. How many gridlines from 0 to 50 inclusive?",options:["9","10","11","12"],answer:"11"},
      {id:9,type:"input",text:"A pictograph uses 1 symbol = 5 students. A category has 45 students. How many symbols?",answer:"9"},
      {id:10,type:"truefalse",text:"True or false: when using a many-to-one scale you must include a key explaining what each unit represents.",answer:"true"},
    ]},
    {id:"y4",band:"yellow",short:"Describe data: range, mode and shape",label:"Describe and interpret data by calculating range and mode and describing the shape of distribution",questions:[
      {id:1,type:"input",text:"Data: 3, 7, 5, 9, 5, 2, 8. What is the range?",answer:"7"},
      {id:2,type:"input",text:"Data: 4, 7, 4, 9, 4, 6, 2. What is the mode?",answer:"4"},
      {id:3,type:"mc",text:"A column graph shows the most frequent value is 5. What does this tell you?",options:["The mean is 5","The range is 5","The minimum is 5","The mode is 5"],answer:"The mode is 5"},
      {id:4,type:"input",text:"Data: 12, 15, 12, 18, 20, 12, 15. What is the range?",answer:"8"},
      {id:5,type:"truefalse",text:"True or false: a dataset can have more than one mode.",answer:"true"},
      {id:6,type:"mc",text:"Data: 3, 3, 4, 5, 6, 7, 7, 7, 9. What is the mode?",options:["3","5","7","9"],answer:"7"},
      {id:7,type:"input",text:"The range of a dataset is 15 and the lowest value is 8. What is the highest value?",answer:"23"},
      {id:8,type:"truefalse",text:"True or false: the range tells us how spread out the data is.",answer:"true"},
      {id:9,type:"mc",text:"Data: 2, 3, 5, 8, 10. What is the range?",options:["5","6","8","10"],answer:"8"},
      {id:10,type:"mc",text:"Data: 4, 4, 5, 6, 6, 6, 7, 8. What is the mode?",options:["4","5","6","7"],answer:"6"},
    ]},
    {id:"y5",band:"yellow",short:"Compare and interpret displays",label:"Interpret and compare different data displays describing range, mode and shape of distribution",questions:[
      {id:1,type:"mc",text:"Class A test scores range=20. Class B range=40. What does this tell us?",options:["Class A has higher scores","Class B has lower scores","Class B has more spread out results","Class A has more students"],answer:"Class B has more spread out results"},
      {id:2,type:"truefalse",text:"True or false: two datasets can have the same mode but different ranges.",answer:"true"},
      {id:3,type:"input",text:"Dataset A: 2,4,6,8,10. Dataset B: 1,4,7,10,13. Which has the larger range? Write A or B.",answer:"B"},
      {id:4,type:"truefalse",text:"True or false: comparing two displays allows you to identify similarities and differences between datasets.",answer:"true"},
      {id:5,type:"mc",text:"Class A: mode=75, range=20. Class B: mode=75, range=40. What can we conclude?",options:["Class B is more consistent","Both are equally consistent","Cannot tell","Class A is more consistent"],answer:"Class A is more consistent"},
      {id:6,type:"mc",text:"A dataset is described as 'clustered around 50'. What does this mean?",options:["All values equal 50","The minimum is 50","The range is 50","Most values are close to 50"],answer:"Most values are close to 50"},
      {id:7,type:"input",text:"Both classes have mode=7 for hours of sleep. Class A range=3, Class B range=6. Which is more consistent? Write A or B.",answer:"A"},
      {id:8,type:"truefalse",text:"True or false: a larger range always means the data is unreliable.",answer:"false"},
      {id:9,type:"mc",text:"Graph A: most students scored 70–80. Graph B: scores spread 20–100. Which class had more consistent results?",options:["Class in Graph B","Equally consistent","Cannot tell","Class in Graph A"],answer:"Class in Graph A"},
      {id:10,type:"mc",text:"What does an 'outlier' in a dataset mean?",options:["A value that appears most often","The average value","The middle value","A value far from the rest of the data"],answer:"A value far from the rest of the data"},
    ]},
    {id:"g1",band:"green",short:"Calculate and use the mean",label:"Calculate the mean of a dataset and use mean, median, mode and range together to describe and compare data",questions:[
      {id:1,type:"input",text:"Data: 4, 7, 3, 8, 3. What is the mean?",answer:"5"},
      {id:2,type:"input",text:"Data: 10, 14, 12, 16, 8. What is the mean?",answer:"12"},
      {id:3,type:"mc",text:"Which measure tells you the most common value in a dataset?",options:["Mean","Median","Mode","Range"],answer:"Mode"},
      {id:4,type:"truefalse",text:"True or false: the mean is calculated by adding all values and dividing by how many values there are.",answer:"true"},
      {id:5,type:"input",text:"Five students scored: 60, 70, 80, 90, 100. What is the mean score?",answer:"80"},
      {id:6,type:"mc",text:"A class has a mean score of 75 and a range of 40. Another class has mean 75 and range 10. Which class is more consistent?",options:["Class with range 40","They are equally consistent","Cannot tell","Class with range 10"],answer:"Class with range 10"},
      {id:7,type:"truefalse",text:"True or false: the mean, median, mode and range together give a more complete picture of a dataset than any single measure alone.",answer:"true"},
      {id:8,type:"input",text:"Data: 3, 5, 7, 9, 11. The mean = 7. True or false: the mean equals the median here. Write true or false.",answer:"true"},
      {id:9,type:"mc",text:"Data: 2, 4, 4, 6, 9. What is the mean?",options:["4","5","4.5","6"],answer:"5"},
      {id:10,type:"input",text:"The mean of 4 numbers is 8. Three of the numbers are 6, 9, and 7. What is the fourth number?",answer:"10"},
    ]},
    {id:"g2",band:"green",short:"Effect of outliers",label:"Identify outliers and describe their effect on the mean, median, mode and range of a dataset",questions:[
      {id:1,type:"mc",text:"Data: 5, 6, 7, 6, 5, 50. Which value is an outlier?",options:["5","6","7","50"],answer:"50"},
      {id:2,type:"truefalse",text:"True or false: removing an outlier will always change the mean.",answer:"true"},
      {id:3,type:"mc",text:"Data: 10, 11, 12, 11, 10, 100. Which measure is most affected by the outlier 100?",options:["Mode","Median","Mean","None are affected"],answer:"Mean"},
      {id:4,type:"input",text:"Data: 3, 4, 4, 5, 5, 40. Without the outlier (40), the mean of the remaining 5 values is: (3+4+4+5+5)/5 = ?",answer:"4.2",aliases:["4.20"]},
      {id:5,type:"truefalse",text:"True or false: an outlier has a large effect on the range of a dataset.",answer:"true"},
      {id:6,type:"mc",text:"Data: 8, 9, 9, 10, 8, 2. The outlier is 2. If it is removed, the range changes from:",options:["8 to 2","8 to 3","2 to 8","Cannot tell"],answer:"8 to 2"},
      {id:7,type:"mc",text:"Which measure is least affected by a single outlier in a large dataset?",options:["Mean","Range","Median","None"],answer:"Median"},
      {id:8,type:"truefalse",text:"True or false: the mode is not affected by an outlier unless the outlier appears most frequently.",answer:"true"},
      {id:9,type:"input",text:"Data: 5, 6, 6, 7, 7, 30. The range = 25. If the outlier is removed, what is the new range?",answer:"2"},
      {id:10,type:"mc",text:"A student scores 95, 90, 88, 92, 10. The score of 10 is an outlier. What should the student do when reporting their 'typical' performance?",options:["Always include the outlier","Report the mean including 10","Report the mean without 10 and explain why","Ignore all results"],answer:"Report the mean without 10 and explain why"},
    ]},
    {id:"g3",band:"green",short:"Dot plots and stem-and-leaf plots",label:"Construct and interpret dot plots and stem-and-leaf plots to display and compare data",questions:[
      {id:1,type:"mc",text:"A stem-and-leaf plot shows stem 3 with leaves 2, 5, 8. What values does this represent?",options:["3, 2, 5, 8","32, 53, 83","32, 35, 38","23, 53, 83"],answer:"32, 35, 38"},
      {id:2,type:"input",text:"A dot plot shows: 3 dots above 4, 2 dots above 5, 1 dot above 6. How many data values are there in total?",answer:"6"},
      {id:3,type:"truefalse",text:"True or false: a stem-and-leaf plot preserves every individual data value.",answer:"true"},
      {id:4,type:"mc",text:"A stem-and-leaf plot has stem 2 with leaves 1, 4, 7, 7. What is the mode?",options:["21","24","27","47"],answer:"27"},
      {id:5,type:"truefalse",text:"True or false: a dot plot is a type of number line with dots stacked above each value to show frequency.",answer:"true"},
      {id:6,type:"input",text:"A stem-and-leaf plot: Stem 1: leaves 2,5. Stem 2: leaves 0,3,8. Stem 3: leaves 1. What is the range?",answer:"19"},
      {id:7,type:"mc",text:"What is the main advantage of a stem-and-leaf plot over a column graph?",options:["It looks nicer","It shows every individual data value","It is easier to draw","It uses less space"],answer:"It shows every individual data value"},
      {id:8,type:"input",text:"A dot plot shows scores: 5, 5, 6, 7, 7, 7, 8. What is the mode?",answer:"7"},
      {id:9,type:"truefalse",text:"True or false: back-to-back stem-and-leaf plots are useful for comparing two datasets.",answer:"true"},
      {id:10,type:"mc",text:"A back-to-back stem-and-leaf plot shows Group A leaves: 3,5,8 and Group B leaves: 1,2,6 for stem 4. Which group has more values above 45?",options:["Group A","Group B","They are equal","Cannot tell"],answer:"Group A"},
    ]},
    {id:"g4",band:"green",short:"Evaluate statistical claims",label:"Critically evaluate statistical claims and reports in the media, identifying possible bias and misleading representations",questions:[
      {id:1,type:"mc",text:"A report says '9 out of 10 dentists prefer Brand X'. What should you question?",options:["Nothing — 9/10 is impressive","Who funded the study?","What is Brand X?","How many dentists there are"],answer:"Who funded the study?"},
      {id:2,type:"truefalse",text:"True or false: a study with a sample size of 10 can reliably represent the opinion of 10 million people.",answer:"false"},
      {id:3,type:"mc",text:"A graph shows sales increased by 5%. The y-axis starts at 95. What is misleading?",options:["The title is wrong","The increase looks much larger than it really is","The scale is correct","The colours are wrong"],answer:"The increase looks much larger than it really is"},
      {id:4,type:"mc",text:"A headline reads: 'Screen time causes poor grades.' A study found students with more screen time had slightly lower grades. What is a problem with the headline?",options:["It is too short","It confuses correlation with causation","The study must be wrong","There is no problem"],answer:"It confuses correlation with causation"},
      {id:5,type:"truefalse",text:"True or false: two things happening at the same time (correlation) does not necessarily mean one causes the other (causation).",answer:"true"},
      {id:6,type:"mc",text:"A survey of 1000 people claims '70% prefer Product A'. The survey was funded by the makers of Product A. What type of bias might exist?",options:["No bias — 1000 is a large sample","Sampling bias from funding influence","The question was too hard","The results must be correct"],answer:"Sampling bias from funding influence"},
      {id:7,type:"input",text:"A report says '1 in 3 students struggles with reading'. 3 students were surveyed. Is this a reliable sample? Write yes or no.",answer:"no"},
      {id:8,type:"truefalse",text:"True or false: when evaluating a statistical claim, you should always consider who conducted the study and why.",answer:"true"},
      {id:9,type:"mc",text:"A newspaper claims crime 'skyrocketed' based on a graph where the y-axis starts at 98 instead of 0 and crime went from 99 to 101. What is the best description?",options:["The graph is accurate and fair","The y-axis manipulation makes a tiny increase look dramatic","Crime genuinely skyrocketed","There is not enough information"],answer:"The y-axis manipulation makes a tiny increase look dramatic"},
      {id:10,type:"mc",text:"Which of the following would most improve the reliability of a statistical study?",options:["Funding from a company that benefits from the results","A very small sample size","A large, randomly selected, representative sample","Only surveying people who agree with the hypothesis"],answer:"A large, randomly selected, representative sample"},
    ]},
  ]},

  // ── Unit 26: Representing Numbers & Decimals ──────────────────────────────
  { id:"u26", name:"Unit 26", subtitle:"Representing Numbers & Decimals", outcomes:[
    {id:"r1",band:"red",short:"Round numbers",label:"Round numbers to a specified place value",questions:[
      {id:1,type:"input",text:"Round 3,847 to the nearest hundred.",answer:"3800"},
      {id:2,type:"mc",text:"What is 56,423 rounded to the nearest thousand?",options:["55,000","56,000","56,400","57,000"],answer:"56,000"},
      {id:3,type:"input",text:"Round 7.6 to the nearest whole number.",answer:"8"},
      {id:4,type:"mc",text:"What is 4.35 rounded to the nearest tenth?",options:["4.3","4","4.4","5"],answer:"4.4"},
      {id:5,type:"truefalse",text:"True or false: 6,500 rounded to the nearest thousand is 7,000.",answer:"true"},
      {id:6,type:"input",text:"Round 234,567 to the nearest ten thousand.",answer:"230000"},
      {id:7,type:"mc",text:"What is 0.847 rounded to the nearest hundredth?",options:["0.8","0.84","0.85","0.9"],answer:"0.85"},
      {id:8,type:"truefalse",text:"True or false: 3.145 rounded to 2 decimal places is 3.15.",answer:"true"},
      {id:9,type:"input",text:"Round 1,350,000 to the nearest million.",answer:"1000000"},
      {id:10,type:"mc",text:"A number rounded to the nearest ten is 380. Which could be the original number?",options:["371","374","384","391"],answer:"384"},
    ]},
    {id:"r2",band:"red",short:"Millions and billions",label:"Recognise 1000 thousands = 1 million and 1000 millions = 1 billion, and partition large numbers",questions:[
      {id:1,type:"mc",text:"How many thousands are in one million?",options:["100","10,000","100,000","1,000"],answer:"1,000"},
      {id:2,type:"input",text:"Write the number: two million, four hundred thousand, six hundred and fifty.",answer:"2400650"},
      {id:3,type:"mc",text:"How many millions are in one billion?",options:["10","100","10,000","1,000"],answer:"1,000"},
      {id:4,type:"truefalse",text:"True or false: 1,000 thousands = 1 million.",answer:"true"},
      {id:5,type:"mc",text:"What is the value of the digit 7 in 7,432,000?",options:["7 thousand","70,000","700,000","7 million"],answer:"7 million"},
      {id:6,type:"truefalse",text:"True or false: 1,000 millions = 1 billion.",answer:"true"},
      {id:7,type:"input",text:"Write: 5 millions + 4 hundred thousands + 3 ten thousands + 2 thousands + 1 hundred + 6 tens + 7 ones.",answer:"5432167"},
      {id:8,type:"mc",text:"Which is the correct way to write six billion, three hundred million?",options:["6,003,000,000","6,300,000","6,030,000,000","6,300,000,000"],answer:"6,300,000,000"},
      {id:9,type:"input",text:"In the number 8,245,673,000 — what digit is in the billions place?",answer:"8"},
      {id:10,type:"mc",text:"Which number equals 3 millions + 5 hundreds?",options:["3,500","3,005,000","3,000,005","3,000,500"],answer:"3,000,500"},
    ]},
    {id:"r3",band:"red",short:"Decimal place value: thousandths",label:"Interpret decimal notation for thousandths and describe place value of digits up to 3 decimal places",questions:[
      {id:1,type:"mc",text:"What is the value of the digit 5 in 3.125?",options:["5 tenths","5 ones","5 hundredths","5 thousandths"],answer:"5 thousandths"},
      {id:2,type:"input",text:"Write 4 ones, 3 tenths, 7 hundredths and 2 thousandths as a decimal.",answer:"4.372"},
      {id:3,type:"mc",text:"What is the place value of the digit 8 in 0.085?",options:["8 tenths","8 thousandths","8 hundredths","8 ones"],answer:"8 hundredths"},
      {id:4,type:"truefalse",text:"True or false: in the number 2.307, the digit 0 is in the hundredths place.",answer:"true"},
      {id:5,type:"input",text:"Write 7 thousandths as a decimal.",answer:"0.007"},
      {id:6,type:"mc",text:"Which decimal has the digit 4 in the thousandths place?",options:["4.100","0.400","0.040","0.004"],answer:"0.004"},
      {id:7,type:"truefalse",text:"True or false: in 3.250, the digit 5 is in the hundredths place.",answer:"true"},
      {id:8,type:"input",text:"What is 2 tenths + 4 hundredths + 6 thousandths as a decimal?",answer:"0.246"},
      {id:9,type:"mc",text:"In the number 5.923, which digit is in the hundredths place?",options:["9","5","3","2"],answer:"2"},
      {id:10,type:"mc",text:"What is 0.045 equal to?",options:["4 tenths + 5 hundredths","4 hundredths + 5 tenths","45 hundredths","45 thousandths"],answer:"45 thousandths"},
    ]},
    {id:"r4",band:"red",short:"Compare and order decimals",label:"Compare and order decimal numbers of up to 3 decimal places",questions:[
      {id:1,type:"order",text:"Click from smallest to largest.",items:["0.3","0.25","0.305","0.03"],answer:["0.03","0.25","0.3","0.305"]},
      {id:2,type:"mc",text:"Which is larger: 0.5 or 0.49?",options:["0.49","They are equal","0.5"],answer:"0.5"},
      {id:3,type:"truefalse",text:"True or false: 0.70 is greater than 0.7.",answer:"false"},
      {id:4,type:"mc",text:"Which decimal is between 0.4 and 0.5?",options:["0.35","0.39","0.51","0.45"],answer:"0.45"},
      {id:5,type:"truefalse",text:"True or false: 0.9 is greater than 0.89.",answer:"true"},
      {id:6,type:"order",text:"Click from largest to smallest.",items:["2.1","2.01","2.15","2.105"],answer:["2.15","2.105","2.1","2.01"]},
      {id:7,type:"mc",text:"Which of these is the greatest?",options:["3.009","3.09","3.099","3.1"],answer:"3.1"},
      {id:8,type:"truefalse",text:"True or false: 4.250 = 4.25.",answer:"true"},
      {id:9,type:"input",text:"What decimal comes exactly halfway between 0.6 and 0.8?",answer:"0.7"},
      {id:10,type:"mc",text:"Which is the correct order from smallest to largest: 1.2, 0.12, 1.02?",options:["1.2, 1.02, 0.12","0.12, 1.2, 1.02","1.02, 0.12, 1.2","0.12, 1.02, 1.2"],answer:"0.12, 1.02, 1.2"},
    ]},
    {id:"r5",band:"red",short:"Trailing zeros and number lines",label:"Interpret that trailing zeros do not change a decimal's value, and place decimals on a number line",questions:[
      {id:1,type:"truefalse",text:"True or false: 3.40 and 3.4 represent the same value.",answer:"true"},
      {id:2,type:"mc",text:"Which of these are equal to 5.6?",options:["5.06 only","5.600 only","5.60 only","Both 5.60 and 5.600"],answer:"Both 5.60 and 5.600"},

      "Mixed numbers: 1 3/4 = 1.75 — sits between 1 and 2.",
      "Negative fractions: −1/2 is to the LEFT of 0, to the right of −1.",
      "Order: −1 < −1/2 < 0 < 1/4 < 1/2 < 1 < 1 3/4",

    questions:[
      {type:"mc",text:"Where does 1 1/2 sit on a number line?",options:["Between 0 and 1","Between 1 and 2","Between 2 and 3","At 2"],answer:"Between 1 and 2"},
      {type:"truefalse",text:"True or false: −3/4 is greater than −1.",answer:"true"},
      {type:"mc",text:"Which order is correct?",options:["−1/2, −1, 0, 1/2","0, −1/2, −1, 1/2","−1, −1/2, 0, 1/2","1/2, 0, −1/2, −1"],answer:"−1, −1/2, 0, 1/2"},
      {type:"input",text:"Write 7/4 as a mixed number (e.g. 1 3/4).",answer:"1 3/4"},
      {type:"input",text:"Write 9/4 as a mixed number.",answer:"2 1/4"},
      {type:"mc",text:"Which is the greatest value?",options:["1.3","1 1/4","1.35","5/4"],answer:"1.35"},

      {type:"mc",text:"Between which two integers does 2 3/4 sit?",options:["1 and 2","2 and 3","3 and 4","0 and 1"],answer:"2 and 3"},

  u24_g3:{
    example:[
      "Convert everything to decimals to compare easily.",
      "3/4 = 0.75 &nbsp; 70% = 0.70 &nbsp; 0.72",
      "Order: 0.70 < 0.72 < 0.75, so 70% < 0.72 < 3/4",
      "Useful: 1/2 = 0.5 = 50%, &nbsp; 1/4 = 0.25 = 25%, &nbsp; 1/5 = 0.2 = 20%",
    ],
    questions:[
      {type:"mc",text:"Which is the largest?",options:["3/5","0.55","58%","3/5 and 58% are equal"],answer:"3/5"},
      {type:"input",text:"Write 3/4 as a percentage.",answer:"75%",aliases:["75"]},
      {type:"input",text:"Write 0.6 as a fraction in its simplest form.",answer:"3/5"},
      {type:"mc",text:"Which is the correct order from smallest to largest: 0.5, 45%, 1/2, 0.55?",options:["45%, 0.5, 1/2, 0.55","0.5, 45%, 1/2, 0.55","45%, 1/2, 0.5, 0.55","0.5, 0.55, 45%, 1/2"],answer:"45%, 0.5, 1/2, 0.55"},
      {type:"truefalse",text:"True or false: 0.4 is the same as 40%.",answer:"true"},
      {type:"input",text:"Write 2/5 as a decimal.",answer:"0.4"},
      {type:"mc",text:"Which is the smallest?",options:["3/4","0.8","72%","They are equal"],answer:"72%"},
      {type:"truefalse",text:"True or false: 1/4 = 25%.",answer:"true"},
      {type:"mc",text:"Which set is correctly ordered from smallest to largest?",options:["0.3, 25%, 1/3, 0.4","25%, 0.3, 1/3, 0.4","0.4, 1/3, 0.3, 25%","1/3, 0.3, 25%, 0.4"],answer:"25%, 0.3, 1/3, 0.4"},
    ]},
  u24_g4:{
    example:[
      "Find the Lowest Common Denominator (LCD) before adding or subtracting.",
      "1/3 + 1/4: LCD of 3 and 4 = 12.",
      "1/3 = 4/12 &nbsp; 1/4 = 3/12 &nbsp;→&nbsp; 4/12 + 3/12 = 7/12",
      "3/4 − 2/3: LCD = 12 &nbsp;→&nbsp; 9/12 − 8/12 = 1/12",
    ],
    questions:[
      {type:"input",text:"1/2 + 1/3 = (LCD = 6)",answer:"5/6"},
      {type:"input",text:"1/2 + 1/5 = (LCD = 10)",answer:"7/10"},
      {type:"input",text:"3/4 − 1/3 = (LCD = 12)",answer:"5/12"},
      {type:"mc",text:"What is the LCD of 1/3 and 1/4?",options:["7","8","12","6"],answer:"12"},
      {type:"input",text:"2/3 + 1/4 = (LCD = 12)",answer:"11/12"},
      {type:"truefalse",text:"True or false: 1/3 + 1/4 = 7/12.",answer:"true"},
      {type:"input",text:"5/6 − 1/4 = (LCD = 12)",answer:"7/12"},
      {type:"mc",text:"What is 1/2 + 2/5?",options:["3/7","9/10","7/10","3/5"],answer:"9/10"},
      {type:"truefalse",text:"True or false: 1/2 − 1/3 = 1/6.",answer:"true"},
    ]},
  u24_g5:{
    example:[
      "Add or subtract whole numbers and fractions separately, then combine.",
      "1 1/2 + 2 1/3: &nbsp; Whole: 1 + 2 = 3. &nbsp; Fractions: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.",
      "Answer: 3 5/6",
      "For subtraction, regroup if needed: 3 1/4 − 1 3/4 → borrow 1 whole → 2 5/4 − 1 3/4 = 1 2/4 = 1 1/2",
    ],
    questions:[
      {type:"input",text:"1 1/2 + 1 1/4 =",answer:"2 3/4"},
      {type:"input",text:"2 1/3 + 1 1/6 =",answer:"3 1/2"},
      {type:"input",text:"3 3/4 − 1 1/4 =",answer:"2 1/2",aliases:["2 2/4"]},
      {type:"mc",text:"What is 2 1/2 + 1 1/4?",options:["3 3/4","3 1/2","3 1/4","4"],answer:"3 3/4"},
      {type:"input",text:"4 1/2 − 1 3/4 =",answer:"2 3/4"},
      {type:"truefalse",text:"True or false: 1 1/3 + 2 2/3 = 4.",answer:"true"},
      {type:"input",text:"2 2/3 + 1 3/4 =",answer:"4 5/12"},
      {type:"mc",text:"What is 3 1/2 − 1 2/3?",options:["1 5/6","2 1/6","1 2/3","2 5/6"],answer:"1 5/6"},
      {type:"truefalse",text:"True or false: 2 1/4 + 1 3/4 = 4.",answer:"true"},
    ]},

  // ─── Unit 25: Data ──────────────────────────────────────────────────────────
  u25_r1:{
    example:[
      "Data can be categorical (e.g. favourite colour) or numerical (e.g. number of goals scored).",
      "Surveys collect opinions or preferences. Observations collect data by watching and counting.",
      "A tally chart records data as you collect it: IIII = 4, IIII I = 5",
      "A class of 30 is surveyed: 12 chose dogs, 8 chose cats, 6 chose fish, and the rest chose birds.",
      "Birds = 30 - 12 - 8 - 6 = 4 students",
    ],
    questions:[
      {type:"mc",text:"Which is an example of categorical data?",options:["Number of goals scored","Height in centimetres","Favourite subject","Number of siblings"],answer:"Favourite subject"},
      {type:"truefalse",text:"True or false: observation is used to collect data by watching and counting events.",answer:"true"},
      {type:"mc",text:"A student wants to find out how many cars pass the school each hour. Which method is best?",options:["Survey","Observation","Interview","Research"],answer:"Observation"},
      {type:"input",text:"25 students were surveyed: 8 chose summer, 7 chose winter, 6 chose autumn. How many chose spring?",answer:"4"},
      {type:"truefalse",text:"True or false: the number of siblings a student has is an example of discrete numerical data.",answer:"true"},
      {type:"mc",text:"A tally chart shows IIII IIII I for football. How many students chose football?",options:["9","10","11","8"],answer:"11"},
      {type:"input",text:"A class of 32 was surveyed about pets: 10 dogs, 8 cats, 5 fish. How many chose other or none?",answer:"9"},
      {type:"truefalse",text:"True or false: 'What is your favourite sport?' collects categorical data.",answer:"true"},
      {type:"mc",text:"Which question collects numerical data?",options:["What sport do you play?","What is your favourite colour?","How many books did you read this week?","What is your pet?"],answer:"How many books did you read this week?"},
    ]},
  u25_r2:{
    example:[
      "A side-by-side column graph compares two groups across the same categories.",
      "Always check the key/legend to know which bar belongs to which group.",
      "Example: Boys who prefer dogs = 8, Girls who prefer dogs = 5. Total = 13.",
      "To find 'how many more', subtract: 8 - 5 = 3 more boys than girls prefer dogs.",
    ],
    questions:[
      {type:"truefalse",text:"True or false: a side-by-side column graph can compare two groups at once.",answer:"true"},
      {type:"input",text:"A graph shows: Class A chose fiction = 9, Class B chose fiction = 14. How many chose fiction altogether?",answer:"23"},
      {type:"mc",text:"A graph shows sport preferences. Boys: cricket=10, soccer=6. Girls: cricket=5, soccer=9. Which sport is preferred more by girls?",options:["Cricket","Soccer","They are equal","Cannot tell"],answer:"Soccer"},
      {type:"input",text:"Year 5: adventure=12, mystery=7. Year 6: adventure=8, mystery=13. How many more Year 6 students prefer mystery than adventure?",answer:"5"},
      {type:"truefalse",text:"True or false: you need a key or legend to read a side-by-side column graph.",answer:"true"},
      {type:"mc",text:"What does the height of a bar in a column graph represent?",options:["The category name","The frequency of that category","The number of groups","The scale interval"],answer:"The frequency of that category"},
      {type:"input",text:"Monday: homework done=18, not done=5. Tuesday: done=16, not done=7. How many students did NOT do homework across both days?",answer:"12"},
      {type:"mc",text:"What is the main purpose of a side-by-side column graph?",options:["Show change over time","Compare two groups across categories","Show parts of a whole","Display one group only"],answer:"Compare two groups across categories"},
      {type:"truefalse",text:"True or false: in a side-by-side column graph, bars for the same category are placed next to each other.",answer:"true"},
    ]},
  u25_r3:{
    example:[
      "A timeline shows events in chronological order from left to right.",
      "The scale must use equal intervals — e.g. every 10 years, every month.",
      "To find a time span: subtract the earlier date from the later date.",
      "Example: A timeline from 1920 to 2000 spans 80 years.",
      "Scale: 80 years drawn 40 cm long = 1 cm per 2 years.",
    ],
    questions:[
      {type:"mc",text:"A timeline runs from 1850 to 1950. What is the total time span?",options:["50 years","75 years","100 years","150 years"],answer:"100 years"},
      {type:"truefalse",text:"True or false: events on a timeline are placed in chronological order from left to right.",answer:"true"},
      {type:"input",text:"A timeline from 1900 to 2000 has a mark every 10 years. How many marks are there, including start and end?",answer:"11"},
      {type:"mc",text:"A timeline spans 6 years and is drawn 30 cm long. How many centimetres represent 1 year?",options:["4 cm","5 cm","6 cm","3 cm"],answer:"5 cm"},
      {type:"truefalse",text:"True or false: negative numbers on a timeline can represent events before a reference point.",answer:"true"},
      {type:"mc",text:"An event happened in 1975. A timeline runs 1950–2000 with marks every 10 years. Between which marks does it sit?",options:["1960 and 1970","1970 and 1980","1980 and 1990","1950 and 1960"],answer:"1970 and 1980"},
      {type:"input",text:"A timeline spans 4 years from 2010 to 2014 and is drawn 20 cm long. How many cm represent 1 year?",answer:"5"},
      {type:"mc",text:"Which scale suits a timeline showing events across one school year?",options:["Every decade","Every century","Every year","Every month"],answer:"Every month"},
      {type:"truefalse",text:"True or false: all intervals on a timeline must be equal.",answer:"true"},
    ]},
  u25_r4:{
    example:[
      "A line graph shows how data changes over time. Read values from the y-axis at each point.",
      "A rising line = increase. A falling line = decrease. A flat line = no change.",
      "Range = highest value − lowest value.",
      "Example: Temperatures Mon=20, Tue=24, Wed=28, Thu=25, Fri=27.",
      "Range = 28 − 20 = 8. The temperature decreased on Thursday.",
    ],
    questions:[
      {type:"truefalse",text:"True or false: a line graph is best used to show how data changes over time.",answer:"true"},
      {type:"mc",text:"A line graph shows: Mon=22, Tue=25, Wed=28, Thu=24. On which day did the temperature decrease?",options:["Tuesday","Wednesday","Thursday","Monday"],answer:"Thursday"},
      {type:"input",text:"A line graph shows: Jan=40, Feb=30, Mar=55, Apr=65. What is the range?",answer:"35"},
      {type:"truefalse",text:"True or false: a flat horizontal line on a line graph means the value stayed the same.",answer:"true"},
      {type:"mc",text:"What does a steeper line on a line graph indicate?",options:["A smaller change","No change","A greater rate of change","The data has ended"],answer:"A greater rate of change"},
      {type:"input",text:"Reading time (min): Mon=30, Tue=45, Wed=45, Thu=60, Fri=30. What is the mode?",answer:"45"},
      {type:"mc",text:"Test scores over 5 weeks: 55, 60, 65, 63, 70. What is the overall trend?",options:["Decreasing","Increasing","No change","Random"],answer:"Increasing"},
      {type:"truefalse",text:"True or false: a line graph is appropriate for displaying students' favourite colours.",answer:"false"},
      {type:"mc",text:"Rainfall (mm): Apr=50, May=35, Jun=70, Jul=80. What was the total rainfall?",options:["225","220","235","215"],answer:"235"},
    ]},
  u25_r5:{
    example:[
      "Match the display type to the data type:",
      "Line graph → change over time (e.g. temperature each day)",
      "Column graph → comparing categories (e.g. favourite subjects)",
      "Side-by-side column graph → comparing two groups across categories",
      "Timeline → events in chronological order",
    ],
    questions:[
      {type:"mc",text:"Which display best shows how temperature changes each day over a month?",options:["Column graph","Side-by-side column graph","Timeline","Line graph"],answer:"Line graph"},
      {type:"mc",text:"Which display best compares the favourite sports of boys and girls?",options:["Line graph","Timeline","Side-by-side column graph","Tally chart"],answer:"Side-by-side column graph"},
      {type:"truefalse",text:"True or false: a timeline is the best display for showing historical events in order.",answer:"true"},
      {type:"mc",text:"A teacher wants to show the results of a class survey about favourite foods. Which is best?",options:["Line graph","Timeline","Column graph","Scatter plot"],answer:"Column graph"},
      {type:"truefalse",text:"True or false: a line graph is appropriate for comparing two groups' favourite sports.",answer:"false"},
      {type:"mc",text:"To show when important events in someone's life occurred, which is most appropriate?",options:["Column graph","Line graph","Side-by-side column graph","Timeline"],answer:"Timeline"},
      {type:"truefalse",text:"True or false: a column graph is appropriate for displaying categorical data.",answer:"true"},
      {type:"mc",text:"Weekly sales figures for 6 months would best be shown using a:",options:["Timeline","Column graph","Side-by-side column graph","Line graph"],answer:"Line graph"},
      {type:"mc",text:"Which display would NOT be appropriate for showing data that changes over time?",options:["Line graph","Column graph showing monthly totals","Timeline of events","Side-by-side column graph comparing two groups by sport"],answer:"Side-by-side column graph comparing two groups by sport"},
    ]},
  u25_r6:{
    example:[
      "Choose a scale that fits all your data and is easy to read.",
      "Many-to-one scale: each unit on the axis represents more than 1 value.",
      "Example: data values are 10, 20, 30, 40. Scale by 10s works well.",
      "Pictograph: 1 symbol = 5 students. 35 students = 7 symbols.",
      "Scale must always start at 0 on a column graph.",
    ],
    questions:[
      {type:"mc",text:"Data values: 15, 25, 35, 50. Which scale is most appropriate?",options:["By 1s","By 100s","By 10s","By 2s"],answer:"By 10s"},
      {type:"truefalse",text:"True or false: a many-to-one scale means each unit represents more than one data value.",answer:"true"},
      {type:"input",text:"A pictograph uses 1 symbol = 4 students. 32 students chose maths. How many symbols?",answer:"8"},
      {type:"mc",text:"Your maximum data value is 85. Which scale is most appropriate?",options:["0–50 by 10s","0–80 by 20s","0–90 by 10s","0–100 by 50s"],answer:"0–90 by 10s"},
      {type:"truefalse",text:"True or false: the scale on a column graph must always start at 0.",answer:"true"},
      {type:"input",text:"A pictograph uses 1 symbol = 5 students. A category shows 6 symbols. How many students?",answer:"30"},
      {type:"mc",text:"A scale goes from 0 to 40 by 5s. How many gridlines are there from 0 to 40 inclusive?",options:["7","8","9","10"],answer:"9"},
      {type:"input",text:"Data goes up to 60 and you want intervals of 10. What is the maximum value your scale should reach?",answer:"60"},
      {type:"truefalse",text:"True or false: if your data goes up to 150, a scale reaching only 100 would be inappropriate.",answer:"true"},
    ]},
  u25_y1:{
    example:[
      "Bias occurs when a survey does not fairly represent the whole group.",
      "Leading questions push respondents towards a particular answer.",
      "Sampling bias: only surveying one group (e.g. only boys) to represent everyone.",
      "Small sample size = unreliable results.",
      "Example of a leading question: 'Don't you think sport is better than reading?'",
    ],
    questions:[
      {type:"mc",text:"A survey asks: 'Don't you agree homework should be banned?' What type of bias is this?",options:["Sampling bias","Leading question bias","Observer bias","No bias"],answer:"Leading question bias"},
      {type:"truefalse",text:"True or false: surveying only one class to represent the whole school is an example of sampling bias.",answer:"true"},
      {type:"mc",text:"Which survey method gives the most representative result?",options:["Ask your friends","Survey only Year 6","Randomly select students from all year groups","Ask only teachers"],answer:"Randomly select students from all year groups"},
      {type:"truefalse",text:"True or false: a larger sample size generally gives more reliable results.",answer:"true"},
      {type:"mc",text:"Which question is least likely to produce biased results?",options:["Don't you love soccer?","What is your favourite sport?","Isn't maths the best subject?","Surely you prefer summer?"],answer:"What is your favourite sport?"},
      {type:"input",text:"A survey of 4 students is used to represent a school of 400. Is this a reliable sample size? Write yes or no.",answer:"no"},
      {type:"truefalse",text:"True or false: a biased survey always produces completely wrong results.",answer:"false"},
      {type:"mc",text:"A chocolate company surveys customers in their own store about their favourite brand. What bias might this create?",options:["The sample is too large","Customers there may already prefer that brand","The questions are too hard","There is no bias"],answer:"Customers there may already prefer that brand"},
      {type:"mc",text:"A survey about school canteen food is only given to students who use the canteen. What problem does this create?",options:["Too many students are surveyed","Only canteen users' views are represented","The questions are leading","The sample is too large"],answer:"Only canteen users' views are represented"},
    ]},
  u25_y2:{
    example:[
      "A graph can be accurate but still misleading if the scale is manipulated.",
      "Y-axis not starting at 0 makes small differences look much larger than they are.",
      "Example: A graph with y-axis from 90–100 makes a change from 92 to 95 look dramatic.",
      "The same data on a 0–100 scale would show the change is actually very small.",
      "Always check: where does the y-axis start? Are the intervals equal?",
    ],
    questions:[
      {type:"mc",text:"A graph's y-axis starts at 80 instead of 0. What effect does this have?",options:["No effect","Makes the graph more colourful","Makes small differences appear much larger","Makes it easier to read"],answer:"Makes small differences appear much larger"},
      {type:"truefalse",text:"True or false: starting a bar graph's y-axis at a number other than zero can be misleading.",answer:"true"},
      {type:"mc",text:"Graph A shows data on a y-axis from 0–100. Graph B shows the same data from 90–100. Which looks more dramatic?",options:["Graph A","Graph B","They look the same","Cannot tell"],answer:"Graph B"},
      {type:"truefalse",text:"True or false: a graph can be technically correct but still mislead the reader.",answer:"true"},
      {type:"mc",text:"Which feature is most important to check to avoid being misled by a graph?",options:["The colour","The title","The scale and axis labels","The size of the graph"],answer:"The scale and axis labels"},
      {type:"truefalse",text:"True or false: using symbols of different sizes in a pictograph to represent the same value is misleading.",answer:"true"},
      {type:"mc",text:"Sales went from 100 to 103. A headline reads 'Sales triple!' Why is this misleading?",options:["Wrong graph type","Sales actually fell","The tiny increase looks huge on a y-axis starting at 100","The title is wrong"],answer:"The tiny increase looks huge on a y-axis starting at 100"},
      {type:"mc",text:"Why might a 3D pie chart be considered misleading?",options:["Too many colours","Some slices appear larger due to 3D perspective","Shows too much data","Is too complicated"],answer:"Some slices appear larger due to 3D perspective"},
      {type:"truefalse",text:"True or false: graphs used in advertising always present data fairly.",answer:"false"},
    ]},
  u25_y3:{
    example:[
      "When constructing a column graph, plan your scale first.",
      "Scale must start at 0 and go at least as high as your largest value.",
      "Example: max value = 70. Scale by 10s from 0–70 works well.",
      "1 cm = 10 students. A bar for 50 students = 5 cm tall.",
      "Always include: a title, labelled x and y axes, and equal-width bars.",
    ],
    questions:[
      {type:"mc",text:"Data values: 20, 40, 60, 80. Which scale is most appropriate for a column graph?",options:["By 5s","By 1s","By 20s","By 100s"],answer:"By 20s"},
      {type:"input",text:"A scale is 1 cm = 10 students. A category has 60 students. How tall should the bar be (in cm)?",answer:"6"},
      {type:"truefalse",text:"True or false: all bars in a column graph should be the same width.",answer:"true"},
      {type:"mc",text:"Data goes up to 75. Which scale is best?",options:["0–60 by 10s","0–80 by 10s","0–50 by 5s","0–100 by 25s"],answer:"0–80 by 10s"},
      {type:"mc",text:"Which axis label placement is correct for a graph of favourite sports?",options:["Sports on y-axis, number on x-axis","Number of students on x-axis, sports on y-axis","Sports on x-axis, number of students on y-axis","No labels needed"],answer:"Sports on x-axis, number of students on y-axis"},
      {type:"input",text:"A pictograph uses 1 symbol = 5 students. A category has 40 students. How many symbols?",answer:"8"},
      {type:"truefalse",text:"True or false: a column graph must always have a title and labelled axes.",answer:"true"},
      {type:"mc",text:"A scale from 0 to 50 in steps of 10. How many gridlines are there (including 0 and 50)?",options:["4","5","6","7"],answer:"6"},
      {type:"input",text:"A scale goes 0–40 by 5s. A bar represents 35. Between which two gridlines does the bar end? Write the lower value.",answer:"30"},
    ]},
  u25_y4:{
    example:[
      "Range = highest value − lowest value. It tells us how spread out the data is.",
      "Mode = the value that appears most often.",
      "Example dataset: 3, 5, 7, 5, 9, 5, 2",
      "Range = 9 − 2 = 7",
      "Mode = 5 (appears 3 times)",
      "A dataset can have more than one mode.",
    ],
    questions:[
      {type:"input",text:"Data: 4, 7, 9, 4, 2, 8, 4. What is the mode?",answer:"4"},
      {type:"input",text:"Data: 3, 8, 5, 11, 3, 7, 9. What is the range?",answer:"8"},
      {type:"mc",text:"Data: 2, 5, 5, 8, 9, 9, 9. What is the mode?",options:["5","2","9","8"],answer:"9"},
      {type:"input",text:"Data: 12, 15, 18, 12, 20, 15, 12. What is the range?",answer:"8"},
      {type:"truefalse",text:"True or false: the range tells us how spread out the data is.",answer:"true"},
      {type:"mc",text:"A dataset has a range of 0. What does this tell you?",options:["All values are the same","There is no data","The mode is 0","The values are very spread out"],answer:"All values are the same"},
      {type:"truefalse",text:"True or false: a dataset can have more than one mode.",answer:"true"},
      {type:"input",text:"The highest value in a dataset is 28 and the range is 19. What is the lowest value?",answer:"9"},
      {type:"mc",text:"Data: 4, 4, 6, 7, 7, 7, 8, 9. What is the mode?",options:["4","6","7","8"],answer:"7"},
    ]},
  u25_y5:{
    example:[
      "To compare datasets, look at the range and mode for each.",
      "Smaller range = more consistent (values are closer together).",
      "An outlier is a value that is far from the rest of the data.",
      "Example: Class A range=8, Class B range=20. Class A is more consistent.",
      "Same mode but different range means groups tend towards the same value but with different spread.",
    ],
    questions:[
      {type:"mc",text:"Class A has a range of 15. Class B has a range of 35. Which is more consistent?",options:["Class B","They are equally consistent","Cannot tell","Class A"],answer:"Class A"},
      {type:"truefalse",text:"True or false: two datasets can have the same mode but different ranges.",answer:"true"},
      {type:"input",text:"Dataset A: 2, 5, 8, 11, 14. Dataset B: 1, 5, 9, 13, 17. Which has the larger range? Write A or B.",answer:"B"},
      {type:"mc",text:"A dataset is described as 'clustered around 50'. What does this mean?",options:["All values equal 50","Most values are close to 50","The range is 50","The mode is 50"],answer:"Most values are close to 50"},
      {type:"truefalse",text:"True or false: a larger range always means the data is unreliable.",answer:"false"},
      {type:"input",text:"Both classes have mode = 8 for sleep hours. Class A range = 4, Class B range = 7. Which is more consistent? Write A or B.",answer:"A"},
      {type:"mc",text:"What is an outlier in a dataset?",options:["The most common value","The middle value","A value far from the rest of the data","The average value"],answer:"A value far from the rest of the data"},
      {type:"mc",text:"Graph A shows most scores between 70–80. Graph B shows scores from 20–100. Which class is more consistent?",options:["Graph B class","Equally consistent","Cannot tell","Graph A class"],answer:"Graph A class"},
      {type:"truefalse",text:"True or false: comparing the range of two datasets helps you decide which is more consistent.",answer:"true"},
    ]},

  // ─── Unit 25 Green ───────────────────────────────────────────────────────────
  u25_g1:{
    example:[
      "Mean = sum of all values ÷ number of values.",
      "Example: 4, 7, 3, 8, 3. Sum = 25. Mean = 25 ÷ 5 = 5.",
      "Use mean, median, mode AND range together to get a complete picture of data.",
      "Mean is sensitive to extreme values. Mode tells you what's most common. Range shows spread.",
    ],
    questions:[
      {type:"input",text:"Data: 6, 8, 4, 10, 2. What is the mean?",answer:"6"},
      {type:"input",text:"Data: 15, 20, 25, 10, 5, 15. What is the mean?",answer:"15"},
      {type:"mc",text:"Which measure is calculated by adding all values and dividing by the count?",options:["Mode","Median","Mean","Range"],answer:"Mean"},
      {type:"input",text:"Five students scored: 70, 80, 90, 60, 50. What is the mean score?",answer:"70"},

// ─── Helpers ──────────────────────────────────────────────────────────────────
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }
function checkAnswer(given,q){
  if(q.type==="order")return Array.isArray(given)&&JSON.stringify(given)===JSON.stringify(q.answer);
  if(q.type==="shade")return Number(given)===q.answer;
  if(q.type==="numberline"){
    if(!given||typeof given!=="object")return false;
    return q.tokens.every(t=>{const pos=given[t];if(pos===undefined)return false;const[mn,mx]=q.targets[t];return pos>=mn&&pos<=mx;});
  }
  if(q.type==="match"){
    if(!given||typeof given!=="object")return false;
    return q.left.every(l=>given[l]===q.pairs[l]);
  }
  if(q.type==="partition"){
    if(!Array.isArray(given))return false;
    return given.length===q.target;
  }
  const u=norm(given);
  if(u===norm(q.answer))return true;
  return(q.aliases||[]).some(a=>u===norm(a));
}
function fmtGiven(given,q){
  if(q.type==="order")return Array.isArray(given)?given.join(" → "):String(given);
  if(q.type==="shade")return `${given} cell${given===1?"":"s"} shaded`;
  if(q.type==="numberline")return"Number line placement submitted";
  if(q.type==="match")return"Matching attempt submitted";
  if(q.type==="partition")return`${Array.isArray(given)?given.length:0} parts shaded`;
  return String(given)||"(blank)";
}
function initAns(q){
  return{input:"",option:"",orderSeq:[],shadedCells:q.type==="shade"?new Array(q.cells).fill(false):[],nlPlaced:{},matchPairs:{},partitionShaded:[]};
}
function unitProgress(prog,unitId){ const u=UNITS.find(u=>u.id===unitId); if(!u)return{done:0,total:0}; const total=u.outcomes.length; const done=u.outcomes.filter(o=>prog[`${unitId}_${o.id}`]).length; return{done,total}; }
