  u25_r5:{
    example:[
      "Match the display type to the data type:",
      "Line graph → change over time (e.g. temperature each day)",
      "Column graph → comparing categories (e.g. favourite subjects)",
      "Side-by-side column graph → comparing two groups across categories",
      "Timeline → events in chronological order",
    ],
    questions:[
      {type:"mc",text:"Which display best shows how temperature changes each day over a month?",options:["Column graph","Side-by-side column graph","Timeline","Line graph"],answer:"Line graph"},
      {type:"mc",text:"Which display best compares the favourite sports of boys and girls?",options:["Line graph","Timeline","Side-by-side column graph","Tally chart"],answer:"Side-by-side column graph"},
      {type:"truefalse",text:"True or false: a timeline is the best display for showing historical events in order.",answer:"true"},
      {type:"mc",text:"A teacher wants to show the results of a class survey about favourite foods. Which is best?",options:["Line graph","Timeline","Column graph","Scatter plot"],answer:"Column graph"},
      {type:"truefalse",text:"True or false: a line graph is appropriate for comparing two groups' favourite sports.",answer:"false"},
      {type:"mc",text:"To show when important events in someone's life occurred, which is most appropriate?",options:["Column graph","Line graph","Side-by-side column graph","Timeline"],answer:"Timeline"},
      {type:"truefalse",text:"True or false: a column graph is appropriate for displaying categorical data.",answer:"true"},
      {type:"mc",text:"Weekly sales figures for 6 months would best be shown using a:",options:["Timeline","Column graph","Side-by-side column graph","Line graph"],answer:"Line graph"},
      {type:"mc",text:"Which display would NOT be appropriate for showing data that changes over time?",options:["Line graph","Column graph showing monthly totals","Timeline of events","Side-by-side column graph comparing two groups by sport"],answer:"Side-by-side column graph comparing two groups by sport"},
    ]},
  u25_r6:{
    example:[
      "Choose a scale that fits all your data and is easy to read.",
      "Many-to-one scale: each unit on the axis represents more than 1 value.",
      "Example: data values are 10, 20, 30, 40. Scale by 10s works well.",
      "Pictograph: 1 symbol = 5 students. 35 students = 7 symbols.",
      "Scale must always start at 0 on a column graph.",
    ],
    questions:[
      {type:"mc",text:"Data values: 15, 25, 35, 50. Which scale is most appropriate?",options:["By 1s","By 100s","By 10s","By 2s"],answer:"By 10s"},
      {type:"truefalse",text:"True or false: a many-to-one scale means each unit represents more than one data value.",answer:"true"},
      {type:"input",text:"A pictograph uses 1 symbol = 4 students. 32 students chose maths. How many symbols?",answer:"8"},
      {type:"mc",text:"Your maximum data value is 85. Which scale is most appropriate?",options:["0–50 by 10s","0–80 by 20s","0–90 by 10s","0–100 by 50s"],answer:"0–90 by 10s"},
      {type:"truefalse",text:"True or false: the scale on a column graph must always start at 0.",answer:"true"},
      {type:"input",text:"A pictograph uses 1 symbol = 5 students. A category shows 6 symbols. How many students?",answer:"30"},
      {type:"mc",text:"A scale goes from 0 to 40 by 5s. How many gridlines are there from 0 to 40 inclusive?",options:["7","8","9","10"],answer:"9"},
      {type:"input",text:"Data goes up to 60 and you want intervals of 10. What is the maximum value your scale should reach?",answer:"60"},
      {type:"truefalse",text:"True or false: if your data goes up to 150, a scale reaching only 100 would be inappropriate.",answer:"true"},
    ]},
  u25_y1:{
    example:[
      "Bias occurs when a survey does not fairly represent the whole group.",
      "Leading questions push respondents towards a particular answer.",
      "Sampling bias: only surveying one group (e.g. only boys) to represent everyone.",
      "Small sample size = unreliable results.",
      "Example of a leading question: 'Don't you think sport is better than reading?'",
    ],
    questions:[
      {type:"mc",text:"A survey asks: 'Don't you agree homework should be banned?' What type of bias is this?",options:["Sampling bias","Leading question bias","Observer bias","No bias"],answer:"Leading question bias"},
      {type:"truefalse",text:"True or false: surveying only one class to represent the whole school is an example of sampling bias.",answer:"true"},
      {type:"mc",text:"Which survey method gives the most representative result?",options:["Ask your friends","Survey only Year 6","Randomly select students from all year groups","Ask only teachers"],answer:"Randomly select students from all year groups"},
      {type:"truefalse",text:"True or false: a larger sample size generally gives more reliable results.",answer:"true"},
      {type:"mc",text:"Which question is least likely to produce biased results?",options:["Don't you love soccer?","What is your favourite sport?","Isn't maths the best subject?","Surely you prefer summer?"],answer:"What is your favourite sport?"},
      {type:"input",text:"A survey of 4 students is used to represent a school of 400. Is this a reliable sample size? Write yes or no.",answer:"no"},
      {type:"truefalse",text:"True or false: a biased survey always produces completely wrong results.",answer:"false"},
      {type:"mc",text:"A chocolate company surveys customers in their own store about their favourite brand. What bias might this create?",options:["The sample is too large","Customers there may already prefer that brand","The questions are too hard","There is no bias"],answer:"Customers there may already prefer that brand"},
      {type:"mc",text:"A survey about school canteen food is only given to students who use the canteen. What problem does this create?",options:["Too many students are surveyed","Only canteen users' views are represented","The questions are leading","The sample is too large"],answer:"Only canteen users' views are represented"},
    ]},
  u25_y2:{
    example:[
      "A graph can be accurate but still misleading if the scale is manipulated.",
      "Y-axis not starting at 0 makes small differences look much larger than they are.",
      "Example: A graph with y-axis from 90–100 makes a change from 92 to 95 look dramatic.",
      "The same data on a 0–100 scale would show the change is actually very small.",
      "Always check: where does the y-axis start? Are the intervals equal?",
    ],
    questions:[
      {type:"mc",text:"A graph's y-axis starts at 80 instead of 0. What effect does this have?",options:["No effect","Makes the graph more colourful","Makes small differences appear much larger","Makes it easier to read"],answer:"Makes small differences appear much larger"},
      {type:"truefalse",text:"True or false: starting a bar graph's y-axis at a number other than zero can be misleading.",answer:"true"},
      {type:"mc",text:"Graph A shows data on a y-axis from 0–100. Graph B shows the same data from 90–100. Which looks more dramatic?",options:["Graph A","Graph B","They look the same","Cannot tell"],answer:"Graph B"},
      {type:"truefalse",text:"True or false: a graph can be technically correct but still mislead the reader.",answer:"true"},
      {type:"mc",text:"Which feature is most important to check to avoid being misled by a graph?",options:["The colour","The title","The scale and axis labels","The size of the graph"],answer:"The scale and axis labels"},
      {type:"truefalse",text:"True or false: using symbols of different sizes in a pictograph to represent the same value is misleading.",answer:"true"},
      {type:"mc",text:"Sales went from 100 to 103. A headline reads 'Sales triple!' Why is this misleading?",options:["Wrong graph type","Sales actually fell","The tiny increase looks huge on a y-axis starting at 100","The title is wrong"],answer:"The tiny increase looks huge on a y-axis starting at 100"},
      {type:"mc",text:"Why might a 3D pie chart be considered misleading?",options:["Too many colours","Some slices appear larger due to 3D perspective","Shows too much data","Is too complicated"],answer:"Some slices appear larger due to 3D perspective"},
      {type:"truefalse",text:"True or false: graphs used in advertising always present data fairly.",answer:"false"},
    ]},
  u25_y3:{
    example:[
      "When constructing a column graph, plan your scale first.",
      "Scale must start at 0 and go at least as high as your largest value.",
      "Example: max value = 70. Scale by 10s from 0–70 works well.",
      "1 cm = 10 students. A bar for 50 students = 5 cm tall.",
      "Always include: a title, labelled x and y axes, and equal-width bars.",
    ],
    questions:[
      {type:"mc",text:"Data values: 20, 40, 60, 80. Which scale is most appropriate for a column graph?",options:["By 5s","By 1s","By 20s","By 100s"],answer:"By 20s"},
      {type:"input",text:"A scale is 1 cm = 10 students. A category has 60 students. How tall should the bar be (in cm)?",answer:"6"},
      {type:"truefalse",text:"True or false: all bars in a column graph should be the same width.",answer:"true"},
      {type:"mc",text:"Data goes up to 75. Which scale is best?",options:["0–60 by 10s","0–80 by 10s","0–50 by 5s","0–100 by 25s"],answer:"0–80 by 10s"},
      {type:"mc",text:"Which axis label placement is correct for a graph of favourite sports?",options:["Sports on y-axis, number on x-axis","Number of students on x-axis, sports on y-axis","Sports on x-axis, number of students on y-axis","No labels needed"],answer:"Sports on x-axis, number of students on y-axis"},
      {type:"input",text:"A pictograph uses 1 symbol = 5 students. A category has 40 students. How many symbols?",answer:"8"},
      {type:"truefalse",text:"True or false: a column graph must always have a title and labelled axes.",answer:"true"},
      {type:"mc",text:"A scale from 0 to 50 in steps of 10. How many gridlines are there (including 0 and 50)?",options:["4","5","6","7"],answer:"6"},
      {type:"input",text:"A scale goes 0–40 by 5s. A bar represents 35. Between which two gridlines does the bar end? Write the lower value.",answer:"30"},
    ]},
  u25_y4:{
    example:[
      "Range = highest value − lowest value. It tells us how spread out the data is.",
      "Mode = the value that appears most often.",
      "Example dataset: 3, 5, 7, 5, 9, 5, 2",
      "Range = 9 − 2 = 7",
      "Mode = 5 (appears 3 times)",
      "A dataset can have more than one mode.",
    ],
    questions:[
      {type:"input",text:"Data: 4, 7, 9, 4, 2, 8, 4. What is the mode?",answer:"4"},
      {type:"input",text:"Data: 3, 8, 5, 11, 3, 7, 9. What is the range?",answer:"8"},
      {type:"mc",text:"Data: 2, 5, 5, 8, 9, 9, 9. What is the mode?",options:["5","2","9","8"],answer:"9"},
      {type:"input",text:"Data: 12, 15, 18, 12, 20, 15, 12. What is the range?",answer:"8"},
      {type:"truefalse",text:"True or false: the range tells us how spread out the data is.",answer:"true"},
      {type:"mc",text:"A dataset has a range of 0. What does this tell you?",options:["All values are the same","There is no data","The mode is 0","The values are very spread out"],answer:"All values are the same"},
      {type:"truefalse",text:"True or false: a dataset can have more than one mode.",answer:"true"},
      {type:"input",text:"The highest value in a dataset is 28 and the range is 19. What is the lowest value?",answer:"9"},
      {type:"mc",text:"Data: 4, 4, 6, 7, 7, 7, 8, 9. What is the mode?",options:["4","6","7","8"],answer:"7"},
    ]},
  u25_y5:{
    example:[
      "To compare datasets, look at the range and mode for each.",
      "Smaller range = more consistent (values are closer together).",
      "An outlier is a value that is far from the rest of the data.",
      "Example: Class A range=8, Class B range=20. Class A is more consistent.",
      "Same mode but different range means groups tend towards the same value but with different spread.",
    ],
    questions:[
      {type:"mc",text:"Class A has a range of 15. Class B has a range of 35. Which is more consistent?",options:["Class B","They are equally consistent","Cannot tell","Class A"],answer:"Class A"},
      {type:"truefalse",text:"True or false: two datasets can have the same mode but different ranges.",answer:"true"},
      {type:"input",text:"Dataset A: 2, 5, 8, 11, 14. Dataset B: 1, 5, 9, 13, 17. Which has the larger range? Write A or B.",answer:"B"},
      {type:"mc",text:"A dataset is described as 'clustered around 50'. What does this mean?",options:["All values equal 50","Most values are close to 50","The range is 50","The mode is 50"],answer:"Most values are close to 50"},
      {type:"truefalse",text:"True or false: a larger range always means the data is unreliable.",answer:"false"},
      {type:"input",text:"Both classes have mode = 8 for sleep hours. Class A range = 4, Class B range = 7. Which is more consistent? Write A or B.",answer:"A"},
      {type:"mc",text:"What is an outlier in a dataset?",options:["The most common value","The middle value","A value far from the rest of the data","The average value"],answer:"A value far from the rest of the data"},
      {type:"mc",text:"Graph A shows most scores between 70–80. Graph B shows scores from 20–100. Which class is more consistent?",options:["Graph B class","Equally consistent","Cannot tell","Graph A class"],answer:"Graph A class"},
      {type:"truefalse",text:"True or false: comparing the range of two datasets helps you decide which is more consistent.",answer:"true"},
    ]},

  u25_g1:{
    example:[
      "Mean = sum of all values ÷ number of values.",
      "Example: 4, 7, 3, 8, 3. Sum = 25. Mean = 25 ÷ 5 = 5.",
      "Use mean, median, mode AND range together to get a complete picture of data.",
      "Mean is sensitive to extreme values. Mode tells you what's most common. Range shows spread.",
    ],
    questions:[
      {type:"input",text:"Data: 6, 8, 4, 10, 2. What is the mean?",answer:"6"},
      {type:"input",text:"Data: 15, 20, 25, 10, 5, 15. What is the mean?",answer:"15"},
      {type:"mc",text:"Which measure is calculated by adding all values and dividing by the count?",options:["Mode","Median","Mean","Range"],answer:"Mean"},
      {type:"input",text:"Five students scored: 70, 80, 90, 60, 50. What is the mean score?",answer:"70"},
      {type:"truefalse",text:"True or false: the mean is always equal to the median.",answer:"false"},
      {type:"input",text:"The mean of 4 numbers is 10. Three numbers are 8, 12, 9. What is the fourth?",answer:"11"},
      {type:"mc",text:"Class A: mean=75, range=5. Class B: mean=75, range=30. Which class performed more consistently?",options:["Class B","They are the same","Cannot tell","Class A"],answer:"Class A"},
      {type:"truefalse",text:"True or false: a small range combined with a high mean suggests consistently good performance.",answer:"true"},
      {type:"mc",text:"Data: 2, 4, 4, 6, 9. What is the mean?",options:["4","5","4.5","6"],answer:"5"},
    ]},
  u25_g2:{
    example:[
      "An outlier is a value that is much higher or lower than the rest of the data.",
      "Outliers have a big effect on the MEAN and RANGE but less effect on the MEDIAN and MODE.",
      "Example: 5, 6, 6, 7, 7, 50. The outlier is 50.",
      "Without outlier: mean = 6.2, range = 2. With outlier: mean = 13.5, range = 45.",
      "When reporting data with outliers, consider reporting both versions and explaining why.",
    ],
    questions:[
      {type:"mc",text:"Data: 8, 9, 9, 10, 8, 2. Which is the outlier?",options:["8","9","10","2"],answer:"2"},
      {type:"truefalse",text:"True or false: an outlier has a large effect on the range.",answer:"true"},
      {type:"mc",text:"Which measure is LEAST affected by a single outlier?",options:["Mean","Range","Median","None — all are equally affected"],answer:"Median"},
      {type:"input",text:"Data: 3, 4, 5, 4, 3, 30. The range = 27. If the outlier is removed, what is the new range?",answer:"2"},
      {type:"truefalse",text:"True or false: the mode is usually unaffected by an outlier unless the outlier repeats most often.",answer:"true"},
      {type:"mc",text:"A student has scores 80, 82, 84, 83, 10. The 10 is an outlier. What happens to the mean if it is removed?",options:["The mean decreases","The mean stays the same","The mean increases","Cannot tell"],answer:"The mean increases"},
      {type:"input",text:"Data: 5, 6, 7, 6, 5, 40. Mean with outlier = 11.5. What is the mean WITHOUT the outlier? (5+6+7+6+5)/5 =",answer:"5.8"},
      {type:"mc",text:"Data: 10, 11, 11, 12, 10, 100. The median of the full dataset is between 11 and 11. After removing 100, the median is:",options:["Still between 11 and 11","Higher","Lower","Cannot tell"],answer:"Still between 11 and 11"},
      {type:"truefalse",text:"True or false: removing an outlier always makes the data more representative of the typical value.",answer:"true"},
    ]},
  u25_g3:{
    example:[
      "A dot plot shows values on a number line with dots stacked above each value.",
      "A stem-and-leaf plot splits each value into a 'stem' (tens) and 'leaf' (ones).",
      "Example: 32, 35, 38 → Stem 3: leaves 2, 5, 8",
      "A back-to-back stem-and-leaf plot compares TWO datasets using the same stems.",
      "Both plots preserve individual data values, making them useful for finding mode and range.",
    ],
    questions:[
      {type:"mc",text:"Use the stem-and-leaf plot. What values are these?",options:["41, 43, 43, 47","14, 34, 34, 74","4.1, 4.3, 4.3, 4.7","40, 41, 43, 47"],answer:"41, 43, 43, 47",svg:`<svg viewBox="0 0 260 80" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="80" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="72" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="54" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">4</text><text x="120" y="54" font-size="11" fill="#0d9488" font-weight="600">1  3  3  7</text></svg>`},
      {type:"mc",text:"Use the stem-and-leaf plot. What is the mode?",options:["41","43","47","44"],answer:"43",svg:`<svg viewBox="0 0 260 80" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="80" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="72" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="54" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">4</text><text x="120" y="54" font-size="11" fill="#0d9488" font-weight="600">1  3  3  7</text></svg>`},
      {type:"input",text:"Use the dot plot. How many data values are there in total?",answer:"6",svg:`<svg viewBox="0 0 260 100" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="100" fill="#f8fafc" rx="6"/><line x1="50" y1="75" x2="245" y2="75" stroke="#94a3b8" stroke-width="1.5"/><line x1="80" y1="72" x2="80" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="80" y="90" font-size="10" fill="#475569" text-anchor="middle">5</text><circle cx="80" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="80" cy="46" r="7" fill="#6366f1" opacity="0.85"/><line x1="130" y1="72" x2="130" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="90" font-size="10" fill="#475569" text-anchor="middle">6</text><circle cx="130" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="130" cy="46" r="7" fill="#6366f1" opacity="0.85"/><circle cx="130" cy="30" r="7" fill="#6366f1" opacity="0.85"/><line x1="180" y1="72" x2="180" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="180" y="90" font-size="10" fill="#475569" text-anchor="middle">7</text><line x1="230" y1="72" x2="230" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="90" font-size="10" fill="#475569" text-anchor="middle">8</text><circle cx="230" cy="62" r="7" fill="#6366f1" opacity="0.85"/></svg>`},
      {type:"truefalse",text:"True or false: a stem-and-leaf plot is better than a column graph for preserving individual data values.",answer:"true"},
      {type:"input",text:"Use the stem-and-leaf plot. What is the range?",answer:"16",svg:`<svg viewBox="0 0 260 95" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="95" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="87" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="52" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">2</text><text x="120" y="52" font-size="11" fill="#0d9488" font-weight="600">3  8</text><text x="80" y="74" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">3</text><text x="120" y="74" font-size="11" fill="#0d9488" font-weight="600">0  5  9</text></svg>`},
      {type:"input",text:"Use the stem-and-leaf plot. What is the range?",answer:"19",svg:`<svg viewBox="0 0 260 110" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="110" fill="#f8fafc" rx="6"/><text x="80" y="22" font-size="10" fill="#64748b" font-weight="700" text-anchor="middle">Stem</text><line x1="110" y1="8" x2="110" y2="102" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="22" font-size="10" fill="#64748b" font-weight="700">Leaf</text><line x1="40" y1="28" x2="240" y2="28" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="44" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">1</text><text x="120" y="44" font-size="11" fill="#0d9488" font-weight="600">2  5</text><text x="80" y="62" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">2</text><text x="120" y="62" font-size="11" fill="#0d9488" font-weight="600">0  3  8</text><text x="80" y="80" font-size="11" fill="#6366f1" font-weight="700" text-anchor="middle">3</text><text x="120" y="80" font-size="11" fill="#0d9488" font-weight="600">1</text></svg>`},
      {type:"mc",text:"What is the main advantage of a back-to-back stem-and-leaf plot?",options:["It is more colourful","It compares two groups using the same scale","It is easier to draw than a column graph","It only works for small datasets"],answer:"It compares two groups using the same scale"},
      {type:"truefalse",text:"True or false: in a dot plot, more dots above a value means that value appears more often.",answer:"true"},
      {type:"mc",text:"Use the dot plot. What is the mode?",options:["3","4","5","6"],answer:"5",svg:`<svg viewBox="0 0 260 100" width="100%" style="max-width:260px;display:block;margin:0 auto;font-family:sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="260" height="100" fill="#f8fafc" rx="6"/><line x1="40" y1="75" x2="230" y2="75" stroke="#94a3b8" stroke-width="1.5"/><line x1="70" y1="72" x2="70" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="70" y="90" font-size="10" fill="#475569" text-anchor="middle">3</text><circle cx="70" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="70" cy="46" r="7" fill="#6366f1" opacity="0.85"/><line x1="113" y1="72" x2="113" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="113" y="90" font-size="10" fill="#475569" text-anchor="middle">4</text><circle cx="113" cy="62" r="7" fill="#6366f1" opacity="0.85"/><line x1="157" y1="72" x2="157" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="157" y="90" font-size="10" fill="#475569" text-anchor="middle">5</text><circle cx="157" cy="62" r="7" fill="#6366f1" opacity="0.85"/><circle cx="157" cy="46" r="7" fill="#6366f1" opacity="0.85"/><circle cx="157" cy="30" r="7" fill="#6366f1" opacity="0.85"/><line x1="200" y1="72" x2="200" y2="78" stroke="#94a3b8" stroke-width="1.5"/><text x="200" y="90" font-size="10" fill="#475569" text-anchor="middle">6</text><circle cx="200" cy="62" r="7" fill="#6366f1" opacity="0.85"/></svg>`},
    ]},
  u25_g4:{
    example:[
      "When evaluating a statistical claim, ask:",
      "1. Who conducted the study? Do they benefit from a particular result?",
      "2. How large was the sample? Is it representative?",
      "3. How was data collected? Could bias have been introduced?",
      "4. Is the graph honest? Does the y-axis start at 0? Are intervals equal?",
      "5. Correlation vs causation — two things happening together doesn't mean one causes the other.",
    ],
    questions:[
      {type:"mc",text:"A toothpaste company claims '8/10 dentists recommend our brand'. What should you question?",options:["Nothing — it sounds convincing","Who funded the study and how were dentists selected","How many teeth do dentists have","Whether people brush their teeth"],answer:"Who funded the study and how were dentists selected"},
      {type:"truefalse",text:"True or false: a study funded by a company that benefits from positive results may be biased.",answer:"true"},
      {type:"mc",text:"A newspaper headline: 'Eating chocolate improves exam scores!' A study found students who ate chocolate had slightly higher scores. What is the problem?",options:["Nothing — chocolate must help","Correlation has been mistaken for causation","The study was too large","Exam scores are irrelevant"],answer:"Correlation has been mistaken for causation"},
      {type:"truefalse",text:"True or false: two things that happen at the same time are always causally related.",answer:"false"},
      {type:"mc",text:"A graph shows test scores from 78–82. The y-axis starts at 77. A headline reads 'Scores soar!' What is misleading?",options:["The headline is accurate","The y-axis manipulation makes a tiny change look dramatic","The scores are too high","There are not enough students"],answer:"The y-axis manipulation makes a tiny change look dramatic"},
      {type:"input",text:"A survey of 5 people is used to represent the opinion of 5 million. Is this sample size reliable? Write yes or no.",answer:"no"},
      {type:"mc",text:"Which of these makes a statistical study MORE reliable?",options:["Small, convenience sample","Funded by a company with a vested interest","Large, randomly selected, representative sample","Only surveying people who agree"],answer:"Large, randomly selected, representative sample"},
      {type:"truefalse",text:"True or false: when reading any graph in the media, you should always check where the y-axis starts and whether intervals are equal.",answer:"true"},
      {type:"mc",text:"'Children who read more have better vocabulary.' Is this definitely evidence that reading CAUSES better vocabulary?",options:["Yes — the data proves it","No — it may be correlation only","Yes — always true","No — reading does not help vocabulary"],answer:"No — it may be correlation only"},
    ]},
  u26_r1:{
    example:[
      "When rounding, look at the digit to the RIGHT of the place you're rounding to.",
      "If that digit is 5 or more → round up. If it is 4 or less → round down.",
      "Example: Round 3,847 to the nearest hundred. The tens digit is 4 → round down → 3,800.",
      "Example: Round 6.75 to the nearest tenth. The hundredths digit is 5 → round up → 6.8.",
    ],
    questions:[
      {type:"mc",text:"Round 7,362 to the nearest thousand.",options:["7,000","7,300","7,400","8,000"],answer:"7,000"},
      {type:"input",text:"Round 4.73 to the nearest tenth.",answer:"4.7"},
      {type:"truefalse",text:"True or false: 5,450 rounded to the nearest hundred is 5,500.",answer:"true"},
      {type:"mc",text:"Round 0.685 to the nearest hundredth.",options:["0.6","0.68","0.69","0.7"],answer:"0.69"},
      {type:"input",text:"Round 12,500 to the nearest ten thousand.",answer:"10000",aliases:["10,000"]},
      {type:"mc",text:"A number rounded to the nearest ten is 460. Which could be the original?",options:["451","454","465","469"],answer:"465"},
      {type:"truefalse",text:"True or false: 3.645 rounded to 2 decimal places is 3.64.",answer:"false"},
      {type:"input",text:"Round 2,847,391 to the nearest million.",answer:"3000000",aliases:["3,000,000"]},
      {type:"input",text:"Round 9.98 to the nearest tenth.",answer:"10.0",aliases:["10","10.00"]},
    ]},
  u26_r2:{
    example:[
      "1,000 thousands = 1 million. 1,000 millions = 1 billion.",
      "Standard partition of 4,350,000: 4 millions + 3 hundred-thousands + 5 ten-thousands.",
      "Non-standard partition: the same number expressed differently.",
      "4,350,000 = 43 hundred-thousands + 5 ten-thousands, OR 435 ten-thousands, OR 4,000,000 + 350,000.",
    ],
    questions:[
      {type:"mc",text:"Which value is equal to 1 billion?",options:["1,000 hundreds","1,000 thousands","10,000 millions","1,000 millions"],answer:"1,000 millions"},
      {type:"input",text:"Write 6 millions + 4 hundred-thousands + 2 thousands as a numeral.",answer:"6402000",aliases:["6,402,000"]},
      {type:"truefalse",text:"True or false: 15 hundred-thousands = 1,500,000.",answer:"true"},
      {type:"mc",text:"How many hundred-thousands are in 4,500,000?",options:["4","45","450","4,500"],answer:"45"},
      {type:"mc",text:"3,200,000 = ___ hundred-thousands. What is the missing number?",options:["3","32","320","3,200"],answer:"32"},
      {type:"truefalse",text:"True or false: 2,500 thousands equals 2,500,000.",answer:"true"},
      {type:"mc",text:"What is the value of the digit 8 in 8,430,000,000?",options:["8 millions","8 hundred-millions","8 ten-billions","8 billions"],answer:"8 billions"},
      {type:"mc",text:"Which shows 9,000,000 partitioned in a non-standard way?",options:["9 millions","Nine million","9,000,000","9,000 thousands"],answer:"9,000 thousands"},
      {type:"input",text:"A number has 7 millions, 4 hundred-thousands and 8 ten-thousands. Write it as a numeral.",answer:"7480000",aliases:["7,480,000"]},
    ]},
  u26_r3:{
    example:[
      "Decimal place value: tenths (1st), hundredths (2nd), thousandths (3rd).",
      "In 3.527: the 5 is in the tenths place, the 2 is in the hundredths place, the 7 is in the thousandths place.",
      "To write from a partition: 4 ones + 3 tenths + 0 hundredths + 6 thousandths = 4.306.",
      "Key: a zero in the middle holds a place — 4.306 ≠ 4.36.",
    ],
    questions:[
      {type:"mc",text:"What is the place value of the digit 4 in 0.047?",options:["4 tenths","4 ones","4 hundredths","4 thousandths"],answer:"4 hundredths"},
      {type:"input",text:"Write 5 ones, 2 tenths, 0 hundredths and 9 thousandths as a decimal.",answer:"5.209"},
      {type:"truefalse",text:"True or false: in 6.084, the digit 8 is in the hundredths place.",answer:"true"},
      {type:"mc",text:"Which decimal has the digit 3 in the thousandths place?",options:["3.100","0.300","0.030","0.003"],answer:"0.003"},
      {type:"input",text:"What is 4 tenths + 5 hundredths + 3 thousandths written as a decimal?",answer:"0.453"},
      {type:"truefalse",text:"True or false: in 2.705, the digit 0 is in the hundredths place.",answer:"true"},
      {type:"mc",text:"In the number 8.163, which digit is in the tenths place?",options:["8","1","6","3"],answer:"1"},
      {type:"input",text:"Write 0 ones + 8 tenths + 0 hundredths + 4 thousandths as a decimal.",answer:"0.804"},
      {type:"mc",text:"What does the 6 represent in 1.263?",options:["6 thousandths","6 hundredths","6 tenths","6 ones"],answer:"6 hundredths"},
    ]},
  u26_r4:{
    example:[
      "To compare decimals, line up the decimal points and compare digit by digit from left to right.",
      "0.7 vs 0.69: the tenths digits are 7 vs 6. Since 7 > 6, we know 0.7 > 0.69 immediately.",
      "When ordering, add trailing zeros so all numbers have the same number of decimal places.",
      "0.3, 0.25, 0.305 → 0.300, 0.250, 0.305 → ordered: 0.250 < 0.300 < 0.305.",
    ],
    questions:[
      {type:"mc",text:"Which is greater: 0.4 or 0.399?",options:["0.399","They are equal","0.4","Cannot tell"],answer:"0.4"},
      {type:"truefalse",text:"True or false: 0.50 = 0.5.",answer:"true"},
      {type:"mc",text:"Which decimal sits between 0.7 and 0.8?",options:["0.69","0.71","0.8","0.89"],answer:"0.71"},
      {type:"truefalse",text:"True or false: 2.3 is greater than 2.29.",answer:"true"},
      {type:"mc",text:"Which of these is the smallest?",options:["0.5","0.501","0.51","0.05"],answer:"0.05"},
      {type:"truefalse",text:"True or false: 3.100 is the same as 3.1.",answer:"true"},
      {type:"mc",text:"Which decimal is between 0.5 and 0.6?",options:["0.059","0.49","0.561","0.6"],answer:"0.561"},
      {type:"mc",text:"Which is the correct order from largest to smallest?",options:["0.09, 0.9, 0.909, 0.99","0.99, 0.909, 0.9, 0.09","0.9, 0.99, 0.09, 0.909","0.909, 0.99, 0.9, 0.09"],answer:"0.99, 0.909, 0.9, 0.09"},
      {type:"mc",text:"Sam says 0.30 is greater than 0.3 because it has more digits. Is he correct?",options:["Yes — more digits means more value","No — trailing zeros don't change the value","Yes — 30 > 3","No — 0.30 is less than 0.3"],answer:"No — trailing zeros don't change the value"},
    ]},
  u26_r5:{
    example:[
      "Adding zeros after the last decimal digit does NOT change the value: 0.5 = 0.50 = 0.500.",
      "Removing trailing zeros also does NOT change the value: 3.200 = 3.2.",
      "This works because each extra zero is in a smaller place value (hundredths, thousandths) and adds nothing.",
      "Careful: a zero is only 'trailing' if it's at the END. In 0.05 the zero is NOT trailing — it changes the value.",
    ],
    questions:[
      {type:"truefalse",text:"True or false: 4.70 and 4.7 represent the same value.",answer:"true",why:"The 0 on the end sits in the hundredths place and adds nothing, so 4.70 = 4.7.",hint:"Does that last zero actually add any value?"},
      {type:"mc",text:"Which of these is equal to 2.5?",options:["2.50 only","2.500 only","Neither — 2.5 is different","Both 2.50 and 2.500"],answer:"Both 2.50 and 2.500",why:"Extra zeros on the end never change the value, so 2.5 = 2.50 = 2.500.",hint:"Try reading each one out loud — do they sound like the same amount?"},
      {type:"input",text:"Write 6.3400 without trailing zeros.",answer:"6.34",why:"Drop only the zeros at the very end: 6.3400 → 6.34. The 3 and 4 must stay.",hint:"Cross off zeros from the right, but stop at the last non-zero digit."},
      {type:"truefalse",text:"True or false: 0.30 is greater than 0.3.",answer:"false",why:"They're equal — the extra 0 is a placeholder, so 0.30 = 0.3.",hint:"Is 0.30 actually bigger, or just written with an extra zero?"},
      {type:"mc",text:"Which decimal is NOT equal to 0.9?",options:["0.90","0.900","0.09","0.9000"],answer:"0.09",why:"In 0.09 the zero is between the point and the 9, so it's NOT trailing — that makes it nine hundredths, not nine tenths.",hint:"Look for the zero that is NOT at the very end."},
      {type:"input",text:"Write 5.20 without the unnecessary trailing zero.",answer:"5.2",why:"The final 0 is in the hundredths place and adds nothing, so 5.20 = 5.2.",hint:"Only the zero on the very end can go."},
      {type:"truefalse",text:"True or false: 8.0 and 8 represent the same value.",answer:"true",why:"A trailing zero after the point adds nothing, so 8.0 is just 8.",hint:"Does '.0' add any extra amount?"},
      {type:"mc",text:"A ribbon is labelled 1.40 m. Which is the same length?",options:["1.4 m","1.04 m","14 m","0.14 m"],answer:"1.4 m",why:"The end zero in 1.40 adds nothing, so 1.40 m = 1.4 m. (1.04 has the zero in a different place.)",hint:"Drop only the zero on the very end."},
      {type:"input",text:"Write 0.700 without unnecessary trailing zeros.",answer:"0.7",why:"Both end zeros are placeholders, so 0.700 = 0.7.",hint:"Cross off zeros from the right until you hit a non-zero digit."},
    ]},
  u26_r8:{
    example:[
      "On a number line, decimals increase from left to right — just like whole numbers.",
      "To place a decimal, find the two tenths it sits between: 0.73 sits between 0.7 and 0.8.",
      "Then count hundredths along: 0.73 is 3 hundredths past 0.7.",
      "Halfway between 0 and 1 is 0.5; halfway between 0.4 and 0.6 is 0.5; the midpoint is always the average.",
    ],
    questions:[
      {type:"mc",text:"On a number line from 0 to 1, which number is furthest to the right?",options:["0.19","0.72","0.089","0.8"],answer:"0.8"},
      {type:"input",text:"What decimal is exactly halfway between 1.5 and 1.7?",answer:"1.6"},
      {type:"mc",text:"Which decimal would be placed between 2 and 3 on a number line, closer to 3?",options:["2.1","2.4","2.8","3.1"],answer:"2.8"},
      {type:"truefalse",text:"True or false: on a number line, 0.45 is to the left of 0.5.",answer:"true"},
      {type:"mc",text:"A number line goes from 0 to 2. Which decimal would be placed closest to 1?",options:["0.3","0.89","1.08","1.7"],answer:"1.08"},
      {type:"input",text:"What decimal is exactly halfway between 0.2 and 0.4?",answer:"0.3"},
      {type:"mc",text:"Between which two tenths does 0.86 sit?",options:["0.7 and 0.8","0.8 and 0.9","0.6 and 0.7","0.9 and 1.0"],answer:"0.8 and 0.9"},
      {type:"mc",text:"Which decimal sits between 0.5 and 0.6 on a number line?",options:["0.45","0.55","0.65","0.06"],answer:"0.55"},
      {type:"truefalse",text:"True or false: 0.305 sits between 0.3 and 0.4 on a number line.",answer:"true"},
    ]},
  u26_r6:{
    example:[
      "1 km = 1,000 m. To convert km → m, multiply by 1,000. To convert m → km, divide by 1,000.",
      "2.5 km = 2.5 × 1,000 = 2,500 m.",
      "750 m = 750 ÷ 1,000 = 0.75 km.",
      "Estimate to check: 3,200 m is a bit over 3 km, so 3.2 km is sensible.",
    ],
    questions:[
      {type:"input",text:"Convert 4.75 km to metres.",answer:"4750"},
      {type:"mc",text:"Which is equivalent to 3,250 metres?",options:["0.325 km","3.25 km","32.5 km","325 km"],answer:"3.25 km"},
      {type:"input",text:"Convert 0.8 km to metres.",answer:"800"},
      {type:"truefalse",text:"True or false: 250 metres = 0.25 kilometres.",answer:"true"},
      {type:"input",text:"Convert 5,600 metres to kilometres.",answer:"5.6"},
      {type:"mc",text:"Convert 1.05 km to metres.",options:["105 m","150 m","1,050 m","1,500 m"],answer:"1,050 m"},
      {type:"truefalse",text:"True or false: 2 km is longer than 1,950 m.",answer:"true"},
      {type:"input",text:"A trail is 2.35 km long. A runner has completed 1,200 m. How many kilometres remain?",answer:"1.15"},
      {type:"mc",text:"Which is the shortest distance?",options:["0.9 km","850 m","1.1 km","1,000 m"],answer:"850 m"},
    ]},
  u26_r9:{
    example:[
      "1 kg = 1,000 g. To convert kg → g, multiply by 1,000. To convert g → kg, divide by 1,000.",
      "3.2 kg = 3,200 g. &nbsp;&nbsp; 500 g = 0.5 kg.",
      "Decimal notation for mass: 2.05 kg means 2 kg and 50 g (0.05 kg = 50 g).",
      "Whole-number and decimal can show the same mass: 1,500 g = 1.5 kg.",
    ],
    questions:[
      {type:"input",text:"Convert 2.4 kg to grams.",answer:"2400"},
      {type:"mc",text:"Which is equivalent to 3,750 grams?",options:["0.375 kg","3.75 kg","37.5 kg","375 kg"],answer:"3.75 kg"},
      {type:"input",text:"Convert 0.6 kg to grams.",answer:"600"},
      {type:"truefalse",text:"True or false: 250 grams = 0.25 kilograms.",answer:"true"},
      {type:"input",text:"Convert 5,600 grams to kilograms.",answer:"5.6"},
      {type:"mc",text:"What does 1.08 kg mean?",options:["1 kg 8 g","1 kg 80 g","1 kg 800 g","1 kg 8000 g"],answer:"1 kg 80 g"},
      {type:"truefalse",text:"True or false: 3,500 g = 3.5 kg.",answer:"true"},
      {type:"mc",text:"Which is heavier: 2.3 kg or 2,250 g?",options:["2,250 g","They are equal","Cannot tell","2.3 kg"],answer:"2.3 kg"},
      {type:"input",text:"A parcel weighs 1 kg and 250 g. Write its mass in kilograms as a decimal.",answer:"1.25",aliases:["1.25 kg"]},
    ]},
  u26_y1:{
    example:[
      "Line up the decimal points before adding or subtracting.",
      "Add trailing zeros if needed so both numbers have the same number of decimal places.",
      "Example: 3.4 + 1.25 → write as 3.40 + 1.25 = 4.65.",
      "Check your answer makes sense — adding makes it larger; subtracting makes it smaller.",
    ],
    questions:[
      {type:"input",text:"A piece of timber is 3.75 m long. You cut off 1.4 m. How much is left?",answer:"2.35"},
      {type:"mc",text:"What is 6.8 + 3.45?",options:["9.85","10.25","10.45","10.85"],answer:"10.25"},
      {type:"input",text:"Tom drank 0.375 L of water in the morning and 0.625 L in the afternoon. How much altogether?",answer:"1",aliases:["1.0","1.00"]},
      {type:"truefalse",text:"True or false: 12.5 − 4.75 = 7.75.",answer:"true"},
      {type:"mc",text:"A bag weighs 2.35 kg. You add 0.9 kg of fruit. What is the new weight?",options:["2.44 kg","2.34 kg","3.24 kg","3.25 kg"],answer:"3.25 kg"},
      {type:"input",text:"A pool holds 8.5 litres. 3.75 litres evaporate. How much is left?",answer:"4.75"},
      {type:"mc",text:"What is 5 − 2.48?",options:["2.52","2.62","3.52","3.62"],answer:"2.52"},
      {type:"truefalse",text:"True or false: when adding or subtracting decimals, you must always line up the decimal points.",answer:"true"},
      {type:"input",text:"Maya has $20. She spends $7.35. How much does she have left?",answer:"12.65",aliases:["$12.65"]},
    ]},
  u26_y2:{
    example:[
      "10% of a number: divide by 10.",
      "25% of a number: divide by 4 (one quarter).",
      "50% of a number: divide by 2 (one half).",
      "Sale price = original price − discount amount.",
      "Example: 25% off $80 → $80 ÷ 4 = $20 discount → sale price = $80 − $20 = $60.",
    ],
    questions:[
      {type:"input",text:"What is 10% of $340?",answer:"34",aliases:["$34","34.00","$34.00"]},
      {type:"mc",text:"A $200 bike has a 25% discount. What is the sale price?",options:["$140","$150","$160","$175"],answer:"$150"},
      {type:"input",text:"What is 50% of $95?",answer:"47.5",aliases:["47.50","$47.50","$47.5"]},
      {type:"truefalse",text:"True or false: 10% of $450 is $45.",answer:"true"},
      {type:"mc",text:"A $120 jacket is 50% off. What do you pay?",options:["$50","$55","$60","$65"],answer:"$60"},
      {type:"input",text:"A $500 TV has a 10% discount. What is the sale price?",answer:"450",aliases:["$450","450.00","$450.00"]},
      {type:"mc",text:"Which discount saves more on an $80 item: 25% off or a flat $15 off?",options:["A flat $15 off","25% off","They save the same","Cannot tell"],answer:"25% off"},
      {type:"truefalse",text:"True or false: 25% is the same as one quarter.",answer:"true"},
      {type:"mc",text:"A $360 gaming console is on 25% sale. How much do you save?",options:["$80","$90","$95","$100"],answer:"$90"},
    ]},
  u26_y3:{
    example:[
      "Integers are whole numbers — positive, negative, or zero.",
      "Negative integers appear in everyday life: temperatures, debts, floors below ground, ocean depths.",
      "When you subtract a larger number from a smaller one, the result is negative.",
      "Example: 3 − 8 = −5. On a number line: start at 3, move 8 steps left → land on −5.",
    ],
    questions:[
      {type:"mc",text:"The temperature is −3°C. It rises by 5 degrees. What is the new temperature?",options:["−8°C","−2°C","2°C","8°C"],answer:"2°C"},
      {type:"truefalse",text:"True or false: −6 is greater than −2.",answer:"false"},
      {type:"input",text:"A lift is on floor −2. It goes up 7 floors. What floor is it on now?",answer:"5"},
      {type:"mc",text:"Which shows the correct order from smallest to largest?",options:["0, −1, −3, 2","−1, −3, 2, 0","2, 0, −1, −3","−3, −1, 0, 2"],answer:"−3, −1, 0, 2"},
      {type:"truefalse",text:"True or false: 5 − 11 = −6.",answer:"true"},
      {type:"input",text:"A bank account has $12 in it. The owner withdraws $20. What is the new balance?",answer:"-8",aliases:["−8","−$8","-$8"]},
      {type:"mc",text:"On a number line, where is −4?",options:["To the right of 0","To the right of −3","Between 0 and −1","Between −2 and −6"],answer:"Between −2 and −6"},

      {type:"input",text:"What is 2 − 9?",answer:"-7",aliases:["−7"]},

function NumberLineQ({q,ans,setAns}){
  const lineRef=useRef(null);
  const [held,setHeld]=useState(null);
  const placed=ans.nlPlaced||{};
  const unplaced=q.tokens.filter(t=>placed[t]===undefined);

  function posFromEvent(e){
    const rect=lineRef.current.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.changedTouches?e.changedTouches[0].clientX:e.clientX;
    return Math.max(0.02,Math.min(0.97,(clientX-rect.left)/rect.width));
  }
  function pickUp(token){
    if(held===token){setHeld(null);return;}
    if(placed[token]!==undefined){const np={...placed};delete np[token];setAns(a=>({...a,nlPlaced:np}));}
    setHeld(token);
  }
  function placeToken(e){
    if(!held)return;
    e.preventDefault();
    const pos=posFromEvent(e);
    setAns(a=>({...a,nlPlaced:{...(a.nlPlaced||{}),[held]:pos}}));
    setHeld(null);
  }
  return(
    <div>
      <p style={{fontSize:13,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {held?<><strong style={{color:"#1e40af"}}>Tap the number line</strong> to place <strong style={{color:"#1e40af"}}>{held}</strong></>

            <Frac v={t} s={14} c={held===t?"#fff":"#1d4ed8"}/>
          </button>
        ))}
        {unplaced.length===0&&<span style={{fontSize:13,color:"#94a3b8",alignSelf:"center"}}>All placed — tap a token to move it</span>}
      </div>

        onClick={placeToken} onTouchEnd={placeToken}>
        <div ref={lineRef} style={{position:"relative",height:4,background:"#334155",borderRadius:2}}>

          <div style={{position:"absolute",right:-8,top:-4,width:0,height:0,borderTop:"6px solid transparent",borderBottom:"6px solid transparent",borderLeft:"10px solid #334155"}}/>
          {[0,0.25,0.5,0.75,1].map(p=>(
            <div key={p} style={{position:"absolute",left:`${p*100}%`,top:-6,transform:"translateX(-50%)",display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:2,height:16,background:"#334155"}}/>
              <span style={{marginTop:4,fontSize:11,fontWeight:600,color:"#475569"}}>{p===0?"0":p===1?"1":""}</span>

function MatchQ({q,ans,setAns}){
  const [selLeft,setSelLeft]=useState(null);
  const matched=ans.matchPairs||{};
  const matchedLeft=Object.keys(matched);
  const matchedRight=Object.values(matched);
  function clickLeft(item){
    if(matchedLeft.includes(item)){const nm={...matched};delete nm[item];setAns(a=>({...a,matchPairs:nm}));setSelLeft(item);return;}
    setSelLeft(selLeft===item?null:item);
  }
  function clickRight(item){
    if(matchedRight.includes(item)){const nm={...matched};const k=Object.keys(nm).find(k=>nm[k]===item);delete nm[k];setAns(a=>({...a,matchPairs:nm}));return;}
    if(!selLeft)return;
    setAns(a=>({...a,matchPairs:{...(a.matchPairs||{}),[selLeft]:item}}));
    setSelLeft(null);
  }
  const isCorrect=l=>matched[l]&&q.pairs[l]===matched[l];
  const card=(active,isM,ok)=>({padding:"10px 4px",borderRadius:10,fontWeight:700,fontSize:15,cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",minHeight:48,
    border:`2px solid ${isM?(ok?"#86efac":"#fca5a5"):active?"#3b82f6":"#e2e8f0"}`,
    background:isM?(ok?"#dcfce7":"#fee2e2"):active?"#eff6ff":"#f8fafc",
    color:isM?(ok?"#16a34a":"#dc2626"):active?"#1d4ed8":"#1e293b",transition:"all 0.15s"});
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        {selLeft?<><strong style={{color:"#1e40af"}}>Now click the matching fraction</strong> on the right</>
          :"Click a fraction on the left, then click its equivalent on the right."}
      </p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 28px 1fr",gap:"8px 4px",alignItems:"center"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Fraction</div>
        <div/>
        <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textAlign:"center",textTransform:"uppercase",letterSpacing:"0.05em"}}>Equivalent</div>
        {q.left.map((l,i)=>{
          const r=q.right[i];
          const lM=matchedLeft.includes(l);
          const rMatchedTo=Object.keys(matched).find(k=>matched[k]===r);
          const rM=!!rMatchedTo;
          return[
            <button key={`l${l}`} onClick={()=>clickLeft(l)} style={card(selLeft===l,lM,isCorrect(l))}>
              <Frac v={l} s={13} c={lM?(isCorrect(l)?"#16a34a":"#dc2626"):selLeft===l?"#1d4ed8":"#1e293b"}/>
            </button>,
            <div key={`m${i}`} style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
              {lM&&<div style={{height:2,width:"100%",background:isCorrect(l)?"#86efac":"#fca5a5",borderRadius:1}}/>}
            </div>,
            <button key={`r${r}`} onClick={()=>clickRight(r)} style={card(false,rM,rMatchedTo?isCorrect(rMatchedTo):false)}>
              <Frac v={r} s={13} c={rM?(isCorrect(rMatchedTo)?"#16a34a":"#dc2626"):"#1e293b"}/>
            </button>
          ];
        })}
      </div>
      <p style={{fontSize:11,color:"#94a3b8",margin:"10px 0 0",textAlign:"center"}}>Click a matched pair to undo it</p>
    </div>
  );
}

function PartitionQ({q,ans,setAns}){
  const shaded=new Set(ans.partitionShaded||[]);
  function toggle(i){const ns=new Set(shaded);ns.has(i)?ns.delete(i):ns.add(i);setAns(a=>({...a,partitionShaded:[...ns]}));}
  const fracStr=`${q.target}/${q.parts}`;
  const statusColor=shaded.size===q.target?"#16a34a":shaded.size>q.target?"#dc2626":"#64748b";
  const statusMsg=shaded.size===q.target?`✓ ${fracStr} shaded`:shaded.size>q.target?"Too many — click to unshade":`${shaded.size}/${q.parts} shaded`;
  if(q.shape==="circle"){
    const sz=180,cx=90,cy=90,r=82;
    return(
      <div>
        <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
          Click the sections to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the circle.
        </p>
        <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>
          <svg width={sz} height={sz} style={{cursor:"pointer"}}>
            {Array.from({length:q.parts},(_,i)=>{
              const a1=(i/q.parts)*2*Math.PI-Math.PI/2,a2=((i+1)/q.parts)*2*Math.PI-Math.PI/2;
              const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
              const large=q.parts<3?1:0;
              return <path key={i} d={`M${cx},${cy} L${x1},${y1} A${r},${r},0,${large},1,${x2},${y2} Z`}
                fill={shaded.has(i)?"#1e40af":"#dbeafe"} stroke="#fff" strokeWidth={2}
                onClick={()=>toggle(i)} style={{transition:"fill 0.15s",cursor:"pointer"}}/>;
            })}
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#334155" strokeWidth={2}/>
          </svg>
        </div>
        <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
      </div>
    );
  }
  return(
    <div>
      <p style={{fontSize:12,color:"#64748b",margin:"0 0 14px",fontStyle:"italic"}}>
        Click the parts to shade <strong style={{color:"#1e40af"}}>{fracStr}</strong> of the bar.
      </p>
      <div style={{display:"flex",gap:3,marginBottom:8}}>
        {Array.from({length:q.parts},(_,i)=>(
          <div key={i} onClick={()=>toggle(i)}
            style={{flex:1,height:80,background:shaded.has(i)?"#1e40af":"#dbeafe",border:"2px solid #fff",borderRadius:4,cursor:"pointer",transition:"background 0.15s",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {shaded.has(i)&&<span style={{color:"rgba(255,255,255,0.5)",fontSize:20}}>✓</span>}
          </div>
        ))}
      </div>
      <p style={{fontSize:12,textAlign:"center",fontWeight:600,color:statusColor}}>{statusMsg}</p>
    </div>
  );
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }
function checkAnswer(given,q){
  if(q.type==="order")return Array.isArray(given)&&JSON.stringify(given)===JSON.stringify(q.answer);
  if(q.type==="shade")return Number(given)===q.answer;
  if(q.type==="numberline"){
    if(!given||typeof given!=="object")return false;
    return q.tokens.every(t=>{const pos=given[t];if(pos===undefined)return false;const[mn,mx]=q.targets[t];return pos>=mn&&pos<=mx;});
  }
  if(q.type==="match"){
    if(!given||typeof given!=="object")return false;
    return q.left.every(l=>given[l]===q.pairs[l]);
  }
  if(q.type==="partition"){
    if(!Array.isArray(given))return false;
    return given.length===q.target;
  }
  const u=norm(given);
  if(u===norm(q.answer))return true;
  return(q.aliases||[]).some(a=>u===norm(a));
}
function fmtGiven(given,q){
  if(q.type==="order")return Array.isArray(given)?given.join(" → "):String(given);
  if(q.type==="shade")return `${given} cell${given===1?"":"s"} shaded`;
  if(q.type==="numberline")return"Number line placement submitted";
  if(q.type==="match")return"Matching attempt submitted";
  if(q.type==="partition")return`${Array.isArray(given)?given.length:0} parts shaded`;
  return String(given)||"(blank)";
}

function GrowQuiz({questions,outcomeId,quizState,setQuizState}){
  const ff2="'Lexend',sans-serif";
  const state=quizState[outcomeId]||{idx:0,answered:null};
  const {idx,answered}=state;
  const q=questions[idx];
  if(!q||!q.question||!Array.isArray(q.question.options)){return null;}

  function pickAnswer(i){
    if(answered!==null)return;
    setQuizState(prev=>({...prev,[outcomeId]:{idx,answered:i}}));
  }

  function next(){
    setQuizState(prev=>({...prev,[outcomeId]:{idx:idx+1,answered:null}}));
  }

  function reset(){
    setQuizState(prev=>({...prev,[outcomeId]:{idx:0,answered:null}}));
  }

  if(idx>=questions.length){
    return(
      <div style={{fontFamily:ff2,textAlign:"center",padding:"16px 0"}}>
        <p style={{fontSize:20,margin:"0 0 6px"}}>🎉</p>
        <p style={{fontSize:13,fontWeight:700,color:"#16a34a",margin:"0 0 10px"}}>All done!</p>
        <button onClick={reset} style={{fontFamily:ff2,fontSize:12,padding:"7px 16px",background:"var(--ind-50)",color:"var(--indigo)",border:"1.5px solid var(--ind-200)",borderRadius:8,cursor:"pointer",fontWeight:600}}>Try again</button>
      </div>
    );
  }

  const correctIdx=q.question.options.findIndex(o=>o.correct);
  const isCorrect=answered===correctIdx;

  return(
    <div style={{fontFamily:ff2}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <p style={{margin:0,fontSize:11,fontWeight:700,color:"var(--sub)",textTransform:"uppercase",letterSpacing:"0.05em"}}>Practice questions</p>
        <span style={{fontSize:11,color:"var(--muted)"}}>{idx+1} of {questions.length}</span>
      </div>
      <p style={{fontSize:14,fontWeight:600,color:"var(--text)",lineHeight:1.5,margin:"0 0 12px"}}>{q.question.text}</p>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
        {q.question.options.map((opt,i)=>{
          let bg="var(--surface)",border="1px solid #e2e8f0",color="var(--text)";
          if(answered!==null){
            if(i===correctIdx){bg="#f0fdf4";border="1.5px solid #86efac";color="#16a34a";}
            else if(i===answered&&!isCorrect){bg="#fef2f2";border="1.5px solid #fca5a5";color="#dc2626";}
          }
          return(
            <button key={i} onClick={()=>pickAnswer(i)} disabled={answered!==null}
              style={{fontFamily:ff2,textAlign:"left",padding:"10px 14px",borderRadius:10,cursor:answered!==null?"default":"pointer",background:bg,border,color,fontSize:13,fontWeight:500,display:"flex",alignItems:"center",gap:10}}>
              <span style={{width:20,height:20,borderRadius:"50%",flexShrink:0,background:"rgba(0,0,0,0.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>{String.fromCharCode(65+i)}</span>
              <span style={{flex:1}}>{opt.text}</span>
              {answered!==null&&i===correctIdx&&<span style={{flexShrink:0,color:"#16a34a",fontWeight:700}}>✓</span>}
              {answered!==null&&i===answered&&!isCorrect&&<span style={{flexShrink:0,color:"#dc2626",fontWeight:700}}>✗</span>}
            </button>
          );
        })}
      </div>
      {answered!==null&&(
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{margin:0,fontSize:12,fontWeight:700,color:isCorrect?"#16a34a":"#dc2626"}}>
            {isCorrect?"Correct! ✓":"Not quite — see the answer above."}
          </p>
          {idx<questions.length-1
            ?<button onClick={next} style={{fontFamily:ff2,fontSize:12,fontWeight:700,padding:"7px 16px",background:"linear-gradient(135deg,var(--indigo),var(--blue))",color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}}>Next →</button>
            :<button onClick={next} style={{fontFamily:ff2,fontSize:12,fontWeight:700,padding:"7px 16px",background:"#f0fdf4",color:"#16a34a",border:"1.5px solid #86efac",borderRadius:8,cursor:"pointer"}}>Finish ✓</button>
          }
        </div>
      )}
    </div>
  );
}

  async function saveOutcome(sid,key,val){

    await sb.from("solo_progress").upsert({student_id:sid,outcome_key:key,completed:val,updated_at:now},{onConflict:"student_id,outcome_key"});
    setTimestamps(prev=>{

      return {...prev,[sid]:st};
    });
  }

  async function setTeacherStatus(sid,key,status){
    // status: 'green' | 'red' | 'review'
    // green/red flip the completed flag; review = completed + override flag
    // 'green' also adds to approvedOverrides so a failed snapshot doesn't re-trigger orange
    const isCompleted=status==="green"||status==="review";
    setProgress(p=>({...p,[sid]:{...p[sid],[key]:isCompleted}}));
    saveOutcome(sid,key,isCompleted);
    setTeacherReviewOverrides(prev=>{
      const cur=new Set(prev[sid]||[]);
      if(status==="review")cur.add(key); else cur.delete(key);
      return {...prev,[sid]:cur};
    });
    setTeacherApprovedOverrides(prev=>{
      const cur=new Set(prev[sid]||[]);
      if(status==="green")cur.add(key); else cur.delete(key);
      return {...prev,[sid]:cur};
    });
    // Persist overrides to classes.settings
    try{
      const {data:cur,error:selErr}=await sb.from("classes").select("settings").eq("id",selectedClassId).single();
      if(selErr)throw selErr;
      const existingTRO=cur?.settings?.soloTeacherReview||{};
      const updatedTROSet=new Set(existingTRO[sid]||[]);
      if(status==="review")updatedTROSet.add(key); else updatedTROSet.delete(key);
      const existingTAO=cur?.settings?.soloTeacherApproved||{};
      const updatedTAOSet=new Set(existingTAO[sid]||[]);
      if(status==="green")updatedTAOSet.add(key); else updatedTAOSet.delete(key);
      const merged={...(cur?.settings||{}),soloTeacherReview:{...existingTRO,[sid]:[...updatedTROSet]},soloTeacherApproved:{...existingTAO,[sid]:[...updatedTAOSet]}};
      const {error:updErr}=await sb.from("classes").update({settings:merged}).eq("id",selectedClassId);
      if(updErr)throw updErr;
    }catch(e){
      alert("Couldn't save status change — please reload and try again.\n\n"+e.message);
    }
  }

  function beginReview(){
    if(!reviewActive)return;
    const prog=progress[studentId]||{};
    const unitData=PRETESTS[reviewActive.unitId]||[];
    const qList=[];
    unitData.forEach(section=>{
      const key=`${reviewActive.unitId}_${section.outcomeId}`;
      if(prog[key]){
        const qs=section.questions;
        const q=qs[Math.floor(Math.random()*qs.length)];
        qList.push({outcomeId:section.outcomeId,short:section.short,q,unitId:reviewActive.unitId});
      }
    });
    if(qList.length===0){
      // No outcomes achieved yet — mark done immediately
      try{sessionStorage.setItem(`solo_review_done_${reviewActive.startedAt}_${studentId}`,'1');}catch{}
      setReviewMode(null);
      return;
    }
    setReviewQList(qList);
    setReviewIdx(0);
    setReviewAnswers([]);
    setReviewAns({input:"",option:"",orderSeq:[],shadedCells:qList[0].q.type==="shade"?Array(qList[0].q.cells||0).fill(false):[],nlPlaced:{},matchPairs:{},partitionShaded:[]});
    setReviewMode('running');
    setView('review');
  }

  function reviewCanGo(){
    const q=reviewQList[reviewIdx]?.q;
    if(!q)return false;
    if(q.type==="input")return reviewAns.input.trim().length>0;
    if(q.type==="mc"||q.type==="truefalse")return reviewAns.option.length>0;
    if(q.type==="order")return reviewAns.orderSeq.length===q.items.length;
    if(q.type==="shade")return reviewAns.shadedCells.some(Boolean);
    if(q.type==="numberline")return q.tokens.every(t=>(reviewAns.nlPlaced||{})[t]!==undefined);
    if(q.type==="match")return q.left.every(l=>(reviewAns.matchPairs||{})[l]!==undefined);
    if(q.type==="partition")return(reviewAns.partitionShaded||[]).length>0;
    return false;
  }

  async function handleReviewNext(){
    const current=reviewQList[reviewIdx];
    const q=current.q;
    let given;
    if(q.type==="order")given=reviewAns.orderSeq;
    else if(q.type==="shade")given=reviewAns.shadedCells.filter(Boolean).length;
    else if(q.type==="numberline")given=reviewAns.nlPlaced;
    else if(q.type==="match")given=reviewAns.matchPairs;
    else if(q.type==="partition")given=reviewAns.partitionShaded;
    else if(q.type==="mc"||q.type==="truefalse")given=reviewAns.option;
    else given=reviewAns.input;
    const correct=checkAnswer(given,q);
    const newAnswers=[...reviewAnswers,{outcomeId:current.outcomeId,short:current.short,correct}];
    setReviewAnswers(newAnswers);

    if(reviewIdx<reviewQList.length-1){
      const next=reviewQList[reviewIdx+1];
      setReviewIdx(reviewIdx+1);
      setReviewAns({input:"",option:"",orderSeq:[],shadedCells:next.q.type==="shade"?Array(next.q.cells||0).fill(false):[],nlPlaced:{},matchPairs:{},partitionShaded:[]});
    } else {
      const byOutcome={};
      newAnswers.forEach(a=>{byOutcome[a.outcomeId]={short:a.short,passed:a.correct,correct:a.correct?1:0,total:1};});
      const passedCount=Object.values(byOutcome).filter(o=>o.passed).length;
      const totalCount=Object.keys(byOutcome).length;
      if(studentId&&reviewActive){
        await sb.from("solo_review_results").insert({
          student_id:studentId,
          class_id:loginClassObj?.id||"",
          unit_id:reviewActive.unitId,
          review_key:reviewActive.startedAt,
          by_outcome:byOutcome,
          passed_count:passedCount,
          total_count:totalCount
        });
        try{sessionStorage.setItem(`solo_review_done_${reviewActive.startedAt}_${studentId}`,'1');}catch{}
        // Save a merged test snapshot so the teacher dashboard clears orange flags for passed outcomes
        if(passedCount>0){
          const {data:latestSnap}=await sb.from("solo_test_snapshots")
            .select("by_outcome,passed_count,total_count")
            .eq("student_id",studentId)
            .eq("unit_id",reviewActive.unitId)
            .order("taken_at",{ascending:false})
            .limit(1)
            .single();
          if(latestSnap){
            const mergedByOutcome={...(latestSnap.by_outcome||{})};
            Object.entries(byOutcome).forEach(([oid,result])=>{
              if(result.passed&&mergedByOutcome[oid])mergedByOutcome[oid]={...mergedByOutcome[oid],passed:true};
            });
            const newPassedCount=Object.values(mergedByOutcome).filter(o=>o.passed).length;
            const newSnap={student_id:studentId,unit_id:reviewActive.unitId,by_outcome:mergedByOutcome,passed_count:newPassedCount,total_count:Object.keys(mergedByOutcome).length};
            await sb.from("solo_test_snapshots").insert(newSnap);
            setTestSnapshots(prev=>{
              const existing=(prev[studentId]||{})[reviewActive.unitId]||[];
              return{...prev,[studentId]:{...(prev[studentId]||{}),[reviewActive.unitId]:[...existing,{...newSnap,taken_at:new Date().toISOString()}]}};
            });
          }
        }
      }
      setReviewResults({byOutcome,passedCount,totalCount});
      setReviewMode('done');
    }
  }

  async function loadResources(unitId,classId){
    const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    let query=sb.from("solo_resources").select("*").eq("unit_id",unitId).order("sort_order");
    if(classId){
      if(!UUID_RE.test(classId)){setSoloResources([]);return;}
      query=query.or(`scope.eq.global,class_id.eq.${classId}`);
    }else{
      query=query.eq("scope","global");
    }
    const {data,error}=await query;
    if(error){setSoloResources([]);return;}
    setSoloResources(data||[]);
  }

  async function loadUnitResources(unit){

    console.log('[SOLO] resources fetched:',data?.length,'rows for',unit.id);
    if(!data||data.length===0){setUnitResources({});setUnitPracticeQuestions({});setUnitResourcesLoading(false);return;}
    const res={};
    const pq={};
    data.forEach(row=>{
      const key=`${row.unit_id}_${row.outcome_id}`;
      if(row.type==='question'){
        if(!pq[key])pq[key]=[];
        pq[key].push(row.question||row);
      }else{
        if(!res[key])res[key]=[];
        res[key].push({label:row.label,url:row.url,type:row.type});
      }
    });
    setUnitResources(res);
    setUnitPracticeQuestions(pq);
    setUnitResourcesLoading(false);
  }

  async function saveResource(){
    if(!resourceOutcome){return;}
    if(!newResLabel.trim()){return;}
    if(newResType!=="question"){
      if(!newResUrl.trim()){return;}
      try{const u=new URL(newResUrl.trim());if(u.protocol!=="http:"&&u.protocol!=="https:"){return;}}catch{return;}
    }
    if(newResType==="question"&&(!newResQ.text.trim()||newResQ.options.some(o=>!o.text.trim()))){return;}
    const isAdmin=teacherEmail===ADMIN_EMAIL;
    const goGlobal=isAdmin&&addingToGlobal;
    const {data:{session}}=await sb.auth.getSession();
    const uid=session?.user?.id;
    if(!uid){return;}
    const base={
      unit_id:selectedUnit.id,

  function finishPretest(answers){
    const activeUnitId=pretestQList[0]?.unitId||"u24";
    // Build byOutcome with totals from full question list (so skipped questions count as wrong)
    const byOutcome={};
    pretestQList.forEach(item=>{
      if(!byOutcome[item.outcomeId])byOutcome[item.outcomeId]={short:item.short,total:0,correct:0,wrong:[],unitId:item.unitId};
      byOutcome[item.outcomeId].total++;
    });
    answers.forEach(a=>{
      if(!byOutcome[a.outcomeId])return;
      if(a.correct)byOutcome[a.outcomeId].correct++;
      else byOutcome[a.outcomeId].wrong.push(a.q.text);
    });
    const passed=Object.keys(byOutcome).filter(id=>byOutcome[id].correct===byOutcome[id].total);
    const priorSnaps=(testSnapshots[studentId]||{})[activeUnitId]||[];
    if(studentId){
      setProgress(p=>{
        const updated={...p[studentId]};
        passed.forEach(id=>{const uid=byOutcome[id].unitId||"u24";updated[`${uid}_${id}`]=true;});
        return{...p,[studentId]:updated};
      });
      passed.forEach(id=>saveOutcome(studentId,`${byOutcome[id].unitId||"u24"}_${id}`,true));
      const byOutcomeSnap={};
      Object.entries(byOutcome).forEach(([id,o])=>{
        const band=UNITS.find(u=>u.id===o.unitId)?.outcomes.find(oc=>oc.id===id)?.band||"red";
        byOutcomeSnap[id]={short:o.short,correct:o.correct,total:o.total,passed:o.correct===o.total,band};
      });
      saveTestSnapshot(studentId,activeUnitId,byOutcomeSnap);
      try{localStorage.removeItem(`solo_pretest_draft_${studentId}`);}catch{}
    }
    setPretestResults({byOutcome,passed,priorSnaps});
    setPretestMode("done");
  }

  function handlePretestNext(){
    const currentItemIdx=pretestInReview?pretestReviewQueue[pretestReviewPos]:pretestIdx;
    const current=pretestQList[currentItemIdx];
    const q=current.q;
    let given;
    if(q.type==="order")given=pretestAns.orderSeq;
    else if(q.type==="shade")given=pretestAns.shadedCells.filter(Boolean).length;
    else if(q.type==="numberline")given=pretestAns.nlPlaced;
    else if(q.type==="match")given=pretestAns.matchPairs;
    else if(q.type==="partition")given=pretestAns.partitionShaded;
    else if(q.type==="mc"||q.type==="truefalse")given=pretestAns.option;
    else given=pretestAns.input;
    const correct=checkAnswer(given,q);
    const newAnswer={idx:currentItemIdx,outcomeId:current.outcomeId,short:current.short,q,given,correct,unitId:current.unitId};
    const newAnswers=[...pretestAnswers.filter(a=>a.idx!==currentItemIdx),newAnswer];
    setPretestAnswers(newAnswers);
    if(pretestFlagged.has(currentItemIdx)){const nf=new Set(pretestFlagged);nf.delete(currentItemIdx);setPretestFlagged(nf);}

    // Per-outcome immediate save
    if(studentId){
      const oid=current.outcomeId;
      const uid=current.unitId||"u24";
      const outcomeAnswers=newAnswers.filter(a=>a.outcomeId===oid);
      const outcomeTotal=pretestQList.filter(item=>item.outcomeId===oid).length;
      if(outcomeAnswers.length===outcomeTotal&&outcomeAnswers.every(a=>a.correct)){
        saveOutcome(studentId,`${uid}_${oid}`,true);
      }
    }

    if(!pretestInReview){
      // localStorage checkpoint (main pass only) — strip svg to avoid quota errors
      if(studentId){
        try{
          const slimAns=a=>({...a,q:{...a.q,svg:undefined}});
          localStorage.setItem(
            `solo_pretest_draft_${studentId}`,
            JSON.stringify({unitId:current.unitId,pretestIdx:pretestIdx+1,pretestAnswers:newAnswers.map(slimAns)})
          );
        }catch{}
      }
      if(pretestIdx<pretestQList.length-1){
        const nextIdx=pretestIdx+1;
        const currentBand=getBand(current.outcomeId);
        const nextBand=getBand(pretestQList[nextIdx].outcomeId);
        setPretestIdx(nextIdx);
        setPretestAns(initAns(pretestQList[nextIdx].q));
        if(nextBand!==currentBand)setPretestSectionStart(nextBand);
      } else {
        // End of main pass — enter review if flagged questions exist, else finish
        const stillFlagged=[...pretestFlagged];
        if(stillFlagged.length>0){
          setPretestInReview(true);
          setPretestReviewQueue(stillFlagged);
          setPretestReviewPos(0);
          setPretestAns(initAns(pretestQList[stillFlagged[0]].q));
        } else {
          finishPretest(newAnswers);
        }
      }
    } else {
      // In review pass
      if(pretestReviewPos<pretestReviewQueue.length-1){
        const nextPos=pretestReviewPos+1;
        setPretestReviewPos(nextPos);
        setPretestAns(initAns(pretestQList[pretestReviewQueue[nextPos]].q));
      } else {
        finishPretest(newAnswers);
      }
    }
  }

  function handlePretestSkip(){
    if(pretestInReview){
      // In review: skip = count as wrong, move on
      if(pretestReviewPos<pretestReviewQueue.length-1){
        const nextPos=pretestReviewPos+1;
        setPretestReviewPos(nextPos);
        setPretestAns(initAns(pretestQList[pretestReviewQueue[nextPos]].q));
      } else {
        finishPretest([...pretestAnswers]);
      }
    } else {
      // Main pass: flag and defer this question
      const newFlagged=new Set(pretestFlagged);
      newFlagged.add(pretestIdx);
      setPretestFlagged(newFlagged);
      if(pretestIdx<pretestQList.length-1){
        const nextIdx=pretestIdx+1;
        const currentBand=getBand(pretestQList[pretestIdx].outcomeId);
        const nextBand=getBand(pretestQList[nextIdx].outcomeId);
        setPretestIdx(nextIdx);
        setPretestAns(initAns(pretestQList[nextIdx].q));
        if(nextBand!==currentBand)setPretestSectionStart(nextBand);
      } else {
        // Last question skipped — enter review with all flagged
        const flaggedQueue=[...newFlagged];
        setPretestInReview(true);
        setPretestReviewQueue(flaggedQueue);
        setPretestReviewPos(0);
        setPretestAns(initAns(pretestQList[flaggedQueue[0]].q));
      }
    }
  }

  function handlePretestJumpTo(targetIdx){
    if(pretestInReview||targetIdx<0||targetIdx>=pretestQList.length)return;
    if(pretestFlagged.has(targetIdx)){const nf=new Set(pretestFlagged);nf.delete(targetIdx);setPretestFlagged(nf);}
    setPretestIdx(targetIdx);
    const q=pretestQList[targetIdx].q;
    const prev=pretestAnswers.find(a=>a.idx===targetIdx);
    if(prev){
      const restored=initAns(q);
      if(q.type==="mc"||q.type==="truefalse")restored.option=prev.given||"";
      else if(q.type==="input")restored.input=prev.given||"";
      else if(q.type==="order")restored.orderSeq=Array.isArray(prev.given)?prev.given:[];
      else if(q.type==="shade")restored.shadedCells=restored.shadedCells.map((_,i)=>i<prev.given);
      else if(q.type==="numberline")restored.nlPlaced=prev.given||{};
      else if(q.type==="match")restored.matchPairs=prev.given||{};
      else if(q.type==="partition")restored.partitionShaded=Array.isArray(prev.given)?prev.given:[];
      setPretestAns(restored);
    } else {
      setPretestAns(initAns(q));
    }
  }
  function handlePretestBack(){
    if(pretestInReview||pretestIdx===0)return;
    handlePretestJumpTo(pretestIdx-1);
  }

  // ── Class selector (teacher) ─────────────────────────────────────────────
  if(view==="classes") return(

  // ── Home / Unit selector ─────────────────────────────────────────────────
  if(view==="home"){
    const s=!isTeacher&&students.find(s=>s.id===studentId);
    const nameDisplay=isTeacher?null:(s?s.name:"");

            {nameDisplay&&<span style={{fontSize:12,padding:"4px 10px",background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:20,color:"rgba(255,255,255,0.8)"}}>{nameDisplay}</span>}

                          {isHidden?"Show":"Hide"}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {!isTeacher&&reviewActive&&(()=>{

              const unit=UNITS.find(u=>u.id===reviewActive.unitId);
              if(!unit)return null;
              const prog=progress[studentId]||{};

                <div style={{background:"#fff7ed",border:"2px solid #fdba74",borderRadius:16,padding:"20px 20px 18px",marginBottom:20,boxShadow:"var(--sh-md)"}}>

                        </button>
                      ):(
                        <span style={{fontSize:12,color:"#92400e",fontStyle:"italic"}}>No questions for you yet — your teacher will let you know when to start.</span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

                const uc=UC[unit.id];
                const isHiddenUnit=hiddenUnits.has(unit.id);
                let done=0,total=unit.outcomes.length;
                if(isTeacher){
                  const avg=visibleStudents.reduce((sum,st)=>sum+(progress[st.id]?unit.outcomes.filter(o=>progress[st.id][`${unit.id}_${o.id}`]).length:0),0);
                  done=visibleStudents.length?Math.round(avg/visibleStudents.length*10)/10:0;
                } else {
                  done=progress[studentId]?unit.outcomes.filter(o=>progress[studentId][`${unit.id}_${o.id}`]).length:0;
                }
                const pct=Math.round(done/total*100);
                const redDone=unit.outcomes.filter(o=>o.band==="red"&&(isTeacher?visibleStudents.some(st=>progress[st.id]&&progress[st.id][`${unit.id}_${o.id}`]):progress[studentId]&&progress[studentId][`${unit.id}_${o.id}`])).length;
                const redTotal=unit.outcomes.filter(o=>o.band==="red").length;
                const yelDone=unit.outcomes.filter(o=>o.band==="yellow"&&(isTeacher?visibleStudents.some(st=>progress[st.id]&&progress[st.id][`${unit.id}_${o.id}`]):progress[studentId]&&progress[studentId][`${unit.id}_${o.id}`])).length;

                    onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="var(--sh-md)";}}
                    onClick={()=>{if(!isHiddenUnit)openUnit(unit);}}>
                    <div style={{padding:"1.25rem 1.25rem 1rem"}}>

                          <span style={{display:"inline-block",background:isHiddenUnit?"#f1f5f9":uc.bg,color:isHiddenUnit?"#94a3b8":uc.text,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:6,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}}>{unit.name}</span>
                          <h2 style={{fontSize:15,fontWeight:700,margin:0,color:isHiddenUnit?"#94a3b8":"var(--text)"}}>{unit.subtitle}</h2>

                            <button onClick={e=>{e.stopPropagation();toggleHideUnit(unit.id);}}
                              title={isHiddenUnit?"Show to students":"Hide from students"}
                              style={{fontFamily:ff,fontSize:13,padding:"3px 8px",borderRadius:6,border:`1px solid ${isHiddenUnit?"#c7d2fe":"#e2e8f0"}`,background:isHiddenUnit?"var(--ind-50)":"var(--surface)",color:isHiddenUnit?"var(--indigo)":"#94a3b8",cursor:"pointer",lineHeight:1,transition:"all 0.15s"}}>
                              {isHiddenUnit?"👁 Show":"🚫 Hide"}
                            </button>
                          )}
                        </div>
                      </div>
                      {!isHiddenUnit&&<>
                      <div style={{background:"var(--ind-100)",borderRadius:99,height:8,marginBottom:12,overflow:"hidden"}}>
                        <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,var(--indigo),var(--blue))",borderRadius:99,transition:"width 0.4s"}}/>
                      </div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:11,padding:"3px 9px",borderRadius:5,background:BAND.red.bg,color:BAND.red.text,fontWeight:600}}>Red {redDone}/{redTotal}</span>
                        <span style={{fontSize:11,padding:"3px 9px",borderRadius:5,background:BAND.yellow.bg,color:BAND.yellow.text,fontWeight:600}}>Yellow {yelDone}/{yelTotal}</span>
                        {(()=>{
                          const gTotal=unit.outcomes.filter(o=>o.band==="green").length;
                          if(!gTotal)return null;
                          const gDone=unit.outcomes.filter(o=>o.band==="green"&&(isTeacher?visibleStudents.some(st=>progress[st.id]&&progress[st.id][`${unit.id}_${o.id}`]):progress[studentId]&&progress[studentId][`${unit.id}_${o.id}`])).length;
                          return <span style={{fontSize:11,padding:"3px 9px",borderRadius:5,background:BAND.green.bg,color:BAND.green.text,fontWeight:600}}>Green {gDone}/{gTotal}</span>;
                        })()}
                      </div>
                      </>}
                      {isHiddenUnit&&<p style={{fontSize:12,color:"#94a3b8",margin:"4px 0 0",fontStyle:"italic"}}>Hidden from students</p>}

                    {!isTeacher&&!isHiddenUnit&&(unit.id==="u24"||unit.id==="u25"||unit.id==="u26"||unit.id==="u27")&&(()=>{
                      const unitSnaps=(testSnapshots[studentId]||{})[unit.id]||[];
