                      const postSnap=unitSnaps.length>=2?unitSnaps[unitSnaps.length-1]:null;
                      return(
                        <div style={{borderTop:"1px solid var(--border)",padding:"10px 1.25rem"}}>

                            </div>

                            📋 {preSnap?"Retake as Post-test":"Pre-test / Post-test"}
                          </button>
                        </div>
                      );
                    })()}
                    {/* Teacher review controls strip */}
                    {isTeacher&&!isHiddenUnit&&(()=>{
                      const isThisReview=reviewActive?.unitId===unit.id;
                      return(
                        <div onClick={e=>e.stopPropagation()} style={{borderTop:"1px solid var(--border)",padding:"9px 14px",background:isThisReview?"#fff7ed":"var(--surface)",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

                            <>
                              <span style={{fontSize:11,fontWeight:700,color:"#c2410c",display:"flex",alignItems:"center",gap:4,flex:1}}>
                                <span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:"#f97316",boxShadow:"0 0 0 3px rgba(249,115,22,0.2)"}}/>

                              <button onClick={loadReviewResults} style={{fontFamily:ff,fontSize:11,fontWeight:600,padding:"4px 10px",borderRadius:7,border:"1px solid #e2e8f0",background:"#fff",color:"var(--sub)",cursor:"pointer"}}>

                        </div>

                    })()}
                  </div>
                );

            </div>
            {/* Review results panel */}
            {isTeacher&&reviewResultsPanel&&(
              <div style={{marginTop:20,background:"var(--surface)",border:"1.5px solid #fdba74",borderRadius:16,boxShadow:"var(--sh-md)",overflow:"hidden"}}>
                <div style={{background:"#fff7ed",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div>
                    <p style={{fontSize:13,fontWeight:700,color:"#c2410c",margin:0}}>📊 Review Results — {UNITS.find(u=>u.id===reviewResultsPanel.unitId)?.subtitle||reviewResultsPanel.unitId}</p>
                    {!reviewResultsPanel.loading&&<p style={{fontSize:11,color:"#92400e",margin:"2px 0 0"}}>{reviewResultsPanel.data.length} of {visibleStudents.length} student{visibleStudents.length!==1?"s":""} completed</p>}
                  </div>
                  <button onClick={()=>setReviewResultsPanel(null)} style={{fontSize:18,background:"none",border:"none",cursor:"pointer",color:"#92400e",lineHeight:1,padding:"0 2px"}}>×</button>
                </div>
                {reviewResultsPanel.loading?(
                  <p style={{textAlign:"center",padding:"20px 0",fontSize:13,color:"var(--muted)"}}>Loading results…</p>
                ):(()=>{
                  const unit=UNITS.find(u=>u.id===reviewResultsPanel.unitId);
                  if(!unit)return null;
                  const byStudent={};
                  reviewResultsPanel.data.forEach(r=>{byStudent[r.student_id]=r;});
                  return(
                    <div style={{overflowX:"auto",padding:"12px 16px"}}>
                      <table style={{borderCollapse:"collapse",minWidth:"100%",fontSize:12}}>
                        <thead>
                          <tr>
                            <th style={{textAlign:"left",padding:"4px 8px 8px 0",fontWeight:600,color:"var(--sub)",minWidth:80}}>Student</th>

                              const bs=BAND[o.band];
                              return(<th key={o.id} style={{padding:"4px 4px 8px",textAlign:"center"}}>
                                <span style={{display:"inline-block",fontSize:9,fontWeight:700,color:bs.text,background:bs.bg,border:`1px solid ${bs.border}`,padding:"2px 5px",borderRadius:4,textTransform:"uppercase"}}>{o.id}{o.showTask?" ✏":""}</span>
                              </th>);
                            })}
                            <th style={{padding:"4px 0 8px 10px",textAlign:"right",fontWeight:600,color:"var(--sub)"}}>Score</th>

                                        {ticked?"✓":"○"}

                                    </td>

                                }
                                if(!r){return<td key={o.id} style={{padding:"4px",textAlign:"center"}}><span style={{fontSize:12,color:"#cbd5e1"}}>⏳</span></td>;}

  // ── Student rubric ────────────────────────────────────────────────────────

                            <div key={pi} style={{background:"linear-gradient(135deg,#fefce8,#fff7ed)",border:"1px solid #fde68a",borderRadius:14,padding:"14px 16px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>

                                <span style={{fontSize:22,flexShrink:0}}>{proj.icon}</span>

                              </div>
                              <p style={{margin:"0 0 10px",fontSize:12,color:"#78350f",lineHeight:1.5}}>{proj.description}</p>

                      {questions.length>0&&(

                      )}
                    </>
                  )}
                </div>
              );
            })()}
            {studentRubricTab==="outcomes"&&["red","yellow","green"].filter(band=>selectedUnit.outcomes.some(o=>o.band===band)).map(band=>{
              const bs=BAND[band];
              return(
                <div key={band} style={{marginBottom:"1.5rem"}}>
                  <span style={{display:"inline-block",background:bs.bg,color:bs.text,border:`1px solid ${bs.border}`,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:7,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>{band}</span>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {selectedUnit.outcomes.filter(o=>o.band===band).map((o,i)=>{
                      const isShowTask=!!o.showTask;
                      const isDone=isShowTask?showDone.has(`${selectedUnit.id}_${o.id}`):prog[`${selectedUnit.id}_${o.id}`];
                      const resKey=`${selectedUnit.id}_${o.id}`;
                      const fetchedRes=(unitResources[resKey]||[]).length>0?unitResources[resKey]:(RESOURCES[resKey]||[]);
                      const dynRes=soloResources.filter(r=>r.outcome_id===o.id);
                      const allLinks=[
                        ...fetchedRes.map(r=>({...r,_src:"hard"})),
                        ...dynRes.filter(r=>r.type!=="question").map(r=>({...r,_src:"db"})),
                      ];
                      const allQuestions=dynRes.filter(r=>r.type==="question");
                      const hasResources=allLinks.length>0||allQuestions.length>0;
                      const isExpanded=expandedResource===resKey;
                      const _latestUSSt=(testSnapshots[studentId]?.[selectedUnit.id]||[]).slice(-1)[0];
                      const isApprovedS=(teacherApprovedOverrides[studentId]||new Set()).has(resKey);
                      const isRegressed=isDone&&!isApprovedS&&(_latestUSSt?.by_outcome?.[o.id]?.passed===false||(teacherReviewOverrides[studentId]||new Set()).has(resKey));
                      return(
                        <div key={o.id} style={{background:isRegressed?"#fff7ed":"var(--surface)",borderRadius:12,boxShadow:"var(--sh-sm)",overflow:"hidden",border:isRegressed?"1px solid #fb923c":isDone?"1px solid #86efac":"1px solid var(--border)"}}>
                          <div style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
                            <div style={{width:26,height:26,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,background:isRegressed?"#fed7aa":isDone?"#dcfce7":"var(--ind-50)",color:isRegressed?"#ea580c":isDone?"#16a34a":"var(--ind-mid)"}}>{isRegressed?"⚠":isDone?"✓":i+1}</div>
                            <div style={{flex:1,minWidth:0}}>
                              <p style={{fontSize:13,fontWeight:600,margin:"0 0 1px",color:isRegressed?"#ea580c":isDone?"#16a34a":"var(--text)"}}>{o.short}</p>
                              <p style={{fontSize:11,color:"var(--muted)",margin:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{o.label}</p>
                            </div>
                            <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>

                                <button onClick={()=>setExpandedResource(isExpanded?null:resKey)}

                                  {isRegressed?"Reassess ⚠":"Show"}
                                </button>}
                            </div>
                          </div>
                          {isExpanded&&hasResources&&(
                            <div style={{borderTop:"1px solid var(--border)",padding:"12px 14px",background:"var(--ind-50)"}}>
                              {LEARN[resKey]&&(

                                        style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,textDecoration:"none",color:"var(--text)"}}>

                                <GrowQuiz questions={allQuestions} outcomeId={o.id} quizState={quizState} setQuizState={setQuizState}/>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ── Practice mode ────────────────────────────────────────────────────────
  if(view==="practice"){
    const pd=getPracticeData();
    const uc=practiceUnit?UC[practiceUnit.id]:{dot:"#3b82f6",dark:"#1e3a8a"};
    const bs=practiceOutcome?BAND[practiceOutcome.band]:BAND.red;

    if(practicePhase==="done"){
      const pct=Math.round(practiceScore.correct/practiceScore.total*100)||0;
      return(
        <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
          <div style={{padding:"1.25rem 0"}}>
            <Coach mood={pct>=80?"happy":"idle"} reactKey={`done-${pct}`}>
              <p style={{fontSize:14,fontWeight:700,margin:"0 0 2px",color:pct>=80?"#16a34a":"var(--text)"}}>
                {pct>=80?"Brilliant work!":"Good effort — you're getting there."}
              </p>
              <p style={{fontSize:13,color:"var(--sub)",margin:0,lineHeight:1.5}}>
                You got <strong style={{color:pct>=80?"#16a34a":"#d97706"}}>{practiceScore.correct} of {practiceScore.total}</strong> on {practiceOutcome?.short}. {pct>=80?"You're ready to press Show and prove it!":"Have another look at the example, then try again — you'll get there."}
              </p>
            </Coach>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>{setPracticePhase("example");setPracticeIdx(0);setPracticeScore({correct:0,total:0});setPracticeSubmitted(false);setPracticeCorrect(false);setPracticeAttempts(0);setPracticeBookwork(false);setPracticeAns({input:"",option:"",orderSeq:[],shadedCells:[],nlPlaced:{},matchPairs:{},partitionShaded:[]});}}
              style={Sb({fontWeight:600})}>Try again</button>
            <button onClick={()=>setView("rubric")} style={Sb({background:uc.dark,color:"#fff",border:"none",fontWeight:600})}>Back to rubric</button>
          </div>
        </div>
      );
    }

    if(practicePhase==="example"){
      return(
        <div style={{maxWidth:520,margin:"0 auto",padding:"1rem",fontFamily:ff}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1.25rem"}}>
            <button onClick={()=>setView("rubric")} style={Sb()}>← Back</button>
            <div>
              <p style={{fontSize:12,fontWeight:600,margin:"0 0 2px",color:"#64748b"}}>{practiceUnit?.name}: {practiceUnit?.subtitle}</p>
              <p style={{fontSize:14,fontWeight:600,margin:0,color:"#0f172a"}}>{practiceOutcome?.short}</p>
            </div>
          </div>
          <div style={{marginBottom:14}}>
            <Coach mood="think" reactKey="ex-intro">
              <p style={{fontSize:13.5,fontWeight:600,margin:0,color:"var(--text)",lineHeight:1.5}}>Let's look at one together first. Read it through with your book open — then have a go yourself.</p>
            </Coach>
          </div>
          <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:12,padding:"1.5rem",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <span style={{fontSize:18}}>📖</span>
              <span style={{fontSize:13,fontWeight:700,color:"#0f172a",textTransform:"uppercase",letterSpacing:"0.05em"}}>Worked Example</span>
            </div>
            {(pd?.example||[]).map((line,i)=>(
              <p key={i} style={{fontSize:i===0?14:13,fontWeight:i===0?600:400,color:i===0?"#0f172a":"#475569",margin:"0 0 8px",lineHeight:1.6,paddingLeft:i>0?12:0,borderLeft:i>0?"2px solid #e2e8f0":"none"}}>
                {line}
              </p>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button onClick={()=>setPracticePhase("questions")}
              style={{fontSize:14,padding:"10px 24px",background:uc.dark,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>
              Start practice →
            </button>
          </div>
        </div>
      );
    }

    if(!pd)return null;
    const q=pd.questions[practiceIdx];
    const total=pd.questions.length;
    const pct=Math.round(practiceIdx/total*100);
    const ok=practiceCan();
    const pool=q.type==="order"?q.items.filter(item=>!practiceAns.orderSeq.includes(item)):[];
    const showAnswer=practiceSubmitted&&!practiceCorrect&&practiceAttempts>=2;
    const outcomeShortName=practiceOutcome?.short||"Practice";
    const needsBookwork=["input","mc","truefalse"].includes(q.type);
    const gateBookwork=needsBookwork&&!practiceBookwork&&!practiceSubmitted;
    const bookworkPrompt=q.type==="input"?"Set out your working in your book, then type your answer here.":q.type==="truefalse"?"Decide in your book whether it's true or false — and why — then answer.":"Work it out in your book, then choose from the options.";

      <div style={{display:"flex",flexDirection:"column",flex:1,fontFamily:ff}}>

        <div style={{flex:1,display:"flex",flexDirection:"column",padding:"18px 18px 24px",minHeight:0}}>
          {/* topbar: back + progress bar + counter */}
