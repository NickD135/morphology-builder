<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Dark launch: parent tier is not yet linked from the public site (PARENT_TIER.md §3a). -->
  <meta name="robots" content="noindex, nofollow">
  <title>Word Labs – Parent Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wordlab-common.css">
  <style>
    body{ font-family:'Lexend',sans-serif; background:linear-gradient(180deg,#0d0b1a 0%,#110f1e 50%,#0d0b1a 100%); color:#e0e7ff; min-height:100vh; }
    .page-wrap{ max-width:860px; margin:0 auto; padding:32px 20px 60px; }

    .top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
    .page-title{ font-size:24px; font-weight:900; margin:0; }
    .plan-pill{ display:inline-block; padding:6px 14px; border-radius:999px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.25); color:#a5b4fc; }
    .sub{ font-size:14px; color:#94a3b8; font-weight:600; margin:0 0 24px; }
    .sub b{ color:#e0e7ff; font-weight:800; }

    .children-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
    .child-card{ background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:14px; }
    .child-name{ font-size:18px; font-weight:900; }
    .child-stats{ display:flex; flex-wrap:wrap; gap:8px; }
    .stat{ font-size:12px; font-weight:700; color:#cbd5e1; background:rgba(255,255,255,.05); border-radius:10px; padding:6px 10px; }
    .stat b{ color:#fff; font-weight:900; }
    .child-actions{ display:flex; gap:8px; margin-top:auto; }
    .play-btn{ flex:1; border:none; background:#0d9488; color:#fff; font-weight:900; font-size:14px; padding:12px; border-radius:14px; cursor:pointer; font-family:'Lexend',sans-serif; transition:background .15s; }
    .play-btn:hover{ background:#0f766e; }

    .add-card{ background:rgba(255,255,255,.02); border:1px dashed rgba(255,255,255,.16); border-radius:20px; padding:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:150px; cursor:pointer; transition:border-color .15s,background .15s; color:#94a3b8; }
    .add-card:hover{ border-color:#6366f1; background:rgba(99,102,241,.06); color:#e0e7ff; }
    .add-card .plus{ font-size:30px; font-weight:900; line-height:1; }
    .add-card .lbl{ font-size:13px; font-weight:800; }

    .empty{ background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:20px; padding:36px; text-align:center; }
    .empty h2{ font-size:18px; font-weight:900; margin:0 0 8px; }
    .empty p{ font-size:14px; color:#94a3b8; font-weight:600; margin:0 0 18px; }

    .primary-btn{ border:none; background:#4338ca; color:#fff; font-weight:900; font-size:14px; padding:13px 22px; border-radius:14px; cursor:pointer; font-family:'Lexend',sans-serif; transition:background .15s; }
    .primary-btn:hover{ background:#3730a3; }

    .signout-btn{ border:none; background:rgba(255,255,255,.06); color:#e0e7ff; font-weight:800; font-size:13px; padding:10px 16px; border-radius:12px; cursor:pointer; font-family:'Lexend',sans-serif; }
    .signout-btn:hover{ background:rgba(255,255,255,.1); }

    /* Add-child dialog */
    .modal-back{ position:fixed; inset:0; background:rgba(8,6,18,.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; z-index:200; }
    .modal-back.show{ display:flex; }
    .modal{ background:#161427; border:1px solid rgba(255,255,255,.1); border-radius:22px; padding:28px; max-width:380px; width:100%; }
    .modal h3{ margin:0 0 6px; font-size:18px; font-weight:900; }
    .modal p{ margin:0 0 16px; font-size:13px; color:#94a3b8; font-weight:600; }
    .modal input{ width:100%; box-sizing:border-box; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 14px; color:#e0e7ff; font-size:15px; outline:none; font-family:'Lexend',sans-serif; }
    .modal input:focus{ border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .modal-actions{ display:flex; gap:10px; margin-top:18px; }
    .modal-actions button{ flex:1; }
    .ghost-btn{ border:1px solid rgba(255,255,255,.14); background:transparent; color:#cbd5e1; font-weight:800; font-size:14px; padding:12px; border-radius:12px; cursor:pointer; font-family:'Lexend',sans-serif; }
    .modal-err{ color:#f87171; font-size:13px; font-weight:700; min-height:18px; margin-top:10px; }
    .limit-note{ background:rgba(217,119,6,.12); border:1px solid rgba(217,119,6,.3); color:#fcd34d; border-radius:12px; padding:10px 14px; font-size:12px; font-weight:700; margin-top:12px; }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="header" role="banner">
  <div class="headerInner">
    <a class="brand" href="landing.html">
      <div class="brandIcon">🧪</div>
      <span class="brandName">Word Labs</span>
    </a>
    <nav class="headerRight" role="navigation" aria-label="Main navigation">
      <button id="signOutTop" class="headerLink" style="border:none;background:transparent;cursor:pointer;font-family:inherit;">Sign out</button>
    </nav>
  </div>
</header>

<div class="page-wrap" id="main-content" role="main">
  <div class="top-row">
    <h1 class="page-title">Your children</h1>
    <span class="plan-pill" id="planPill">Free</span>
  </div>
  <p class="sub">Signed in as <b id="guardianEmail">…</b></p>

  <div id="content" aria-live="polite">
    <p class="sub">Loading…</p>
  </div>
</div>

<!-- Add child dialog -->
<div class="modal-back" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
  <div class="modal">
    <h3 id="addModalTitle">Add a child</h3>
    <p>We only store your child's first name and their learning progress — nothing else.</p>
    <input type="text" id="childName" placeholder="First name (e.g. Mia)" autocomplete="off" maxlength="40" aria-label="Child's first name">
    <div class="modal-err" id="addErr" aria-live="assertive"></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="addCancel">Cancel</button>
      <button class="primary-btn" id="addSave">Add child</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wordlab-data.js"></script>
<script>
(async function() {
  const user = await WordLabData.requireGuardianAuth();
  if (!user) return; // redirected to login

  document.getElementById('guardianEmail').textContent = user.email || '(unknown)';

  const rec = await WordLabData.getGuardianRecord();
  const planPill = document.getElementById('planPill');
  if (rec && rec.plan) planPill.textContent = rec.plan.charAt(0).toUpperCase() + rec.plan.slice(1);
  const childLimit = (rec && rec.child_limit) || 1;

  const content = document.getElementById('content');
  const addModal = document.getElementById('addModal');
  const childNameInput = document.getElementById('childName');
  const addErr = document.getElementById('addErr');
  const addSave = document.getElementById('addSave');

  let children = [];

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function statPill(label, value) {
    const s = el('span', 'stat');
    const b = el('b', null, value);
    s.appendChild(b);
    s.appendChild(document.createTextNode(' ' + label));
    return s;
  }

  function playChild(id, name) {
    WordLabData.enterChildPlay(id, name).then(function() {
      window.location.href = 'landing.html';
    });
  }

  async function render() {
    while (content.firstChild) content.removeChild(content.firstChild);

    if (!children.length) {
      const empty = el('div', 'empty');
      empty.appendChild(el('h2', null, 'No children yet'));
      empty.appendChild(el('p', null, 'Add your child to get started. They play inside your account — you log in, choose them, and hand over the device.'));
      const btn = el('button', 'primary-btn', '+ Add your first child');
      btn.addEventListener('click', openAdd);
      empty.appendChild(btn);
      content.appendChild(empty);
      return;
    }

    const grid = el('div', 'children-grid');
    children.forEach(function(c) {
      const card = el('div', 'child-card');
      card.appendChild(el('div', 'child-name', c.name));

      const stats = el('div', 'child-stats');
      stats.appendChild(el('span', 'stat', 'Loading…'));
      card.appendChild(stats);

      const actions = el('div', 'child-actions');
      const play = el('button', 'play-btn', '▶ Play');
      play.addEventListener('click', function(){ playChild(c.id, c.name); });
      actions.appendChild(play);
      card.appendChild(actions);

      grid.appendChild(card);

      // Fill stats asynchronously
      WordLabData.getChildSummary(c.id).then(function(s) {
        while (stats.firstChild) stats.removeChild(stats.firstChild);
        stats.appendChild(statPill('Level', String(s.level)));
        stats.appendChild(statPill('quarks', String(s.quarks)));
        stats.appendChild(statPill(s.accuracy != null ? '% accuracy' : 'not played',
          s.accuracy != null ? String(s.accuracy) : '—'));
        if (s.badges) stats.appendChild(statPill('badges', String(s.badges)));
      });
    });

    // Add-child tile (if under the limit)
    if (children.length < childLimit) {
      const add = el('div', 'add-card');
      add.setAttribute('role', 'button');
      add.setAttribute('tabindex', '0');
      add.appendChild(el('div', 'plus', '+'));
      add.appendChild(el('div', 'lbl', 'Add a child'));
      add.addEventListener('click', openAdd);
      add.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAdd(); } });
      grid.appendChild(add);
    }

    content.appendChild(grid);

    if (children.length >= childLimit) {
      const note = el('div', 'limit-note');
      note.textContent = 'You’ve reached your plan’s limit of ' + childLimit + ' child' + (childLimit === 1 ? '' : 'ren') + '. More children will be available on a paid household plan.';
      content.appendChild(note);
    }
  }

  function openAdd() {
    addErr.textContent = '';
    childNameInput.value = '';
    addModal.classList.add('show');
    setTimeout(function(){ childNameInput.focus(); }, 30);
  }
  function closeAdd() { addModal.classList.remove('show'); }

  async function saveChild() {
    addErr.textContent = '';
    const name = childNameInput.value.trim();
    if (!name) { addErr.textContent = 'Please enter a first name.'; return; }
    addSave.disabled = true; addSave.textContent = 'Adding…';
    const res = await WordLabData.createChild(name);
    addSave.disabled = false; addSave.textContent = 'Add child';
    if (!res.ok) {
      if (res.reason === 'limit') addErr.textContent = 'You’ve reached your plan’s child limit.';
      else if (res.reason === 'not_guardian') addErr.textContent = 'Account not ready — try refreshing the page.';
      else addErr.textContent = res.reason || 'Could not add child.';
      return;
    }
    closeAdd();
    children = await WordLabData.getMyChildren();
    render();
  }

  document.getElementById('addCancel').addEventListener('click', closeAdd);
  addSave.addEventListener('click', saveChild);
  childNameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') saveChild(); });
  addModal.addEventListener('click', function(e){ if (e.target === addModal) closeAdd(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && addModal.classList.contains('show')) closeAdd(); });

  document.getElementById('signOutTop').addEventListener('click', WordLabData.guardianSignOut);

  // Initial load
  children = await WordLabData.getMyChildren();
  render();
})();
</script>
</body>
</html>
