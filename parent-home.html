<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Dark launch: parent tier is not yet linked from the public site (PARENT_TIER.md §3a). -->
  <meta name="robots" content="noindex, nofollow">
  <title>Word Labs – Parent Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wordlab-common.css">
  <style>
    body{ font-family:'Lexend',sans-serif; background:linear-gradient(180deg,#0d0b1a 0%,#110f1e 50%,#0d0b1a 100%); color:#e0e7ff; min-height:100vh; }
    .page-wrap{ max-width:760px; margin:0 auto; padding:40px 20px; }
    .panel{ background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:24px; padding:32px; }
    .panel h1{ font-size:22px; font-weight:900; margin:0 0 6px; }
    .meta{ font-size:14px; color:#94a3b8; font-weight:600; }
    .meta b{ color:#e0e7ff; font-weight:800; }
    .plan-pill{ display:inline-block; margin-top:14px; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.25); color:#a5b4fc; }
    .note{ margin-top:22px; font-size:13px; color:#94a3b8; line-height:1.6; }
    .signout-btn{ margin-top:24px; border:none; background:rgba(255,255,255,.06); color:#e0e7ff; font-weight:800; font-size:13px; padding:10px 18px; border-radius:12px; cursor:pointer; font-family:'Lexend',sans-serif; }
    .signout-btn:hover{ background:rgba(255,255,255,.1); }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="header" role="banner">
  <div class="headerInner">
    <a class="brand" href="landing.html">
      <div class="brandIcon">🧪</div>
      <span class="brandName">Word Labs</span>
    </a>
    <nav class="headerRight" role="navigation" aria-label="Main navigation">
      <button id="signOutTop" class="headerLink" style="border:none;background:transparent;cursor:pointer;font-family:inherit;">Sign out</button>
    </nav>
  </div>
</header>

<div class="page-wrap" id="main-content" role="main">
  <div class="panel">
    <h1>Welcome 👋</h1>
    <div class="meta">Signed in as <b id="guardianEmail">…</b></div>
    <div class="plan-pill" id="planPill">Free</div>
    <div class="note">
      This is your parent home. Adding children and viewing their progress arrives in
      the next build step. Children play inside your account — you log in, choose a child,
      and hand over the device.
    </div>
    <button class="signout-btn" id="signOutBtn">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wordlab-data.js"></script>
<script>
(async function() {
  const user = await WordLabData.requireGuardianAuth();
  if (!user) return; // redirected to login

  document.getElementById('guardianEmail').textContent = user.email || '(unknown)';

  const rec = await WordLabData.getGuardianRecord();
  if (rec && rec.plan) {
    const pill = document.getElementById('planPill');
    pill.textContent = rec.plan.charAt(0).toUpperCase() + rec.plan.slice(1);
  }

  document.getElementById('signOutBtn').addEventListener('click', WordLabData.guardianSignOut);
  document.getElementById('signOutTop').addEventListener('click', WordLabData.guardianSignOut);
})();
</script>
</body>
</html>
