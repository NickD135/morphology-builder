    var info = document.createElement('div');
    var nm   = document.createElement('div');
    nm.className = 'lab-modal-item-name';
    nm.textContent = item.name;
    var pr   = document.createElement('div');
    pr.className  = 'lab-modal-item-cost';
    pr.textContent = '⚛ ' + WL.costOf(cat, item) + ' quarks';
    info.appendChild(nm);
    info.appendChild(pr);
    prev.appendChild(sw);
    prev.appendChild(info);
  }
  if (msg) {
    var need = WL.costOf(cat, item) - WL.quarks;
    msg.textContent = 'You need ' + (need > 0 ? need : 0) + ' more quarks — keep playing to earn them!';
  }

  var modal = document.getElementById('notEnoughModal');
  modal.removeAttribute('hidden');
  document.getElementById('notEnoughClose').focus();

  modal._onKey = function(e) {
    if (e.key === 'Escape') { WL.closeNotEnough(); }
    else if (e.key === 'Tab') { _focusTrap(document.getElementById('notEnoughCard'), e); }
  };
  modal._onOverlay = function(e) {
    if (e.target === modal) WL.closeNotEnough();
  };
  document.addEventListener('keydown', modal._onKey);
  modal.addEventListener('click', modal._onOverlay);
};

/* ── WL.closeNotEnough ───────────────────────────────────────────── */
WL.closeNotEnough = function() {
  var modal = document.getElementById('notEnoughModal');
  modal.setAttribute('hidden', '');
  if (modal._onKey)     { document.removeEventListener('keydown', modal._onKey); modal._onKey = null; }
  if (modal._onOverlay) { modal.removeEventListener('click', modal._onOverlay); modal._onOverlay = null; }
  if (_modalTrigger) { _modalTrigger.focus(); _modalTrigger = null; }
};

/* Wire up persistent button handlers (once, on first call via boot) */
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('confirmBuyBtn').addEventListener('click', function() { WL.confirmBuy(); });
    document.getElementById('confirmCancel').addEventListener('click', function() { WL.closeConfirm(); });
    document.getElementById('notEnoughClose').addEventListener('click', function() { WL.closeNotEnough(); });
  });
})();

/* ── WL.confirmBuy ───────────────────────────────────────────────── */
WL.confirmBuy = async function() {
  if (!WL.pending) return;
  var cat  = WL.pending.cat, item = WL.pending.item;
  var cost = WL.pending.cost !== undefined ? WL.pending.cost : WL.costOf(cat, item);
  var key  = WL.ownKey(cat, item);

  var res;
  try {
    res = await WordLabData.purchase(key, cost);
  } catch(e) {
    console.error('[WL.confirmBuy] purchase threw:', e);
    res = null;
  }

  /* purchase() returns { success, quarks, reason }.
   * On failure: close confirm, show not-enough (handles edge cases like
   * concurrent spend or server-side insufficient-funds check).
   * Save trigger BEFORE closeConfirm() nulls _modalTrigger. */
  var savedTrigger = _modalTrigger;
  if (!res || !res.success) {
    WL.closeConfirm();
    WL.openNotEnough(item, cat, savedTrigger);
    return;
  }

  /* Success — update client-side state to mirror what the DB already did.
   * purchase() via atomic_purchase RPC already added key to owned[] in DB,
   * so we just mirror it here. We do NOT call saveScientist({ owned }) —
   * that would double-write and the RPC already persisted it.
   * Pattern matches scientist.html (render() → getStudentData() refreshes
   * owned from DB; here we mirror manually instead). */
  WL.quarks = res.quarks;
  WL.owned.push(key);
  WL.renderQuarks();
  WL.popQuark();        // animate quark pill

  WL.closeConfirm();
  WL.equipFor(cat, item);   // saves the equipped field + re-renders
};

/* ── WL.surprise — Task 10: randomise all 5 visual outfit fields ───
 * Picks a random AVAILABLE item per field (free OR owned), excluding any
 * item the student hasn't badge-unlocked yet.  Uses the same badge-gate
 * rule as WL.select/WL.cardEl so badge-locked cosmetics are never picked.
 * Only the 5 visual outfit fields are randomised; effects, dances, badges,
 * and custom are left untouched.
 */
WL.surprise = async function() {
  var updates = {};
  [
    ['colours',  'coatColor'],
    ['patterns', 'coatPattern'],
    ['heads',    'head'],
    ['faces',    'face'],
    ['wings',    'wings']
  ].forEach(function(pair) {
    var catId = pair[0], field = pair[1];
    var cat = WL.CATS.find(function(c) { return c.id === catId; });
    if (!cat || !cat.src) return;

    var available = cat.src().filter(function(it) {
      /* Badge-gate — same rule as WL.select and WL.cardEl.
       * Effects use item.requires; visual outfit categories use item.requiresBadge. */
      var reqBadge    = it.requiresBadge;
      var hasReqBadge = !reqBadge || (WL.badges && WL.badges.includes(reqBadge));
      if (!hasReqBadge) return false;                 // locked: skip

      /* Free (cost 0) or already owned */
      var isFree = !!(it.free || it.cost === 0);
      return isFree || WL.owned.includes(WL.ownKey(cat, it));
    });

    if (available.length) {
      var pick = available[Math.floor(Math.random() * available.length)];
      updates[field]         = pick.id;
      WL.scientist[field]    = pick.id;
    }
  });

  await WordLabData.saveScientist(updates);
  WL.renderStage();
  WL.renderGrid();
  if (!_calm()) { WL.speech('Surprise! 🎲'); WL.spin(); WL.burst(); }
};

/* ── WL.select — FULL version (Task 9) ──────────────────────────── */
WL.select = function(cat, item, triggerEl) {
  /* Badge-gating check — FIRST, before owned/afford (scientist.html line 1106, 1180).
   * Effects use item.requires; all other categories use item.requiresBadge. */
  var reqBadge    = (cat.id === 'effects') ? item.requires : item.requiresBadge;
  var hasReqBadge = !reqBadge || (WL.badges && WL.badges.includes(reqBadge));
  if (!hasReqBadge) return;   // Badge-locked: no-op (matches scientist.html)

  /* Ownership check */
  var isFree  = !!(item.free || item.cost === 0 ||
    (cat.id === 'custom' && item.quark_cost === 0 &&
     item.unlock_method !== 'milestone' && item.unlock_method !== 'gifted'));
  var isOwned = isFree || WL.owned.includes(WL.ownKey(cat, item));

  if (isOwned) {
    WL.equipFor(cat, item);
    return;
  }

  /* Not owned — check afford */
  var cost = WL.costOf(cat, item);
  if (WL.quarks < cost) {
    WL.openNotEnough(item, cat, triggerEl || null);
    WL.shakeBalance();
    return;
  }

  WL.openConfirm(cat, item, triggerEl || null);
};

/* ═══════════════════════════════════════════════════════════════════
   Task 9: Reactions — spin, burst, popQuark, shakeBalance, speech
   Spec §12.5 (exact glyphs, colours, timings)
   ═══════════════════════════════════════════════════════════════════ */

var _SPEECH_PHRASES = [
  'Looking sharp! ✨', 'Ooh, love it! 💜', 'Lab-tastic! 🧪',
  'So cool! 😎', 'New look unlocked!', 'Spelling AND style!',
  'Wowza! 🌟', 'Fresh fit! ⚡', 'Science of style!', 'Quark well spent!'
];

/* speech — show a speech bubble above the scientist character */
WL.speech = function(text) {
  if (_calm()) return;
  /* Remove existing bubble */
  var old = document.getElementById('speechBubble');
  if (old) old.remove();

  /* Anchor to WL.charEl (the character wrap) */
  var anchor = WL.charEl || document.getElementById('stage');
  if (!anchor) return;

  var bubble = document.createElement('div');
  bubble.id = 'speechBubble';
  bubble.setAttribute('aria-hidden', 'true');
  bubble.textContent = text;
  anchor.style.position = 'relative';
  anchor.appendChild(bubble);

  setTimeout(function() { if (bubble.parentNode) bubble.remove(); }, 2000);
};

/* spin — 40% chance rotateY spin, else double-hop (spec §12.5) */
WL.spin = function() {
  if (_calm()) return;
  var el = WL.charEl;
  if (!el) return;
  if (Math.random() < 0.4) {
    /* RotateY spin over 820ms */
    el.animate(
      [
        { transform: 'translateY(0) rotateY(0deg)' },
        { transform: 'translateY(-12px) rotateY(180deg)' },
        { transform: 'translateY(0) rotateY(360deg)' }
      ],
      { duration: 820, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'none' }
    );
  } else {
    /* Double-hop over 660ms */
    el.animate(
      [
        { transform: 'translateY(0)' },
        { transform: 'translateY(-14px)' },
        { transform: 'translateY(0)' },
        { transform: 'translateY(-8px)' },
        { transform: 'translateY(0)' }
      ],
      { duration: 660, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'none' }
    );
  }
};

/* burst — 18 particles with exact glyphs and colours from spec §12.5 */
WL.burst = function() {
  if (_calm()) return;
  var layer = document.getElementById('burstLayer');
  if (!layer) return;

  /* Origin: centre of the stage section */
  var stage = document.getElementById('stage');
  var rect  = stage ? stage.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
  var ox = rect.left + rect.width  / 2;
  var oy = rect.top  + rect.height / 2;

  var glyphs  = ['✦','✧','★','✦','●'];
  var colours = ['#f7d24a','#ff8fc4','#7df0ff','#b18bff','#7ed321','#ff9a4a'];

  for (var i = 0; i < 18; i++) {
    (function() {
      var span = document.createElement('span');
      span.className = 'burst-dot';
      span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      span.style.color  = colours[Math.floor(Math.random() * colours.length)];
      span.style.left   = ox + 'px';
      span.style.top    = oy + 'px';

      var angle    = Math.random() * Math.PI * 2;
      var dist     = 50 + Math.random() * 95;     // 50–145 px (spec §12.5)
      var dur      = 700  + Math.random() * 350;  // 700–1050 ms (spec §12.5)
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;

      layer.appendChild(span);

      var anim = span.animate(
        [
          { transform: 'translate(0,0) scale(.2)', opacity: 1 },
          { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(1.15)', opacity: 0 }
        ],
        { duration: dur, easing: 'ease-out', fill: 'forwards' }
      );
      anim.onfinish = function() { span.remove(); };
    })();
  }
};

/* popQuark — scale animation on the quark pill on successful buy (spec §12.5) */
WL.popQuark = function() {
  var pill = document.getElementById('quarkPill');
  if (!pill) return;
  pill.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
    { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'none' }
  );
};

/* shakeBalance — horizontal shake on quark pill for insufficient funds (spec §12.5) */
WL.shakeBalance = function() {
  var pill = document.getElementById('quarkPill');
  if (!pill) return;
  pill.animate(
    [
      { transform: 'translateX(0)' },
      { transform: 'translateX(-6px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(0)' }
    ],
    { duration: 300, easing: 'ease-in-out', fill: 'none' }
  );
};

/* react — called after equip: happy face + speech + spin + burst + revert (guarded by calm()) */
WL.react = function() {
  if (_calm()) return;
  WL.renderStage('happy');   // face → happy; also sets WL.charEl to new node
  var phrase = _SPEECH_PHRASES[Math.floor(Math.random() * _SPEECH_PHRASES.length)];
  WL.speech(phrase);         // anchors to updated WL.charEl
  WL.spin();                 // animates updated WL.charEl
  WL.burst();
  setTimeout(function() { WL.renderStage('neutral'); }, 1000);
};

/* ── WL.renderShop — orchestrator called from WL.boot() ──────────── */
WL.renderShop = function() {
  WL.renderPills();
  WL.renderShopHeader();
  WL.renderGrid();
};
</script>
