<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Labs – My Scientist</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="wordlab-common.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Lab Shop — palette tokens (spec §12.2) ── */
    :root{
      --lab-bg:#15131f;
      --topbar:linear-gradient(180deg,#33324a,#2a2940);
      --brand:linear-gradient(135deg,#7b6bff,#5a39c7);
      --panel:linear-gradient(180deg,#faf3da,#f3e9c8);
      --panel-edge:#e5d49e;
      --accent:#5a39c7;
      --accent-2:#7b6bff;
    }

    /* Prevent background flash */
    body{ background:#15131f; overflow:hidden; }

    /* ── Main layout scaffold (spec §12.3) ── */
    .labshop{
      height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--lab-bg);
      font-family:'Lexend',sans-serif;
      color:#3a3550;
      overflow:hidden;
    }

    /* Top bar — 58 px fixed (spec §12.3) */
    .lab-topbar{
      height:58px;
      flex:0 0 58px;
      background:var(--topbar);
      display:flex;
      align-items:center;
      padding:0 20px;
      gap:14px;
      border-bottom:2px solid rgba(0,0,0,.3);
      box-shadow:0 4px 18px rgba(0,0,0,.25);
      z-index:40;
    }

    /* Main area */
    .lab-main{
      flex:1;
      min-height:0;
      display:flex;
    }

    /* Left pane — character stage + stats (spec §12.3) */
    .lab-left{
      flex:1 1 50%;
      min-width:380px;
      display:flex;
      flex-direction:column;
      background:var(--lab-bg);
    }

    /* Right pane — shop (spec §12.3) */
    .lab-shop-panel{
      flex:1 1 50%;
      min-width:420px;
      background:var(--panel);
      border-left:3px solid var(--panel-edge);
      display:flex;
      flex-direction:column;
      box-shadow:-10px 0 30px rgba(0,0,0,.2);
    }

    /* Fredoka accent class */
    .fred{ font-family:'Fredoka',sans-serif; font-weight:600; }

    /* ── Top bar internals ── */
    .tb-brand-group{
      display:flex;
      align-items:center;
      gap:11px;
    }
    .tb-brand-tile{
      width:36px; height:36px;
      border-radius:11px;
      background:var(--brand);
      display:flex; align-items:center; justify-content:center;
      font-size:19px;
      box-shadow:0 3px 10px rgba(90,57,199,.5);
      flex-shrink:0;
    }
    .tb-brand-text{ line-height:1; }
    .tb-brand-name{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:18px;
      color:#fff;
      display:block;
    }
    .tb-brand-sub{
      font-size:9px;
      letter-spacing:2px;
      color:#9a96c4;
      font-weight:800;
      text-transform:uppercase;
      display:block;
      margin-top:2px;
    }
    .tb-spacer{ flex:1; }

    /* Quark pill (spec §12.2) */
    #quarkPill{
      display:flex;
      align-items:center;
      gap:9px;
      background:rgba(123,107,255,.16);
      border:1.5px solid rgba(150,135,255,.4);
      padding:6px 15px 6px 10px;
      border-radius:999px;
    }
    .tb-quark-orb{
      width:23px; height:23px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#b9a6ff,#6d4ad6);
      display:flex; align-items:center; justify-content:center;
      font-size:12px;
      flex-shrink:0;
    }
    #quarkValue{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:16px;
      color:#fff;
    }
    .tb-quark-label{
      font-size:10px;
      color:#b6b0e0;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.6px;
    }

    /* Student name pill */
    .tb-name-pill{
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.1);
      border:1.5px solid rgba(255,255,255,.18);
      padding:6px 13px;
      border-radius:999px;
    }
    .tb-name-avatar{
      width:21px; height:21px;
      border-radius:50%;
      background:linear-gradient(135deg,#8a7bff,#5a39c7);
      display:flex; align-items:center; justify-content:center;
      font-size:11px;
      flex-shrink:0;
      /* decorative — screenreader-hidden via aria-hidden */
    }
    #studentName{
      color:#fff;
      font-weight:800;
      font-size:13px;
    }

    /* Home link pill */
    .tb-home-link{
      display:flex;
      align-items:center;
      gap:6px;
      background:rgba(255,255,255,.07);
      padding:6px 13px;
      border-radius:999px;
      color:#cfcbe8;
      font-weight:700;
      font-size:13px;
      text-decoration:none;
      transition:background .15s, color .15s;
    }
    .tb-home-link:hover{ background:rgba(255,255,255,.13); color:#fff; }

    /* ── Stage: character on glowing podium (Task 2 — spec §12.2/§12.3) ── */
    .lab-stage{
      flex:1;
      min-height:0;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* Radial glow podium behind character */
    .lab-podium{
      position:absolute;
      left:50%; top:58%;
      transform:translate(-50%,-50%);
      width:240px; height:160px;
      border-radius:50%;
      background:radial-gradient(ellipse at center, rgba(240,200,90,.7) 0%, transparent 68%);
      animation:ringPulse 3s ease-in-out infinite;
      pointer-events:none;
    }
    @media(prefers-reduced-motion:reduce){ .lab-podium{ animation:none; } }
    body.low-stim .lab-podium{ animation:none; }

    /* Character wrapper — SVG is 0 0 80 120; width 180px gives good stage size */
    .lab-charwrap{
      position:relative;
      z-index:1;
      width:180px;
      flex-shrink:0;
    }
    .lab-charwrap svg{
      width:100%;
      height:auto;
      display:block;
    }

    /* ── Stats card (Task 2 — spec §12.2) ── */
    .lab-stats{
      background:linear-gradient(180deg,#faf3da,#f0e4c0);
      border-top:3px solid #e5d49e;
      padding:13px 16px 15px;
      flex-shrink:0;
    }
    .lab-stats-top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:9px;
    }
    /* LVL badge — spec: 42px, radius 13px, gold gradient */
    .lab-lvl-badge{
      width:42px; height:42px;
      border-radius:13px;
      background:linear-gradient(135deg,#ffd24a,#e0a02a);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
      box-shadow:0 3px 8px rgba(224,160,42,.4);
    }
    .lab-lvl-num{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:22px;
      color:#fff;
      line-height:1;
    }
    .lab-level-meta{ flex:1; min-width:0; }
    .lab-level-title{
      font-size:13px;
      font-weight:700;
      color:#4a3416;
      line-height:1.2;
    }
    .lab-xp-next{
      font-size:11px;
      font-weight:600;
      color:#9a7a3a;
      margin-top:2px;
    }
    /* XP bar — spec: track #e7d7a6, fill purple gradient */
    .lab-xp-bar-wrap{ margin-bottom:9px; }
    .lab-xp-track{
      width:100%;
      height:8px;
      background:#e7d7a6;
      border-radius:999px;
      overflow:hidden;
    }
    .lab-xp-fill{
      height:100%;
      background:linear-gradient(90deg,#8a7bff,#6d4ad6);
      border-radius:999px;
      transition:width .4s ease;
    }
    /* 4-tile stat grid — spec: repeat(4,1fr), gap 8px */
    .lab-stat-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    /* Stat tile — spec: bg #fffdf2, border 1.5px solid #ecdba6, radius 13px */
    .lab-stat-tile{
      background:#fffdf2;
      border:1.5px solid #ecdba6;
      border-radius:13px;
      padding:7px 4px 6px;
      text-align:center;
    }
    /* Stat number (Fredoka) — colour per spec §12.2 */
    .lab-stat-num{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:20px;
      line-height:1;
      display:block;
    }
    /* Stat label — spec: #8a6a2a */
    .lab-stat-lbl{
      font-size:9px;
      font-weight:700;
      color:#8a6a2a;
      text-transform:uppercase;
      letter-spacing:.04em;
      margin-top:3px;
      display:block;
    }

    /* ── Right pane placeholders (Tasks 4–8 add content) ── */
    .lab-grid{
      flex:1;
      overflow-y:auto;
      padding:8px 22px 26px;
    }

    /* ── Phase 1 keyframes (spec §12.4) ── */
    @keyframes floatY    { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-9px)} }
    @keyframes idleBob   { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-6px)} }
    @keyframes ringPulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.55}
                           50%{transform:translate(-50%,-50%) scale(1.12);opacity:.9} }
    @keyframes speechPop { 0%  {transform:translate(-50%,8px) scale(.6);opacity:0}
                           60% {transform:translate(-50%,-4px) scale(1.06);opacity:1}
                           100%{transform:translate(-50%,0) scale(1);opacity:1} }
    @keyframes modalPop  { 0%  {transform:scale(.82) translateY(14px);opacity:0}
                           100%{transform:scale(1) translateY(0);opacity:1} }
    @keyframes overlayFade { from{opacity:0} to{opacity:1} }

    .lab-bob{ animation:idleBob 4s ease-in-out infinite; }
    @media(prefers-reduced-motion:reduce){ .lab-bob{ animation:none; } }
    body.low-stim .lab-bob{ animation:none; }

    /* Low-stim: hide Effects and Dances category pills (spec §6) */
    body.low-stim [data-cat="effects"],
    body.low-stim [data-cat="dances"]{ display:none !important; }

    /* Low-stim: disable ALL decorative animations on this page */
    body.low-stim .lab-card,
    body.low-stim .lab-bob,
    body.low-stim .lab-podium,
    body.low-stim .lab-charwrap { animation:none !important; }

    /* Carry-forward fix 1: wordlab-scientist.js auto-injects #wlScientistWidget into
     * the first <header> it finds (fallback when #wlPillSlot is absent).
     * The new top bar already shows all relevant info — hide the injected widget. */
    #wlScientistWidget { display:none !important; }

    /* ── Mobile: stack panes vertically below 760 px (spec §8) ── */
    @media(max-width:760px){
      body{ overflow:auto; }
      .labshop{ height:auto; min-height:100vh; overflow:visible; }
      .lab-main{ flex-direction:column; overflow-y:auto; }
      .lab-left{ min-width:0; flex:none; }
      .lab-stage{ min-height:230px; }
      .lab-shop-panel{ min-width:0; flex:none; border-left:none; border-top:3px solid var(--panel-edge); box-shadow:none; }
      #itemGrid{ grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); }
    }
    /* ── Top bar + modals: condense for very narrow viewports (≤480 px) ── */
    @media(max-width:480px){
      .lab-topbar{ height:auto; flex-wrap:wrap; padding:8px 12px; gap:8px; }
      .tb-brand-text{ display:none; }
      .tb-spacer{ display:none; }
      .tb-quark-label{ display:none; }
      #quarkPill{ padding:5px 10px 5px 8px; }
      .tb-name-pill{ padding:5px 10px; }
      .tb-home-link{ padding:5px 10px; font-size:12px; }
      .lab-modal-card{ padding:18px 16px 16px; }
    }

    /* ══════════════════════════════════════════════════════════════
       Task 4: Category pills, shop header, item grid + cards
       Spec §12.2 / §12.3 — exact values
       ══════════════════════════════════════════════════════════════ */

    /* ── Pill rail (spec §12.3) ── */
    #pillRail{
      padding:13px 22px 8px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      flex-shrink:0;
      border-bottom:1.5px solid #e5d49e;
    }
    .lab-pill{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:8px 14px;
      border-radius:999px;
      font-size:13.5px;
      font-family:'Lexend',sans-serif;
      font-weight:600;
      cursor:pointer;
      border:2px solid #e5d49e;
      background:#fffdf2;
      color:#7a5a1e;
      min-height:44px;
      transition:background .12s,color .12s,border-color .12s,box-shadow .12s;
    }
    .lab-pill.lab-pill-active{
      background:linear-gradient(135deg,#7b6bff,#5a39c7);
      border-color:#5a39c7;
      color:#fff;
      box-shadow:0 4px 12px rgba(90,57,199,.35);
    }
    .lab-pill:focus-visible{
      outline:3px solid #7b6bff;
      outline-offset:2px;
    }

    /* ── Shop header (spec §12.3) ── */
    #shopHeader{
      padding:16px 24px 11px;
      border-bottom:1.5px solid #e5d49e;
      flex-shrink:0;
    }
    .sh-title{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:25px;
      color:#4a3416;
      margin:0 0 3px;
    }
    .sh-count{
      font-size:12px;
      color:#9a7a3a;
      font-weight:600;
      margin-bottom:4px;
    }
    .sh-sub{
      font-size:12px;
      color:#8a6a2a;
      margin-bottom:9px;
    }
    .sh-surprise{
      background:linear-gradient(135deg,#ffb43c,#f5841f);
      border:2px solid #e0741a;
      box-shadow:0 4px 10px rgba(245,132,31,.4);
      color:#fff;
      font-family:'Lexend',sans-serif;
      font-weight:700;
      font-size:13px;
      padding:7px 16px;
      border-radius:999px;
      cursor:pointer;
      min-height:44px;
      transition:opacity .15s;
    }
    .sh-surprise:hover{ opacity:.9; }
    .sh-surprise:focus-visible{ outline:3px solid #f5841f; outline-offset:2px; }

    /* ── Item grid (spec §12.3) — overrides flex:1 from .lab-grid ── */
    #itemGrid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(156px,1fr));
      gap:14px;
      align-content:start;
      perspective:1100px;
    }

    /* ── Item card (spec §12.2) ── */
    .lab-card{
      position:relative;
      background:linear-gradient(180deg,#fdf7e0,#f6edcf);
      border:2px solid #ecdba6;
      border-radius:18px;
      box-shadow:0 6px 14px rgba(120,80,20,.12);
      padding:12px 12px 14px;
      cursor:pointer;
      text-align:left;
      font-family:'Lexend',sans-serif;
      display:flex;
      flex-direction:column;
      gap:4px;
      width:100%;
      min-height:44px;
      /* Float animation — duration staggered per card via --card-delay */
      animation:floatY 3.4s ease-in-out infinite;
    }
    .lab-card:hover{ box-shadow:0 10px 20px rgba(120,80,20,.2); }
    .lab-card:focus-visible{ outline:3px solid #7b6bff; outline-offset:2px; }
    /* Equipped state */
    .lab-card.is-equipped{
      border-color:#b9a6ff;
      background:linear-gradient(180deg,#fff8e6,#f3ead0);
      box-shadow:0 8px 18px rgba(90,57,199,.18);
    }
    /* Rarity border overrides */
    .lab-card.is-legendary{
      border-color:#e0a02a;
      box-shadow:0 8px 20px rgba(224,160,42,.28),inset 0 0 16px rgba(255,210,90,.2);
    }
    .lab-card.is-epic{
      border-color:#cf9ae8;
      box-shadow:0 8px 18px rgba(177,79,216,.2);
    }
    @media(prefers-reduced-motion:reduce){ .lab-card{ animation:none; } }
    body.low-stim .lab-card{ animation:none !important; }

    /* Card preview area — 70px per spec §12.3 */
    .lab-card-preview{
      height:70px;
      border-radius:12px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      margin-bottom:3px;
    }
    /* Colour swatch */
    .lab-swatch{
      width:100%;
      height:100%;
      border-radius:10px;
    }
    /* Pattern swatch — SVG bg-image applied inline */
    .lab-swatch-pattern{
      width:100%;
      height:100%;
      border-radius:10px;
      background-color:#e8e8e8;
    }
    /* Icon fallback for Head/Face/Wings (Task 5 upgrades to mini-SVG) */
    .lab-card-icon{
      font-size:34px;
      line-height:1;
    }

    /* Card name */
    .lab-card-name{
      font-size:12.5px;
      font-weight:700;
      color:#4a3416;
      line-height:1.2;
    }
    /* Card price — Fredoka accent, per spec §12.2 */
    .lab-card-price{
      font-family:'Fredoka',sans-serif;
      font-weight:600;
      font-size:13px;
      color:#6e4f1e;
    }
    .lab-card-price.is-free{ color:#3f8a4a; }

    /* Action indicator — styled like a button but is a <div> so no nested-button HTML violation */
    .lab-card-act{
      background:#fff;
      color:#5a39c7;
      border:2px solid #b9a6ff;
      box-shadow:0 3px 0 #d9ccff;
      border-radius:11px;
      font-family:'Lexend',sans-serif;
      font-weight:700;
      font-size:12px;
      padding:8px 0;
      text-align:center;
      margin-top:auto;
    }
    .lab-card-act.is-equipped{
      background:#e7e0fb;
      border-color:#cabdf5;
    }

    /* Rarity badge — top left */
    .lab-rarity{
      position:absolute;
      top:8px; left:9px;
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
      padding:2px 7px;
      border-radius:999px;
      line-height:1.4;
      pointer-events:none;
    }
    .lab-rarity-legendary{ background:#e0a02a; color:#fff; }
    .lab-rarity-epic{      background:#b14fd8; color:#fff; }
    .lab-rarity-rare{      background:#2f8fd8; color:#fff; }

    /* ── Task 7: Badges view ── */
    /* Full-height scrollable container that renders inside #itemGrid */
    .lab-badges-wrap{
      grid-column:1/-1;
      display:flex;
      flex-direction:column;
      gap:0;
    }
    .lab-badges-section-title{
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:#9a7a3a;
      margin:20px 0 10px;
      padding-bottom:5px;
      border-bottom:1px dashed #e5d49e;
    }
    .lab-badges-section-title:first-child{ margin-top:4px; }

    /* Pin-strip grid — matches badgePinsGrid in scientist.html */
    .lab-pins-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
      gap:9px;
    }
    .lab-pin-card{
      background:linear-gradient(180deg,#fdf7e0,#f6edcf);
      border:2px solid #ecdba6;
      border-radius:14px;
      padding:11px 10px;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }
    .lab-pin-card.is-pinned{
      border-color:#f59e0b;
      background:linear-gradient(135deg,#fffbeb,#fef3c7);
    }
    .lab-pin-icon{ font-size:26px; line-height:1; }
    .lab-pin-name{ font-size:11px; font-weight:800; color:#4a3416; }
    .lab-pin-sub{  font-size:9px;  color:#b45309; font-weight:600; }
    .lab-pin-btn{
      margin-top:3px;
      background:#fff;
      color:#5a39c7;
      border:2px solid #b9a6ff;
      box-shadow:0 2px 0 #d9ccff;
      border-radius:8px;
      font-family:'Lexend',sans-serif;
      font-weight:700;
      font-size:11px;
      padding:5px 10px;
      cursor:pointer;
      min-height:32px;
      width:100%;
      transition:opacity .12s;
    }
    .lab-pin-btn:hover{ opacity:.85; }
    .lab-pin-btn:focus-visible{ outline:3px solid #7b6bff; outline-offset:2px; }
    .lab-pin-btn.is-pinned{
      background:#e7e0fb;
      border-color:#cabdf5;
      color:#3a2590;
    }
    .lab-pin-btn.is-capped{
      background:#f3f3f3;
      border-color:#ccc;
      color:#888;
      cursor:default;
      box-shadow:none;
    }

    /* Badge catalogue grid */
    .lab-badge-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:10px;
      margin-bottom:8px;
    }
    .lab-badge-card{
      background:linear-gradient(180deg,#fdf7e0,#f6edcf);
      border:2px solid #ecdba6;
      border-radius:14px;
      padding:12px 10px;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
    }
    .lab-badge-card.is-earned{
      background:#eef2ff;
      border-color:#c7d2fe;
    }
    .lab-badge-card.is-legendary{
      background:#fffbeb;
      border-color:#fcd34d;
    }
    .lab-badge-card.is-legendary.is-earned{
      background:#fffbeb;
      border-color:#f59e0b;
      box-shadow:0 4px 12px rgba(245,158,11,.2);
    }
    /* Locked state: dimmed + grayscale, plus text label (not colour-only) */
    .lab-badge-card.is-locked{
      opacity:.5;
      filter:grayscale(.6);
    }
    .lab-badge-icon{ font-size:28px; line-height:1; }
    .lab-badge-name{ font-size:12px; font-weight:800; color:#312e81; }
    .lab-badge-desc{ font-size:10px; color:#6e5a2a; font-weight:600; line-height:1.4; }
    /* Locked label — visible text on top of the greyscale card (not colour-only) */
    .lab-badge-locked-label{
      font-size:10px;
      font-weight:800;
      color:#888;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-top:2px;
    }

    /* Equipped chip — top right */
    .lab-equipped-chip{
      position:absolute;
      top:8px; right:9px;
      width:22px; height:22px;
      border-radius:50%;
      background:linear-gradient(135deg,#7b6bff,#5a39c7);
      box-shadow:0 3px 8px rgba(90,57,199,.5);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; color:#fff; font-weight:700;
      pointer-events:none;
    }

    /* ── Task 5: Mini-SVG previews for Head / Face / Wings cards ── */
    /* Wrapper fills the 70px preview area; the SVG is the trusted buildSVG output */
    .lab-mini{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .lab-mini svg{
      height:100%;   /* 70 px — shows full character */
      width:auto;
      display:block;
      flex-shrink:0;
      overflow:visible;  /* wings extend outside viewBox */
    }
    /* Face zoom: enlarge and shift up so the face accessory (y ≈ 28–58 SVG units)
       fills the 70 px crop window.
       Math: SVG at 175 px tall, top=-25 px → visible y-range ≈ 17–65 SVG units
       (i.e. (25/175)*120 = 17.1 to (95/175)*120 = 65.1) — captures eyes + all face accessories */
    .lab-mini--face svg{
      height:175px;
      position:absolute;
      top:-25px;
      left:50%;
      transform:translateX(-50%);
    }

    /* ══════════════════════════════════════════════════════════════
       Task 9: Buying flow — modals, badge-locked state, reactions
       ══════════════════════════════════════════════════════════════ */

    /* Badge-locked card — dimmed, not interactive */
    .lab-card.is-badge-locked {
      opacity: .45;
      cursor: default;
    }
    .lab-card-act.is-locked {
      background: #f3f3f3;
      color: #888;
      border-color: #ccc;
      box-shadow: none;
    }

    /* Modal overlay (spec §12.3) */
    .lab-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20,16,34,.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      animation: overlayFade .15s ease both;
    }
    .lab-modal-overlay[hidden] { display: none !important; }

    /* Modal card (spec §12.2) */
    .lab-modal-card {
      background: linear-gradient(180deg,#fffdf4,#f7eecf);
      border: 3px solid #e5d49e;
      border-radius: 24px;
      width: 340px;
      max-width: calc(100vw - 32px);
      padding: 26px 24px 22px;
      animation: modalPop .22s cubic-bezier(.34,1.56,.64,1) both;
      position: relative;
    }
    /* Not-enough variant */
    .lab-modal-not-enough .lab-modal-card { border-color: #f0b8a0; }

    .lab-modal-heading {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: #4a3416;
      margin: 0 0 14px;
    }
    .lab-modal-not-enough .lab-modal-heading { color: #c0392b; }

    .lab-modal-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .lab-modal-preview-swatch {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid #ecdba6;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }
    .lab-modal-item-name {
      font-size: 14px;
      font-weight: 700;
      color: #4a3416;
    }
    .lab-modal-item-cost {
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      color: #6e4f1e;
      margin-top: 3px;
    }
    .lab-modal-balance {
      font-size: 12px;
      color: #9a7a3a;
      background: #fdf6e0;
      border: 1px solid #e5d49e;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 18px;
    }
    .lab-modal-balance strong { color: #4a3416; }

    .lab-modal-actions { display: flex; gap: 10px; }

    .lab-modal-buy {
      flex: 1;
      background: linear-gradient(135deg,#7b6bff,#5a39c7);
      color: #fff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 0 #4226a8;
      font-family: 'Lexend', sans-serif;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 0;
      cursor: pointer;
      min-height: 44px;
      transition: opacity .12s;
    }
    .lab-modal-buy:hover { opacity: .9; }
    .lab-modal-buy:focus-visible { outline: 3px solid #7b6bff; outline-offset: 2px; }

    .lab-modal-cancel, .lab-modal-close {
      background: #fff;
      color: #5a39c7;
      border: 2px solid #b9a6ff;
      border-radius: 12px;
      font-family: 'Lexend', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 16px;
      cursor: pointer;
      min-height: 44px;
      transition: opacity .12s;
    }
    .lab-modal-close { width: 100%; text-align: center; }
    .lab-modal-cancel:hover, .lab-modal-close:hover { opacity: .9; }
    .lab-modal-cancel:focus-visible, .lab-modal-close:focus-visible {
      outline: 3px solid #7b6bff;
      outline-offset: 2px;
    }

    /* Speech bubble — pops above the scientist character */
    #speechBubble {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 2px solid #b9a6ff;
      border-radius: 14px;
      padding: 7px 14px;
      font-family: 'Lexend', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #4a3416;
      white-space: nowrap;
      pointer-events: none;
      animation: speechPop .3s cubic-bezier(.34,1.56,.64,1) both;
      z-index: 500;
    }
    #speechBubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #b9a6ff;
    }
    body.low-stim #speechBubble { display: none !important; }

    /* Burst particle layer (fixed overlay, pointer-events: none) */
    #burstLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 800;
      overflow: hidden;
    }
    .burst-dot {
      position: absolute;
      font-size: 16px;
      line-height: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="labshop">

  <!-- ── Task 9: Confirm-purchase modal ── -->
  <div id="confirmModal" class="lab-modal-overlay" role="dialog" aria-modal="true"
       aria-labelledby="confirmHeading" hidden>
    <div class="lab-modal-card" id="confirmCard">
      <h2 class="lab-modal-heading" id="confirmHeading">Get this item?</h2>
      <div class="lab-modal-preview" id="confirmPreview"></div>
      <div class="lab-modal-balance" id="confirmBalance"></div>
      <div class="lab-modal-actions">
        <button class="lab-modal-cancel" id="confirmCancel" type="button">Cancel</button>
        <button class="lab-modal-buy"    id="confirmBuyBtn" type="button">Buy &amp; Equip</button>

      <div class="lab-modal-preview" id="notEnoughPreview"></div>

         style="font-size:13px;color:#c0392b;margin:0 0 14px;font-weight:600;"></p>

<!-- ── Scripts — same order and attributes as scientist.html ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wordlab-stage.js"></script>
<script src="wordlab-data.js"></script>
<script defer src="wordlab-scientist.js"></script>
<script defer src="wordlab-audio.js"></script>
<script defer src="wordlab-effects.js"></script>
<!-- wordlab-shop-data.js created in Task 3 — 404 is harmless until then -->
<script defer src="wordlab-shop-data.js"></script>

<script>
/* ── WL namespace — page state and boot ──────────────────────── */
const WL = window.WL = {
  scientist: null,
  stats:     null,
  quarks:    0,
  owned:     [],
  activeCat: 'colours'
};

/* Update the quark balance pill (XSS-safe via textContent) */
WL.renderQuarks = function() {
  document.getElementById('quarkValue').textContent =
    (WL.quarks || 0).toLocaleString('en-AU');
};

/* ── Task 2: Stage renderer ──────────────────────────────────────
 * Renders the REAL character via WLScientist.buildSVG — one renderer only.
 * Spec §12.2/§12.3: 180 px wide on radial glow podium with idle-bob.
 * WL.charEl is stored here and reused by Task 9 reactions.
 */
WL.renderStage = function(mood) {
  mood = mood || 'neutral';
  const stage = document.getElementById('stage');
  if (!stage) return;
  if (!WL.scientist || typeof WLScientist === 'undefined') return;
  stage.innerHTML = '';

  // Glowing podium ellipse (decorative — hidden from AT)
  const podium = document.createElement('div');
  podium.className = 'lab-podium';
  podium.setAttribute('aria-hidden', 'true');

  // Character wrapper — SVG string is from our own trusted builder, not user input
  const wrap = document.createElement('div');
  wrap.className = 'lab-charwrap lab-bob';
  wrap.setAttribute('aria-label', 'Your scientist character');
  wrap.setAttribute('role', 'img');
  wrap.innerHTML = WLScientist.buildSVG(WL.scientist, mood); // trusted SVG builder

  WL.charEl = wrap;      // stored for Task 9 reactions

  stage.appendChild(podium);
  stage.appendChild(wrap);

  // Re-apply live particle effect after the character node is replaced.
  // Without this, any previous WLEffects.start() was attached to the old,
  // now-detached DOM node — the effect would silently die on every renderStage call.
  // Use _calm() so body.low-stim, sessionStorage flag, AND prefers-reduced-motion all suppress.
  if (typeof WLEffects !== 'undefined' && WL.scientist && WL.scientist.effect) {
    var _effectId = WL.scientist.effect;
    if (!_calm()) {
      try { WLEffects.stop(WL.charEl); } catch(e) {}
      try { WLEffects.start(_effectId, WL.charEl); } catch(e) {}
    }
  }
};

/* ── Task 2: Stats card renderer ─────────────────────────────────
 * Builds the parchment stats card in #statsCard exactly per spec §12.2.
 * Level + title computation copied verbatim from scientist.html (line 810):
 *   const lvl = sd.level;  (sd.level = getLevel(char.xp))
 * Badge count from scientist.html (line 843): sd.badges.length
 * All text set via textContent (XSS-safe).
 */
WL.renderStats = function() {
  const card = document.getElementById('statsCard');
  if (!card) return;

  // Level/title — scientist.html line 810: const lvl = sd.level;
  // getStudentData() returns data.level = getLevel(char.xp)
  // WordLabData.getLevel is exported (wordlab-data.js line 2888)
  const lvl = WL.level || WordLabData.getLevel(WL.xp || 0);

  const s         = WL.stats || {};
  const correct   = s.totalCorrect  || 0;
  const answered  = s.totalAnswered || 0;
  const sessions  = s.sessions      || 0;
  // Accuracy — spec: round(totalCorrect/totalAnswered*100) or 0
  const acc       = answered ? Math.round(correct / answered * 100) : 0;
  // Badge count — scientist.html line 843: sd.badges.length
  const badgeCount = (WL.badges || []).length;

  card.innerHTML = '';   // safe — clearing our own DOM

  // — Top row: LVL badge + level title + XP to next —
  const top = document.createElement('div');
  top.className = 'lab-stats-top';

  const lvlBadge = document.createElement('div');
  lvlBadge.className = 'lab-lvl-badge';
  lvlBadge.setAttribute('aria-hidden', 'true');   // number repeated in title text
  const lvlNum = document.createElement('span');
  lvlNum.className = 'lab-lvl-num';   // Fredoka applied via class
  lvlNum.textContent = lvl.level;
  lvlBadge.appendChild(lvlNum);

  const meta = document.createElement('div');
  meta.className = 'lab-level-meta';

  const titleEl = document.createElement('div');
  titleEl.className = 'lab-level-title';
  // scientist.html line 833: Level ${lvl.level} · ${lvl.title}
  titleEl.textContent = 'Level ' + lvl.level + ' · ' + lvl.title;

  const nextEl = document.createElement('div');
  nextEl.className = 'lab-xp-next';
  // scientist.html line 835: ${lvl.xpToNext} XP to next
  nextEl.textContent = lvl.xpToNext + ' XP to next';

  meta.appendChild(titleEl);
  meta.appendChild(nextEl);
  top.appendChild(lvlBadge);
  top.appendChild(meta);
  card.appendChild(top);

  // — XP bar — spec: track #e7d7a6, fill purple gradient; progress from lvl.progress
  // scientist.html line 836: width:${lvl.progress}%
  const barWrap = document.createElement('div');
  barWrap.className = 'lab-xp-bar-wrap';
  const track = document.createElement('div');
  track.className = 'lab-xp-track';
  track.setAttribute('role', 'progressbar');
  track.setAttribute('aria-valuenow', String(lvl.progress));
  track.setAttribute('aria-valuemin', '0');
  track.setAttribute('aria-valuemax', '100');
  track.setAttribute('aria-label', 'XP progress to next level, ' + lvl.progress + '%');
  const fill = document.createElement('div');
  fill.className = 'lab-xp-fill';
  fill.style.width = lvl.progress + '%';
  track.appendChild(fill);
  barWrap.appendChild(track);
  card.appendChild(barWrap);

  // — 4-tile stat grid — spec §12.2: Correct #3f8a4a · Accuracy #6d4ad6 · Sessions #2f8fd8 · Badges #e0a02a
  const grid = document.createElement('div');
  grid.className = 'lab-stat-grid';
  grid.setAttribute('aria-label', 'Statistics');

  [
    { label: 'Correct',  value: correct,          colour: '#3f8a4a' },
    { label: 'Accuracy', value: acc + '%',   colour: '#6d4ad6' },  // % without template literal
    { label: 'Sessions', value: sessions,          colour: '#2f8fd8' },
    { label: 'Badges',   value: badgeCount,        colour: '#e0a02a' },
  ].forEach(function(t) {
    const tile = document.createElement('div');
    tile.className = 'lab-stat-tile';
    const num = document.createElement('span');
    num.className = 'lab-stat-num';   // Fredoka weight via .fred applied in CSS
    num.style.color = t.colour;
    num.textContent = t.value;
    const lbl = document.createElement('span');
    lbl.className = 'lab-stat-lbl';
    lbl.textContent = t.label;        // text label — never colour-only (WCAG)
    tile.appendChild(num);
    tile.appendChild(lbl);
    grid.appendChild(tile);
  });
  card.appendChild(grid);
};

/* Boot — load student data and hydrate the top bar */
WL.boot = async function() {
  if (typeof WordLabData === 'undefined') {
    // Non-deferred scripts not yet executed — retry
    setTimeout(WL.boot, 100);
    return;
  }

  /* Auth guard: redirect to landing if no student session */
  const session = WordLabData.getSession();
  if (!session) {
    window.location.href = 'landing.html';
    return;
  }

  /* Low-stim: refresh setting from class DB record and apply body.low-stim.
   * wordlab-data.js auto-applies from sessionStorage at parse time (synchronous),
   * but calling loadLowStimMode here refreshes from the DB so changes the teacher
   * made since last login are picked up. Fire-and-forget: no need to await here
   * since rendering proceeds regardless of the outcome. */
  if (session.classId && typeof WordLabData.loadLowStimMode === 'function') {
    WordLabData.loadLowStimMode(session.classId).catch(function() {});
  }

  const data = await WordLabData.getStudentData();
  if (!data) {
    window.location.href = 'landing.html';
    return;
  }

  WL.scientist = data.scientist || {};
  WL.stats     = data.stats    || {};
  WL.quarks    = data.quarks   || 0;
  WL.xp        = data.xp      || 0;
  WL.level     = data.level;            // { level, title, progress, xpToNext } — from getLevel()
  WL.badges    = data.badges   || [];   // array of earned badge IDs — scientist.html: sd.badges.length
  WL.owned     = WL.scientist.owned || [];

  /* XSS-safe: textContent only */
  document.getElementById('studentName').textContent =
    data.name || session.studentName || 'Scientist';

  WL.renderQuarks();

  /* Later tasks attach WL.renderStage / WL.renderStats / WL.renderShop */
  if (typeof WL.renderStage === 'function') WL.renderStage();
  if (typeof WL.renderStats  === 'function') WL.renderStats();
  if (typeof WL.renderShop   === 'function') WL.renderShop();
};

document.addEventListener('DOMContentLoaded', WL.boot);

/* ══════════════════════════════════════════════════════════════════
   Task 4: Category pills + Colours / Patterns grids + live equip
   ══════════════════════════════════════════════════════════════════

   ownKey format — confirmed from scientist.html:
     colours / patterns / heads / faces / wings → bare item.id     (lines 862,869,885,893,900)
     dances   → 'dance_'  + item.id                                (line 1136)
     effects  → 'effect_' + item.id                                (line 1171)
     custom   → 'custom_' + item.id                                (line 1416)

   field names confirmed from scientist.html renderShopSection calls (lines 1002–1006):
     coatColor, coatPattern, head, face, wings, effect
*/

/* ── WL.CATS — 9 Phase 1 categories ────────────────────────────── */
WL.CATS = [
  {id:'colours', label:'Colours', icon:'🎨', field:'coatColor',   src:function(){ return WLShopData.colours;  }},
  {id:'patterns',label:'Patterns',icon:'▦',  field:'coatPattern', src:function(){ return WLShopData.patterns; }},
  {id:'heads',   label:'Head',    icon:'🎩', field:'head',         src:function(){ return WLShopData.heads;    }},
  {id:'faces',   label:'Face',    icon:'👓', field:'face',         src:function(){ return WLShopData.faces;    }},
  {id:'wings',   label:'Wings',   icon:'🪽', field:'wings',        src:function(){ return WLShopData.wings;    }},
  {id:'effects', label:'Effects', icon:'✨', field:'effect',       src:function(){ return WL.effectList ? WL.effectList() : []; }},
  {id:'dances',  label:'Dances',  icon:'💃', src:function(){ return (typeof WLShopData !== 'undefined') ? WLShopData.dances : []; }},  // Task 6
  {id:'badges',  label:'Badges',  icon:'🏅'},   // Task 7
  {id:'custom',  label:'Custom',  icon:'🎨'},   // Task 8
];

/* ── WL.effectList — Task 6: adapter over WLEffects.EFFECTS ───────
 * Maps each WLEffects.EFFECTS entry to a flat item object compatible with
 * WL.cardEl. Icons sourced from WLEffects.EFFECTS[id].icon — confirmed
 * from scientist.html renderEffectsSection (each card shows eff.icon at 28px).
 * Generic ✨ fallback used if an entry lacks an icon property.
 */
WL.effectList = function() {
  if (typeof WLEffects === 'undefined' || !WLEffects.EFFECTS) return [];
  return Object.entries(WLEffects.EFFECTS).map(function(entry) {
    var id = entry[0], e = entry[1];
    return {
      id:       id,
      name:     e.name,
      cost:     e.cost     || 0,
      free:     (e.cost    || 0) === 0,
      rarity:   e.rarity   || 'common',
      requires: e.requiresBadge || null,
      icon:     e.icon     || '✨',
      desc:     e.desc     || '',
    };
  });
};

/* ── WL.ownKey — must EXACTLY match scientist.html's owned[] keys ─ */
WL.ownKey = function(cat, item) {
  if (cat.id === 'dances')  return 'dance_'  + item.id;
  if (cat.id === 'effects') return 'effect_' + item.id;
  if (cat.id === 'custom')  return 'custom_' + item.id;
  return item.id;   // colours, patterns, heads, faces, wings: bare id
};

/* ── Swatch helpers ─────────────────────────────────────────────── */

/* _colourBg: CSS background value for a coat-colour swatch.
 * Matches scientist.html line 863 rainbow/holographic logic.
 */
WL._colourBg = function(item) {
  if (item.id === 'rainbow')
    return 'linear-gradient(135deg,#f87171,#fb923c,#facc15,#4ade80,#60a5fa,#a78bfa)';
  if (item.id === 'holographic')
    return 'linear-gradient(135deg,#c0d0ff,#d4b0ff,#ffd4f8,#ffa8d0,#ffb8a8,#ffe0a0)';
  return item.id;   // hex colour string
};

/* _patternBg: CSS background-image value for a pattern swatch.
 * Uses SVG data URIs that reuse the EXACT pattern shapes from wordlab-scientist.js
 * (lines 166–191) so the swatch preview matches the worn coat result.
 * Returns null for 'plain' (no overlay needed).
 */
WL._patternBg = function(patId) {
  if (patId === 'plain') return null;
  var base = '#e8e8e8';
  var pats = {
    stripes:
      '<pattern id="p" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">' +
      '<rect width="8" height="8" fill="' + base + '"/>' +

      '<path d="M0,4 L6,0 L12,4" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/></pattern>',
    hearts:

      '<path d="M6,10 C2,7 0,4 3,2 C5,1 6,3 6,3 C6,3 7,1 9,2 C12,4 10,7 6,10Z"' +
      ' fill="rgba(0,0,0,0.15)"/></pattern>',
    lightning:
      '<pattern id="p" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">' +

      '<path d="M2,0 Q5,5 8,10 Q5,15 2,20" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>' +
      '<path d="M8,0 Q5,5 2,10 Q5,15 8,20" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>' +
      '<line x1="3" y1="5" x2="7" y2="5" stroke="rgba(0,0,0,0.1)" stroke-width="0.8"/>' +

      '<pattern id="p" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">' +
      '<rect width="12" height="12" fill="' + base + '"/>' +
      '<line x1="0" y1="4" x2="12" y2="4" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>' +

      '<line x1="4" y1="0" x2="4" y2="12" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>' +
      '<line x1="10" y1="0" x2="10" y2="12" stroke="rgba(0,0,0,0.1)" stroke-width="1"/></pattern>',
  };
  if (!pats[patId]) return null;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">' +
            '<defs>' + pats[patId] + '</defs>' +
            '<rect width="60" height="60" fill="url(#p)"/></svg>';
  return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
};

/* ── WL.miniPreview — mini real-SVG scientist for Head/Face/Wings ──
 * Builds a minimal scientist object (neutral outfit, only the single
 * accessory from `item` set), renders it via WLScientist.buildSVG,
 * and wraps the result in a .lab-mini div sized to the 70 px preview area.
 * For 'faces': adds .lab-mini--face to zoom/crop to the face region.
 * innerHTML is intentional here — the SVG comes only from our trusted
 * WLScientist.buildSVG builder, never from user-supplied strings.
 */
WL.miniPreview = function(cat, item) {
  if (typeof WLScientist === 'undefined') { return document.createElement('span'); }

  /* Minimal scientist: default skin, plain white coat, no accessories */
  var base = {
    skinTone:    (WL.scientist && WL.scientist.skinTone) || '#FDBCB4',
    coatColor:   '#ffffff',
    coatPattern: 'plain',
    head:        null,
    face:        null,
    wings:       null,
  };

  /* Set ONLY the field for this category (skip 'none' or falsy — null shows bare scientist) */
  if (item.id && item.id !== 'none') {
    base[cat.field] = item.id;
  }

  var wrap = document.createElement('div');
  /* .lab-mini--face triggers the CSS zoom/crop that reveals face accessories */
  wrap.className = 'lab-mini' + (cat.id === 'faces' ? ' lab-mini--face' : '');
  wrap.setAttribute('aria-hidden', 'true');
  wrap.innerHTML = WLScientist.buildSVG(base, 'neutral'); // trusted SVG builder — not user input
  return wrap;
};

/* ── WL.cardEl — builds one card <button> ───────────────────────── */
WL.cardEl = function(item, cat) {
  var isFree   = !!(item.free || item.cost === 0);
  var isOwned  = isFree || WL.owned.includes(WL.ownKey(cat, item));

  /* ── Task 9: Badge-gating — matches scientist.html renderShopSection (lines 1097-1107)
   * and renderEffectsSection (lines 1172-1181).
   * Effects expose badge via item.requires; all other categories use item.requiresBadge.
   * Rule: if item has a requiresBadge/requires field AND student doesn't hold that badge
   *       → item is badge-locked: cannot be equipped OR purchased with quarks.
   */
  var reqBadge = (cat.id === 'effects') ? item.requires : item.requiresBadge;
  var hasReqBadge = !reqBadge || (WL.badges && WL.badges.includes(reqBadge));
  var isLocked = !hasReqBadge;   // true = badge gate is blocking

  // Dances: equipped state is keyed per-tier, not a single scientist field.
  // Task 6: (WL.scientist.dances||{})[item.tier] === item.id
  var equipped;
  if (cat.id === 'dances') {
    var dancesMap = (WL.scientist && WL.scientist.dances) || {};
    equipped = (dancesMap[item.tier] === item.id);
  } else {
    equipped = !!(WL.scientist && cat.field && WL.scientist[cat.field] === item.id);
  }
  var rarity   = WLShopData.rarityOf(item);  // 'legendary'|'epic'|'rare'|'common'

  /* Outer card — a real <button> with role="listitem" (grid has role="list") */
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('role', 'listitem');
  btn.className = 'lab-card' +
    (equipped           ? ' is-equipped'     : '') +
    (isLocked           ? ' is-badge-locked' : '') +
    (rarity==='legendary'? ' is-legendary'   : '') +
    (rarity==='epic'     ? ' is-epic'        : '');

  /* Staggered float animation: delay is random-feeling (idx not available here, id used).
   * Duration varies per card per spec §12.4: (3 + (idLen % 4) * 0.4)s — gives 3.0–4.2 s range.
   * Delay: (idLen % 5) * 0.2s — small phase offset so not all cards move in unison. */
  var idLen = item.id.length;
  btn.style.animationDuration = (3 + (idLen % 4) * 0.4).toFixed(1) + 's';
  btn.style.animationDelay    = ((idLen % 5) * 0.2).toFixed(1) + 's';

  /* aria-label: name + price + state (no colour-only meaning) */
  var priceLabel = isFree ? 'free' : item.cost + ' quarks';
  var stateLabel = isLocked  ? 'badge locked'
                : equipped   ? 'equipped'
                : isOwned    ? 'owned'
                : 'not owned';
  btn.setAttribute('aria-label', item.name + ', ' + priceLabel + ', ' + stateLabel);

  /* ── Rarity badge (top-left, only for non-common) ── */
  if (rarity !== 'common') {
    var badge = document.createElement('span');
    badge.className = 'lab-rarity lab-rarity-' + rarity;
    badge.setAttribute('aria-hidden', 'true');  // conveyed by aria-label above
    badge.textContent = rarity.charAt(0).toUpperCase() + rarity.slice(1);
    btn.appendChild(badge);
  }

  /* ── Equipped chip (top-right) ── */
  if (equipped) {
    var chip = document.createElement('span');
    chip.className = 'lab-equipped-chip';
    chip.setAttribute('aria-hidden', 'true');
    chip.textContent = '✓';
    btn.appendChild(chip);
  }

  /* ── Preview area (70px per spec §12.3) ── */
  var preview = document.createElement('div');
  preview.className = 'lab-card-preview';

  if (cat.id === 'colours') {
    var swatch = document.createElement('div');
    swatch.className = 'lab-swatch';
    swatch.style.background = WL._colourBg(item);
    preview.appendChild(swatch);

  } else if (cat.id === 'patterns') {
    var ps = document.createElement('div');
    ps.className = 'lab-swatch-pattern';
    var bgImg = WL._patternBg(item.id);
    if (bgImg) ps.style.backgroundImage = bgImg;
    preview.appendChild(ps);

  } else if ((cat.id === 'heads' || cat.id === 'faces' || cat.id === 'wings') && item.id && item.id !== 'none') {
    /* Task 5: real mini-SVG preview via WLScientist.buildSVG (one renderer only) */
    preview.appendChild(WL.miniPreview(cat, item));

  } else if (cat.id === 'heads' || cat.id === 'faces' || cat.id === 'wings') {
    /* 'None' item — no accessory equipped; show no-entry glyph */
    var noneGlyph = document.createElement('span');
    noneGlyph.className = 'lab-card-icon';
    noneGlyph.setAttribute('aria-hidden', 'true');
    noneGlyph.textContent = '🚫';
    preview.appendChild(noneGlyph);

  } else {
    /* Effects / Dances / Custom — icon fallback (Tasks 6–8) */
    var iconFbEl = document.createElement('span');
    iconFbEl.className = 'lab-card-icon';
    iconFbEl.setAttribute('aria-hidden', 'true');
    iconFbEl.textContent = item.icon || '?';
    preview.appendChild(iconFbEl);
  }
  btn.appendChild(preview);

  /* ── Item name (XSS-safe via textContent) ── */
  var nameEl = document.createElement('div');
  nameEl.className = 'lab-card-name';
  nameEl.textContent = item.name;
  btn.appendChild(nameEl);

  /* ── Price (Fredoka accent) ── */
  var priceEl = document.createElement('div');
  priceEl.className = 'lab-card-price' + (isFree ? ' is-free' : '');
  priceEl.textContent = isFree ? 'FREE' : '⚛ ' + item.cost;
  btn.appendChild(priceEl);

  /* ── Action indicator (<div> styled as button — avoids nested <button> HTML violation) ── */
  var actEl = document.createElement('div');
  var actClass = 'lab-card-act';
  var actText;
  if (isLocked) {
    actClass += ' is-locked';
    actText = '🔒 Badge needed';
  } else if (equipped) {
    actClass += ' is-equipped';
    actText = '✓ Equipped';
  } else if (isOwned) {
    actText = 'Equip';
  } else {
    actText = 'Get it';
  }
  actEl.className = actClass;
  actEl.setAttribute('aria-hidden', 'true');  // state conveyed by card's aria-label
  actEl.textContent = actText;
  btn.appendChild(actEl);

  /* Click handler — passes btn as triggerEl so focus returns to card after modal closes */
  btn.addEventListener('click', function() { WL.select(cat, item, btn); });

  return btn;
};

/* ── WL.renderPills — builds pill buttons into #pillRail ─────────── */
WL.renderPills = function() {
  var rail = document.getElementById('pillRail');
  if (!rail) return;
  rail.innerHTML = '';   // safe — clearing our own DOM

  WL.CATS.forEach(function(cat) {
    var active = (cat.id === WL.activeCat);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lab-pill' + (active ? ' lab-pill-active' : '');
    btn.setAttribute('data-cat', cat.id);   // CRITICAL: used by low-stim CSS selectors
    btn.id = 'pill-' + cat.id;
    if (active) btn.setAttribute('aria-current', 'true');

    var iconSpan = document.createElement('span');
    iconSpan.setAttribute('aria-hidden', 'true');
    iconSpan.textContent = cat.icon;

    var lblSpan = document.createElement('span');
    lblSpan.textContent = cat.label;

    btn.appendChild(iconSpan);
    btn.appendChild(document.createTextNode(' '));
    btn.appendChild(lblSpan);

    btn.addEventListener('click', function() { WL.setCategory(cat.id); });
    rail.appendChild(btn);
  });
};

/* ── WL.renderShopHeader ─────────────────────────────────────────── */

/* ── WL.renderDancesGrid — Task 6: dances grouped by tier ───────────
 * Tier keys from scientist.html shopEquipDance / WLShopData.dancesByTier:
 *   'correct' | 'streak3' | 'streak5' | 'streak10' | 'streak15' | 'streak30'
 * Each tier gets a section heading (grid-column: 1/-1) followed by dance cards.
 */
WL.renderDancesGrid = function(grid, cat) {
  var tierLabels = {
    correct:  'Correct Answer',
    streak3:  '3+ Answer Streak',
    streak5:  '5+ Answer Streak',
    streak10: '10+ Answer Streak',
    streak15: '15+ Answer Streak',
    streak30: '30+ Answer Streak — Legendary',
  };
  var tierOrder = ['correct','streak3','streak5','streak10','streak15','streak30'];
  tierOrder.forEach(function(tier) {
    var tierDances = WLShopData.dancesByTier[tier];
    if (!tierDances || tierDances.length === 0) return;

    // Tier section heading — spans all grid columns
    var heading = document.createElement('div');
    heading.style.cssText = 'grid-column:1/-1;font-size:11px;font-weight:800;' +
      'color:#6a4a1a;text-transform:uppercase;letter-spacing:.07em;' +
      'padding:14px 0 5px;border-bottom:1.5px solid #e5d49e;margin-bottom:2px;';
    heading.textContent = tierLabels[tier] || tier;
    heading.setAttribute('aria-hidden', 'true');  // tier announced via card aria-labels
    grid.appendChild(heading);

    // Dance cards for this tier
    tierDances.forEach(function(item) {
      grid.appendChild(WL.cardEl(item, cat));
    });
  });
};

/* ── WL.renderGrid ───────────────────────────────────────────────── */
WL.renderGrid = function() {
  var cat  = WL.CATS.find(function(c) { return c.id === WL.activeCat; });
  var grid = document.getElementById('itemGrid');
  if (!grid) return;
  grid.innerHTML = '';   // safe — clearing our own DOM

  // Task 6: Dances — tier-grouped renderer (separate from flat-card loop)
  if (WL.activeCat === 'dances' && typeof WLShopData !== 'undefined') {
    WL.renderDancesGrid(grid, cat);
    return;
  }

  // Task 7: Badges — dedicated renderer
  if (WL.activeCat === 'badges') {
    WL.renderBadges();
    return;
  }

  // Task 8: Custom teacher-made items — async load + dedicated renderer
  if (WL.activeCat === 'custom') {
    WL.loadCustom().then(function() { WL.renderCustom(); });
    return;
  }

  if (!cat || !cat.src) {
    var stub = document.createElement('p');
    stub.style.cssText = 'color:#9a7a3a;font-size:13px;padding:20px 0;grid-column:1/-1;';
    stub.textContent = 'Nothing here yet.';
    grid.appendChild(stub);
    return;
  }

  var items = cat.src();
  if (!items || items.length === 0) {
    var empty = document.createElement('p');
    empty.style.cssText = 'color:#9a7a3a;font-size:13px;padding:20px 0;grid-column:1/-1;';
    empty.textContent = 'Nothing here yet.';
    grid.appendChild(empty);
    return;
  }

  items.forEach(function(item) {
    grid.appendChild(WL.cardEl(item, cat));
  });
};

/* ── Task 7: WL.togglePin / WL.unpinBadge ───────────────────────
 * Ported from scientist.html pinBadge() / unpinBadge() (lines 1294–1311).
 * Uses WL.scientist (already in memory) + saveScientist, then re-renders
 * both the grid (pin buttons update) and the stage (coat pins appear).
 */
WL.togglePin = async function(badgeId) {
  var pins = (WL.scientist.displayBadges || []).slice();
  if (pins.includes(badgeId)) {
    // Unpin
    pins = pins.filter(function(id) { return id !== badgeId; });
  } else {
    // Pin — enforce 3-cap
    if (pins.length >= 3) return;
    pins.push(badgeId);
  }
  WL.scientist.displayBadges = pins;
  try {
    await WordLabData.saveScientist({ displayBadges: pins });
  } catch(e) {
    console.error('[WL.togglePin] saveScientist failed:', e);
  }
  // Re-render stage so pins appear/disappear on coat; re-render grid to update buttons
  WL.renderStage();
  WL.renderGrid();
};

/* ── Task 7: WL.renderBadges ────────────────────────────────────
 * Ported from scientist.html tab-badges (lines 914–993) and pinBadge /
 * unpinBadge helpers. Restyled to the parchment grid. Locked badges
 * show a text "Locked" label (not colour-only). All text via textContent.
 */
WL.renderBadges = function() {
  var grid = document.getElementById('itemGrid');
  if (!grid) return;
  grid.innerHTML = '';   // safe — clearing our own DOM

  var wrap = document.createElement('div');
  wrap.className = 'lab-badges-wrap';

  var sci    = WL.scientist || {};
  var pins   = (sci.displayBadges || []).slice();
  var earned = WL.badges || [];  // array of badge IDs earned — loaded in WL.boot()

  // ── Section 1: Badge Pins ──────────────────────────────────────
  var pinTitle = document.createElement('div');
  pinTitle.className = 'lab-badges-section-title';
  pinTitle.textContent = '📌 Badge Pins — pin up to 3 on your lab coat';
  wrap.appendChild(pinTitle);

  var pinsGrid = document.createElement('div');
  pinsGrid.className = 'lab-pins-grid';
  pinsGrid.setAttribute('role', 'list');

  // Streak Flame — always available (same as scientist.html)
  var streakDays = 0;
  try { streakDays = WordLabData.updateDailyStreak().count || 0; } catch(e) {}
  var flameLabel     = streakDays > 0 ? streakDays + ' day streak' : 'No streak yet';
  var flameIntensity = streakDays >= 30 ? 'Legendary' :
                       streakDays >= 14 ? 'Blazing'   :
                       streakDays >= 7  ? 'Hot'        :
                       streakDays >= 3  ? 'Warming'   : 'Spark';
  var flamePinned = pins.includes('streak_flame');
  var flameCard = document.createElement('div');
  flameCard.className = 'lab-pin-card' + (flamePinned ? ' is-pinned' : '');
  flameCard.setAttribute('role', 'listitem');

  var flameIcon = document.createElement('div');
  flameIcon.className = 'lab-pin-icon';
  flameIcon.textContent = '🔥';

  var flameName = document.createElement('div');
  flameName.className = 'lab-pin-name';
  flameName.textContent = 'Streak Flame';

  var flameSub = document.createElement('div');
  flameSub.className = 'lab-pin-sub';
  flameSub.textContent = flameIntensity + ' — ' + flameLabel;

  flameCard.appendChild(flameIcon);
  flameCard.appendChild(flameName);
  flameCard.appendChild(flameSub);

  var flameBtn = document.createElement('button');
  if (flamePinned) {
    flameBtn.className = 'lab-pin-btn is-pinned';
    flameBtn.textContent = '📌 Pinned';
  } else if (pins.length < 3) {
    flameBtn.className = 'lab-pin-btn';
    flameBtn.textContent = 'Pin';
  } else {
    flameBtn.className = 'lab-pin-btn is-capped';
    flameBtn.textContent = '3 pinned';
    flameBtn.setAttribute('aria-disabled', 'true');
    flameBtn.disabled = true;
  }
  flameBtn.setAttribute('aria-label', (flamePinned ? 'Unpin' : 'Pin') + ' Streak Flame badge');
  (function(id) {
    flameBtn.addEventListener('click', function() { WL.togglePin(id); });
  })('streak_flame');
  flameCard.appendChild(flameBtn);
  pinsGrid.appendChild(flameCard);

  // Earned badges — available to pin
  var allBadgeDefs = [].concat(
    (typeof WordLabData !== 'undefined' && WordLabData.ALL_BADGES)        || [],
    (typeof WordLabData !== 'undefined' && WordLabData.LEGENDARY_BADGES)  || []
  );
  var earnedDefs = allBadgeDefs.filter(function(b) { return earned.includes(b.id); });

  earnedDefs.forEach(function(b) {
    var isPinned = pins.includes(b.id);
    var card = document.createElement('div');
    card.className = 'lab-pin-card' + (isPinned ? ' is-pinned' : '');
    card.setAttribute('role', 'listitem');

    var icon = document.createElement('div');
    icon.className = 'lab-pin-icon';
    icon.textContent = b.icon;

    var name = document.createElement('div');
    name.className = 'lab-pin-name';
    name.textContent = b.label;

    var sub = document.createElement('div');
    sub.className = 'lab-pin-sub';
    sub.textContent = 'Earned';

    var btn = document.createElement('button');
    if (isPinned) {
      btn.className = 'lab-pin-btn is-pinned';
      btn.textContent = '📌 Pinned';
    } else if (pins.length < 3) {
      btn.className = 'lab-pin-btn';
      btn.textContent = 'Pin';
    } else {
      btn.className = 'lab-pin-btn is-capped';
      btn.textContent = '3 pinned';
      btn.setAttribute('aria-disabled', 'true');
      btn.disabled = true;
    }
    btn.setAttribute('aria-label', (isPinned ? 'Unpin' : 'Pin') + ' ' + b.label + ' badge');
    (function(id) {
      btn.addEventListener('click', function() { WL.togglePin(id); });
    })(b.id);

    card.appendChild(icon);
    card.appendChild(name);
    card.appendChild(sub);
    card.appendChild(btn);
    pinsGrid.appendChild(card);
  });

  if (earnedDefs.length === 0 && !earned.includes('streak_flame')) {
    var noBadges = document.createElement('div');
    noBadges.style.cssText = 'color:#9a7a3a;font-size:12px;font-weight:700;padding:10px;grid-column:1/-1;';
    noBadges.textContent = 'Earn badges to pin more on your coat!';
    pinsGrid.appendChild(noBadges);
  }

  wrap.appendChild(pinsGrid);

/* ── Task 8: Custom teacher-made items ───────────────────────────────
 *
 * WL._customItemsData: id → {item_type, image_data} cache
 *   (image_data is a resolved URL or base64 — no extra DB call in equipCustom)
 * WL.customItems: filtered array of visible shop_items (null = not yet loaded)
 *
 * Sources:
 *   loadCustom  ← scientist.html loadCustomShopItems()      lines 1352–1430
 *   equipCustom ← scientist.html equipCustomItem()           lines 1527–1557
 */

WL._customItemsData = {};
WL.customItems      = null;   // null = not yet fetched

/* WL.loadCustom — fetches shop_items once, caches result.
 * Exact select columns, active/seasonal/limited filter, and milestone
 * auto-unlock ported verbatim from scientist.html (lines 1364–1430).
 */
WL.loadCustom = async function() {
  if (WL.customItems !== null) return;   // already loaded — use cache

  var items;
  try {
    var result = await WordLabData._sb
      .from('shop_items')
      .select('id,name,item_type,rarity,unlock_method,quark_cost,is_active,available_from,available_until,milestone_type,milestone_threshold,secret_code,limited_days,release_date,image_url,image_data')
      .eq('is_active', true);
    if (result.error) throw result.error;
    items = result.data || [];
  } catch(e) {
    WL.customItems = [];   // mark as attempted so we don't retry on every click
    return;
  }

  // Populate image cache so WL.equipCustom can find image_data without another DB call
  WL._customItemsData = {};
  items.forEach(function(item) {
    var url = item.image_url && item.image_url.trim() !== 'null' && item.image_url.startsWith('http')
      ? item.image_url.trim() : null;
    WL._customItemsData[item.id] = { item_type: item.item_type, image_data: url || item.image_data };
  });

  var today     = new Date();
  var dayOfWk   = today.getDay();   // 0=Sun, 6=Sat
  var isWeekend = (dayOfWk === 0 || dayOfWk === 6);

  var visible = items.filter(function(item) {
    var m = item.unlock_method;
    if (m === 'purchase' || m === 'gifted' || m === 'milestone' || m === 'secret_code') return true;
    if (m === 'seasonal') {
      var from  = item.available_from  ? new Date(item.available_from)  : null;
      var until = item.available_until ? new Date(item.available_until) : null;
      return (!from || today >= from) && (!until || today <= until);
    }
    if (m === 'weekend') return isWeekend;
    if (m === 'limited') {
      var release = item.release_date ? new Date(item.release_date) : null;
      if (!release) return false;
      var days   = item.limited_days || 30;
      var expiry = new Date(release.getTime() + days * 86400000);
      return today <= expiry;
    }
    return true;
  });

  // Auto-unlock milestone items the student has already earned
  var stats = WL.stats || {};
  var milestoneUnlocked = [];
  visible.forEach(function(item) {
    if (item.unlock_method !== 'milestone') return;
    if (WL.owned.includes('custom_' + item.id)) return;
    var mt     = item.milestone_type || 'totalCorrect';
    var thresh = item.milestone_threshold || 0;
    var val    = stats[mt] || 0;
    if (val >= thresh) milestoneUnlocked.push(item.id);
  });
  if (milestoneUnlocked.length > 0) {
    var newOwned = WL.owned.slice();
    milestoneUnlocked.forEach(function(id) { newOwned.push('custom_' + id); });
    WordLabData.saveScientist({ owned: newOwned }).catch(function() {});
    milestoneUnlocked.forEach(function(id) { WL.owned.push('custom_' + id); });
  }

  WL.customItems = visible;
};

/* WL.renderCustom — renders WL.customItems into #itemGrid using DOM methods.
 * XSS-safe: all user-supplied strings (names, rarity) written via textContent.
 * Images set via img.src property — never via raw innerHTML.
 * Card style matches the parchment .lab-card used by WL.cardEl.
 */
WL.renderCustom = function() {
  var grid = document.getElementById('itemGrid');
  if (!grid) return;
  grid.innerHTML = '';   // safe — clearing our own DOM

  var items = WL.customItems || [];
  if (items.length === 0) {
    var msg = document.createElement('p');
    msg.style.cssText = 'color:#9a7a3a;font-size:13px;padding:20px 0;grid-column:1/-1;text-align:center;line-height:1.6;';
    msg.textContent = 'No custom items yet. Your teacher can create them in the Item Creator!';
    grid.appendChild(msg);
    return;
  }

  var rarityCardClass  = { legendary:'is-legendary', epic:'is-epic', rare:'is-rare' };
  var rarityLabelClass = { legendary:'lab-rarity-legendary', epic:'lab-rarity-epic', rare:'lab-rarity-rare' };

  var customSlots = (WL.scientist && WL.scientist.customSlots) || {};
  var catObj = WL.CATS.find(function(c) { return c.id === 'custom'; });

  items.forEach(function(item, idx) {
    var isOwned   = WL.owned.includes('custom_' + item.id);
    var isFree    = (item.quark_cost === 0 && item.unlock_method !== 'milestone' && item.unlock_method !== 'gifted');
    var isEquipped = (customSlots[item.item_type] === item.id);

    // ── Card button ──────────────────────────────────────────────────
    var card = document.createElement('button');
    card.className = 'lab-card' +
      (rarityCardClass[item.rarity] ? ' ' + rarityCardClass[item.rarity] : '') +
      (isEquipped ? ' is-equipped' : '');
    card.style.setProperty('--card-delay', (idx * 0.18) + 's');
    card.setAttribute('type', 'button');
    card.setAttribute('role', 'listitem');  // grid has role="list"
    card.setAttribute('aria-label',
      item.name + (isEquipped ? ' (equipped)' : (isOwned || isFree ? ' (owned)' : '')));

    // ── Rarity badge — top left (not for common; colour is supplemented by text) ──
    if (item.rarity && item.rarity !== 'common') {
      var badge = document.createElement('div');
      badge.className = 'lab-rarity ' + (rarityLabelClass[item.rarity] || '');
      badge.setAttribute('aria-hidden', 'true');
      badge.textContent = item.rarity;   // textContent — XSS-safe
      card.appendChild(badge);
    }

    // ── Equipped chip — top right ─────────────────────────────────────
    if (isEquipped) {
      var chip = document.createElement('div');
      chip.className = 'lab-equipped-chip';
      chip.setAttribute('aria-hidden', 'true');
      chip.textContent = '✓';
      card.appendChild(chip);
    }

    // ── Image preview ─────────────────────────────────────────────────
    var previewWrap = document.createElement('div');
    previewWrap.className = 'lab-card-preview';

    var rawUrl = item.image_url && item.image_url.trim() !== 'null' && item.image_url.startsWith('http')
      ? item.image_url.trim() : null;
    var imgSrc = rawUrl || item.image_data;
    if (imgSrc) {
      var img = document.createElement('img');
      img.src   = imgSrc;           // set as property — never via innerHTML
      img.alt   = '';               // decorative; label is on the card <button>
      img.style.cssText = 'width:60px;height:60px;object-fit:contain;border-radius:8px;';
      previewWrap.appendChild(img);
    } else {
      var placeholder = document.createElement('div');
      placeholder.className = 'lab-card-icon';
      placeholder.setAttribute('aria-hidden', 'true');
      placeholder.textContent = '🎨';
      previewWrap.appendChild(placeholder);
    }
    card.appendChild(previewWrap);

    // ── Item name (textContent — XSS-safe) ────────────────────────────
    var nameEl = document.createElement('div');
    nameEl.className = 'lab-card-name';
    nameEl.textContent = item.name;   // textContent — XSS-safe
    card.appendChild(nameEl);

    // ── Rarity line ───────────────────────────────────────────────────
    if (item.rarity) {
      var rarityLine = document.createElement('div');
      rarityLine.className = 'lab-card-price';
      rarityLine.setAttribute('aria-hidden', 'true');
      rarityLine.textContent = item.rarity.charAt(0).toUpperCase() + item.rarity.slice(1);
      card.appendChild(rarityLine);
    }

    // ── Action indicator ──────────────────────────────────────────────
    var act = document.createElement('div');
    act.className = 'lab-card-act' + (isEquipped ? ' is-equipped' : '');
    act.setAttribute('aria-hidden', 'true');

    if (isEquipped) {
      act.textContent = '✓ Equipped';
    } else if (isOwned || isFree) {
      act.textContent = 'Equip';
    } else if (item.unlock_method === 'gifted') {
      act.textContent = '🎁 Teacher gift';
    } else if (item.unlock_method === 'milestone') {
      var mt     = item.milestone_type || 'totalCorrect';
      var thresh = item.milestone_threshold || 0;
      var prog   = (WL.stats || {})[mt] || 0;
      act.textContent = prog >= thresh ? '🏅 Unlocked' : '🏅 ' + prog + '/' + thresh;
    } else if (item.quark_cost > 0) {
      act.textContent = '⚛️ ' + item.quark_cost;
    } else {
      act.textContent = 'Claim Free';
    }
    card.appendChild(act);

    // ── Click → WL.select ─────────────────────────────────────────────
    (function(it, cardEl) {
      cardEl.addEventListener('click', function() { WL.select(catObj, it, cardEl); });
    })(item, card);

    grid.appendChild(card);
  });
};

/* WL.equipCustom — ported verbatim from scientist.html equipCustomItem()
 * (lines 1527–1557). Writes customSlots[item_type] + customSlots['_img_<type>'],
 * persists via saveScientist, then re-renders stage + grid.
 * Toggle: clicking an already-equipped item unequips it (sets slot to null).
 */
WL.equipCustom = async function(item) {
  var cached = WL._customItemsData[item.id];
  if (!cached) return;
  var itemType  = cached.item_type;
  var imageData = cached.image_data;

  // Read fresh scientist data so we don't overwrite concurrent changes
  var current     = await WordLabData.getScientist() || {};
  var owned       = current.owned || [];
  var customSlots = Object.assign({}, current.customSlots || {});
  var updates     = {};

  if (!owned.includes('custom_' + item.id)) {
    updates.owned = owned.concat(['custom_' + item.id]);
  }

  // Toggle equip
  if (customSlots[itemType] === item.id) {
    customSlots[itemType] = null;
  } else {
    customSlots[itemType] = item.id;
    // Store image so buildSVG can render the overlay without a DB call
    customSlots['_img_' + itemType] = imageData;
  }
  updates.customSlots = customSlots;

  try {
    await WordLabData.saveScientist(updates);
  } catch(e) {
    console.error('[WL.equipCustom] saveScientist failed:', e);
    return;
  }

  // Update in-memory state so renderStage and renderCustom see the change immediately
  WL.scientist.customSlots = customSlots;
  if (updates.owned) WL.owned = updates.owned.slice();

  WL.renderStage();
  WL.renderGrid();
  WL.react();
};

};

/* ── WL.equipEffect — Task 6 ─────────────────────────────────────────
 * Sets scientist.effect, saves via saveScientist, re-renders grid, and
 * previews the live effect on the stage character (unless low-stim).
 * Passing id='none' removes the effect.
 * Effect icons shown on cards come from WLEffects.EFFECTS[id].icon.
 */
WL.equipEffect = async function(id) {
  WL.scientist.effect = (id === 'none' ? null : id);
  try {
    await WordLabData.saveScientist({ effect: WL.scientist.effect });
  } catch(e) { console.error('[WL.equipEffect] saveScientist failed:', e); }
  WL.renderGrid();
  // Preview effect on stage character (unless low-stim or reduced-motion or removing)
  // Use _calm() so body.low-stim, sessionStorage flag, AND prefers-reduced-motion all suppress.
  if (typeof WLEffects !== 'undefined') {
    if (!_calm() && id !== 'none') {
      WLEffects.stop(WL.charEl);
      WLEffects.start(id, WL.charEl);
    } else {
      WLEffects.stop(WL.charEl);
    }
  }
  WL.react();
};

/* ── WL.equipDance — Task 6 ──────────────────────────────────────────

/* ═══════════════════════════════════════════════════════════════════
   Task 9: Buying flow — full WL.select, modals, purchase, reactions
   ═══════════════════════════════════════════════════════════════════

   Purchase semantics (matched EXACTLY from scientist.html):
   ─────────────────────────────────────────────────────────
   scientist.html calls WordLabData.purchase(itemId, cost) which runs the
   atomic_purchase Postgres RPC. That RPC deducts quarks AND adds the
   item to the student's owned[] in the DB atomically. purchase() returns
   { success, quarks, reason } but does NOT return the updated owned[].

   After a successful purchase, scientist.html calls saveScientist({field:id})
   to equip the item, then render() which re-fetches getStudentData() to
   refresh the owned[] client-side.

   On this page there is no render() re-fetch, so we manually push
   WL.ownKey(cat, item) to WL.owned[] (client-side mirror of DB state) after
   a confirmed purchase. We do NOT call saveScientist({ owned }) — the atomic
   RPC already persisted the owned update server-side.

   Badge-gating rule (copied from scientist.html renderShopSection line 1097-1107
   and renderEffectsSection lines 1172-1181):
   ─────────────────────────────────────────────────────────────────────────────
   Regular shop items use item.requiresBadge; effects use eff.requiresBadge
   (mapped to item.requires in WL.effectList). If the student doesn't hold the
   required badge (WL.badges.includes(reqBadge) is false), the item is LOCKED:
   it cannot be equipped OR purchased with quarks — the click is a no-op.
   This is exactly scientist.html's behaviour (locked items show "🔒 Requires:"
   with no buy or equip button).
*/

/* ── _calm() guard — suppress all motion/sound in low-stim or reduced-motion.
 *
 * Carry-forward fix (Task 11): WL.equipEffect previously used WordLabData.isLowStimMode()
 * directly, while _calm() used body.low-stim. Now _calm() is the single source of truth
 * and WL.equipEffect delegates to it, so all three sources are checked consistently:
 *
 *   1. body.low-stim       — set by loadLowStimMode() (wordlab-data.js line 721) and
 *                             auto-applied from sessionStorage at parse time (line 2938).
 *   2. isLowStimMode()     — reads sessionStorage 'wl_low_stim'; catches the brief window
 *                             between page load and the first DOMContentLoaded callback.
 *   3. prefers-reduced-motion — honours the OS/browser accessibility setting.
 */
function _calm() {
  return document.body.classList.contains('low-stim') ||
         (typeof WordLabData !== 'undefined' &&
          typeof WordLabData.isLowStimMode === 'function' &&
          WordLabData.isLowStimMode()) ||
         window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}

/* ── WL.equipFor — dispatches to the right equip function by cat.id ── */
WL.equipFor = function(cat, item) {
  if (cat.id === 'effects') {
    var alreadyOn = WL.scientist && WL.scientist.effect === item.id;
    WL.equipEffect(alreadyOn ? 'none' : item.id);
  } else if (cat.id === 'dances') {
    WL.equipDance(item.tier, item.id);
  } else if (cat.id === 'custom') {
    WL.equipCustom(item);
  } else {
    WL.equip(cat, item);
  }
};

/* ── Focus-trap helpers ───────────────────────────────────────────── */
var _modalTrigger = null;   // element that opened the modal — restored on close

function _focusTrap(modal, e) {
  var focusable = Array.from(modal.querySelectorAll(
    'button:not([disabled]),input:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])'
  ));
  if (!focusable.length) return;
  var first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
  }
}

/* ── WL.openConfirm ───────────────────────────────────────────────── */
WL.openConfirm = function(cat, item, triggerEl) {
  /* Cost field: custom items use quark_cost, all others use cost */
  var cost = WL.costOf(cat, item);
  WL.pending = { cat: cat, item: item, cost: cost };
  _modalTrigger = triggerEl || null;

  /* Populate preview */
  var prev  = document.getElementById('confirmPreview');
  var bal   = document.getElementById('confirmBalance');
  if (prev) {
    prev.innerHTML = '';
    var sw = document.createElement('div');
    sw.className = 'lab-modal-preview-swatch';
    if (cat.id === 'colours') {
      sw.style.background = WL._colourBg(item);
    } else if (cat.id === 'patterns') {
      var pbg = WL._patternBg(item.id);
      sw.style.background = '#e8e8e8';
      if (pbg) sw.style.backgroundImage = pbg;
    } else if ((cat.id === 'heads' || cat.id === 'faces' || cat.id === 'wings') && item.id && item.id !== 'none') {
      sw.appendChild(WL.miniPreview(cat, item));
    } else {
      sw.textContent = item.icon || '?';
    }
    var info = document.createElement('div');
    var nm   = document.createElement('div');
    nm.className = 'lab-modal-item-name';
    nm.textContent = item.name;   // textContent = XSS-safe
    var pr   = document.createElement('div');
    pr.className  = 'lab-modal-item-cost';
    pr.textContent = '⚛ ' + cost + ' quarks';
    info.appendChild(nm);
    info.appendChild(pr);
    prev.appendChild(sw);
    prev.appendChild(info);
  }
  if (bal) {
    var after = WL.quarks - cost;
    bal.innerHTML = '';   // clear
    var bt = document.createElement('span');
    bt.textContent = 'Balance after purchase: ';
    var bv = document.createElement('strong');
    bv.textContent = after.toLocaleString('en-AU') + ' quarks';
    bal.appendChild(bt);
    bal.appendChild(bv);
  }

  var modal = document.getElementById('confirmModal');
  modal.removeAttribute('hidden');
  document.getElementById('confirmBuyBtn').focus();

  /* Esc + overlay-click to close */
  modal._onKey = function(e) {
    if (e.key === 'Escape') { WL.closeConfirm(); }
    else if (e.key === 'Tab') { _focusTrap(document.getElementById('confirmCard'), e); }
  };
  modal._onOverlay = function(e) {
    if (e.target === modal) WL.closeConfirm();
  };
  document.addEventListener('keydown', modal._onKey);
  modal.addEventListener('click', modal._onOverlay);
};

/* ── WL.closeConfirm ─────────────────────────────────────────────── */
WL.closeConfirm = function() {
  var modal = document.getElementById('confirmModal');
  modal.setAttribute('hidden', '');
  if (modal._onKey)     { document.removeEventListener('keydown', modal._onKey); modal._onKey = null; }
  if (modal._onOverlay) { modal.removeEventListener('click', modal._onOverlay); modal._onOverlay = null; }
  if (_modalTrigger) { _modalTrigger.focus(); _modalTrigger = null; }
};

/* ── WL.costOf — unified price accessor for regular and custom items ──
 * Custom items use quark_cost; all others use cost.
 * Used everywhere a price is read in the buy flow. */
WL.costOf = function(cat, item) {
  return (cat && cat.id === 'custom') ? (item.quark_cost || 0) : (item.cost || 0);
};

/* ── WL.openNotEnough ─────────────────────────────────────────────── */

    if (catObj && catObj.id === 'colours') {

    } else if (catObj && catObj.id === 'patterns') {

    } else {
